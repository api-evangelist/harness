        in: query
        description: Harness organization ID
        allowEmptyValue: true
        schema:
          type: string
          description: Harness organization ID
          default: ''
          example: test-org
        example: test-org
      - name: projectIdentifier
        in: query
        description: Harness project ID
        allowEmptyValue: true
        schema:
          type: string
          description: Harness project ID
          default: ''
          example: test-project
        example: test-project
      - name: git_commit_msg
        in: query
        description: The commit message used in git when creating the policy
        allowEmptyValue: true
        schema:
          type: string
          description: The commit message used in git when creating the policy
          example: harness policy commit msg
        example: harness policy commit msg
      - name: git_import
        in: query
        description: A flag to determine if the api should try and import and existing policy from git
        allowEmptyValue: true
        schema:
          type: boolean
          description: A flag to determine if the api should try and import and existing policy from git
          example: true
        example: true
      - name: git_branch
        in: query
        description: The git branch the policy will be created in
        allowEmptyValue: true
        schema:
          type: string
          description: The git branch the policy will be created in
          example: main
        example: main
      - name: git_is_new_branch
        in: query
        description: A flag to determine if the api should try and commit to a new branch
        allowEmptyValue: true
        schema:
          type: boolean
          description: A flag to determine if the api should try and commit to a new branch
          example: true
        example: true
      - name: git_base_branch
        in: query
        description: If committing to a new branch, git_base_branch tells the api which branch to base the new branch from
        allowEmptyValue: true
        schema:
          type: string
          description: If committing to a new branch, git_base_branch tells the api which branch to base the new branch from
          example: main
        example: main
      - name: x-api-key
        in: header
        description: Harness PAT key used to perform authorization
        allowEmptyValue: true
        schema:
          type: string
          description: Harness PAT key used to perform authorization
          example: Pariatur harum atque dolor rerum.
        example: Quas numquam aliquid suscipit.
