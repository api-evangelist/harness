          deny["should say hello world"] {input.message != "world"}'
    CacheResponse:
      type: object
      properties:
        cache_state:
          type: string
          description: Cache state (UNKNOWN_STATE, VALID_CACHE, STALE_CACHE)
          example: STALE_CACHE
        is_sync_enabled:
          type: boolean
          description: Whether sync is enabled for this resource
          example: true
        last_updated_at:
          type: integer
          description: Timestamp (millis) when cache was last updated
          example: 1773917288158
          format: int64
        ttl_left:
          type: integer
          description: Remaining time-to-live in milliseconds
          example: 258234442
          format: int64
      description: Cache metadata from GitX getFile RPC
      example:
        cache_state: STALE_CACHE
        is_sync_enabled: true
        last_updated_at: 1773917288158
        ttl_left: 258234442
    PolicyToPolicySet:
      type: object
      properties:
        account_id:
          type: string
          description: Harness account ID associated with this policy set
          default: ''
          example: eBqAoNchMLKigC_qZ5EdC
        action:
          type: string
          description: Action that triggers the policy set
          example: onrun
          minLength: 1
        created:
          type: integer
          description: Time the policy set was created
          example: 1636669297674
          format: int64
        enabled:
          type: boolean
          description: Only enabled policy sets are evaluated when evaluating by type/action
          example: true
        identifier:
          type: string
          description: Identifier of the policy set
          example: policyset-1
          minLength: 1
        name:
          type: string
          description: Name of the policy set
          example: Production Policies
          minLength: 1
        org_id:
          type: string
          description: Harness organization ID associated with this policy set
          default: ''
          example: test-org
        project_id:
          type: string
          description: Harness project ID associated with this policy set
          default: ''
          example: test-project
        updated:
          type: integer
          description: Time the policy set was last updated
          example: 1636669297674
          format: int64
      example:
        account_id: eBqAoNchMLKigC_qZ5EdC
        action: onrun
        created: 1636669297674
        enabled: true
        identifier: policyset-1
        name: Production Policies
        org_id: test-org
        project_id: test-project
        updated: 1636669297674
      required:
      - identifier
      - name
      - action
      - enabled
      - created
      - updated
      - account_id
      - org_id
      - project_id
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
