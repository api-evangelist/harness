          default: ''
          example: eBqAoNchMLKigC_qZ5EdC
        example: eBqAoNchMLKigC_qZ5EdC
      - name: orgIdentifier
        in: query
        description: Harness organization ID
        allowEmptyValue: true
        schema:
          type: string
          description: Harness organization ID
          default: ''
          example: test-org
        example: test-org
      - name: projectIdentifier
        in: query
        description: Harness project ID
        allowEmptyValue: true
        schema:
          type: string
          description: Harness project ID
          default: ''
          example: test-project
        example: test-project
      - name: per_page
        in: query
        description: Number of results per page
        allowEmptyValue: true
        schema:
          type: integer
          description: Number of results per page
          default: 50
          example: 20
          format: int64
          minimum: 1
          maximum: 100
        example: 20
      - name: page
        in: query
        description: Page number (starting from 0)
        allowEmptyValue: true
        schema:
          type: integer
          description: Page number (starting from 0)
          default: 0
          example: 4
          format: int64
          minimum: 0
        example: 4
      - name: identifierFilter
        in: query
        description: Comma separated List of Identifiers to filter on
        allowEmptyValue: true
        schema:
          type: string
          description: Comma separated List of Identifiers to filter on
          default: ''
          example: test-projectId1, test-projectId2
        example: test-projectId1, test-projectId2
      - name: searchTerm
        in: query
        description: Filter results by partial name match
        allowEmptyValue: true
        schema:
          type: string
          description: Filter results by partial name match
          default: ''
          example: poli
        example: poli
      - name: sort
        in: query
        description: Sort order for results
        allowEmptyValue: true
        schema:
          type: string
          description: Sort order for results
          default: name,ASC
          example: updated,ASC
          enum:
          - name,ASC
          - name,DESC
          - updated,ASC
          - updated,DESC
        example: name,DESC
      - name: excludeRegoFromResponse
        in: query
        description: Set to true to exclude Rego content from the response
        allowEmptyValue: true
        schema:
          type: boolean
          description: Set to true to exclude Rego content from the response
          default: false
          example: false
        example: false
      - name: includePolicySetCount
        in: query
        description: Set to true to include the count of policy sets associated with each policy in the response
        allowEmptyValue: true
        schema:
          type: boolean
          description: Set to true to include the count of policy sets associated with each policy in the response
          default: false
          example: true
        example: true
      - name: x-api-key
        in: header
        description: Harness PAT key used to perform authorization
        allowEmptyValue: true
        schema:
          type: string
          description: Harness PAT key used to perform authorization
          example: Consequatur nam eveniet amet veritatis quia veritatis.
        example: Sit molestiae id quod quaerat consequatur.
