openapi: 3.2.0
info:
  title: Harness Pipeline Execution Details API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Pipeline Execution Details
  description: This contains APIs for fetching Pipeline Execution Details
paths:
  /pipeline/api/pipelines/execution/canRetry/{planExecutionId}:
    get:
      tags:
      - Pipeline Execution Details
      summary: Validate if Execution can be retried
      description: Validates if an execution can be retried for a Given PlanExecution ID
      operationId: canRetryExecution
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: planExecutionId
        in: path
        description: Plan Execution Id for which we want to check if it can be retried
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Return true if the provided execution can be retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
  /pipeline/api/pipelines/execution/{planExecutionId}/annotations/{contextId}/content:
    get:
      tags:
      - Pipeline Execution Details
      summary: Fetch Full Annotation Content
      description: Returns full annotation content for a specific context from GCS
      operationId: getAnnotationFullContent
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier
        required: true
        schema:
          type: string
      - name: planExecutionId
        in: path
        description: Plan Execution ID for the pipeline run
        required: true
        schema:
          type: string
      - name: contextId
        in: path
        description: Context ID for the annotation
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns full content for the specified annotation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOAnnotationContentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOAnnotationContentResponse'
  /pipeline/api/pipelines/execution/{planExecutionId}:
    get:
      tags:
      - Pipeline Execution Details
      summary: Fetch Execution Details
      description: Returns the Pipeline Execution Details for a Given PlanExecution ID
      operationId: getExecutionDetail
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: stageNodeId
        in: query
        description: Stage Node Identifier for which Stage Graph needs to be Rendered
        schema:
          type: string
      - name: stageNodeExecutionId
        in: query
        description: Stage Node Execution ID for which Stage Graph needs to be Rendered. (Needed only when there are Multiple Runs for a Given Stage. It can be Extracted from LayoutNodeMap Field)
        schema:
          type: string
      - name: planExecutionId
        in: path
        description: Plan Execution Id for which we want to get the Execution details
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Return the Pipeline Execution details for given PlanExecution Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPipelineExecutionDetail'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPipelineExecutionDetail'
      deprecated: true
  /pipeline/api/pipelines/execution/v2/{planExecutionId}:
    get:
      tags:
      - Pipeline Execution Details
      summary: Fetch Execution Details
      description: Returns the Pipeline Execution Details for a Given PlanExecution ID
      operationId: getExecutionDetailV2
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: stageNodeId
        in: query
        description: Stage Node Identifier for which Stage Graph needs to be Rendered
        schema:
          type: string
      - name: stageNodeExecutionId
        in: query
        description: Stage Node Execution ID for which Stage Graph needs to be Rendered. (Needed only when there are Multiple Runs for a Given Stage. It can be Extracted from LayoutNodeMap Field)
        schema:
          type: string
      - name: childStageNodeId
        in: query
        description: Stage Node Execution ID for which Stage Graph needs to be Rendered. (Needed only when there are Multiple Runs for a Given Stage. It can be Extracted from LayoutNodeMap Field)
        schema:
          type: string
      - name: childStageNodeExecutionId
        in: query
        description: Stage Node Execution ID for which Stage Graph needs to be Rendered. (Needed only when there are Multiple Runs for a Given Stage. It can be Extracted from LayoutNodeMap Field)
        schema:
          type: string
      - name: renderFullBottomGraph
        in: query
        description: Generate Graph for all the Stages including Steps in each Stage
        schema:
          type: boolean
      - name: planExecutionId
        in: path
        description: Plan Execution Id for which we want to get the Execution details
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Return the Pipeline Execution details for given PlanExecution Id without full graph if stageNodeId is null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPipelineExecutionDetail'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPipelineExecutionDetail'
  /pipeline/api/pipelines/execution/getExecutionGraph/{planExecutionId}:
    get:
      tags:
      - Pipeline Execution Details
      summary: Fetch Execution Graph
      description: Returns the Pipeline Execution Graph for a Given PlanExecution ID
      operationId: getExecutionGraph
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: planExecutionId
        in: path
        description: Plan Execution Id for which we want to get the Execution details
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Return the Pipeline Execution graph for given PlanExecution Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOExecutionGraph'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOExecutionGraph'
  /pipeline/api/pipelines/execution/subGraph/{planExecutionId}/{nodeExecutionId}:
    get:
      tags:
      - Pipeline Execution Details
      summary: Fetch Execution SubGraph for a Given Retried StepGroup NodeExecution ID
      description: Returns the Pipeline Execution SubGraph for a Given Retried StepGroup NodeExecution ID
      operationId: getExecutionSubGraphForNodeExecution
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: nodeExecutionId
        in: path
        description: Node Execution Id for which we want to get the Execution SubGraph
        required: true
        schema:
          type: string
      - name: planExecutionId
        in: path
        description: Plan Execution Id for which we want to get the Execution details
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Return Execution subGraph for a Given Retried StepGroup NodeExecution ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTONodeExecutionDetails'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTONodeExecutionDetails'
  /pipeline/api/pipelines/execution/url:
    post:
      tags:
      - Pipeline Execution Details
      summary: Fetch Execution Url
      description: Returns the Pipeline Execution Url for a Given PlanExecution ID
      operationId: getExecutionURL
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Id for which we want to get the Execution url
        required: true
        schema:
          type: string
      - name: planExecutionId
        in: query
        description: Plan Execution Id for which we want to get the Execution url
        required: true
        schema:
          type: string
      - name: modules
        in: query
        description: Modules
        schema:
          type: array
          items:
            type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Return the Pipeline Execution url for given Pipeline and PlanExecution Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOString'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOString'
  /pipeline/api/pipelines/execution/{planExecutionId}/metadata:
    get:
      tags:
      - Pipeline Execution Details
      summary: Get execution metadata of a pipeline execution
      operationId: getExecutionData
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: planExecutionId
        in: path
        description: ExecutionId of the execution for which we want to get Metadata
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns metadata of a execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOExecutionDataResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOExecutionDataResponse'
  /pipeline/api/pipelines/execution/{planExecutionId}/inputsetV2:
    get:
      tags:
      - Pipeline Execution Details
      summary: Get the Input Set YAML used for given Plan Execution
      operationId: getInputsetYamlV2
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: resolveExpressions
        in: query
        description: 'A boolean that indicates whether or not expressions should be resolved in input set yaml '
        schema:
          type: boolean
          default: false
      - name: resolveExpressionsType
        in: query
        description: 'Resolve Expressions Type indicates what kind of expressions should be resolved in input set yaml. The default value is UNKNOWN in which case no expressions will be resolvedChoose a value from the enum list: [RESOLVE_ALL_EXPRESSIONS, RESOLVE_TRIGGER_EXPRESSIONS, UNKNOWN]'
        schema:
          type: string
          enum:
          - RESOLVE_ALL_EXPRESSIONS
          - RESOLVE_TRIGGER_EXPRESSIONS
          - UNKNOWN
          default: UNKNOWN
      - name: planExecutionId
        in: path
        description: Plan Execution Id for which we want to get the Input Set YAML
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Return the Input Set YAML used for given Plan Execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOInputSetTemplateResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOInputSetTemplateResponse'
  /pipeline/api/pipelines/execution/{planExecutionId}/policy-evaluation:
    get:
      tags:
      - Pipeline Execution Details
      summary: Gets the policy evaluated used for given Plan Execution
      operationId: getPpolicyEvaluation
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
      - name: planExecutionId
        in: path
        description: Plan Execution Id for which we want to get the Input Set YAML
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Return policy evaluation details for given Plan Execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageGovernanceMetadata'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageGovernanceMetadata'
  /pipeline/api/pipelines/execution/executionSummary:
    post:
      tags:
      - Pipeline Execution Details
      summary: List Execution Identifier
      description: Returns a List of Pipeline Executions Identifier with Specific Filter
      operationId: getListOfExecutionIdentifier
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier filter if exact pipelines needs to be filtered.
        schema:
          type: string
      - name: page
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 10
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      - name: filterIdentifier
        in: query
        schema:
          type: string
      requestBody:
        description: Returns a List of Pipeline Executions with Specific Filters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterProperties'
            examples:
              List:
                summary: Sample List Pipeline Executions
                description: Sample List Pipeline Executions JSON Payload
                value:
                  filterType: PipelineExecution
                  pipelineTags:
                  - key: tag1
                    value: value1
                  - key: tag2
                    value: value2
                  status:
                  - Success
                  - Failed
                  - Running
                  pipelineName: My Pipeline
                  timeRange:
                    timeRangeFilterType: LAST_30_DAYS
                  moduleProperties:
                    cd:
                      serviceIdentifiers:
                      - service1
                      - service2
                      envIdentifiers:
                      - dev
                      - prod
                      artifactDisplayNames:
                      - library/nginx:stable
                      - stable
                      serviceDefinitionTypes:
                      - Kubernetes
                      - NativeHelm
                      helmChartVersions:
                      - chartV1
                      - chartV2
                      gitOpsAppIdentifiers:
                      - app1
                      - app2
                    ci:
                      ciExecutionInfoDTO:
                        event: pullRequest
                        pullRequest:
                          sourceBranch: source-branch
                          targetBranch: target-branch
                  triggerTypes:
                  - MANUAL
                  - WEBHOOK
                  triggerIdentifiers:
                  - trigger1
                  - trigger2
                  pipelineIdentifiers:
                  - pipeline1
                  - pipeline2
                  myDeployments: true
                  branchName: main
                  repo: my-repo
                  inputSetIdentifiers:
                  - inputSet1
                  - inputSet2
                  planExecutionIds:
                  - exec1
                  - exec2
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns all the Executions Identifier of pipelines for given filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPagePipelineExecutionIdentifierSummary'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPagePipelineExecutionIdentifierSummary'
  /pipeline/api/pipelines/execution/summary:
    post:
      tags:
      - Pipeline Execution Details
      summary: List Executions
      description: Returns a List of Pipeline Executions with Specific Filter
      operationId: getListOfExecutions
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: searchTerm
        in: query
        description: Search term to filter out pipelines based on pipeline name, identifier, tags.
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier filter if exact pipelines needs to be filtered.
        schema:
          type: string
      - name: page
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 10
      - name: sort
        in: query
        description: Sort criteria for the elements.
        schema:
          type: array
          items:
            type: string
      - name: filterIdentifier
        in: query
        description: Identifier of a saved filter to apply. Cannot be used together with the request body filter properties. If both are provided, the saved filter takes precedence.
        schema:
          type: string
      - name: showAllExecutions
        in: query
        description: Whether to show all executions accessible to the user, not just those in the specified project. Defaults to false.
        schema:
          type: boolean
          default: false
      - name: module
        in: query
        description: 'Harness module which triggered the execution. Examples: CD, CI, CE, etc.'
        schema:
          type: string
      - name: status
        in: query
        description: 'Filter by execution status. Accepts multiple values. Valid values: Running, AsyncWaiting, TaskWaiting, TimedWaiting, Failed, Errored, IgnoreFailed, NotStarted, Expired, Aborted, Discontinuing, Queued, Paused, ResourceWaiting, InterventionWaiting, ApprovalWaiting, WaitStepRunning, QueuedLicenseLimitReached, QueuedExecutionConcurrencyReached, Success, Suspended, Skipped, Pausing, ApprovalRejected, InputWaiting, AbortedByFreeze, UploadWaiting, QueuedGlobalInfraCapacityReached, QUEUED_PLAN_CREATION'
        schema:
          type: array
          items:
            type: string
