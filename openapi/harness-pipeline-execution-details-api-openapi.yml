            - Discontinuing
            - Queued
            - Paused
            - ResourceWaiting
            - InterventionWaiting
            - ApprovalWaiting
            - WaitStepRunning
            - QueuedLicenseLimitReached
            - QueuedExecutionConcurrencyReached
            - Success
            - Suspended
            - Skipped
            - Pausing
            - ApprovalRejected
            - InputWaiting
            - AbortedByFreeze
            - UploadWaiting
            - QueuedGlobalInfraCapacityReached
            - QUEUED_PLAN_CREATION
            - NOT_STARTED
            - INTERVENTION_WAITING
            - APPROVAL_WAITING
            - APPROVAL_REJECTED
            - Waiting
            - Queued
            - Queued
            - Queued
