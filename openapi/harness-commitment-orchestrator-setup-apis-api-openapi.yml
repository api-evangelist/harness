components:
  schemas:
    ListMasterContent:
      type: object
      properties:
        connector:
          $ref: '#/components/schemas/LwCOConnector'
    LwCOConnector:
      type: object
      properties:
        accountIdentifier:
          type: string
        identifier:
          type: string
        name:
          type: string
        type:
          type: string
        spec:
          type: object
    SetupValidateSuccessResponse:
      type: object
      properties:
        ts:
          type: integer
          description: Response timestamp
        success:
          type: boolean
          description: Specifies if the operation is successful
        errors:
          type: string
          description: Specifies the error if the operation failed
        response:
          type: object
          properties:
            savings_plan_max_percentage:
              type: integer
              maximum: 1
              minimum: 0
    ListMasterSuccessResponse:
      type: object
      properties:
        ts:
          type: integer
          description: Response timestamp
        success:
          type: boolean
          description: Specifies if the operation is successful
        errors:
          type: string
          description: Specifies the error if the operation failed
        response:
          type: object
          properties:
            data:
              type: object
              properties:
                content:
                  type: array
                  items:
                    $ref: '#/components/schemas/ListMasterContent'
    InstanceTypesPayload:
      type: object
      properties:
        instance_families:
          type: array
          items:
            type: string
        excluded_cloud_accounts:
          type: array
          items:
            type: string
        regions:
          type: array
          items:
            type: string
        service:
          type: string
          enum:
          - Amazon Relational Database Service
          - Amazon Elastic Compute Cloud - Compute
          default: Amazon Elastic Compute Cloud - Compute
          description: Service to fetch the details for.
    ListSetupsSuccessResponse:
      type: object
      properties:
        ts:
          type: integer
          description: Response timestamp
        success:
          type: boolean
          description: Specifies if the operation is successful
        errors:
          type: string
          description: Specifies the error if the operation failed
        response:
          type: array
          items:
            $ref: '#/components/schemas/AutoCUDSetup'
    ListChildAccountsSuccessResponse:
      type: object
      properties:
        ts:
          type: integer
          description: Response timestamp
        success:
          type: boolean
          description: Specifies if the operation is successful
        errors:
          type: string
          description: Specifies the error if the operation failed
        response:
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePair'
    AutoCUDConfig:
      type: object
      properties:
        exclusion_list:
          type: array
          items:
            $ref: '#/components/schemas/ExclusionEntry'
        excluded_cloud_accounts:
          type: array
          items:
            type: string
        total_coverage:
          type: integer
          minimum: 0
          maximum: 1
        savings_plan_layering:
          type: object
          description: Savings Plan laddering configuration
          properties:
            enabled:
              type: boolean
              description: Whether Savings Plan laddering is enabled
              default: false
        max_sp_hourly_commitment:
          type: number
          format: double
          description: Maximum hourly commitment for a net-new Savings Plan purchase in USD/hour; 0 or omitted means no ceiling
          minimum: 0
        preferred_commitment_mode:
          type: string
          description: Commitment type that receives the shared coverage budget first
          enum:
          - ri_preferred
          - sp_preferred
          default: ri_preferred
      required:
      - total_coverage
    AutoCUDSetup:
      type: object
      properties:
        account_id:
          type: string
        cloud_account_id:
          type: string
        enabled:
          type: boolean
        config:
          type: object
          items:
            $ref: '#/components/schemas/AutoCUDConfig'
    SetupInstanceTypesSuccessResponse:
      type: object
      properties:
        ts:
          type: integer
          description: Response timestamp
        success:
          type: boolean
          description: Specifies if the operation is successful
        errors:
          type: string
          description: Specifies the error if the operation failed
        response:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ListInstanceTypesContent'
    ExclusionEntry:
      type: object
      properties:
        instance_type:
          type: string
          example: t2.micro
        region:
          type: string
          example: us-east-1
    GenericSuccessResponse:
      type: object
      properties:
        ts:
          type: integer
          description: Response timestamp
        success:
          type: boolean
          description: Specifies if the operation is successful
        errors:
          type: string
          description: Specifies the error if the operation failed
    ListInstanceTypesContent:
      type: object
      properties:
        compute_spend:
          type: number
        coverage_percentage:
          type: number
        region:
          type: string
        instance_type:
          type: string
    KeyValuePair:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
