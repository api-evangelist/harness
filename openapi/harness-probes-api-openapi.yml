openapi: 3.2.0
info:
  title: Harness Probes API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Probes
paths:
  /gateway/chaos/manager/api/rest/v2/probes:
    get:
      description: Retrieve a list of probes based on various filters like name, tags, date range, and infrastructure type, with pagination support.
      summary: List probes with filtering options
      operationId: listProbes
      parameters:
      - description: Account ID for accessing the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Organization ID for accessing the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Project ID for accessing the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Filter probes by name
        name: search
        in: query
        schema:
          type: string
      - description: Comma-separated list of tags to filter probes
        name: tags
        in: query
        schema:
          type: string
      - description: Filter probes by start date (ISO 8601 format)
        name: startDate
        in: query
        schema:
          type: string
      - description: Filter probes by end date (ISO 8601 format)
        name: endDate
        in: query
        schema:
          type: string
      - description: Comma-separated list of probe IDs
        name: probeIDs
        in: query
        schema:
          type: string
      - description: Filter probes by infrastructure type
        name: infraType
        in: query
        schema:
          type: string
      - description: Page index for pagination
        name: page
        in: query
        schema:
          type: integer
          default: 1
      - description: Number of items per page
        name: limit
        in: query
        schema:
          type: integer
          default: 50
      - description: Field to sort the probe list
        name: sortField
        in: query
        schema:
          type: string
          enum:
          - NAME
          - TIME
          - ENABLED
      - description: Sort the field in ascending order
        name: sortAscending
        in: query
        schema:
          type: boolean
      - description: Filter based on probe entity type
        name: entityType
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the list of probes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ListProbeResponse'
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '401':
          description: Unauthorized - Invalid credentials or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
    post:
      summary: Create a new probe
      operationId: createProbe
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/types.ProbeRequest'
      responses:
        '200':
          description: Successfully created probe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.CreateProbeResponse'
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '401':
          description: Unauthorized - Invalid credentials or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
  /gateway/chaos/manager/api/rest/v2/probes/experiment-run:
    post:
      summary: Get probes in experiment
      operationId: getProbesInExperiment
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.ProbeDetailsInExperimentRequest'
        description: probe request configuration
        required: true
      responses:
        '200':
          description: Successfully fetched probe details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ProbeDetailsInExperimentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
  /gateway/chaos/manager/api/rest/v2/probes/import:
    post:
      summary: Import a new probe
      operationId: importProbe
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.ImportProbeTemplateRequest'
        description: action configuration
        required: true
      responses:
        '200':
          description: Successfully created Action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.CreateProbeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
  /gateway/chaos/manager/api/rest/v2/probes/manifest/{probeId}:
    get:
      description: Retrieve probe manifest of a specific probe by its ID
      summary: Get a probe
      operationId: getProbeManifest
      parameters:
      - description: Account ID for accessing the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Organization ID for accessing the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Project ID for accessing the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: ID of the probe to retrieve
        name: probeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved probe manifest details
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request - Missing or invalid probe ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '401':
          description: Unauthorized - Invalid credentials or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '404':
          description: Not Found - Probe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
  /gateway/chaos/manager/api/rest/v2/probes/{probeId}:
    get:
      description: Retrieve details of a specific probe by its ID
      summary: Get a probe
      operationId: getProbe
      parameters:
      - description: Account ID for accessing the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Organization ID for accessing the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Project ID for accessing the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: ID of the probe to retrieve
        name: probeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved probe details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.GetProbeResponse'
        '400':
          description: Bad request - Missing or invalid probe ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '401':
          description: Unauthorized - Invalid credentials or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '404':
          description: Not Found - Probe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
    put:
      description: Update a probe with the specified configuration
      summary: Update a probe
      operationId: updateProbe
      parameters:
      - description: Account ID to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Organization ID to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Project ID to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: ID of the probe to retrieve
        name: probeId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/types.ProbeRequest'
      responses:
        '200':
          description: Successfully created probe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.CreateProbeResponse'
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '401':
          description: Unauthorized - Invalid credentials or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
    delete:
      description: Delete a probe with a provided identifier
      summary: Delete a probe
      operationId: deleteProbe
      parameters:
      - description: Account ID to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Organization ID to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: Project ID to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: ID of the probe to retrieve
        name: probeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully delete probe
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '401':
          description: Unauthorized - Invalid credentials or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
  /gateway/chaos/manager/api/rest/v2/probes/enable/{probeId}:
    post:
      summary: Enable and disable probes across experiments
      operationId: enableProbe
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: ID of the probe to retrieve
        name: probeId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.ProbeBulkEnableRequest'
        description: Enable Probe configuration
        required: true
      responses:
        '200':
          description: Successfully updated probe
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '401':
          description: Unauthorized - Invalid credentials or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
  /gateway/chaos/manager/api/rest/v2/probes/verify/{probeId}:
    post:
      summary: Verify a probe
      operationId: verifyProbe
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: ID of the probe to retrieve
        name: probeId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.ProbeVerifyRequest'
        description: Verify Probe configuration
        required: true
      responses:
        '200':
          description: Successfully verified probe
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad request - Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '401':
          description: Unauthorized - Invalid credentials or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Probes
  /gateway/chaos/manager/api/v3/probes/list-metadata:
    post:
      tags:
      - Probes
      summary: List probe metadata
      operationId: listProbeMetadata
      parameters:
      - description: account id to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: correlation id is used to debug micro svc communication
        name: correlationID
        in: query
        schema:
          type: string
      - name: includeAllScope
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 15
      - description: organization id to access the resource
        name: organizationIdentifier
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - description: project id to access the resource
        name: projectIdentifier
        in: query
        schema:
          type: string
      - description: name that you want to search
        name: search
        in: query
        schema:
          type: string
      - description: if sort order ascending or not
        name: sortAscending
        in: query
        schema:
          type: boolean
      - description: field  name that you want to sort
        name: sortField
        in: query
        schema:
          type: string
          enum:
          - name
          - lastUpdated
          - experimentName
      - name: tags
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.ListMetadataRequest'
        description: list probe request body
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shared.ListMetadataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
components:
  schemas:
    probe.SyntheticsTestTemplate:
      type: object
      properties:
        publicId:
          type: string
        testType:
          $ref: '#/components/schemas/github_com_harness_hce-saas_hce-sdk_template_schema_probe.DatadogSyntheticsTestType'
    github_com_harness_hce-saas_graphql_server_graph_model.UserDetails:
      type: object
      properties:
        email:
          type: string
        userID:
          type: string
        username:
          type: string
    probe.APMProbe:
      type: object
      properties:
        appDynamicsProbeInputs:
          $ref: '#/components/schemas/github_com_harness_hce-saas_graphql_server_pkg_database_mongodb_probe.AppDynamicsProbeInputs'
        attempt: {}
        comparator:
          $ref: '#/components/schemas/probe.Comparator'
        datadogApmProbeInputs:
          $ref: '#/components/schemas/github_com_harness_hce-saas_graphql_server_pkg_database_mongodb_probe.DatadogApmProbeInputs'
        dynatraceApmProbeInputs:
          $ref: '#/components/schemas/github_com_harness_hce-saas_graphql_server_pkg_database_mongodb_probe.DynatraceApmProbeInputs'
        gcpCloudMonitoringProbeInputs:
          $ref: '#/components/schemas/github_com_harness_hce-saas_graphql_server_pkg_database_mongodb_probe.GcpCloudMonitoringProbeInputs'
        initialDelay:
          type: string
        initialDelaySeconds: {}
        interval:
          type: string
        newRelicProbeInputs:
          $ref: '#/components/schemas/github_com_harness_hce-saas_graphql_server_pkg_database_mongodb_probe.NewRelicProbeInputs'
        pollingInterval:
          type: string
        probeTimeout:
          type: string
        prometheusProbeInputs:
          $ref: '#/components/schemas/github_com_harness_hce-saas_graphql_server_pkg_database_mongodb_probe.PrometheusProbeInputs'
        retry: {}
        splunkObservabilityProbeInputs:
          $ref: '#/components/schemas/github_com_harness_hce-saas_graphql_server_pkg_database_mongodb_probe.SplunkObservabilityProbeInputs'
        stopOnFailure:
          type: boolean
        type:
          type: string
        verbosity:
          type: string
    v1.PodFSGroupChangePolicy:
      type: string
      enum:
      - OnRootMismatch
      - Always
      x-enum-varnames:
      - FSGroupChangeOnRootMismatch
      - FSGroupChangeAlways
    github_com_harness_hce-saas_hce-sdk_template_schema_probe.SplunkObservabilityMetrics:
      type: object
      properties:
        durationInMin: {}
        query:
          type: string
    v1.TaintEffect:
      type: string
      enum:
      - NoSchedule
      - PreferNoSchedule
      - NoExecute
      x-enum-varnames:
      - TaintEffectNoSchedule
      - TaintEffectPreferNoSchedule
      - TaintEffectNoExecute
    probe.K8SProbe:
      type: object
      properties:
        attempt: {}
        fieldSelector:
          type: string
        group:
          type: string
        initialDelay:
          type: string
        initialDelaySeconds: {}
        interval:
          type: string
        labelSelector:
          type: string
        namespace:
          type: string
        operation:
          type: string
        pollingInterval:
          type: string
        probeTimeout:
          type: string
        resource:
          type: string
        resourceNames:
          type: string
        retry: {}
        stopOnFailure:
          type: boolean
        verbosity:
          type: string
        version:
          type: string
    probe.ComparatorTemplate:
      type: object
      properties:
        criteria:
          type: string
        type:
          type: string
        value:
          type: string
    probe.ContainerProbeTemplate:
      type: object
      properties:
        affinity:
          $ref: '#/components/schemas/common.NodeAffinity'
        annotations:
          type: object
          additionalProperties:
            type: string
        args:
          type: string
        command:
          type: array
          items:
            type: string
        comparator:
          $ref: '#/components/schemas/probe.ComparatorTemplate'
        containerSecurityContext:
          $ref: '#/components/schemas/v1.SecurityContext'
        env:
          type: array
          items:
            $ref: '#/components/schemas/k8s_io_api_core_v1.EnvVar'
        hostIPC:
          type: boolean
        hostNetwork:
          type: boolean
        hostPID:
          type: boolean
        image:
          type: string
        imagePullPolicy:
          $ref: '#/components/schemas/v1.PullPolicy'
        imagePullSecrets:
          type: array
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        namespace:
          type: string
        nodeSelector:
          type: object
          additionalProperties:
            type: string
        podSecurityContext:
          $ref: '#/components/schemas/v1.PodSecurityContext'
        resources:
          $ref: '#/components/schemas/common.ResourceRequirements'
        serviceAccountName:
          type: string
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/v1.Toleration'
        volumeMounts:
          type: array
          items:
            $ref: '#/components/schemas/v1.VolumeMount'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/common.Volume'
    probe.DynatraceProbe:
      type: object
      properties:
        apiTokenSecretName:
          type: string
        attempt: {}
        comparator:
          $ref: '#/components/schemas/probe.Comparator'
        endpoint:
          type: string
        initialDelay:
          type: string
        initialDelaySeconds: {}
        interval:
          type: string
        metrics:
          $ref: '#/components/schemas/probe.Metrics'
        pollingInterval:
          type: string
        probeTimeout:
          type: string
        retry: {}
        stopOnFailure:
          type: boolean
        timeFrame:
          type: string
        verbosity:
          type: string
    probe.HttpProbeTemplate:
      type: object
      properties:
        auth:
          $ref: '#/components/schemas/probe.AuthorizationTemplate'
        headers:
          type: array
          items:
            $ref: '#/components/schemas/github_com_harness_hce-saas_hce-sdk_template_schema_probe.Headers'
        method:
          $ref: '#/components/schemas/probe.MethodTemplate'
        tlsConfig:
          $ref: '#/components/schemas/probe.TLSConfigTemplate'
        url:
          type: string
    github_com_harness_hce-saas_hce-sdk_template_schema_probe.GET:
      type: object
      properties:
        criteria:
          type: string
        responseBody:
          type: string
        responseCode:
          type: string
    github_com_harness_hce-saas_graphql_server_pkg_database_mongodb_probe.SecretManager:
      type: object
      properties:
        identifier:
          type: string
    template.InputCategory:
      type: string
      enum:
      - FaultTarget
      - FaultTunable
      - TargetInfra
      - ExperimentTunable
      - ActionProperties
