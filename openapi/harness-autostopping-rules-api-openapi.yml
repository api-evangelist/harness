        account_identifier:
          type: string
        project_id:
          type: string
        fulfilment:
          type: string
        kind:
          type: string
        cloud_account_id:
          type: string
        idle_time_mins:
          type: integer
          format: int64
        host_name:
          type: string
        health_check:
          type: object
          properties: {}
        custom_domains:
          type: array
          items:
            type: string
        match_all_subdomains:
          type: boolean
        routing:
          $ref: '#/components/schemas/RoutingData'
        opts:
          $ref: '#/components/schemas/Opts'
        created_at:
          type: string
        access_point_id:
          type: string
        metadata:
          $ref: '#/components/schemas/ServiceMetadata'
        status:
          type: string
    ServiceHealthResponse:
      type: object
      properties:
        response:
          type: object
          properties:
            state:
              type: string
              description: Current state of the AutoStopping Rule
              enum:
              - warmingup
              - errored
              - active
              - down
              - coolingdown
              - disabled
              - enabled
              - created
              - deleted
              - scheduled_downtime
            target_url:
              type: string
              description: Target URL for accessing the AutoStopping Rule
            error:
              type: string
              description: Error message if the rule is in an errored state, empty otherwise
            id:
              type: string
              description: Unique identifier for the health check result
