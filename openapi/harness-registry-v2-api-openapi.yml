          type: string
        isQuarantined:
          type: boolean
        lastModified:
          type: string
        lastScannedAt:
          type: string
        metadata:
          $ref: '#/components/schemas/ArtifactEntityMetadata'
        package:
          type: string
        packageType:
          $ref: '#/components/schemas/PackageType'
        pullCommand:
          type: string
        purl:
          description: Package URL (PURL) for this artifact version when supported for the package type.
          type: string
        quarantineReason:
          type: string
        registryIdentifier:
          type: string
        registryType:
          $ref: '#/components/schemas/RegistryType'
        registryUUID:
          type: string
        scanId:
          type: string
        scanStatus:
          enum:
          - WARN
          - BLOCKED
          - ALLOWED
          type: string
        size:
          type: string
        uuid:
          type: string
        version:
          type: string
      required:
      - package
      - registryIdentifier
      - version
      - packageType
      - lastModified
      - uuid
      - registryUUID
      type: object
    PackageMetadata:
      description: Package Metadata
      properties:
        artifactType:
          $ref: '#/components/schemas/RegistryArtifactType'
        deletedAt:
          description: Timestamp in milliseconds when the registry was soft-deleted
          type: string
        deletedBy:
          $ref: '#/components/schemas/PerformedBy'
        downloadsCount:
          format: int64
          type: integer
        isPublic:
          type: boolean
        isQuarantined:
          type: boolean
        lastModified:
          type: string
        latestVersion:
          type: string
        latestVersionArtifactKey:
          additionalProperties: true
          type: object
        package:
          type: string
        packageType:
          $ref: '#/components/schemas/PackageType'
        quarantineReason:
          type: string
        registryIdentifier:
          type: string
        registryUUID:
          type: string
        uuid:
          type: string
      required:
      - package
      - registryIdentifier
      - packageType
      - isPublic
      - latestVersion
      - uuid
