openapi: 3.2.0
info:
  title: Harness Registry V2 API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- description: registry V2 endpoints
  name: Registry V2
paths:
  /har/api/v2/artifacts:
    get:
      description: Lists all the Versions.
      operationId: ListVersions
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/OrgIdentifier'
      - $ref: '#/components/parameters/ProjectIdentifier'
      - $ref: '#/components/parameters/RegistryIdentifiersParam'
      - $ref: '#/components/parameters/PackageParam'
      - $ref: '#/components/parameters/MetadataFilter'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/SortField'
      - $ref: '#/components/parameters/RegistrySearchTerm'
      - $ref: '#/components/parameters/PackageTypeParam'
      - $ref: '#/components/parameters/DeleteFilterParam'
      responses:
        '200':
          $ref: '#/components/responses/ListVersionResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: List Versions
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/copy:
    post:
      operationId: Copy
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/SrcOrgIdentifier'
      - $ref: '#/components/parameters/SrcProjectIdentifier'
      - $ref: '#/components/parameters/SrcRegistryIdentifierParam'
      - $ref: '#/components/parameters/SrcArtifact'
      - $ref: '#/components/parameters/SrcVersion'
      - $ref: '#/components/parameters/TargetOrgIdentifier'
      - $ref: '#/components/parameters/TargetProjectIdentifier'
      - $ref: '#/components/parameters/TargetRegistryIdentifierParam'
      - $ref: '#/components/parameters/artifactTypeParam'
      - $ref: '#/components/parameters/FiltersParam'
      responses:
        '200':
          $ref: '#/components/responses/CopyResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Copy Artifact
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/files/{file_name}:
    get:
      operationId: GetFile
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/RegistryIdentifier'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/FileName'
      responses:
        '200':
          $ref: '#/components/responses/DownloadFileResponse'
        '302':
          $ref: '#/components/responses/Redirect'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Download file using file path
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/files/bulk-download:
    post:
      operationId: CreateBulkDownloadRequest
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      requestBody:
        $ref: '#/components/requestBodies/BulkDownloadFilesRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateBulkDownloadRequestResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Create a bulk download request
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/files/bulk-download/{download_id}:
    get:
      operationId: GetBulkDownloadRequestStatus
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/DownloadId'
      responses:
        '200':
          $ref: '#/components/responses/GetBulkDownloadRequestStatusResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Get bulk download request status
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/files/search:
    get:
      description: Search all the files.
      operationId: SearchFiles
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/RegistryIdentifier'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/ListFilesResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Search Files
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/metadata:
    delete:
      description: 'Delete metadata key-value pairs for a specific entity.

        This endpoint allows you to delete existing metadata for packages, versions, or registry-level entities.

        The operation supports deleting existing metadata in a single request.'
      operationId: DeleteMetadata
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      requestBody:
        $ref: '#/components/requestBodies/MetadataRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Delete Metadata
      tags:
      - Registry V2
      x-internal: true
    get:
      description: 'Retrieves all metadata key-value pairs associated with a specific entity.

        This endpoint returns metadata for packages, versions, or registry-level entities based on the provided path.'
      operationId: GetMetadata
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/RegistryIdentifier'
      - $ref: '#/components/parameters/PathParam'
      - $ref: '#/components/parameters/PackageParam'
      - $ref: '#/components/parameters/VersionParam'
      - $ref: '#/components/parameters/FiltersParam'
      responses:
        '200':
          $ref: '#/components/responses/MetadataResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Get Metadata
      tags:
      - Registry V2
      x-internal: true
    post:
      description: 'Creates new metadata or overwrites existing metadata key-value pairs for a specific entity.

        This endpoint allows you to add new metadata or overwrites existing metadata for packages, versions,

        or registry-level entities.

        The operation supports both creating new metadata entries and updating existing ones in a single request.'
      operationId: UpdateMetadata
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      requestBody:
        $ref: '#/components/requestBodies/MetadataRequest'
      responses:
        '200':
          $ref: '#/components/responses/MetadataResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Update Metadata
      tags:
      - Registry V2
      x-internal: true
    put:
      description: 'Saves metadata key-value pairs for a specific entity.

        This endpoint allows you to save metadata for packages, versions, or registry-level entities.

        This operation will remove existing metadata and save the new metadata. It is an idempotent operation.'
      operationId: SaveMetadata
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      requestBody:
        $ref: '#/components/requestBodies/MetadataRequest'
      responses:
        '200':
          $ref: '#/components/responses/MetadataResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Save Metadata
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/metadata/keys:
    get:
      description: Retrieve a paginated list of all available metadata keys.
      operationId: GetMetadataKeys
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/OrgIdentifier'
      - $ref: '#/components/parameters/ProjectIdentifier'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/RegistrySearchTerm'
      responses:
        '200':
          $ref: '#/components/responses/MetadataKeysResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Get Metadata Keys
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/metadata/values:
    get:
      description: Retrieve all possible values for a specific metadata key.
      operationId: GetMetadataValues
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/OrgIdentifier'
      - $ref: '#/components/parameters/ProjectIdentifier'
      - $ref: '#/components/parameters/KeyParam'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/RegistrySearchTerm'
      responses:
        '200':
          $ref: '#/components/responses/MetadataValuesResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Get Metadata Values
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/oci/tags:
    post:
      description: Add OCI Artifact Tags.
      operationId: AddOciArtifactTags
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/OrgIdentifier'
      - $ref: '#/components/parameters/ProjectIdentifier'
      - $ref: '#/components/parameters/RegistryIdentifier'
      requestBody:
        $ref: '#/components/requestBodies/AddTagsRequest'
      responses:
        '200':
          $ref: '#/components/responses/AddTagsResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: Add tags to OCI artifact
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/packages:
    get:
      description: Lists all the Image/Package
      operationId: ListPackages
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/OrgIdentifier'
      - $ref: '#/components/parameters/ProjectIdentifier'
      - $ref: '#/components/parameters/RegistryIdentifiersParam'
      - $ref: '#/components/parameters/MetadataFilter'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/SortField'
      - $ref: '#/components/parameters/RegistrySearchTerm'
      - $ref: '#/components/parameters/ArtifactTypeParam'
      - $ref: '#/components/parameters/PackageTypeParam'
      - $ref: '#/components/parameters/DeleteFilterParam'
      responses:
        '200':
          $ref: '#/components/responses/ListPackageResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: List Image/Package
      tags:
      - Registry V2
      x-internal: true
  /har/api/v2/registries:
    get:
      description: Lists all the registries.
      operationId: ListRegistries
      parameters:
      - $ref: '#/components/parameters/RegistryAccountIdentifier'
      - $ref: '#/components/parameters/OrgIdentifier'
      - $ref: '#/components/parameters/ProjectIdentifier'
      - $ref: '#/components/parameters/PackageTypeParam'
      - $ref: '#/components/parameters/RegistryTypeParam'
      - $ref: '#/components/parameters/MetadataFilter'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/SortField'
      - $ref: '#/components/parameters/RegistrySearchTerm'
      - $ref: '#/components/parameters/RegistryScope'
      - $ref: '#/components/parameters/DeleteFilterParam'
      responses:
        '200':
          $ref: '#/components/responses/ListRegistryResponse'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthenticated'
        '403':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '500':
          $ref: '#/components/responses/RegistryInternalServerError'
      summary: List registries
      tags:
      - Registry V2
      x-internal: true
components:
  responses:
    RegistryUnauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistryError'
      description: Access denied due to insufficient permissions
    CreateBulkDownloadRequestResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/CreateBulkDownloadRequestResponseOutput'
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            - data
            type: object
      description: Response containing status of bulk download operation
    RegistryUnauthenticated:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistryError'
      description: Authentication failed or missing credentials
    ListVersionResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/ListVersion'
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            - data
            type: object
      description: response for list version
    MetadataValuesResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  description: A unique value for the specified metadata key
                  example: production
                  type: string
                type: array
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            - data
            type: object
      description: Paginated response containing all possible values for a specific metadata key
    CopyResponse:
      content:
        application/json:
          schema:
            properties:
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            type: object
      description: Response containing status of copy operation
    DownloadFileResponse:
      content:
        application/octet-stream:
          schema:
            format: binary
            type: string
      description: Response containing file content
    RegistryInternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistryError'
      description: An unexpected server error occurred
    ListRegistryResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/ListRegistry'
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            - data
            type: object
      description: response for list registry
    Redirect:
      description: Temporary Redirect
      headers:
        Location:
          description: The URL of the redirected resource
          schema:
            format: uri
            type: string
    ListFilesResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                description: A list of file
                items:
                  $ref: '#/components/schemas/FileMetadata'
                type: array
              itemCount:
                description: The total number of items
                example: 1
                format: int64
                type: integer
              pageCount:
                description: The total number of pages
                example: 100
                format: int64
                type: integer
              pageIndex:
                description: The current page
                example: 0
                format: int64
                type: integer
              pageSize:
                description: The number of items per page
                example: 1
                type: integer
            required:
            - pageCount
            - itemCount
            - pageSize
            - pageIndex
            - data
            type: object
      description: response for list files
    MetadataResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/MetadataOutput'
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            - data
            type: object
      description: Response containing all metadata entries for the requested entity
    MetadataKeysResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  description: A unique metadata key name
                  example: environment
                  type: string
                type: array
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            - data
            type: object
      description: Paginated response containing all available metadata keys in the registry
    RegistryBadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistryError'
      description: The request was invalid or malformed
    RegistryNotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistryError'
      description: The requested resource was not found
    GetBulkDownloadRequestStatusResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/BulkDownloadRequestStatusOutput'
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            - data
            type: object
      description: Response containing status of bulk download operation
    AddTagsResponse:
      content:
        application/json:
          schema:
            properties:
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            type: object
      description: response for add tags request
    Success:
      content:
        application/json:
          schema:
            properties:
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            type: object
      description: Generic success response
    ListPackageResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/ListPackage'
              status:
                $ref: '#/components/schemas/RegistryStatus'
            required:
            - status
            - data
            type: object
      description: response for list package
  schemas:
    CreateBulkDownloadRequestResponseOutput:
      properties:
        downloadId:
          description: Unique identifier for the download request
          example: 12345678-1234-1234-1234-123456789012
          type: string
      required:
      - downloadId
      type: object
    BulkDownloadRequestStatus:
      description: Status of the bulk download operation
      enum:
      - pending
      - processing
      - success
      - failed
      type: string
    PackageType:
      description: refers to package
      enum:
      - DOCKER
      - MAVEN
      - PYTHON
      - GENERIC
      - HELM
      - NUGET
      - NPM
      - RPM
      - CARGO
      - COMPOSER
      - GO
      - HUGGINGFACE
      - CONDA
      - DART
      - SWIFT
      - PUPPET
      - RUBY
      - CRAN
      - RAW
      - HELM_HTTP
      - DEBIAN
      - CONAN
      - TERRAFORM
      type: string
    MetadataOutput:
      description: Response containing all metadata entries for an entity
      example:
        metadata:
        - id: fv12vr45rvr78gvrg
          key: environment
          type: MANUAL
          value: production
        - id: hdcd632fve987fnveh21
          key: created_at
          type: AUTO
          value: '2023-10-31T14:30:00Z'
      properties:
        metadata:
          description: Array of metadata entries
          items:
            $ref: '#/components/schemas/MetadataItemOutput'
          type: array
      required:
      - metadata
      type: object
    MetadataItemOutput:
      description: Metadata entry
      properties:
        id:
          description: Unique identifier for this metadata entry
          example: 1xyv567fyb9
          type: string
        key:
          description: The metadata key name
          example: environment
          type: string
        type:
          $ref: '#/components/schemas/MetadataType'
        value:
          description: The metadata value
          example: production
          type: string
      required:
      - id
      - key
      - value
      - type
      type: object
    MetadataItemInput:
      description: Metadata key-value pair for create/update operations
      properties:
        key:
          description: The metadata key name (case-sensitive)
          example: environment
          maxLength: 128
          minLength: 1
          type: string
        value:
          description: The metadata value
          example: production
          maxLength: 256
          minLength: 1
          type: string
      required:
      - key
      - value
      type: object
    RegistryArtifactType:
      description: refers to artifact type
      enum:
      - model
      - dataset
      - module
      - provider
      type: string
    DeploymentMetadata:
      properties:
        nonProdEnvCount:
          type: integer
        prodEnvCount:
          type: integer
      required:
      - prodEnvCount
      - nonProdEnvCount
      type: object
    ListVersion:
      description: A list of Versions
      properties:
        artifacts:
          description: A list of Versions
          items:
            $ref: '#/components/schemas/VersionMetadata'
          type: array
        itemCount:
          description: The total number of items
          example: 1
          format: int64
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
        pageCount:
          description: The total number of pages
          example: 100
          format: int64
          type: integer
        pageIndex:
          description: The current page
          example: 0
          format: int64
          type: integer
        pageSize:
          description: The number of items per page
          example: 1
          type: integer
      required:
      - artifacts
      - meta
      type: object
    FileMetadata:
      description: File Metadata
      properties:
        downloadUrl:
          type: string
        filename:
          type: string
        id:
          type: string
        sha256:
          type: string
      required:
      - id
      - downloadUrl
      - sha256
      - filename
      type: object
