    PerformedBy:
      description: Principal who performed the relevant action
      properties:
        email:
          type: string
        name:
          type: string
      required:
      - name
      - email
      type: object
    ArtifactEntityMetadata:
      additionalProperties: true
      description: Artifact Entity Metadata
      type: object
    RegistryStatus:
      description: Request processing status indicator
      enum:
      - SUCCESS
      - FAILURE
      - ERROR
      type: string
    ListRegistry:
      description: A list of Harness Artifact Registries
      properties:
        itemCount:
          description: The total number of items
          example: 1
          format: int64
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
        pageCount:
          description: The total number of pages
          example: 100
          format: int64
          type: integer
        pageIndex:
          description: The current page
          example: 0
          format: int64
          type: integer
        pageSize:
          description: The number of items per page
          example: 1
          type: integer
        registries:
          description: A list of Harness Artifact Registries
          items:
            $ref: '#/components/schemas/RegistryMetadata'
          type: array
      required:
      - registries
      - meta
      type: object
    ListPackage:
      description: A list of Package
      properties:
        itemCount:
          description: The total number of items
          example: 1
          format: int64
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
        packages:
          description: A list of Package
          items:
            $ref: '#/components/schemas/PackageMetadata'
          type: array
        pageCount:
          description: The total number of pages
          example: 100
          format: int64
          type: integer
        pageIndex:
          description: The current page
          example: 0
          format: int64
          type: integer
        pageSize:
          description: The number of items per page
          example: 1
          type: integer
      required:
      - packages
      - meta
      type: object
    BulkDownloadFilesRequestInput:
      description: 'Input for bulk download files. Only one of packages or versions should be provided.

        '
      properties:
        outputFileName:
          description: Name of the output file to be downloaded
          type: string
        packages:
          description: List of packages UUID to download
          items:
            type: string
          type: array
        registryId:
          description: registry UUID
          type: string
        versions:
          description: List of versions UUID to download
          items:
            type: string
          type: array
      required:
      - registryId
      type: object
    MetadataInput:
      description: 'Request payload containing metadata items to add or update for a specific entity.


        **Priority Logic:**

        1. If `path` is present, it takes highest priority and determines the target entity

        2. If `path` is absent but `package` and `version` are provided, metadata is attached to the specific package version

        3. If only `package` is provided (without `version`), metadata is attached to the package level

        4. If neither `path`, `package`, nor `version` are provided, metadata is attached to the registry level

        '
      example:
        metadata:
        - key: environment
          value: production
        - key: team
          value: backend
        package: my-package
        path: /path/to/entity
        registryIdentifier: my-registry
        version: 1.0.0
      properties:
        artifactKeyFilters:
          additionalProperties:
            type: string
          type: object
        metadata:
          description: Array of metadata key-value pairs
          items:
            $ref: '#/components/schemas/MetadataItemInput'
          maxItems: 50
          minItems: 1
          type: array
        package:
          description: 'Optional package name. Used when `path` is not provided.

            '
          example: my-package
          type: string
        path:
          description: 'Optional hierarchical path to the specific entity within the registry.

            When provided, this takes highest priority for determining the metadata target.

            Examples: "/my-package/1.0.0" for a specific version, "/my-package" for an package

            '
          example: /path/to/entity
          type: string
        registryIdentifier:
          description: 'The unique identifier of the registry where the metadata will be applied.

            '
          example: my-registry
          type: string
        version:
          description: 'Optional version identifier. Only used when `package` is also provided and `path` is absent.

            When both `package` and `version` are specified, metadata is attached to the specific package version.

            '
          example: 1.0.0
          type: string
      required:
      - metadata
      - registryIdentifier
      type: object
  requestBodies:
    MetadataRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MetadataInput'
      description: Request body containing metadata key-value pairs to add or update
    BulkDownloadFilesRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkDownloadFilesRequestInput'
      description: request to bulk download files
    AddTagsRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AddTags'
      description: request to add tags to a manifest
  parameters:
    RegistryTypeParam:
      description: Registry Type
      in: query
      name: type
      schema:
        enum:
        - VIRTUAL
        - UPSTREAM
        type: string
    PackageParam:
      description: 'Name of the package


        Example: `nginx` or `redis`

        '
      in: query
      name: package
      schema:
        type: string
    SrcArtifact:
      description: Name of the package/artifact
      in: query
      name: src_artifact
      schema:
        type: string
    SrcProjectIdentifier:
      description: 'Unique identifier for the project within the organization.


        Example: `my_project` or `frontend_services`

        '
      in: query
      name: src_project_identifier
      schema:
        type: string
    TargetRegistryIdentifierParam:
      description: 'Unique identifier for the artifact registry.

        Example: `my-docker-registry` or `npm-packages`

        '
      in: query
      name: target_registry_identifier
      required: true
      schema:
        type: string
    SrcVersion:
      description: Version of the package/artifact
      in: query
      name: src_version
      schema:
        type: string
    RegistryIdentifiersParam:
      description: 'Unique identifier for the artifact registry.


        Example: `my-docker-registry` or `npm-packages`


        Note: This parameter should have one registry if package query param is provided

        '
      in: query
      name: registry_identifier
      schema:
        items:
          type: string
        type: array
    RegistrySearchTerm:
      description: 'Search term for filtering results.


        Example: `search_term=prod` might match keys like "production", "prod-env", etc.

        '
      in: query
      name: search_term
      schema:
        type: string
    DownloadId:
      description: Download ID
      in: path
      name: download_id
      required: true
      schema:
        type: string
    RegistryAccountIdentifier:
      description: 'Unique identifier for the Harness account.

        '
      in: query
      name: account_identifier
      required: true
      schema:
        type: string
    ArtifactTypeParam:
      description: artifact type.
      in: query
      name: artifact_type
      schema:
        enum:
        - model
        - dataset
        - module
        - provider
        type: string
    Query:
      description: "Advanced search expression (query language).\n\nQuery structure\n- A query clause consists of a field followed by an operator followed by a value.\n  Example clause: `email:\"amy@rocketrides.io\"`\n  - field: `email`\n  - operator: `:`\n  - value: `amy@rocketrides.io`\n\nOperators\n- `:` exact match operator (case sensitive): `field:value`\n\nCombining clauses\n- You can combine up to 10 query clauses.\n- Clauses can be separated by a space or by using `AND` / `OR` keywords.\n- You can’t combine `AND` and `OR` in the same query.\n- Parentheses are not supported.\n- If clauses are separated by a space, clauses are combined using `AND` logic.\n\nSupported query fields for files search api\n- `package` (string)\n- `version` (string)\n- `groupId` (string)\n- `artifactId` (string)\n- `classifier` (string)\n- `extension` (string)\n- `fileName` (string)\n\nExamples\n- `query=package:\"usd\" AND version:\"1.0.0\"`\n- `query=fileName:\"report\" OR extension:\"zip\"`\n"
      in: query
      name: query
      required: true
      schema:
        type: string
    TargetOrgIdentifier:
      description: 'Unique identifier for the organization within the account.


        Example: `default` or `engineering_org`

        '
      in: query
      name: target_org_identifier
      schema:
        type: string
    SrcOrgIdentifier:
      description: 'Unique identifier for the organization within the account.


        Example: `default` or `engineering_org`

        '
      in: query
      name: src_org_identifier
      schema:
        type: string
    RegistryScope:
      description: "**Scope of registries to list**\n* **none** – current space only (default)   * **ancestors** – current space **plus** all parent spaces   * **descendants** – current space **plus** all child spaces  \nIf omitted, `none` is assumed.\n"
      in: query
      name: scope
      schema:
        enum:
        - ancestors
        - descendants
        - none
        type: string
    ProjectIdentifier:
      description: 'Unique identifier for the project within the organization.


        Example: `my_project` or `frontend_services`

        '
      in: query
      name: project_identifier
      schema:
        type: string
    TargetProjectIdentifier:
      description: 'Unique identifier for the project within the organization.


        Example: `my_project` or `frontend_services`

        '
      in: query
      name: target_project_identifier
      schema:
        type: string
    FileName:
      description: Name of file to download
      in: path
      name: file_name
      required: true
      schema:
        type: string
    SortOrder:
      description: 'The sort order for the results.


        Determines whether results are sorted in ascending or descending order.

        Must be used in combination with `sort_field` parameter.


        Allowed values: `ASC` (ascending), `DESC` (descending)

        '
      in: query
      name: sort_order
      schema:
        default: ASC
        enum:
        - ASC
        - DESC
        type: string
    KeyParam:
      description: 'The metadata key for which to retrieve all possible values.

        This parameter is used to filter metadata values by a specific key name.


        Examples: `environment`, `team`, `version_type`, `build_number`

        '
      in: query
      name: key
      required: true
      schema:
        type: string
    PageSize:
      description: "The number of items to return per page.\n\nControls the page size for paginated results. \n\nExample: `size=50` returns up to 50 items per page\n"
      in: query
      name: size
      schema:
        default: 20
        format: int64
        maximum: 100
        minimum: 1
        type: integer
    PathParam:
      description: 'The hierarchical path to the registry entity. The path structure varies based on the entity type:


        **Registry Level**: Empty path (`""`) - refers to the registry root


        **package Level**: `{package-name}` - refers to a specific package

        - Example: `my-package` for an package named "my-package"

        - Example: `@scope/package-name` for scoped npm packages


        **Version Level**: `{package-name}/{version}` - refers to a specific version of an package

        - Example: `my-package/1.0.0` for version "1.0.0" of package "my-package"

        - Example: `@scope/package-name/2.1.0` for version "2.1.0" of scoped package


        **Nested Artifacts**: For artifacts with nested structures, use forward slashes as separators

        - Example: `group/artifact/1.0.0` for Maven-style group/artifact/version

        - Example: `namespace/Package/latest` for Docker-style namespace/Package/tag

        '
      in: query
      name: path
      schema:
        type: string
    RegistryIdentifier:
      description: 'Unique identifier for the artifact registry.


        Example: `my-docker-registry` or `npm-packages`

        '
      in: query
      name: registry_identifier
      required: true
      schema:
        type: string
    DeleteFilterParam:
      in: query
      name: deleted
      schema:
        default: EXCLUDE
        enum:
        - EXCLUDE
        - INCLUDE
        - ONLY
        type: string
    SrcRegistryIdentifierParam:
      description: Source Registry name
      in: query
      name: src_registry_identifier
      required: true
      schema:
        type: string
    artifactTypeParam:
      description: artifact type.
      in: query
      name: artifact_type
      schema:
        enum:
        - model
        - dataset
        - module
        - provider
        type: string
    SortField:
      description: 'The field by which to sort the results.


        Specifies which field should be used for sorting. Available fields depend

        on the endpoint and the type of data being returned.


        Common examples: `name`, `createdAt`, `updatedAt`

        '
      in: query
      name: sort_field
      schema:
        type: string
    VersionParam:
      description: 'Name of the package version


        Example: `latest` or `1.1.1`

        '
      in: query
      name: version
      schema:
        type: string
    PageNumber:
      description: 'The page number for pagination (0-indexed).


        Used to navigate through large result sets. Combined with `size` parameter

        to control which subset of results to return.


        Example: `page=0` returns the first page, `page=1` returns the second page

        '
      in: query
      name: page
      schema:
        default: 0
        format: int64
        type: integer
    MetadataFilter:
      description: Filter by metadata using key:value format
      in: query
      name: metadata
      schema:
        items:
          type: string
        type: array
    OrgIdentifier:
      description: 'Unique identifier for the organization within the account.


        Example: `default` or `engineering_org`

        '
      in: query
      name: org_identifier
      schema:
        type: string
    PackageTypeParam:
      description: Registry Package Type
      in: query
      name: package_type
      schema:
        items:
          type: string
        type: array
    FilePath:
      description: Full path of file to download
      in: query
      name: path
      required: true
      schema:
        type: string
    FiltersParam:
      description: 'Key-value filters for artifact retrieval. Repeat the parameter once per filter.

        Format per entry: key:value

        Example: ?filters=architecture:amd64&filters=distribution:jammy

        '
      explode: true
      in: query
      name: filters
      schema:
        items:
          example: architecture:amd64
          type: string
        type: array
      style: form
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
