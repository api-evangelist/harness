    RegistryError:
      description: Standard error response with code, message and optional details
      properties:
        code:
          description: The HTTP error code
          example: '404'
          type: string
        details:
          description: 'Additional context and details about the error.

            May include field-specific validation errors or debugging information.

            '
          example:
            field: registry_identifier
            reason: Registry does not exist in the specified project
            value: invalid-registry
          type: object
        message:
          description: Human-readable error message explaining what went wrong
          example: Registry not found
          type: string
      required:
      - code
      - message
      type: object
    Meta:
      description: Metadata about the list response
      properties:
        activeCount:
          description: Count of active (non-deleted) entities
          example: 95
          format: int64
          type: integer
        deletedCount:
          description: Count of soft-deleted entities
          example: 5
          format: int64
          type: integer
      required:
      - activeCount
      - deletedCount
      type: object
    BulkDownloadRequestStatusOutput:
      properties:
        downloadUrl:
          type: string
        id:
          type: string
        message:
          type: string
        outputFileName:
          type: string
        status:
          $ref: '#/components/schemas/BulkDownloadRequestStatus'
      required:
      - id
      - status
      - message
      - downloadUrl
      - outputFileName
      type: object
    MetadataType:
      description: Indicates if metadata was manually added (MANUAL) or system-generated (AUTO)
      enum:
      - MANUAL
      - AUTO
      example: MANUAL
      type: string
    RegistryType:
      description: refers to type of registry i.e virtual or upstream
      discriminator:
        propertyName: type
      enum:
      - VIRTUAL
      - UPSTREAM
      type: string
    AddTags:
      properties:
        package:
          type: string
        tags:
          items:
            type: string
          type: array
        version:
          type: string
      required:
