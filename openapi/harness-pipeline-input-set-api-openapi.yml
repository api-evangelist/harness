openapi: 3.2.0
info:
  title: Harness Pipeline Input Set API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Pipeline Input Set
  description: This contains APIs related to Input Sets
paths:
  /pipeline/api/inputSets:
    get:
      tags:
      - Pipeline Input Set
      summary: List Input Sets
      description: Lists all Input Sets for a Pipeline
      operationId: listInputSet
      parameters:
      - name: pageIndex
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 100
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline identifier for which we need the Input Sets list.
        required: true
        schema:
          type: string
      - name: inputSetType
        in: query
        description: Type of Input Set. The default value is ALL.
        schema:
          type: string
          enum:
          - ALL
          - INPUT_SET
          - OVERLAY_INPUT_SET
          default: ALL
      - name: searchTerm
        in: query
        description: Search term to filter out Input Sets based on name, identifier, tags.
        schema:
          type: string
      - name: sortOrders
        in: query
        description: Sort criteria for the elements.
        schema:
          type: array
          items:
            type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Fetch all the Input Sets for a Pipeline, including Overlay Input Sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseInputSetSummaryResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseInputSetSummaryResponse'
    post:
      tags:
      - Pipeline Input Set
      summary: Create an Input Set
      description: Creates an Input Set for a Pipeline
      operationId: postInputSet
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier for the entity.
        required: true
        schema:
          type: string
      - name: pipelineBranch
        in: query
        description: Github branch of the Pipeline for which the Input Set is to be created
        schema:
          type: string
      - name: pipelineRepoID
        in: query
        description: Github Repo identifier of the Pipeline for which the Input Set is to be created
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: rootFolder
        in: query
        description: Path to the root folder of the Entity. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: isNewBranch
        in: query
        description: Checks the new branch
        schema:
          type: boolean
          default: false
      - name: baseBranch
        in: query
        description: Name of the default branch.
        schema:
          type: string
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          type: string
      - name: storeType
        in: query
        description: Tells whether the Entity is to be saved on Git or not
        schema:
          type: string
          enum:
          - INLINE
          - REMOTE
          - INLINE_HC
      - name: repoName
        in: query
        description: Name of the repository.
        schema:
          type: string
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
      - name: InputSetVersion
        in: query
        description: Input set yaml version, should be one of '0' or '1'
        schema:
          type: string
          default: '0'
      requestBody:
        description: Input set YAML to be created. The Account, Org, Project, and Pipeline identifiers inside the YAML should match the query parameters.
        content:
          application/yaml:
            schema:
              type: string
            examples:
              Create:
                summary: Sample Input Set YAML
                description: Sample Input Set YAML
                value: "inputSet:\n    name: Sample Input Set\n    tags: {}\n    identifier: Sample_Input_Set\n    orgIdentifier: default\n    projectIdentifier: MISC\n    pipeline:\n        identifier: Sample_Pipeline\n        stages:\n            - stage:\n                  identifier: Sample_Stage\n                  type: Approval\n                  spec:\n                      execution:\n                          steps:\n                              - step:\n                                    identifier: Approval_Step\n                                    type: HarnessApproval\n                                    spec:\n                                        approvers:\n                                            userGroups:\n                                                - account.Admins\n                              - step:\n                                    identifier: Shellscript_Step\n                                    type: ShellScript\n                                    spec:\n                                        source:\n                                            type: Inline\n                                            spec:\n                                                script: echo \"ShellScript\"\n            - stage:\n                  identifier: Sample_Deploy_Stage\n                  type: Deployment\n                  spec:\n                      serviceConfig:\n                          serviceRef: Service1\n                      infrastructure:\n                          environmentRef: Env1\n                          infrastructureDefinition:\n                              type: KubernetesDirect\n                              spec:\n                                  connectorRef: account.harnessciplatform\n                                  namespace: sample\n"
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: If the YAML is valid, returns created Input Set. If not, it sends what is wrong with the YAML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOInputSetResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOInputSetResponse'
  /pipeline/api/inputSets/overlay:
    post:
      tags:
      - Pipeline Input Set
      summary: Create an Overlay Input Set for a pipeline
      operationId: postOverlayInputSet
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier for the entity.
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: rootFolder
        in: query
        description: Path to the root folder of the Entity. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: isNewBranch
        in: query
        description: Checks the new branch
        schema:
          type: boolean
          default: false
      - name: baseBranch
        in: query
        description: Name of the default branch.
        schema:
          type: string
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          type: string
      - name: storeType
        in: query
        description: Tells whether the Entity is to be saved on Git or not
        schema:
          type: string
          enum:
          - INLINE
          - REMOTE
          - INLINE_HC
      - name: repoName
        in: query
        description: Name of the repository.
        schema:
          type: string
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
      requestBody:
        description: Overlay Input Set YAML to be created. The Account, Org, Project, and Pipeline identifiers inside the YAML should match the query parameters
        content:
          application/json:
            schema:
              type: string
          application/yaml:
            schema:
              type: string
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: If the YAML is valid, returns created Overlay Input Set. If not, it sends what is wrong with the YAML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOOverlayInputSetResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOOverlayInputSetResponse'
  /pipeline/api/inputSets/{inputSetIdentifier}:
    get:
      tags:
      - Pipeline Input Set
      summary: Fetch an Input Set
      description: Returns Input Set for a Given Identifier (Throws an Error if no Input Set Exists)
      operationId: getInputSet
      parameters:
      - name: inputSetIdentifier
        in: path
        description: Identifier for the Input Set
        required: true
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier for the entity.
        required: true
        schema:
          type: string
      - name: pipelineBranch
        in: query
        description: Github branch of the Pipeline for which the Input Set is to be fetched
        schema:
          type: string
      - name: pipelineRepoID
        in: query
        description: Github Repo identifier of the Pipeline for which the Input Set is to be fetched
        schema:
          type: string
      - name: loadFromFallbackBranch
        in: query
        schema:
          type: boolean
          default: false
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      - name: Load-From-Cache
        in: header
        schema:
          type: string
          default: 'false'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns Input Set if exists for the given Identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOInputSetResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOInputSetResponse'
    put:
      tags:
      - Pipeline Input Set
      summary: Update an Input Set
      description: Updates the Input Set for a Pipeline
      operationId: putInputSet
      parameters:
      - name: If-Match
        in: header
        description: Version of Entity to match
        schema:
          type: string
      - name: inputSetIdentifier
        in: path
        description: Identifier for the Input Set that needs to be updated. An Input Set corresponding to this identifier should already exist.
        required: true
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier for the entity.
        required: true
        schema:
          type: string
      - name: pipelineBranch
        in: query
        description: Github branch of the Pipeline for which the Input Set is to be updated
        schema:
          type: string
      - name: pipelineRepoID
        in: query
        description: Github Repo Id of the Pipeline for which the Input Set is to be updated
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: rootFolder
        in: query
        description: Path to the root folder of the Entity. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: Commit Message to use for the merge commit.
        schema:
          type: string
      - name: lastObjectId
        in: query
        description: Its required field during update call request. It can be fetched from the response of GET API call for the entity
        schema:
          type: string
      - name: resolvedConflictCommitId
        in: query
        description: If the entity is git-synced, this parameter represents the commit id against which file conflicts are resolved
        schema:
          type: string
      - name: baseBranch
        in: query
        description: Name of the default branch.
        schema:
          type: string
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          type: string
      - name: lastCommitId
        in: query
        description: last commit id of the file
        schema:
          type: string
      - name: isNewBranch
        in: query
        description: Checks the new branch
        schema:
          type: boolean
          default: false
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
      - name: InputSetVersion
        in: query
        description: Input set yaml version, should be one of '0' or '1'
        schema:
          type: string
          default: '0'
      requestBody:
        description: Input set YAML to be updated. The query parameters should match the Account, Org, Project, and Pipeline Ids in the YAML.
        content:
          application/yaml:
            schema:
              type: string
            examples:
              Update:
                summary: Sample Input Set YAML
                description: Sample Input Set YAML
                value: "inputSet:\n    name: Sample Input Set\n    tags: {}\n    identifier: Sample_Input_Set\n    orgIdentifier: default\n    projectIdentifier: MISC\n    pipeline:\n        identifier: Sample_Pipeline\n        stages:\n            - stage:\n                  identifier: Sample_Stage\n                  type: Approval\n                  spec:\n                      execution:\n                          steps:\n                              - step:\n                                    identifier: Approval_Step\n                                    type: HarnessApproval\n                                    spec:\n                                        approvers:\n                                            userGroups:\n                                                - account.Admins\n                              - step:\n                                    identifier: Shellscript_Step\n                                    type: ShellScript\n                                    spec:\n                                        source:\n                                            type: Inline\n                                            spec:\n                                                script: echo \"ShellScript\"\n            - stage:\n                  identifier: Sample_Deploy_Stage\n                  type: Deployment\n                  spec:\n                      serviceConfig:\n                          serviceRef: Service1\n                      infrastructure:\n                          environmentRef: Env1\n                          infrastructureDefinition:\n                              type: KubernetesDirect\n                              spec:\n                                  connectorRef: account.harnessciplatform\n                                  namespace: sample\n"
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: If the YAML is valid, returns the updated Input Set. If not, it sends what is wrong with the YAML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOInputSetResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOInputSetResponse'
    delete:
      tags:
      - Pipeline Input Set
      summary: Delete an Input Set
      description: Deletes the Input Set by Identifier
      operationId: deleteInputSet
      parameters:
      - name: If-Match
        in: header
        description: Version of Entity to match
        schema:
          type: string
      - name: inputSetIdentifier
        in: path
        description: Identifier of the Input Set that should be deleted.
        required: true
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier for the entity.
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: rootFolder
        in: query
        description: Path to the root folder of the Entity. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: Commit Message to use for the merge commit.
        schema:
          type: string
      - name: lastObjectId
        in: query
        description: Last Object Id
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Return the Deleted Input Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
  /pipeline/api/inputSets/get/batch-input-sets-metadata:
    post:
      tags:
      - Pipeline Input Set
      summary: List regular Input Sets for multiple pipelines (excludes overlay input sets)
      description: Lists regular Input Sets for multiple pipelines (excludes overlay input sets). If pipeline identifiers are not provided, fetches all accessible input sets based on RBAC permissions.
      operationId: getBatchInputSetsMetadata
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pageIndex
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 20
      - name: searchTerm
        in: query
        description: Search term to filter out Input Sets based on name, identifier, tags.
        schema:
          type: string
      requestBody:
        description: Optional request containing pipeline identifiers to fetch regular input sets for. If not provided or empty, fetches all accessible input sets based on RBAC permissions.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInputSetsAPIRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/BatchInputSetsAPIRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Fetch regular Input Sets for the specified pipelines (excludes overlay input sets). If no pipeline identifiers provided, returns all accessible input sets based on RBAC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseInputSetListResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseInputSetListResponse'
  /pipeline/api/inputSets/get/bulk:
    post:
      tags:
      - Pipeline Input Set
      summary: Get multiple input sets by identifiers (non-deleted only)
      description: Gets multiple input sets by their identifiers for a specific pipeline. Only returns non-deleted input sets.
      operationId: getBulkInputSets
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier
        required: true
        schema:
          type: string
      requestBody:
        description: Request containing input set identifiers to fetch
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkInputSetsAPIRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/BulkInputSetsAPIRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
