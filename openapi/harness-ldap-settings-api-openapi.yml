      x-stoplight:
        id: 02mvlbq51owqg
      tags:
      - Ldap Settings
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      x-internal: true
      requestBody:
        $ref: '#/components/requestBodies/LinkSSOGroupRequest'
  /v1/ldap-settings/unlink/{group-id}:
