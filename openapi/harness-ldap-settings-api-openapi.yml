openapi: 3.2.0
info:
  title: Harness Ldap Settings API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Ldap Settings
paths:
  /v1/ldap-settings:
    parameters: []
    post:
      summary: Create Account LDAP Settings
      operationId: create-ng-ldap-settings
      responses:
        '201':
          $ref: '#/components/responses/LdapSettingsResponse'
      x-stoplight:
        id: n04275yl5c0g3
      description: Create NG Ldap setttings
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/LdapSettingsRequest'
      tags:
      - Ldap Settings
    get:
      summary: Get ldap settings for the account
      tags:
      - Ldap Settings
      responses:
        '200':
          $ref: '#/components/responses/LdapSettingsResponse'
      operationId: get-account-ldap-settings
      x-stoplight:
        id: x58m09htlk67j
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
  /v1/ldap-settings/{ldap-settings-id}:
    parameters:
    - schema:
        type: string
      name: ldap-settings-id
      in: path
      required: true
    get:
      summary: Get Account Ldap Settings by identifier
      tags:
      - Ldap Settings
      responses:
        '200':
          $ref: '#/components/responses/LdapSettingsResponse'
      operationId: get-ldap-settings
      x-stoplight:
        id: 9655d1754op9c
      description: Get Account NG Ldap settings
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
    put:
      summary: Update Account Ldap Settings
      operationId: update-ldap-settings
      responses:
        '200':
          $ref: '#/components/responses/LdapSettingsResponse'
      x-stoplight:
        id: 63u2f75vg76gz
      description: Update NG Ldap settings for the account
      requestBody:
        $ref: '#/components/requestBodies/LdapSettingsRequest'
      tags:
      - Ldap Settings
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
    delete:
      summary: Delete Account Ldap Settings
      operationId: delete-ldap-settings
      responses:
        '204':
          description: No Content
      x-stoplight:
        id: hw0azqcr4ehs9
      description: Delete Account Ldap settings
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      tags:
      - Ldap Settings
  /v1/ldap-settings/validate/connection-settings:
    post:
      summary: Validate Ldap Connection Settings
      tags:
      - Ldap Settings
      responses:
        '200':
          $ref: '#/components/responses/LdapValidateResponse'
      operationId: validate-connection-settings
      x-stoplight:
        id: 24rd6s9hp2b0a
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/LdapSettingsRequest'
  /v1/ldap-settings/validate/user-settings:
    post:
      summary: Validate Ldap User Settings
      tags:
      - Ldap Settings
      responses:
        '200':
          $ref: '#/components/responses/LdapValidateResponse'
      operationId: validate-user-settings
      x-stoplight:
        id: 5fw3lcfs79wpo
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/LdapSettingsRequest'
  /v1/ldap-settings/validate/group-settings:
    post:
      summary: Validate Ldap Group Settings
      tags:
      - Ldap Settings
      responses:
        '200':
          $ref: '#/components/responses/LdapValidateResponse'
      operationId: validate-group-settings
      x-stoplight:
        id: uvedvfpk6ldue
