  /v1/ldap-settings/link/orgs/{org}/{group-id}:
    parameters:
    - $ref: '#/components/parameters/OrgPathParam'
    - $ref: '#/components/parameters/UserGroupIdentifierPathParam'
    get - copy:
      summary: Link ldap settings
      tags: []
      responses:
        '200':
          $ref: '#/components/responses/LinkGroupToLdapSettings'
      operationId: link-ldap-settings-proj
      x-internal: true
      x-extension-1: null
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
    post:
      summary: Link dap settings
      tags:
      - Ldap Settings
      responses:
        '200':
          $ref: '#/components/responses/LinkGroupToLdapSettings'
      operationId: link-ldap-settings-org
      x-stoplight:
        id: 86uren6k078bj
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      x-internal: true
      requestBody:
