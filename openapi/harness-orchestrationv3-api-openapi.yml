openapi: 3.2.0
info:
  title: Harness Orchestration V3 API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: orchestrationV3
paths:
  /v2/orgs/{org}/projects/{project}/orchestration/{orchestration}/sbom-upload:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/OrchestrationId'
    servers: []
    post:
      summary: Upload SBOM
      tags:
      - orchestrationV3
      responses:
        '201':
          description: Shared Response
      operationId: uploadSbomV2
      x-stoplight:
        id: nu31o2ljat7wm
      description: Upload SBOM for an orchestration run
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - sbom
              - execution_context
              properties:
                sbom:
                  type: string
                  x-stoplight:
                    id: q6xx2x2hw7izu
                  format: binary
                  writeOnly: true
                execution_context:
                  $ref: '#/components/schemas/ExecutionDetail'
                sbom_name:
                  type: string
                  x-stoplight:
                    id: x2y8o4pdp79wh
      security:
      - x-api-key: []
  /v2/orgs/{org}/projects/{project}/orchestration/{orchestration}:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/OrchestrationId'
    post:
      summary: Save Orchestration
      tags:
      - orchestrationV3
      responses:
        '201':
          $ref: '#/components/responses/PluginResponseBody'
        '400':
          description: Bad Request
      operationId: saveOrchestrationV2
      x-stoplight:
        id: z435nplrowm4h
      requestBody:
        $ref: '#/components/requestBodies/SaveOrchestrationRequestBodyV2'
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      security:
      - x-api-key: []
components:
  schemas:
    ExecutionDetail:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/ExecutionType'
        github:
          $ref: '#/components/schemas/GithubExecutionDetail'
        harness:
          $ref: '#/components/schemas/HarnessExecutionDetail'
    GithubExecutionDetail:
      title: GithubExecutionDetail
      x-stoplight:
        id: nfcbibnr1z2rw
      type: object
      properties:
        repository:
          type: string
          x-stoplight:
            id: sac861lasuewn
        github_action:
          type: string
          x-stoplight:
            id: l8azkn1th708h
        action_path:
          type: string
          x-stoplight:
            id: twcllxr8bibkc
        job_id:
          type: string
          x-stoplight:
            id: gxvhjwmosdutz
        run_id:
          type: string
          x-stoplight:
            id: cunrcn7ohnpy2
        workflow_ref:
          type: string
          x-stoplight:
            id: gnclwe27klokp
        runner_detail:
          $ref: '#/components/schemas/GithubRunner'
      description: Github Pipeline Execution Details
    HarnessRunner:
      title: HarnessRunner
      x-stoplight:
        id: vfsaqcya7qwfx
      type: object
      properties:
        trigger_type:
          type: string
          x-stoplight:
            id: rzkmd5bqoc9r9
        trigger_by_id:
          type: string
          x-stoplight:
            id: b36ytjxzv2yq6
        trigger_by_name:
          type: string
          x-stoplight:
            id: a7g4t02vts8gf
    RepositoryPlatform:
      type: string
      title: RepositoryPlatform
      x-stoplight:
        id: prybalroyw6dc
      enum:
      - HARNESS
      - GITHUB
      - BITBUCKET
      - GITLAB
      - GIT
      - AZURE
    SbomMetadataV2:
      title: SbomMetadataV2
      x-stoplight:
        id: 4na922okidtvc
      type: object
      required:
      - name
      - format
      - tool_name
      - tool_version
      properties:
        name:
          type: string
          x-stoplight:
            id: 0160bbgwts3sz
        format:
          type: string
          minLength: 3
          example: spdx-json
        tool_name:
          type: string
          minLength: 3
          example: synk
          x-stoplight:
            id: ic4qf7a3stbw7
        tool_version:
          type: string
          x-stoplight:
            id: 1mfkoo8p7i071
        created:
          type: number
          x-stoplight:
            id: ldh7rwijoj89o
        sbom_version:
          type: string
          x-stoplight:
            id: feovw69zekn4x
        tool_vendor:
          type: string
          x-stoplight:
            id: cbdqudq2dotry
    ArtifactVariant:
      title: ArtifactVariant
      x-stoplight:
        id: uyb3jwhgs9wjh
      type: object
      properties:
        type:
          type: string
          x-stoplight:
            id: 2r8lmxejmwqbf
          enum:
          - tag
          - branch
          - gitTag
          - commit
          description: type of the variant of the artifact.
        value:
          type: string
          x-stoplight:
            id: hd1p3s7bugn88
          description: Value of the variant of the artifact.
    Attestation:
      title: Attestation
      x-stoplight:
        id: rzr5mk8z847jg
      type: object
      properties:
        is_attested:
          type: boolean
          default: false
          description: is the sbom attested or not
        url:
          type: string
          description: url of the attested file
          example: https://storage.googleapis.com/sbom_store_public/kmpySmUISimoRrJL6NL73w/default/SSCS_CI_Plugin_Demo/CKO_SSCA_Pipeline/Build/39/q940CvjoQj-GEInJQfWiwg/sbom
    ExecutionType:
      type: string
      enum:
      - harness
      - github
    SbomComponentRequestDTO:
      title: NormalizedSbomComponentDTO
      x-stoplight:
        id: w7dtx3sur4642
      type: object
      description: Normalized SBOM Component Details
      properties:
        tags:
          type: array
          items:
            type: string
        package_id:
          type: string
        package_name:
          type: string
        package_description:
          type: string
        package_license:
          type: array
          items:
            type: string
        package_source_info:
          type: string
        package_version:
          type: string
        package_originator_name:
          type: string
        originator_type:
          type: string
        package_type:
          type: string
        package_cpe:
          type: string
        package_properties:
          type: string
        package_manager:
          type: string
        package_namespace:
          type: string
        major_version:
          type: number
        minor_version:
          type: number
        patch_version:
          type: number
        purl:
          type: string
        language:
          type: string
        filter_tags:
          type: array
          items:
            $ref: '#/components/schemas/LayerType'
    Artifact1:
      title: Artifact
      x-go-name: ArtifactListItem
      x-stoplight:
        id: 13qkvpww6x2ku
      type: object
      x-examples: {}
      required:
      - type
      - name
      - registry_url
      properties:
        id:
          type: string
          description: id of the artifact
          example: 089855ea-f90e-4bea-a5c9-b5ddf85d3180
        type:
          type: string
          description: type of the artifact
          enum:
          - image
          - repository
          default: image
          example: image
        name:
          type: string
          description: name of the artifact
          example: harness/image
        tag:
          type: string
          description: tag of the artifact
          default: latest
          example: latest
        registry_url:
          type: string
          description: url of the artifact
          example: https://console.cloud.google.com/gcr/images/imageName
        url:
          type: string
          x-stoplight:
            id: 2gcc89tfmislv
        variant:
          $ref: '#/components/schemas/ArtifactVariant'
        digest:
          type: string
          description: digest of the artifact
          example: sha256:1234567890
        metadata:
          type: object
          additionalProperties: true
          x-stoplight:
            id: bcmiu856m2sf8
        repository_platform:
          $ref: '#/components/schemas/RepositoryPlatform'
    PluginResponseBody:
      title: PluginResponseBody
      type: object
      required:
      - source_id
      - artifact
      - response_url
      properties:
        source_id:
          type: string
          x-stoplight:
            id: itkxv1ghux6aa
        artifact:
          type: object
          x-stoplight:
            id: ysaq85xiuzjsw
          properties:
            id:
              type: string
              x-stoplight:
                id: sgyd78hu7w5gl
            name:
              type: string
              x-stoplight:
                id: khrj2i162jh3x
            url:
              type: string
              x-stoplight:
                id: zgc35mjt90crt
        response_url:
          type: string
          x-stoplight:
            id: uadidz06nvmyn
    SaveOrchestrationRequestV2:
      title: SaveOrchestrationRequest
      x-stoplight:
        id: 5tb5gd8m5ehto
      type: object
      required:
      - artifact
      - sbom_metadata
      - attestation
      properties:
        components:
          type: array
          x-stoplight:
            id: x8wtamg34sbym
          items:
            $ref: '#/components/schemas/SbomComponentRequestDTO'
        artifact:
          $ref: '#/components/schemas/Artifact1'
        sbom_metadata:
          $ref: '#/components/schemas/SbomMetadataV2'
        attestation:
          $ref: '#/components/schemas/Attestation'
        execution_context:
          $ref: '#/components/schemas/ExecutionDetail'
    LayerType:
      title: LayerType
      enum:
      - BASE
      - APP
      - DISTRO
      x-stoplight:
        id: 151c5cf8ekave
    GithubRunner:
      title: GithubRunner
      x-stoplight:
        id: 32axq2gn4gemv
      type: object
      properties:
        name:
          type: string
          x-stoplight:
            id: x0aeloqpvaybd
        account_id:
          type: string
          x-stoplight:
            id: aod8pc43fmjbt
    HarnessExecutionDetail:
      title: HarnessExecutionDetail
      x-stoplight:
        id: 26kpn09zundb0
      type: object
      properties:
        org:
          type: string
          x-stoplight:
            id: zf78rh1u21y55
        project:
          type: string
          x-stoplight:
            id: lghyhop0hsg0f
        pipeline_execution_id:
          type: string
          x-stoplight:
            id: svsw1myd4slwa
        pipeline_id:
          type: string
          x-stoplight:
            id: 6ms1cohmjf8rv
        pipeline_name:
          type: string
          x-stoplight:
            id: qecka5f2dfvxx
        sequence_id:
          type: string
          x-stoplight:
            id: tvb3c7trq28pt
        step_id:
          type: string
          x-stoplight:
            id: bj8ul3cpt9061
        step_execution_id:
          type: string
          x-stoplight:
            id: eyon9kxjzpuu5
        step_name:
          type: string
          x-stoplight:
            id: li446ik3qfg8l
        stage_id:
          type: string
          x-stoplight:
            id: uk4e6msb1annk
        stage_execution_id:
          type: string
          x-stoplight:
            id: ltrcdcpqky4rv
        stage_name:
          type: string
          x-stoplight:
            id: n27q5wlhtrd65
        stage_type:
          type: string
          x-stoplight:
            id: 22ha61i5fiwzc
          description: Stage type in which the step executed
        runner_detail:
          $ref: '#/components/schemas/HarnessRunner'
      description: Harness Pipeline Execution Details
  parameters:
    OrgParam1:
      name: org
      in: path
      required: true
      schema:
        type: string
      description: Harness organization ID
    OrchestrationId:
      name: orchestration
      in: path
      required: true
      schema:
        type: string
      description: Harness Pipeline Execution ID
    AccountHeader6:
      name: Harness-Account
      in: header
      required: true
      schema:
        type: string
      description: Identifier field of the account the resource is scoped to. This is required for Authorization methods other than the x-api-key header. If you are using the x-api-key header, this can be skipped.
    ProjectParam1:
      in: path
      required: true
      schema:
        type: string
      description: Harness project ID
      name: project
  responses:
    PluginResponseBody:
      description: Example response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PluginResponseBody'
  requestBodies:
    SaveOrchestrationRequestBodyV2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SaveOrchestrationRequestV2'
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
