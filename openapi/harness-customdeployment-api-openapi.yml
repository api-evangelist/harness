openapi: 3.2.0
info:
  title: Harness Custom Deployment API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: CustomDeployment
  description: This contains APIs related to Custom Deployment
paths:
  /ng/api/customDeployment/get-references:
    post:
      tags:
      - CustomDeployment
      summary: Gets Custom Deployment Entity References
      operationId: getCustomDeploymentEntityReferences
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      requestBody:
        description: Custom Deployment Yaml Request DTO containing entityYaml
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDeploymentYamlRequestDTO'
          application/yaml:
            schema:
              $ref: '#/components/schemas/CustomDeploymentYamlRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns all entity references in the custom deployment template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOListEntityDetailProtoDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOListEntityDetailProtoDTO'
  /ng/api/customDeployment/expression-variables:
    post:
      tags:
      - CustomDeployment
      summary: Gets Custom Deployment Expression Variables
      operationId: getCustomDeploymentExpressionVariables
      requestBody:
        description: Custom Deployment Yaml Request DTO containing entityYaml
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDeploymentYamlRequestDTO'
          application/yaml:
            schema:
              $ref: '#/components/schemas/CustomDeploymentYamlRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns all Variables used that are valid to be used as expression in template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOCustomDeploymentVariableResponseDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOCustomDeploymentVariableResponseDTO'
  /ng/api/customDeployment/variables/{templateIdentifier}:
    get:
      tags:
      - CustomDeployment
      summary: Gets Infra Variables from a Custom Deployment Template by identifier
      operationId: getCustomDeploymentInfraVariables
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: templateIdentifier
        in: path
        description: Custom Deployment Identifier for the entity
        required: true
        schema:
          type: string
      - name: versionLabel
        in: query
        description: Version Label
        schema:
          type: string
      - name: deleted
        in: query
        description: Specifies whether Template is deleted or not
        schema:
          type: boolean
          default: false
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: The saved Custom Deployment Infra Variables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOString'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOString'
  /ng/api/customDeployment/get-updated-Yaml/{infraIdentifier}:
    post:
      tags:
      - CustomDeployment
      summary: Return the updated yaml for infrastructure based on Deployment template
      operationId: getUpdatedYamlForInfrastructure
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: infraIdentifier
        in: path
        description: Infrastructure Identifier for the entity
        required: true
        schema:
          type: string
      requestBody:
        description: YAML
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDeploymentYamlDTO'
          application/yaml:
            schema:
              $ref: '#/components/schemas/CustomDeploymentYamlDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Return the updated yaml for infrastructure based on Deployment template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOCustomDeploymentRefreshYamlDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOCustomDeploymentRefreshYamlDTO'
  /ng/api/customDeployment/validate-infrastructure/{infraIdentifier}:
    get:
      tags:
      - CustomDeployment
      summary: This validates whether Infrastructure is valid or not
      operationId: validateInfrastructureForDeploymentTemplate
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: envIdentifier
        in: query
        description: Environment Identifier for the entity
        schema:
          type: string
      - name: infraIdentifier
        in: path
        description: Infrastructure Identifier for the entity
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns if the infra is valid or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOCustomDeploymentInfraResponseDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOCustomDeploymentInfraResponseDTO'
