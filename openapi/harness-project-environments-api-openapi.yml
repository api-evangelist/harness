openapi: 3.2.0
info:
  title: Harness Project Environments API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Project Environments
  description: This contains APIs for project-scoped environments.
  x-displayName: Project Environments [Beta]
paths:
  /v1/orgs/{org}/projects/{project}/environments:
    parameters:
    - $ref: '#/components/parameters/OrgPathParam'
    - $ref: '#/components/parameters/ProjectPathParam'
    post:
      summary: Creates an Environment
      operationId: create-environment
      responses:
        '201':
          $ref: '#/components/responses/EnvironmentResponse'
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/EnvironmentCreateRequest'
      security:
      - x-api-key: []
      tags:
      - Project Environments
      x-internal: false
    get:
      summary: List Environments
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentListResponse'
      operationId: get-environments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit1'
      - $ref: '#/components/parameters/SearchTerm1'
      - $ref: '#/components/parameters/EnvironmentIdentifiers'
      - $ref: '#/components/parameters/Sort1'
      - schema:
          type: boolean
        in: query
        name: is_access_list
        description: Specifies whether the list is an access list. An access list is a list of environments that you are permitted to use in a pipeline.
      - $ref: '#/components/parameters/AccountHeader'
      - $ref: '#/components/parameters/Order'
      security:
      - x-api-key: []
      description: Returns a list of the enviornments for which you have view permissions in the given project.
      tags:
      - Project Environments
  /v1/orgs/{org}/projects/{project}/environments/{environment}:
    parameters:
    - $ref: '#/components/parameters/OrgPathParam'
    - $ref: '#/components/parameters/ProjectPathParam'
    - $ref: '#/components/parameters/EnvironmentPathParam'
    get:
      summary: Retrieve a environment
      operationId: get-environment
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      description: Retrieves the specified environment
      security:
      - x-api-key: []
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentResponse'
      tags:
      - Project Environments
    put:
      summary: Update Environment
      operationId: update-environment
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentResponse'
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/EnvironmentUpdateRequest'
      description: Updates the specified environment
      security:
      - x-api-key: []
      tags:
      - Project Environments
    delete:
      summary: Delete a Environment
      operationId: delete-environment
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                example-resp:
                  value: {}
            application/yaml:
              schema:
                type: object
                properties: {}
              examples:
                example-resp:
                  value: '{}

                    '
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      - $ref: '#/components/parameters/ForceDelete'
      description: Deletes the requested environment
      security:
      - x-api-key: []
      tags:
      - Project Environments
components:
  schemas:
    EnvironmentCreateRequest:
      type: object
      x-examples:
        example-1:
          identifier: example_environment
          name: Example_environment
          description: This is a example environment
          tags:
            example-tag-1: example-tag-1-value
            example-tag-2: example-tag-2-value
          yaml: "service:\n  name: \"Example_environment\"\n  identifier: \"example_environment\"\n  tags: {}\n"
      title: EnvironmentCreateRequest
      description: 'Environment Request Body '
      properties:
        identifier:
          type: string
          description: Identifier of the Environment
          pattern: ^[a-zA-Z_][0-9a-zA-Z_$]{0,127}$
          minLength: 1
          maxLength: 128
        name:
          type: string
          description: Name of the Environment
          pattern: ^[a-zA-Z_][0-9a-zA-Z-_ ]{0,127}$
          minLength: 1
          maxLength: 128
        description:
          type: string
          description: Description of the Environment
          maxLength: 1024
        tags:
          type: object
          additionalProperties:
            type: string
          description: Environment tags
          maxProperties: 128
        type:
          $ref: '#/components/schemas/EnvironmentType'
        color:
          type: string
          description: Environment color
        harness_version:
          type: string
          description: version of harness yaml
        yaml:
          type: string
          description: YAML for the Environment Request
      required:
      - identifier
      - name
      - type
      x-stoplight:
        id: v1x9is61l27ki
    EnvironmentResponse:
      type: object
      x-examples:
        example-1:
          service:
            account: sample_account
            identifier: example_environment
            org: sample_organization
            project: sample_project
            name: Example_environment
            description: This is a example environment
            tags:
              example-tag-1: example-tag-1-value
              example-tag-2: example-tag-2-value
            yaml: "service:\n  name: \"Example_environment\"\n  identifier: \"example_environment\"\n  tags: {}\n"
          created: 1234567890
          updated: 1234567890
      description: Default response when a environment is returned
      title: EnvironmentResponse
      properties:
        environment:
          $ref: '#/components/schemas/Environment'
        created:
          type: integer
          format: int64
          description: Creation timestamp for environment.
        updated:
          type: integer
          format: int64
          description: Last modification timestamp for environment.
      x-stoplight:
        id: 8wkghgenuyufw
    Environment:
      type: object
      x-examples:
        example-1:
          account: sample_account
          identifier: example_environment
          org: sample_organization
          project: sample_project
          name: Example_environment
          description: This is a example environment
          tags:
            example-tag-1: example-tag-1-value
            example-tag-2: example-tag-2-value
          yaml: "environment:\n  name: \"Example_environment\"\n  identifier: \"example_environment\"\n  tags: {}\n"
      description: This is the Environment entity defined in Harness
      title: Environment
      properties:
        account:
          type: string
          description: Account Identifier
          minLength: 1
          maxLength: 128
        identifier:
          type: string
          description: Identifier of the Environment Request.
          pattern: ^[a-zA-Z_][0-9a-zA-Z_$]{0,127}$
          minLength: 1
          maxLength: 128
        org:
          type: string
          description: Organization Identifier for the Entity.
          pattern: ^[a-zA-Z_][0-9a-zA-Z_$]{0,127}$
          minLength: 1
          maxLength: 128
        project:
          type: string
          description: Project Identifier for the Entity.
          pattern: ^[a-zA-Z_][0-9a-zA-Z_$]{0,127}$
          minLength: 1
          maxLength: 128
        name:
          type: string
          description: Name of the Environment Request.
          pattern: ^[a-zA-Z_][0-9a-zA-Z-_ ]{0,127}$
          minLength: 1
          maxLength: 128
        description:
          type: string
          description: Description of the entity
          maxLength: 1024
        tags:
          type: object
          additionalProperties:
            type: string
          description: Environment tags
          maxProperties: 128
        harness_version:
          type: string
          description: version of harness yaml
        yaml:
          type: string
          description: Yaml related to environment
      required:
      - identifier
      - name
      x-stoplight:
        id: t0gj2z2q9pwsn
    EnvironmentType:
      type: string
      enum:
      - PreProduction
      - Production
    EnvironmentUpdateRequest:
      type: object
      x-examples:
        example-1:
          identifier: example_environment
          name: Example_environment
          description: This is a example environment
          tags:
            example-tag-1: example-tag-1-value
            example-tag-2: example-tag-2-value
          yaml: "service:\n  name: \"Example_environment\"\n  identifier: \"example_environment\"\n  tags: {}\n"
      title: EnvironmentUpdateRequest
      description: 'Environment Update Request Body '
      properties:
        identifier:
          type: string
          description: Identifier of the Environment
          pattern: ^[a-zA-Z_][0-9a-zA-Z_$]{0,127}$
          minLength: 1
          maxLength: 128
        name:
          type: string
          description: Name of the Environment
          pattern: ^[a-zA-Z_][0-9a-zA-Z-_ ]{0,127}$
          minLength: 1
          maxLength: 128
        description:
          type: string
          description: Description of the Environment
          maxLength: 1024
        tags:
          type: object
          additionalProperties:
            type: string
          description: Environment tags
          maxProperties: 128
        type:
          $ref: '#/components/schemas/EnvironmentType'
        color:
          type: string
          description: Environment color
        harness_version:
          type: string
          description: version of harness yaml
        yaml:
          type: string
          description: YAML for the Environment Request
      required:
      - identifier
      - name
      - type
      x-stoplight:
        id: stztl057sv571
  parameters:
    SearchTerm1:
      name: search_term
      in: query
      required: false
      schema:
        type: string
      description: This would be used to filter resources having attributes matching with search term.
    ProjectPathParam:
      name: project
      in: path
      required: true
      schema:
        type: string
      description: Identifier field of the project the resource is scoped to
    EnvironmentPathParam:
      name: environment
      in: path
      required: true
      schema:
        type: string
      description: Identifier field of the scoped environment entity to be used for the selected operation.
    Sort1:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - name
        - identifier
        - created
        - updated
      description: Parameter on the basis of which sorting is done.
    EnvironmentIdentifiers:
      name: environment_ids
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
      description: List of Environment Identifiers
    OrgPathParam:
      name: org
      in: path
      required: true
      schema:
        type: string
      description: Identifier field of the organization the resource is scoped to
    AccountHeader:
      name: Harness-Account
      in: header
      required: false
      schema:
        type: string
      description: Identifier field of the account the resource is scoped to. This is required for Authorization methods other than the x-api-key header. If you are using the x-api-key header, this can be skipped.
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum:
        - ASC
        - DESC
      description: Order on the basis of which sorting is done.
    ForceDelete:
      name: forceDelete
      in: query
      schema:
        type: boolean
        default: false
      description: Enable this field to force delete the entity
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: "Pagination page number strategy: Specify the page number within the paginated collection related to the number of items in each page\t"
    Limit1:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 1000
      description: Number of items to return per page.
  responses:
    EnvironmentResponse:
      description: Example response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvironmentResponse'
          examples:
            example-1:
              value:
                environment:
                  account: sample_account
                  identifier: example_
                  org: sample_organization
                  project: sample_project
                  name: Example_environment
                  description: This is a example environment
                  tags:
                    example-tag-1: example-tag-1-value
                    example-tag-2: example-tag-2-value
                  yaml: "environment:\n  name: \"Example_environment\"\n  identifier: \"example_environment\"\n  tags: {}\n"
                created: 1234567890
                updated: 1234567890
        application/yaml:
