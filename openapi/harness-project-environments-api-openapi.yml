                    example-tag-2: example-tag-2-value
                  yaml: "environment:\n  name: \"Example_environment\"\n  identifier: \"example_environment\"\n  tags: {}\n"
                created: 1234567890
                updated: 1234567890
        application/yaml:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EnvironmentResponse'
          examples:
            example-1:
              value: "- environment:\n    account: sample_account\n    identifier: example_environment\n    org: sample_organization\n    project: sample_project\n    name: Example_environment\n    description: This is a example environment\n    tags:\n      example-tag-1: example-tag-1-value\n      example-tag-2: example-tag-2-value\n    yaml: |\n      environment:\n        name: \"Example_environment\"\n        identifier: \"example_environment\"\n        tags: {}\n  created: 1234567890\n  updated: 1234567890\n"
      headers:
        X-Total-Elements:
          schema:
            type: integer
          description: Total number of elements returned in Paginated response.
        X-Page-Number:
          schema:
            type: integer
          description: Page number in Paginated response.
        X-Page-Size:
          schema:
            type: integer
          description: Maximum page size in Paginated response.
  requestBodies:
    EnvironmentCreateRequest:
      content:
