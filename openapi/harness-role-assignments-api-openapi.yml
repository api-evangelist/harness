            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AuthzError'
        default:
          description: Get an existing role assignment by identifier in the given scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTORoleAssignmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTORoleAssignmentResponse'
    delete:
      tags:
      - Role Assignments
      summary: Delete Role Assignment
      description: Delete an existing role assignment by identifier
      operationId: deleteRoleAssignment
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: identifier
        in: path
        description: Identifier for role assignment
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AuthzError'
        default:
          description: Deleted role assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTORoleAssignmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTORoleAssignmentResponse'
  /authz/api/roleassignments/filter:
