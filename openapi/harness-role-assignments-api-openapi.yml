openapi: 3.2.0
info:
  title: Harness Role Assignments API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Role Assignments
  description: This contains APIs for CRUD on role assignments
paths:
  /authz/api/roleassignments/delete/batch:
    post:
      tags:
      - Role Assignments
      summary: Bulk Delete Role Assignment
      description: Bulk delete role assignments by identifiers
      operationId: bulkDeleteRoleAssignment
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      requestBody:
        description: List of role assigment identifiers to be deleted
        content:
          application/json:
            schema:
              maxItems: 100
              minItems: 0
              uniqueItems: true
              type: array
              items:
                type: string
          application/yaml:
            schema:
              maxItems: 100
              minItems: 0
              uniqueItems: true
              type: array
              items:
                type: string
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AuthzError'
        default:
          description: Returns successfully/failed deleted roleassignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTORoleAssignmentDeleteResponseDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTORoleAssignmentDeleteResponseDTO'
  /authz/api/roleassignments/multi:
    post:
      tags:
      - Role Assignments
      summary: Create Role Assignments
      description: Create multiple role assignments in a scope. Returns all successfully created role assignments. Ignores failures and duplicates.
      operationId: postRoleAssignments
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      requestBody:
        description: List of role assignments to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentCreateRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/RoleAssignmentCreateRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AuthzError'
        default:
          description: Successfully created role assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOListRoleAssignmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOListRoleAssignmentResponse'
  /authz/api/roleassignments:
    get:
      tags:
      - Role Assignments
      summary: List Role Assignments
      description: List role assignments in the given scope
      operationId: getRoleAssignmentList
      parameters:
      - name: pageIndex
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: 'Results per page(max 100)Default Value: 50'
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 50
      - name: sortOrders
        in: query
        description: Sort criteria for the elements.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SortOrder'
      - name: pageToken
        in: query
        description: 'Page Token of the next results to fetch.Default Value: '''''
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AuthzError'
        default:
          description: Paginated list of role assignments in the given scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseRoleAssignmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseRoleAssignmentResponse'
    post:
      tags:
      - Role Assignments
      summary: Create Role Assignment
      description: Creates role assignment within the specified scope.
      operationId: postRoleAssignment
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      requestBody:
        description: These are details for the role assignment to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthzRoleAssignment'
          application/yaml:
            schema:
              $ref: '#/components/schemas/AuthzRoleAssignment'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AccessDeniedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AuthzError'
        default:
          description: These are details of the created role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTORoleAssignmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTORoleAssignmentResponse'
  /authz/api/roleassignments/{identifier}:
    get:
      tags:
      - Role Assignments
      summary: Get Role Assignment
      description: Get an existing role assignment by identifier
      operationId: getRoleAssignment
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: identifier
        in: path
        description: Identifier for role assignment
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
