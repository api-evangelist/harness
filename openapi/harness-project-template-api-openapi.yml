          maxLength: 128
        project:
          type: string
          description: Project identifier
          pattern: ^[a-zA-Z_][0-9a-zA-Z_$]{0,127}$
          minLength: 1
          maxLength: 128
        identifier:
          type: string
          description: Template identifier
          pattern: ^[a-zA-Z_][0-9a-zA-Z_$]{0,127}$
          minLength: 1
          maxLength: 128
        name:
          type: string
          description: Template Name
          pattern: ^[a-zA-Z_][0-9a-zA-Z-_ ]{0,127}$
          minLength: 1
          maxLength: 128
        description:
          type: string
          description: Template description
          maxLength: 1024
        tags:
          type: object
          additionalProperties:
            type: string
          description: Template tags
          maxProperties: 128
        yaml:
          type: string
          description: Yaml related to template
        version_label:
          type: string
          description: Version label of template
        entity_type:
          type: string
          enum:
          - Step
          - Stage
          - Pipeline
          - CustomDeployment
          - MonitoredService
          - SecretManager
          description: 'Type of Template

            '
        child_type:
          type: string
          description: Defines child template type
        scope:
          type: string
          enum:
          - org
          - project
          - account
          - unknown
          description: Scope of template
        updated:
          type: integer
          format: int64
          description: 'Last modification timestamp for Service.

            '
        version:
          type: integer
          format: int64
          description: Version of template
        git_details:
          $ref: '#/components/schemas/EntityGitDetails'
        store_type:
          type: string
          enum:
          - INLINE
          - REMOTE
          description: Specifies whether the Entity is to be stored in Git or not (for Git Experience).
        connector_ref:
          type: string
          description: Identifier of the Harness Connector used for CRUD operations on the Entity (for Git Experience).
        yaml_version:
          type: string
          description: Specifies the yaml version of the template
        stable_template:
          type: boolean
          description: True if this version is stable version of Template
      required:
      - account
      - identifier
      - name
      - yaml
    TemplateYamlInputDTO:
      title: TemplateYamlInputDTO
      x-stoplight:
        id: zojl0rh1u9u81
      type: object
      x-internal: true
      properties:
        name:
