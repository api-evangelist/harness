    GitImportDetails:
      title: Git Import Details
      x-stoplight:
        id: sehprm5mfy45y
      type: object
      description: Contains parameters related to importing an Entity for Git Experience.
      properties:
        connector_ref:
          type: string
        repo_name:
          type: string
        branch_name:
          type: string
        file_path:
          type: string
        is_force_import:
          type: boolean
    TemplateYamlInputDetailsDTO:
      title: TemplateYamlInputDetailsDTO
      x-stoplight:
        id: g5ji5k9iuyk9l
      type: object
      x-internal: true
      properties:
        details:
          $ref: '#/components/schemas/TemplateYamlInputDTO'
        metadata:
          $ref: '#/components/schemas/TemplateYamlInputMetadataDTO'
    TemplateYamlInputMetadataDTO:
      title: TemplateYamlInputMetadataDTO
      x-stoplight:
        id: ualwerzlsrm1a
      type: object
      x-internal: true
      properties:
        field_properties:
          type: array
          x-stoplight:
            id: 3qnzd0bsqj2ls
          items:
            $ref: '#/components/schemas/InputDetailsPerFieldDTO1'
        dependencies:
          $ref: '#/components/schemas/YamlInputDependencyDetailsDTO1'
    TemplateResponse:
      title: templateResponse
      x-stoplight:
        id: f4ndtnn4ympdy
      type: object
