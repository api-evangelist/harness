openapi: 3.2.0
info:
  title: Harness Project Template API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Project Template
  description: This contains APIs for Project-scoped Templates.
  x-displayName: Project Templates [Beta]
paths:
  /v1/orgs/{org}/projects/{project}/templates/git-metadata/{template}:
    parameters:
    - $ref: '#/components/parameters/Template'
    - $ref: '#/components/parameters/Org'
    - $ref: '#/components/parameters/Project'
    put:
      summary: Update Git details
      operationId: update-git-metadata-details-project
      parameters:
      - $ref: '#/components/parameters/Org'
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/AccountHeaderParam'
      requestBody:
        $ref: '#/components/requestBodies/TemplateUpdateGitMetadataRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TemplateUpdateGitMetadataResponse'
      tags:
      - Project Template
      description: Update Git details for multiple version.
      x-stoplight:
        id: 9ta5osrcrp83u
  /v1/orgs/{org}/projects/{project}/templates:
    parameters:
    - $ref: '#/components/parameters/Org'
    - $ref: '#/components/parameters/Project'
    post:
      summary: Create Template
      operationId: create-templates-project
      responses:
        '201':
          $ref: '#/components/responses/TemplateResponse'
      parameters:
      - $ref: '#/components/parameters/AccountHeaderParam'
      tags:
      - Project Template
      description: Creates a Template in the Project scope.
      requestBody:
        $ref: '#/components/requestBodies/TemplateCreateBody'
    get:
      summary: Get Templates List
      operationId: get-templates-list-project
      responses:
        '200':
          $ref: '#/components/responses/TemplateMetaDataList'
      parameters:
      - $ref: '#/components/parameters/AccountHeaderParam'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit4'
      - $ref: '#/components/parameters/Sort5'
      - $ref: '#/components/parameters/Order'
      - $ref: '#/components/parameters/SearchTerm4'
      - $ref: '#/components/parameters/TemplateListType'
      - $ref: '#/components/parameters/IncludeAllTemplatesAccessibleAtScope'
      - $ref: '#/components/parameters/TemplateNames'
      - $ref: '#/components/parameters/TemplateIds'
      - $ref: '#/components/parameters/Description'
      - $ref: '#/components/parameters/EntityType'
      - $ref: '#/components/parameters/TemplateChildTypes'
      tags:
      - Project Template
      description: Retrieves list of Template with meta-data at Project scope.
  /v1/orgs/{org}/projects/{project}/templates/{template}:
    parameters:
    - $ref: '#/components/parameters/Org'
    - $ref: '#/components/parameters/Project'
    - $ref: '#/components/parameters/Template'
    get:
      summary: Get Stable Template
      tags:
      - Project Template
      responses:
        '200':
          $ref: '#/components/responses/TemplateWithInputsResponse'
      operationId: get-template-stable-project
      parameters:
      - $ref: '#/components/parameters/AccountHeaderParam'
      - $ref: '#/components/parameters/GetTemplateInputYaml'
      - $ref: '#/components/parameters/Branch1'
      - $ref: '#/components/parameters/ParentConnectorRef'
      - $ref: '#/components/parameters/ParentRepoName'
      - $ref: '#/components/parameters/ParentAccountId'
      - $ref: '#/components/parameters/ParentOrgId'
      - $ref: '#/components/parameters/ParentProjectId'
      description: Retrieves stable version of Template at Project scope.
  /v1/orgs/{org}/projects/{project}/templates/{template}/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/Project'
    - $ref: '#/components/parameters/Template'
    - $ref: '#/components/parameters/Org'
    - $ref: '#/components/parameters/Version'
    get:
      summary: Retrieve a Template
      tags:
      - Project Template
      responses:
        '200':
          $ref: '#/components/responses/TemplateWithInputsResponse'
      operationId: get-template-project
      parameters:
      - $ref: '#/components/parameters/AccountHeaderParam'
      - $ref: '#/components/parameters/GetTemplateInputYaml'
      - $ref: '#/components/parameters/Branch1'
      - $ref: '#/components/parameters/ParentConnectorRef'
      - $ref: '#/components/parameters/ParentRepoName'
      - $ref: '#/components/parameters/ParentAccountId'
      - $ref: '#/components/parameters/ParentOrgId'
      - $ref: '#/components/parameters/ParentProjectId'
      description: Retrieves particular version of Template at Project scope.
    put:
      summary: Update Template
      operationId: update-template-project
      responses:
        '200':
          $ref: '#/components/responses/TemplateResponse'
      parameters:
      - $ref: '#/components/parameters/AccountHeaderParam'
      tags:
      - Project Template
      description: Updates particular version of Template at Project scope.
      requestBody:
        $ref: '#/components/requestBodies/TemplateUpdateBody'
    delete:
      summary: Delete Template
      operationId: delete-template-project
      parameters:
      - $ref: '#/components/parameters/AccountHeaderParam'
      - $ref: '#/components/parameters/Comments'
      - $ref: '#/components/parameters/ForceDelete1'
      tags:
      - Project Template
      description: Deletes particular version of Template at Project scope.
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                example-resp:
                  value: {}
            application/yaml:
              schema:
                type: object
                properties: {}
              examples:
                example-resp:
                  value: '{}

                    '
  /v1/orgs/{org}/projects/{project}/templates/{template}/versions/{version}/stable:
    parameters:
    - $ref: '#/components/parameters/Org'
    - $ref: '#/components/parameters/Project'
    - $ref: '#/components/parameters/Template'
    - $ref: '#/components/parameters/Version'
    put:
      summary: Update Stable Template
      operationId: update-template-stable-project
      responses:
        '200':
          $ref: '#/components/responses/TemplateUpdateStableResponse'
      parameters:
      - $ref: '#/components/parameters/AccountHeaderParam'
      tags:
      - Project Template
      description: Updates the stable version of Template at Project scope.
      requestBody:
        $ref: '#/components/requestBodies/TemplateFetchBody'
  /v1/orgs/{org}/projects/{project}/templates/{template}/import:
    parameters:
    - $ref: '#/components/parameters/Org'
    - $ref: '#/components/parameters/Project'
    - $ref: '#/components/parameters/Template'
    post:
      summary: Import Template
      operationId: import-template-project
      responses:
        '200':
          $ref: '#/components/responses/TemplateImportResponseBody'
      description: Import template at a project level
      tags:
      - Project Template
      parameters:
      - $ref: '#/components/parameters/AccountHeaderParam'
      requestBody:
        $ref: '#/components/requestBodies/TemplateImportRequestBody'
  /v1/orgs/{org}/projects/{project}/templates/{template}/versions/{version}/inputs-schema:
    parameters:
    - $ref: '#/components/parameters/Org'
    - $ref: '#/components/parameters/Project'
    - $ref: '#/components/parameters/Template'
    - $ref: '#/components/parameters/Version'
    get:
      summary: Get inputs schema for project level templates
      tags:
      - Project Template
      responses:
        '200':
          $ref: '#/components/responses/TemplateInputSchemaDetailsResponseBody'
      operationId: get-project-templates-inputs-schema
      x-stoplight:
        id: 9lff7z2spnh4w
      parameters:
      - $ref: '#/components/parameters/AccountHeaderParam'
      description: get inputs schema for project level templates
      x-internal: true
components:
  parameters:
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
      description: Version Label for Template
    AccountHeaderParam:
      name: Harness-Account
      in: header
      schema:
        type: string
      description: Identifier field of the account the resource is scoped to.
    EntityType:
      name: entity_types
      in: query
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
          - Step
          - Stage
          - Pipeline
          - CustomDeployment
          - MonitoredService
          - SecretManager
      description: Type of Template
    TemplateListType:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
        - STABLE_TEMPLATE
        - LAST_UPDATES_TEMPLATE
        - ALL
      description: Template List Type
    Limit4:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 30
      description: 'Pagination: Number of items to return'
    Org:
      name: org
      in: path
      schema:
        type: string
      required: true
      description: Organization Identifier
    Branch1:
      name: branch_name
      in: query
      required: false
      schema:
        type: string
      description: Name of the branch
    Comments:
      name: comments
      in: query
      required: false
      schema:
        type: string
      description: 'Specify comment with respect to changes  '
    ForceDelete1:
      name: forceDelete
      in: query
      schema:
        type: boolean
        default: false
      description: Enable this field to force delete a template
    Description:
      name: description
      in: query
      required: false
      schema:
        type: string
      description: Filter properties description
    ParentProjectId:
      name: parent_entity_project_id
      in: query
      required: false
      schema:
        type: string
      description: Project name of parent entity if its remote
    Project:
      name: project
      in: path
      required: true
      schema:
        type: string
      description: Project Identifier
    ParentConnectorRef:
      name: parent_entity_connector_ref
      in: query
      required: false
      schema:
        type: string
      description: Connector ref of parent template if its remote
    SearchTerm4:
      name: search_term
      in: query
      required: false
      schema:
        type: string
      description: This would be used to filter resources having attributes matching with search term.
    GetTemplateInputYaml:
      name: include_yaml
      in: query
      required: false
      schema:
        type: boolean
      description: Use it to get Template along with Input Set YAML
    ParentAccountId:
      name: parent_entity_account_id
      in: query
      required: false
      schema:
        type: string
      description: Account name of parent template if its remote
    TemplateNames:
      name: names
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
      description: Template names for filtering
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum:
        - ASC
        - DESC
      description: Order on the basis of which sorting is done.
    Template:
      name: template
      in: path
      required: true
      schema:
        type: string
      description: Template Identifier
    TemplateChildTypes:
      name: child_types
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
      description: Child types describe the type of Step or stage
    IncludeAllTemplatesAccessibleAtScope:
      name: recursive
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Specify true if all accessible Templates are to be included
    Sort5:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - identifier
        - name
        - updated
      description: Parameter on the basis of which sorting is done.
    ParentRepoName:
      name: parent_entity_repo_name
      in: query
      required: false
      schema:
        type: string
      description: Repo name of parent template if its remote
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: "Pagination page number strategy: Specify the page number within the paginated collection related to the number of items in each page\t"
    TemplateIds:
      name: identifiers
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
      description: Template Ids for Filtering
    ParentOrgId:
      name: parent_entity_org_id
      in: query
      required: false
      schema:
        type: string
      description: Organization name of parent template if its remote
  schemas:
    TemplateUpdateRequestBody:
      title: TemplateUpdateRequestBody
      x-stoplight:
        id: l48rfx4q8xoez
      type: object
      x-examples:
        example-2:
          template_yaml: "template:\n  name: Example_template\n  identifier: example_template\n  versionLabel: v1\n  type: Stage\n  tags: {}\n  spec:\n    type: Custom\n    spec:\n      execution:\n        steps:\n          - step:\n              type: ShellScript\n              name: ss1\n              identifier: ss1\n              spec:\n                shell: Bash\n                onDelegate: true\n                source:\n                  type: Inline\n                  spec:\n                    script: exit 1\n                environmentVariables: []\n                outputVariables: []\n              timeout: 10m\n"
          git_details:
            branch_name: branch
            commit_message: Added Harness Git Experience
            last_object_id: example_object_id
            base_branch: old_branch
            connector_ref: git_connector
            last_commit_id: example_commit_id
            file_path: /folder/file.json
            repo_name: example_repository
            store_type: INLINE
          comments: sample_comment
      description: Templates Update Request Body
      properties:
        template_yaml:
          type: string
          description: Yaml for updating existing Template
        identifier:
          type: string
          pattern: ^[a-zA-Z_][0-9a-zA-Z_$]{0,127}$
          maxLength: 128
          description: Template identifier
        name:
          type: string
          pattern: ^[a-zA-Z_][0-9a-zA-Z-_ ]{0,127}$
          maxLength: 128
          description: Template name
        label:
          type: string
          maxLength: 128
          description: Template version label
        description:
          type: string
          maxLength: 1024
          description: Pipeline description
        tags:
          type: object
          additionalProperties:
            type: string
          maxProperties: 128
          description: Template tags
        git_details:
          $ref: '#/components/schemas/GitUpdateDetails1'
        comments:
          type: string
          description: 'Specify comment with respect to changes  '
    RuntimeInputDependencyDetailsDTO1:
      title: RuntimeInputDependencyDetailsDTO
      x-stoplight:
        id: n8vk0pc2nad3z
      type: object
      x-internal: true
      properties:
        field_name:
          type: string
          x-stoplight:
            id: lspf0jnh5w2l3
        input_name:
          type: string
          x-stoplight:
            id: tcgmg70o492mo
    GitUpdateDetails1:
      title: GitUpdateDetails
      x-stoplight:
        id: 7k1zp5afx03m5
      type: object
      description: Contains parameters related to Updating an Entity for Git Experience.
      x-examples:
        example-1:
          branch_name: branch
          commit_message: Added Harness Git Experience
          last_object_id: example_object_id
          base_branch: old_branch
          connector_ref: git_connector
          last_commit_id: example_commit_id
          file_path: /folder/file.json
          repo_name: example_repository
          store_type: INLINE
      properties:
        branch_name:
          type: string
          description: Name of the branch.
        commit_message:
          type: string
          description: Commit message used for the merge commit.
        last_object_id:
          type: string
          description: Last object identifier (for Github).
        base_branch:
          type: string
          description: Name of the default branch (this checks out a new branch titled by branch_name).
        connector_ref:
          type: string
          description: Identifier of the Harness Connector used for CRUD operations on the Entity.
        last_commit_id:
          type: string
          description: Last commit identifier (for Git Repositories other than Github).
        file_path:
          type: string
          description: File path of the Entity in the repository.
        repo_name:
          type: string
          description: Name of the repository.
        store_type:
          type: string
          description: Specifies whether the Entity is to be stored in Git or not.
          enum:
          - INLINE
          - REMOTE
    TemplateImportRequestDTO:
      title: Template Import Request DTO
      x-stoplight:
        id: 63n2xm1nikjdq
      type: object
      description: Information of Tempalte import request DTO
      properties:
        template_name:
          type: string
        template_version:
          type: string
        template_description:
          type: string
    GitCreateDetails1:
      title: Create Git Details
      x-stoplight:
        id: m4q2n9rjsrqre
      type: object
      description: Contains parameters related to creating an Entity for Git Experience.
      properties:
        branch_name:
          type: string
          description: Name of the branch.
        file_path:
          type: string
          description: File path of the Entity in the repository.
        commit_message:
          type: string
          description: Commit message used for the merge commit.
        base_branch:
          type: string
          description: Name of the default branch (this checks out a new branch titled by branch_name).
        connector_ref:
          type: string
          description: Identifier of the Harness Connector used for CRUD operations on the Entity.
        store_type:
          type: string
          description: Specifies whether the Entity is to be stored in Git or not.
          enum:
          - INLINE
          - REMOTE
        repo_name:
          type: string
          description: Name of the repository.
      x-examples:
        example-create-git:
          branch_name: branch
          file_path: /folder/file.json
          commit_message: Added Harness Git Experience
          base_branch: old_branch
          connector_ref: git_connector
          store_type: INLINE
          repo_name: example_repository
    TemplateMetaDataList:
      title: TemplateMetaDataList
      x-stoplight:
        id: k684ta51ybafb
      type: array
      items:
        $ref: '#/components/schemas/TemplateMetadataSummaryResponse'
      x-examples:
        example-1:
        - account: example_account
          org: example_organization
          project: example_project
          identifier: example_template
          name: Example_template
          description: string
          tags:
            example-tag-1: example-tag-1-value
            example-tag-2: example-tag-2-value
          version_label: example_version
          entity_type: Step
          child_type: example_child_type
          scope: org
          version: 1234567890
          git_details:
            object_id: example_object
