components:
  schemas:
    CompleteActivityResponse:
      type: object
      properties:
        activity_id:
          type: string
          description: The activity identifier
          example: Sit iste debitis dolor voluptatibus modi ipsa.
        completed_at:
          type: integer
          description: Unix timestamp in milliseconds when activity completed
          example: 192048153374339330
          format: int64
        status:
          type: string
          description: Final status of the activity
          example: failed
          enum:
          - completed
          - failed
        workspace_status:
          type: string
          description: Updated workspace status after activity completion
          example: inactive
          enum:
          - active
          - inactive
          - provisioning
          - destroying
          - failed
          - unknown
          - rollback_applied
          - drifted
      example:
        activity_id: Aut at sit.
        completed_at: 6301445958051045000
        status: failed
        workspace_status: active
      required:
      - activity_id
      - status
      - completed_at
