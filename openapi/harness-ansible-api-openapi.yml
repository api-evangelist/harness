      tags:
      - ansible
      summary: List Ansible Activities
      description: List all activities.
      operationId: ansible#list-ansible-activities
      parameters:
      - name: limit
        in: query
        description: Limit is the number of records to return for a page.
        allowEmptyValue: true
        schema:
          type: integer
          description: Limit is the number of records to return for a page.
          default: 30
          example: 30
          format: int64
          minimum: 1
          maximum: 1000
        example: 30
      - name: page
        in: query
        description: Page is the page number to return relative to the page 'limit'.
        allowEmptyValue: true
        schema:
          type: integer
          description: Page is the page number to return relative to the page 'limit'.
          default: 1
          example: 1
          format: int64
          minimum: 1
        example: 1
      - name: sort
        in: query
        description: Sort order for results
        allowEmptyValue: true
        schema:
          type: string
          description: Sort order for results
          default: created,DESC
          example: created,ASC
          enum:
          - created,ASC
          - created,DESC
        example: created,ASC
      - name: InventorySearchTerm
        in: query
        description: Search term to filter by inventory identifier
        allowEmptyValue: true
        schema:
          type: string
          description: Search term to filter by inventory identifier
          example: inventory_1
        example: inventory_1
      - name: PlaybookSearchTerm
        in: query
        description: Search term to filter by playbook identifier
        allowEmptyValue: true
        schema:
          type: string
          description: Search term to filter by playbook identifier
          example: playbook_1
        example: playbook_1
      - name: activity_type
        in: query
        description: Activity type filter
        allowEmptyValue: true
        schema:
          type: string
          description: Activity type filter
          example: Ad id ipsum possimus.
        example: Aut labore.
      - name: status
        in: query
        description: Activity status filter
        allowEmptyValue: true
        schema:
          type: string
          description: Activity status filter
          example: Minus molestiae qui aperiam ratione.
        example: Debitis maiores.
      - name: org
        in: path
        description: Org is the organisation identifier.
        required: true
        schema:
          type: string
          description: Org is the organisation identifier.
          example: h
          minLength: 1
          maxLength: 128
        example: r6
      - name: project
        in: path
        description: Project is the project identifier.
        required: true
        schema:
          type: string
          description: Project is the project identifier.
          example: t0
          minLength: 1
          maxLength: 128
        example: 3w
      - name: Harness-Account
