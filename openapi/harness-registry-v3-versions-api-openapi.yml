      description: A Conan package (PKGID).
      properties:
        id:
          description: The stable UUID of the package row.
          format: uuid
          type: string
        latestPackageRevision:
          description: The newest finalized package revision hash.
          type: string
        options:
          additionalProperties: true
          description: Build options parsed from conaninfo.txt.
          type: object
        packageId:
          description: The package id hash.
          type: string
        settings:
          additionalProperties: true
          description: Build settings parsed from conaninfo.txt.
          type: object
        size:
          description: Size of the latest finalized package revision.
          type: string
      required:
      - id
      - packageId
      type: object
