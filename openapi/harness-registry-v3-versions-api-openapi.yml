        type: array
    IdPathParamV3:
      in: path
      name: id
      required: true
      schema:
        type: string
    ForceParamV3:
      in: query
      name: force
      schema:
        default: false
        type: boolean
    MetadataFilterListParamV3:
      description: Filter by metadata using key:value format
      in: query
      name: metadata
      schema:
        items:
          type: string
        type: array
    PackageIdListOptionalParamV3:
      description: 'Unique id for the package.

        '
      example:
      - 12345678-1234-1234-1234-123456789012
      - aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      in: query
      name: package_ids
      schema:
        items:
          format: uuid
          type: string
        type: array
    SortV3:
      description: 'The sort for the results.

        Accepted pattern: `sort_field:sort_order` where sort_field is the field name

        and sort_order is either `asc` or `desc`.


        Examples: `name:asc`, `modifiedAt:desc`

        '
      in: query
      name: sort
      schema:
        type: string
    AccountIdentifierV3:
      description: 'Unique identifier for the Harness account.

        '
      in: query
      name: account_identifier
      required: true
      schema:
        type: string
    SearchTermV3:
      description: 'Search term for filtering results.


        Example: `search_term=prod` might match keys like "production", "prod-env", etc.

        '
      in: query
      name: search_term
      schema:
        type: string
    ConanPackageRevisionPathParamV3:
      description: The stable UUID of the package revision (PREV) row.
      in: path
      name: package_revision_id
      required: true
      schema:
        type: string
    ConanRecipeRevisionPathParamV3:
      description: The stable UUID of the recipe revision (RREV) row.
      in: path
      name: recipe_revision_id
      required: true
      schema:
        type: string
    ProjectIdentifierV3:
      description: 'Unique identifier for the project within the organization.


        Example: `my_project` or `frontend_services`

        '
      in: query
      name: project_identifier
      schema:
        type: string
    IncludeMetaParamV3:
      description: 'When `true`, include the `meta` object (e.g. active/deleted counts)

        in the response.

        '
      in: query
      name: include_meta
      schema:
        default: false
        type: boolean
    PageNumberV3:
      description: 'The page number for pagination (0-indexed).


        Used to navigate through large result sets. Combined with `size` parameter

        to control which subset of results to return.


        Example: `page=0` returns the first page, `page=1` returns the second page

        '
      in: query
      name: page
      schema:
        default: 0
        format: int64
        type: integer
    PageSizeV3:
      description: "The number of items to return per page.\n\nControls the page size for paginated results. \n\nExample: `size=50` returns up to 50 items per page\n"
      in: query
      name: size
      schema:
        default: 20
        format: int64
        maximum: 100
        minimum: 1
        type: integer
    RegistryIdListOptionalParamV3:
      description: 'Unique id for the registry.

        Note: This parameter should have one id if package query param is provided

        '
      example:
      - 12345678-1234-1234-1234-123456789012
      - aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      in: query
      name: registry_ids
      schema:
        items:
          format: uuid
          type: string
        type: array
    OrgIdentifierV3:
      description: 'Unique identifier for the organization within the account.


        Example: `default` or `engineering_org`

        '
      in: query
      name: org_identifier
      schema:
        type: string
    UploadedByParamV3:
      description: 'Filter by uploaded by user ID.


        Example: `uploaded_by=123`

        '
      in: query
      name: uploaded_by
      schema:
        items:
          example: 123
          format: int64
          type: integer
        type: array
