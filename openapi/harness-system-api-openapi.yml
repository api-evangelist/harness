openapi: 3.2.0
info:
  title: Harness System API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: System
  description: Unauthenticated support endpoints
paths:
  /sto/api/v2/system/health:
    get:
      tags:
      - System
      description: Check service health
      operationId: System#health
      responses:
        '204':
          description: Service is healthy.
        '500':
          description: 'InternalServerError: Internal Server Error response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Internal Server Error
                status: 500
      summary: System#health
      x-summary-source: derived
  /sto/api/v2/system/version:
    get:
      tags:
      - System
      description: Get service version
      operationId: System#version
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoServiceVersion'
              example:
                commit: '0000000000000000000000000000000000000001'
                version: v0.123.0
      summary: System#version
      x-summary-source: derived
  /pm/api/v1/system/health:
    get:
      tags:
      - System
      description: Check service health
      operationId: system#health
      responses:
        '204':
          description: No Content response.
        '500':
          description: 'InternalServer: Internal Server Error response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/PolicyManagementError'
        '502':
          description: 'BadGateway: Bad Gateway response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/PolicyManagementError'
      summary: System#health
      x-summary-source: derived
  /pm/api/v1/system/version:
    get:
      tags:
      - System
      description: Check service version
      operationId: system#version
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceVersion'
              example:
                commit: 96381692bf3a2bd7904769c6886e832435768b57
                version: v0.123.0
        '500':
          description: 'InternalServer: Internal Server Error response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/PolicyManagementError'
        '502':
          description: 'BadGateway: Bad Gateway response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/PolicyManagementError'
      summary: System#version
      x-summary-source: derived
  /iacm/api/health:
    get:
      tags:
      - System
      summary: health system
      description: Check server health
      operationId: IaCMsystem#health
      responses:
        '200':
          description: OK response.
  /iacm/api/latest-plugin-version:
    post:
      tags:
      - System
      summary: latest-plugin-version system
      description: Get the latest plugin version
      operationId: system#latest-plugin-version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginReportedVersion'
            example:
              commit: 96381692bf3a2bd7904769c6886e832435768b57
              version: v0.123.0
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessIacmPluginversion'
              example:
                commit: 96381692bf3a2bd7904769c6886e832435768b57
                version: 0.2.0
