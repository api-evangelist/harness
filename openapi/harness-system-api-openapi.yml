  /iacm/api/provisioners/supported/{provisioner}:
    get:
      tags:
      - System
      summary: list-supported-provisioner-versions system
      description: List supported provisioner versions.
      operationId: system#list-supported-provisioner-versions
      parameters:
      - name: provisioner
        in: path
        description: Provisioner defines the provisioning tool to use.
        required: true
        schema:
          type: string
          description: Provisioner defines the provisioning tool to use.
          example: terragrunt
          enum:
          - terraform
          - opentofu
          - terragrunt
          - awscdk
        example: opentofu
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: Officiis atque commodi qui exercitationem provident.
                example:
                - Dolores saepe exercitationem ad tenetur facilis.
                - Consequatur aut.
                - Ullam dolores inventore quis et.
              example:
              - Debitis molestiae.
              - Est quia et qui omnis quas natus.
              - Autem qui est sed excepturi commodi.
              - Ipsam quod nisi ipsam.
  /iacm/api/version:
    get:
      tags:
      - System
      summary: version system
      description: Get server version
      operationId: IaCMsystem#version
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IaCMServiceVersion'
              example:
                commit: 96381692bf3a2bd7904769c6886e832435768b57
                deployment_mode: smp
                version: v0.123.0
components:
  schemas:
    NotFound:
      type: object
      properties:
        message:
          type: string
          example: Not Found
        status:
          type: integer
          default: 404
          example: 404
          format: int64
      example:
        message: Not Found
        status: 404
      required:
      - message
    StoServiceVersion:
      type: object
      properties:
        commit:
          type: string
          description: Build identifier
          example: '0000000000000000000000000000000000000001'
        version:
          type: string
          description: Version number
          example: v0.123.0
      example:
        commit: '0000000000000000000000000000000000000001'
        version: v0.123.0
      required:
      - version
      - commit
    OpentofuConfig:
      type: object
      properties:
        versions:
          type: array
          items:
            type: string
            example: Sit eligendi fuga suscipit laudantium.
          description: List of supported OpenTofu versions
          example:
          - Quo impedit.
          - Quos quis voluptas et.
          - Id id.
          - Eligendi unde.
      description: OpenTofu configuration
      example:
        versions:
        - Doloremque explicabo.
        - Nam dicta.
    HarnessIacmPluginversion:
      type: object
      properties:
        commit:
          type: string
          description: Build identifier
          example: 96381692bf3a2bd7904769c6886e832435768b57
        version:
          type: string
          description: Version number
          example: 0.2.0
      description: Plugin version
      example:
        commit: 96381692bf3a2bd7904769c6886e832435768b57
        version: 0.2.0
    PolicyManagementError:
      type: object
      properties:
        fault:
          type: boolean
          description: Is the error a server-side fault?
          example: true
        id:
          type: string
          description: ID is a unique identifier for this particular occurrence of the problem.
          example: 123abc
        message:
          type: string
          description: Message is a human-readable explanation specific to this occurrence of the problem.
          example: parameter 'p' must be an integer
        name:
          type: string
          description: Name is the name of this class of errors.
          example: bad_request
        temporary:
          type: boolean
          description: Is the error temporary?
          example: true
        timeout:
          type: boolean
          description: Is the error a timeout?
          example: true
      example:
        fault: false
        id: 123abc
        message: parameter 'p' must be an integer
        name: bad_request
        temporary: true
        timeout: false
      required:
      - name
      - id
      - message
      - temporary
      - timeout
      - fault
