components:
  schemas:
    github_com_harness_hce-saas_graphql_server_graph_model.UserDetails:
      type: object
      properties:
        email:
          type: string
        userID:
          type: string
        username:
          type: string
    faulttemplate.AWSAuth:
      type: object
      properties:
        identifier:
          type: string
    v1.PodFSGroupChangePolicy:
      type: string
      enum:
      - OnRootMismatch
      - Always
      x-enum-varnames:
      - FSGroupChangeOnRootMismatch
      - FSGroupChangeAlways
    template.Variable:
      type: object
      required:
      - name
      - value
      properties:
        allowedValues:
          type: array
          items: {}
        category:
          $ref: '#/components/schemas/template.InputCategory'
        default: {}
        description:
          type: string
        name:
          type: string
        path:
          type: string
        required:
          type: boolean
        stringify:
          type: boolean
        tags:
          type: array
          items:
            type: string
        tooltipId:
          type: string
        type:
          $ref: '#/components/schemas/template.InputType'
        validator:
          type: string
        value: {}
    resource.Quantity:
      type: object
      properties:
        Format:
          type: string
          enum:
          - DecimalExponent
          - BinarySI
          - DecimalSI
          x-enum-comments:
            BinarySI: e.g., 12Mi (12 * 2^20)
            DecimalExponent: e.g., 12e6
            DecimalSI: e.g., 12M  (12 * 10^6)
          x-enum-varnames:
          - DecimalExponent
          - BinarySI
          - DecimalSI
    v1.Capabilities:
      type: object
      properties:
        add:
          description: 'Added capabilities

            +optional'
          type: array
          items:
            type: string
        drop:
          description: 'Removed capabilities

            +optional'
          type: array
          items:
            type: string
    v1.TaintEffect:
      type: string
      enum:
      - NoSchedule
      - PreferNoSchedule
      - NoExecute
      x-enum-varnames:
      - TaintEffectNoSchedule
      - TaintEffectPreferNoSchedule
      - TaintEffectNoExecute
    chaosfaulttemplate.ChaosFaultTemplate:
      type: object
      required:
      - accountID
      - isRemoved
      - name
      properties:
        accountID:
          type: string
        category:
          type: array
          items:
            type: string
        createdAt:
          type: integer
        createdBy:
          type: string
        createdByUserDetails:
          $ref: '#/components/schemas/github_com_harness_hce-saas_graphql_server_graph_model.UserDetails'
        description:
          type: string
        hubRef:
          description: Hub identity of the fault
          type: string
        id:
          description: Mongo ID (primary key)
          type: string
        identity:
          description: Unique identifier (human-readable) immutable
          type: string
        infraType:
          type: string
        infras:
          type: array
          items:
            type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/template.Variable'
        isDefault:
          type: boolean
        isEnterprise:
          type: boolean
        isRemoved:
          type: boolean
        links:
          type: array
          items:
            $ref: '#/components/schemas/chaosfaulttemplate.Link'
        name:
          type: string
        orgID:
          type: string
        permissionsRequired:
          type: string
        projectID:
          type: string
        revision:
          type: string
        tags:
          type: array
          items:
            type: string
        template:
          type: string
        type:
          type: string
        updatedAt:
          type: integer
        updatedBy:
          type: string
        updatedByUserDetails:
          $ref: '#/components/schemas/github_com_harness_hce-saas_graphql_server_graph_model.UserDetails'
        variables:
          description: CHAOS-11100
          type: array
          items:
            $ref: '#/components/schemas/template.Variable'
    faulttemplate.SecretVolume:
      type: object
      properties:
        mountMode:
          type: integer
        mountPath:
          type: string
        name:
          type: string
    chaosfaulttemplate.UpdateFaultTemplateResponse:
      type: object
      required:
      - identity
      - name
      properties:
        apiVersion:
          type: string
        category:
          type: array
          items:
            type: string
        correlationID:
          type: string
        description:
          type: string
        hubIdentity:
          type: string
        identity:
          type: string
        infraType:
          type: string
        infras:
          type: array
          items:
            type: string
        inputs:
