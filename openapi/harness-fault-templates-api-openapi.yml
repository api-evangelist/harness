  /gateway/chaos/manager/api/rest/faulttemplates:
    get:
      description: List all the fault templates in a hub based on tag
      tags:
      - Fault Templates
      summary: List all the fault templates in a hub
      operationId: listFaultTemplate
      parameters:
      - description: account id to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - description: correlation id is used to debug micro svc communication
        name: correlationID
        in: query
        schema:
          type: string
      - description: hub identity used for filter
        name: hubIdentity
        in: query
        schema:
          type: string
      - name: includeAllScope
        in: query
        schema:
          type: boolean
      - description: infrastructure used for filter
        name: infrastructure
        in: query
        schema:
          type: string
          enum:
          - KubernetesV2
      - description: infrastructure type used for filter
        name: infrastructureType
        in: query
        schema:
          type: string
          enum:
          - Kubernetes
      - description: if this fault is enterprise fault or not
        name: isEnterprise
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 15
      - description: organization id to access the resource
        name: organizationIdentifier
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - description: permissions required for filter
        name: permissionsRequired
        in: query
        schema:
          type: string
      - description: project id to access the resource
        name: projectIdentifier
        in: query
        schema:
          type: string
      - description: name that you want to search
        name: search
        in: query
        schema:
          type: string
      - description: if sort order ascending or not
        name: sortAscending
        in: query
        schema:
          type: boolean
      - description: field  name that you want to sort
        name: sortField
        in: query
        schema:
          type: string
          enum:
          - name
          - lastUpdated
          - experimentName
      - description: comma separated tags used for filter
        name: tags
        in: query
        schema:
          type: string
      - description: type of the fault used for filter
        name: type
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chaosfaulttemplate.ListFaultTemplateResponse'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    post:
      description: Create fault templates in a hub based on tag
      tags:
      - Fault Templates
      summary: Create fault templates in a hub
      operationId: createFaultTemplate
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: chaos hub identity
        name: hubIdentity
        in: query
        required: true
        schema:
          type: string
      - description: correlation id is used to debug micro svc communication
        name: correlationID
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chaosfaulttemplate.CreateFaultTemplateRequest'
        description: create fault request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chaosfaulttemplate.CreateFaultTemplateResponse'
        '400':
          description: Bad Request
          content:
