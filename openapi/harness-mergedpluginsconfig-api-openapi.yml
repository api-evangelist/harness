openapi: 3.2.0
info:
  title: Harness Merged Plugins Config API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: MergedPluginsConfig
  description: Merged Plugins Configurations
  x-displayName: Merged Plugins Configurations
paths:
  /v1/merged-plugins-config:
    get:
      summary: Retrieve Merged Config for Enabled Plugins
      responses:
        '200':
          $ref: '#/components/responses/MergedPluginConfigResponse'
      operationId: get-merged-plugins-config
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      x-internal: true
      description: API for retriving merged configs for enabled plugin of account.
      tags:
      - MergedPluginsConfig
  /v1/sync-app-config:
    put:
      summary: Sync merged app-config for a given account
      operationId: sync-app-config
      responses:
        '204':
          description: No Content
      description: API to sync app-config for a given account. This API can be accessed by Support User only.
      x-internal: true
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      - schema:
          type: boolean
          default: false
        in: query
        name: base_config
        description: Set true to sync base app-config too
      tags:
      - MergedPluginsConfig
  /v1/configuration-entities:
    put:
      summary: Updates entities present in the configuration screen
      operationId: update-configuration-entities
      responses:
        '200':
          $ref: '#/components/responses/ConfigurationEntitiesResponse'
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      requestBody:
        $ref: '#/components/requestBodies/ConfigurationEntitiesRequest'
      x-internal: true
      tags:
      - MergedPluginsConfig
      x-stoplight:
        id: 67gwj4u4mz6nb
components:
  requestBodies:
    ConfigurationEntitiesRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfigurationEntities'
  responses:
    MergedPluginConfigResponse:
      description: Merged Config for all Enabled Plugins Response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MergedPluginConfigResponse'
    ConfigurationEntitiesResponse:
      description: Response for configuration screen resources
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfigurationEntities'
  schemas:
    ProxyHostDetail:
      title: ProxyHostDetail
      x-stoplight:
        id: agl6s9vai35qw
      type: object
      description: Proxy Host Detail
      properties:
        host:
          type: string
          x-stoplight:
            id: oudzqrxaqnkjy
        proxy:
          type: boolean
          x-stoplight:
            id: 3h03au3y87lyv
        selectors:
          type: array
          x-stoplight:
            id: jdgn49nqlp49k
          items:
            x-stoplight:
              id: zvnhr2daor8lr
            type: string
        identifier:
          type: string
          x-stoplight:
            id: soyi91ysmnt8u
        pluginId:
          type: string
          x-stoplight:
            id: 7we0dzf0ap7v7
      required:
      - host
      - proxy
    BackstageEnvVariable:
      title: BackstageEnvVariable
      x-stoplight:
        id: nxqrkraenk753
      type: object
      description: Backstage Env Variable
      discriminator:
        propertyName: type
        mapping:
          Config: '#/components/schemas/BackstageEnvConfigVariable'
          Secret: '#/components/schemas/BackstageEnvSecretVariable'
      x-examples: {}
      properties:
        identifier:
          type: string
          x-stoplight:
            id: qcqog9dhfhhtn
        env_name:
          type: string
          x-stoplight:
            id: 0br1k8e9y4vds
        created:
          type: integer
          x-stoplight:
            id: jnkz49ajqu2ep
          format: int64
        updated:
          type: integer
          x-stoplight:
            id: f7vn66lecbehz
          format: int64
        type:
          type: string
          x-stoplight:
            id: bkpapdothjik6
          description: This specifies the type of backstage env variable
          enum:
          - Config
          - Secret
      required:
      - env_name
      - type
    BackstageEnvSecretVariable:
      title: BackstageEnvSecretVariable
      x-stoplight:
        id: 3h8ht8pko3bgz
      x-discriminator-value: Secret
      allOf:
      - $ref: '#/components/schemas/BackstageEnvVariable'
        x-stoplight:
          id: qv79339cmwg5d
      - type: object
        properties:
          type:
            type: string
            enum:
            - Secret
          harness_secret_identifier:
            type: string
            x-stoplight:
              id: ah15yig0jo9yb
          is_deleted:
            type: boolean
            x-stoplight:
              id: uvmj7ylwufxzc
            default: false
        required:
        - type
        - harness_secret_identifier
      x-examples: {}
    ConfigurationEntities:
      title: ConfigurationEntities
      x-stoplight:
        id: irav1h1h46nfk
      type: object
      properties:
        env_variables:
          type: array
          x-stoplight:
            id: 75xycs21qycvx
          items:
            $ref: '#/components/schemas/BackstageEnvVariable'
        proxy:
          type: array
          x-stoplight:
            id: cxy39vfdsd9yb
          items:
            $ref: '#/components/schemas/ProxyHostDetail'
      required:
      - env_variables
      - proxy
    MergedPluginConfigs:
      title: MergedPluginConfigs
      x-stoplight:
        id: udd3rjj6vabp6
      type: object
      description: Merged Config for all Enabled Plugins.
      properties:
        config:
          type: string
          x-stoplight:
            id: 1xlvst25jqan6
        env_variables:
          type: array
          x-stoplight:
            id: 626hhepixlmvj
          items:
            $ref: '#/components/schemas/BackstageEnvSecretVariable'
        proxy:
          type: array
          x-stoplight:
            id: 9nyhtn38boka8
          items:
            $ref: '#/components/schemas/ProxyHostDetail'
      required:
      - config
      - env_variables
      - proxy
    MergedPluginConfigResponse:
      title: MergedPluginConfigResponse
      x-stoplight:
        id: ze6z3c1qi8cdy
      type: object
      description: Merged Config for all Enabled Plugins Response.
      properties:
        merged_config:
          $ref: '#/components/schemas/MergedPluginConfigs'
          x-stoplight:
            id: syzo1w7sp9ent
      required:
      - merged_config
  parameters:
    AccountHeader5:
      name: Harness-Account
      in: header
      required: false
      schema:
        type: string
      description: Identifier field of the account the resource is scoped to.
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
