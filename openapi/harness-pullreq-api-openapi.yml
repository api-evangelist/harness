        schema:
          items:
            type: integer
          type: array
        style: form
      - description: List of label value ids used to filter pull requests.
        explode: true
        in: query
        name: value_id
        required: false
        schema:
          items:
            type: integer
          type: array
        style: form
      - description: Return only pull requests where this user is the author.
