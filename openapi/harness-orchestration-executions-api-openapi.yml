openapi: 3.2.0
info:
  title: Harness Orchestration Executions API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Orchestration Executions
  x-displayName: Orchestration Executions [Beta]
paths:
  /rmg/api/orchestration/execution/startRelease/{id}:
    post:
      summary: Start Release Execution
      tags:
      - Orchestration Executions
      operationId: startReleaseExecution
      description: Start a new release execution for the given identifier
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique id of the release to execute
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - releaseInputYaml
              properties:
                releaseInputYaml:
                  type: string
                  description: YAML configuration for release input
      responses:
        '200':
          description: Release execution started successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - identifier
                - yaml
                properties:
                  identifier:
                    type: string
                    description: Identifier of the started execution
                  yaml:
                    type: string
                    description: YAML content of the release
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: start-release-execution
  /rmg/api/orchestration/execution/{releaseId}/phases:
    get:
      summary: Get Phases by Release ID
      tags:
      - Orchestration Executions
      operationId: get-orchestration-execution-phases
      description: Retrieve all phases for a specific release. Returns phase details including their YAML configurations.
      parameters:
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the release
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Filter phases by status (can specify multiple statuses)
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      responses:
        '200':
          description: Successfully retrieved phases
          content:
            application/json:
              schema:
                type: object
                required:
                - release_id
                - phases
                - total_running_phases
                properties:
                  release_id:
                    type: string
                    description: ID of the release
                  process_execution_id:
                    type: string
                    description: ID of the process execution
                    x-omitempty: true
                  total_running_phases:
                    type: integer
                    description: Total number of currently running phases
                  phases:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrchestrationExecutionPhase'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: get-phases-by-release
  /rmg/api/orchestration/execution/{releaseId}/phase/{phaseIdentifier}/activities:
    get:
      summary: Get Activities by Release and Phase ID
      tags:
      - Orchestration Executions
      operationId: get-orchestration-execution-activities
      description: Retrieve all activities for a specific release and phase execution. If no activities exist in the database, it will fetch them from the phase YAML configuration.
      parameters:
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the release
      - name: phaseIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the phase execution
      - name: phaseExecutionId
        in: query
        required: false
        schema:
          type: string
        description: The ID of the phase execution
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      responses:
        '200':
          description: Successfully retrieved activities
          content:
            application/json:
              schema:
                type: object
                required:
                - release_id
                - process_execution_id
                - phase_execution_id
                - activities
                - total_running_activities
                properties:
                  release_id:
                    type: string
                    description: ID of the release
                  process_execution_id:
                    type: string
                    description: ID of the process execution
                    x-omitempty: true
                  phase_execution_id:
                    type: string
                    description: ID of the phase execution
                    x-omitempty: true
                  total_running_activities:
                    type: integer
                    description: Total number of currently running activities
                  activities:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrchestrationExecutionActivity'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: get-activities-by-release-phase
  /rmg/api/orchestration/execution/{releaseId}/phase/{phaseIdentifier}/activity/{activityIdentifier}/tasks:
    get:
      summary: Get Orchestration Execution Tasks by Activity
      tags:
      - Orchestration Executions
      operationId: get-orchestration-execution-tasks
      description: Retrieve all orchestration execution tasks for a specific activity in a release phase
      parameters:
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the release
      - name: phaseIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the phase
      - name: activityIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the activity
      - name: activityExecutionId
        in: query
        required: false
        schema:
          type: string
        description: The ID of the activity execution
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      responses:
        '200':
          $ref: '#/components/responses/ExecutionTasksListResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: get-execution-tasks
  /rmg/api/orchestration/execution/release/{releaseId}/phase/{phaseIdentifier}/activity/{activityIdentifier}/retry-history:
    get:
      summary: Get Activity Retry History By Identifiers
      tags:
      - Orchestration Executions
      operationId: get-activity-retry-history-by-identifiers
      description: Retrieve the retry history for a specific activity by release ID, phase identifier, and activity identifier
      parameters:
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the release
      - name: phaseIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the phase
      - name: activityIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the activity
      - name: activityExecutionId
        in: query
        required: false
        schema:
          type: string
        description: The ID of the activity execution
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/RmLimit'
      - name: maxRetryIndex
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Maximum retry index to include (optional filter)
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      responses:
        '200':
          description: Successfully retrieved activity retry history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRetryHistoryResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: get-activity-retry-history-by-identifiers
  /rmg/api/orchestration/execution/activity/{activityId}/input:
    get:
      summary: Get Activity Execution Inputs
      tags:
      - Orchestration Executions
      operationId: get-orchestration-execution-activity-inputs
      description: Retrieve input values for a specific activity execution
      parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: string
        description: The activity execution ID
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      responses:
        '200':
          $ref: '#/components/responses/ActivityExecutionInputsResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: get-orchestration-execution-activity-inputs
  /rmg/api/orchestration/release/{releaseId}/phase/{phaseIdentifier}/activity/{activityIdentifier}:
    get:
      summary: Get Activity Execution Detail
      tags:
      - Orchestration Executions
      operationId: get-orchestration-execution-activity
      description: Retrieve detailed information about an activity execution including phase info, yaml, and pipeline/subprocess execution details. If activityExecutionId is provided, filters by it directly. Otherwise, filters by releaseId, phaseIdentifier, activityIdentifier, and retryIndex (defaults to 0 if not provided).
      parameters:
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the release
      - name: phaseIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the phase
      - name: activityIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the activity
      - name: activityExecutionId
        in: query
        required: false
        schema:
          type: string
        description: Optional activity execution ID. If provided, filters by this ID directly.
      - name: retryIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Optional retry index. Used when activityExecutionId is not provided. Defaults to 0 if not specified.
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      responses:
        '200':
          description: Successfully retrieved activity execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationExecutionActivityDetail'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: get-orchestration-execution-activity
  /rmg/api/orchestration/execution/release/{releaseId}/phase/{phaseIdentifier}/output:
    get:
      summary: Get Phase Execution Outputs
      tags:
      - Orchestration Executions
      operationId: get-orchestration-execution-phase-outputs
      description: Retrieve output values for a specific phase execution
      parameters:
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the release
      - name: phaseIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the phase
      - name: phaseExecutionId
        in: query
        required: false
        schema:
          type: string
        description: The ID of the phase execution
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      responses:
        '200':
          $ref: '#/components/responses/ExecutionOutputsResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: get-orchestration-execution-phase-outputs
  /rmg/api/orchestration/execution/release/{releaseId}/phase/{phaseIdentifier}/activity/{activityIdentifier}/output:
    get:
      summary: Get Activity Execution Outputs
      tags:
      - Orchestration Executions
      operationId: get-orchestration-execution-activity-outputs
      description: Retrieve output values for a specific activity execution
      parameters:
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the release
      - name: phaseIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the phase
      - name: activityIdentifier
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the activity
      - name: activityExecutionId
        in: query
        required: false
        schema:
          type: string
        description: The ID of the activity execution
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      responses:
        '200':
          $ref: '#/components/responses/ExecutionOutputsResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: get-orchestration-execution-activity-outputs
  /rmg/api/orchestration/execution/activity/{activityId}/output:
    post:
      summary: Submit Activity Execution Outputs
      tags:
      - Orchestration Executions
      operationId: post-activity-execution-output
      description: Submit outputs for a manual activity execution that is waiting for outputs
      parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: string
        description: The activity execution ID
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outputs
              properties:
                outputs:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExecutionOutputDTO'
      responses:
        '200':
          description: Outputs accepted
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '409':
          $ref: '#/components/responses/RmErrorResponse'
        '422':
          $ref: '#/components/responses/RmErrorResponse'
  /rmg/api/orchestration/execution/task/{taskExecutionId}/comment:
    post:
      summary: Create Task Comment
      tags:
      - Orchestration Executions
      operationId: createTaskComment
      description: Create a new comment for a specific execution task
      parameters:
      - name: taskExecutionId
        in: path
        required: true
        schema:
          type: string
        description: ID of the execution task
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - comment
              properties:
                comment:
                  type: string
                  description: The comment text
                  x-oapi-codegen-extra-tags:
                    validate: required,max=1024
      responses:
        '200':
          $ref: '#/components/responses/CreateTaskCommentResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: create-task-comment
  /rmg/api/orchestration/execution/task/comment/{commentId}:
    put:
      summary: Update Task Comment
      tags:
      - Orchestration Executions
      operationId: updateTaskComment
      description: Update an existing task comment
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: string
        description: ID of the comment to update
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - comment
              properties:
                comment:
                  type: string
                  description: The updated comment text
                  x-oapi-codegen-extra-tags:
                    validate: required,max=1024
      responses:
        '200':
          $ref: '#/components/responses/UpdateTaskCommentResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: update-task-comment
    delete:
      summary: Delete Task Comment
      tags:
      - Orchestration Executions
      operationId: deleteTaskComment
      description: Delete a specific task comment
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: string
        description: ID of the comment to delete
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      responses:
        '204':
          description: Comment deleted successfully
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: delete-task-comment
  /rmg/api/orchestration/execution/task/{taskExecutionId}/comment/summary:
    get:
      summary: Get Task Comments Summary
      tags:
      - Orchestration Executions
      operationId: getTaskCommentsSummary
      description: Retrieve a cursor based paginated list of comments for a specific execution task
      parameters:
      - name: taskExecutionId
        in: path
        required: true
        schema:
          type: string
        description: ID of the execution task
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/RmLimit'
      responses:
        '200':
          $ref: '#/components/responses/TaskCommentsListResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: list-task-comments
  /rmg/api/orchestration/execution/task/{taskExecutionId}/status:
    put:
      summary: Update Execution Task Status
      tags:
      - Orchestration Executions
      operationId: updateExecutionTaskStatus
      description: Update the status of a specific execution task
      parameters:
      - name: taskExecutionId
        in: path
        required: true
        schema:
          type: string
        description: ID of the execution task
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  description: The new status for the task
                  $ref: '#/components/schemas/ExecutionTaskStatus'
      responses:
        '200':
          $ref: '#/components/responses/UpdateExecutionTaskStatusResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: update-execution-task-status
  /rmg/api/orchestration/execution/task/{taskExecutionId}/metadata:
    put:
      summary: Update Execution Task Metadata
      tags:
      - Orchestration Executions
      operationId: updateExecutionTaskMetadata
      description: Update the metadata (name and description) of a specific execution task
      parameters:
      - name: taskExecutionId
        in: path
        required: true
        schema:
          type: string
        description: ID of the execution task
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Updated name for the task
                  x-oapi-codegen-extra-tags:
                    validate: required_without_all=Description
                description:
                  type: string
                  description: Updated description for the task
                  x-oapi-codegen-extra-tags:
                    validate: required_without_all=Name
      responses:
        '200':
          $ref: '#/components/responses/UpdateExecutionTaskMetadataResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
  /rmg/api/orchestration/{entityType}/events/{entityId}:
    get:
      summary: Get Events by Entity Type and Entity ID
      tags:
      - Orchestration Executions
      operationId: getEventsByEntityTypeAndId
      description: Retrieve a cursor-based paginated list of events for a specific entity type and entity ID, sorted by created_at in descending order
      parameters:
      - $ref: '#/components/parameters/EventEntityTypeParam'
      - $ref: '#/components/parameters/EventEntityIdParam'
      - $ref: '#/components/parameters/EventTypeParam'
      - $ref: '#/components/parameters/AccountParam'
      - $ref: '#/components/parameters/RmOrgParam'
      - $ref: '#/components/parameters/RmProjectParam'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/RmLimit'
      responses:
        '200':
          $ref: '#/components/responses/EventsResponse'
        '400':
          $ref: '#/components/responses/RmErrorResponse'
        '403':
          $ref: '#/components/responses/RmErrorResponse'
        '404':
          $ref: '#/components/responses/RmErrorResponse'
        '500':
          $ref: '#/components/responses/RmErrorResponse'
      x-stoplight:
        id: get-events-by-entity-type-and-id
  /rmg/api/release/{releaseId}/execution/activities:
    get:
      summary: Get Paginated Activities by Release ID
      tags:
      - Orchestration Executions
      operationId: get-orchestration-execution-activities-paginated
      description: 'Retrieve a paginated list of orchestration execution activities for a specific release with optional filters.


        **Sortable fields:** `start_ts`, `startTs`, `end_ts`, `endTs`, `last_updated_at`, `lastUpdatedAt`, `created_at`, `createdAt`, `name`, `identifier`, `status`, `type`.

        Sort format: `sort=field_name&sort=direction` where direction is `asc` or `desc`.

        Examples: `sort=start_ts&sort=desc` or `sort=endTs&sort=asc`.'
      parameters:
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the release
      - $ref: '#/components/parameters/AccountParam'
