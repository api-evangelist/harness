          $ref: '#/components/schemas/RmFailureInfo'
          description: Failure information if the activity failed
        triggerInfo:
          $ref: '#/components/schemas/ActivityTriggerInfo'
          description: Trigger information for the activity
        pipeline:
          $ref: '#/components/schemas/PipelineActivityInfo'
          description: Pipeline execution information for activities
        subprocess:
          $ref: '#/components/schemas/SubprocessActivityInfo'
          description: Subprocess execution information for activities
        manual:
          $ref: '#/components/schemas/ManualActivityInfo'
          description: Manual activity execution information
    EventDTO:
      type: object
      description: Represents an event for an entity
      required:
      - entityId
      - entityType
      - type
      - eventMetadata
      - createdBy
      - createdAt
      properties:
        entityId:
          type: string
          description: The ID of the entity
        entityType:
          $ref: '#/components/schemas/EventEntity'
          description: The type of entity
        type:
          $ref: '#/components/schemas/EventType'
          description: The type of event
        eventMetadata:
          $ref: '#/components/schemas/EventMetadata'
          description: Event metadata containing from and to fields
        createdBy:
          $ref: '#/components/schemas/CreatedByDTO'
          description: Information about the user who created the event
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp when the event was created
  parameters:
    RmSort:
      name: sort
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: 'Sort parameters as an array. Format: `[field_name, direction]` where direction is `asc` or `desc`.

        Supported fields: `start_ts`, `startTs`, `end_ts`, `endTs`, `last_updated_at`, `lastUpdatedAt`, `created_at`, `createdAt`, `name`, `identifier`, `status`, `type`.

        When used in query params, use format: `sort=field_name&sort=direction` (e.g., `sort=start_ts&sort=desc`).

        '
      examples:
        example1:
          value:
          - created_at,asc
        example2:
          value:
          - last_updated_at,desc
        example3:
          value:
          - start_ts,desc
        example4:
          value:
          - end_ts,asc
    RmOrgParam:
      name: orgIdentifier
      in: query
      required: false
      schema:
        type: string
      description: Organisation Identifier
    RmProjectParam:
      name: projectIdentifier
      in: query
      required: false
      schema:
        type: string
      description: Project Identifier
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
    EventEntityIdParam:
      name: entityId
      in: path
      required: true
      schema:
        type: string
      description: The ID of the entity
    RmLimit:
      name: limit
      in: query
      schema:
        type: number
        default: 500
        maximum: 500
      description: The number of records expected
    AccountParam:
      name: Harness-Account
      in: header
      required: true
      schema:
        type: string
      description: Account Identifier
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Cursor Based Pagination
    OrchestrationStatusListParam:
      name: status
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - SCHEDULED
          - RUNNING
          - OUTPUT_WAITING
          - QUEUED
          - SUCCEEDED
          - FAILED
          - ABORTED
          - ON_HOLD
          - RETRIED
          - IGNORED
          - SKIPPED
        uniqueItems: false
      description: 'Filter activities by status (can specify multiple statuses).

        Valid values: SCHEDULED, QUEUED, RUNNING, OUTPUT_WAITING, SUCCEEDED, FAILED, ABORTED, ON_HOLD, RETRIED, IGNORED, SKIPPED.

        '
    EventEntityTypeParam:
      name: entityType
      in: path
      required: true
      schema:
        type: string
        enum:
        - Task
      description: Type of entity for events
    RmPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
    EventTypeParam:
      name: eventType
      in: query
      required: false
      schema:
        type: string
      description: Optional filter by event type
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
