          type: string
          description: Target variant id — target_summary.variant_id for this row. Null when not set.
          example: abcdef1234567890ghijkl
        url:
          type: string
          description: Repository URL (the git clone/browse URL). Sourced from the chosen variant's last scan's git_metadata.RepositoryHTTP when available (the URL the scanner actually cloned), falling back to target.url. Null when neither is set. target_summary does not store it, so it is joined in from target/scan.
