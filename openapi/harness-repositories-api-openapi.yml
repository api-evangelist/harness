            - bandit
            SCA:
            - snyk
            - twistlock
          additionalProperties:
            type: array
            items:
              type: string
              example: Eveniet sequi rerum.
            example:
            - Eos quia sit recusandae porro.
            - Sit sequi debitis similique.
            - Quis qui rerum voluptate.
            - Molestiae vero.
