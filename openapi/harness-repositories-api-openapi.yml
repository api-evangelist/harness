openapi: 3.2.0
info:
  title: Harness Repositories API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Repositories
  description: Read APIs backing the STO Target Code Repositories page.
paths:
  /gitops/api/v1/agents/{agentIdentifier}/repositories:
    get:
      summary: ListRepositories gets a list of all configured repositories
      description: ListRepositories gets a list of all configured repositories.
      operationId: AgentRepositoryService_ListRepositories
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repositoriesRepositoryList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: identifier
        in: query
        required: false
        schema:
          type: string
      - name: query.repo
        description: Repo URL for query.
        in: query
        required: false
        schema:
          type: string
      - name: query.forceRefresh
        description: Whether to force a cache refresh on repo's connection state.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.project
        description: The associated project project.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Repositories
    post:
      summary: CreateRepository creates a new repository configuration
      description: CreateRepository creates a new repository configuration.
      operationId: AgentRepositoryService_CreateRepository
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Repository'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: identifier
        in: query
        required: false
        schema:
          type: string
      - name: repoCredsId
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/repositoriesRepoCreateRequest'
        required: true
      tags:
      - Repositories
  /gitops/api/v1/agents/{agentIdentifier}/repositories/eso/check:
    get:
      summary: Checks whether External Secrets Operator is installed
      description: CheckExternalSecretsOperator Checks whether External Secrets Operator is installed or not
      operationId: AgentRepositoryService_CheckExternalSecretsOperator
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repositoriesCheckESOResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Repositories
  /gitops/api/v1/agents/{agentIdentifier}/repositories/eso/generators:
    get:
      summary: Returns a list of ESO generators installed in agent namespace
      description: Returns a list of ESO generators installed in agent namespace.
      operationId: AgentRepositoryService_ListESOGenerators
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repositoriesESOGeneratorResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNSET
          - AWS_ECR
          - GOOGLE_GCR
          default: UNSET
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: url
        in: query
        required: false
        schema:
          type: string
      tags:
      - Repositories
  /gitops/api/v1/agents/{agentIdentifier}/repositories/oci/type:
    post:
      summary: Returns the Repository type of OCI repo
      description: CheckOCIRepoType Returns the Repository type of OCI repo
      operationId: AgentRepositoryService_CheckOCIRepoType
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1OCIRepoTypeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1OCIRepoType'
        required: true
      tags:
      - Repositories
  /gitops/api/v1/agents/{agentIdentifier}/repositories/validate:
    post:
      summary: ValidateAccess gets connection state for a repository
      description: ValidateAccess gets connection state for a repository.
      operationId: AgentRepositoryService_ValidateAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commonsConnectionState'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: identifier
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/repositoriesRepoAccessQuery'
        required: true
      tags:
      - Repositories
  /gitops/api/v1/agents/{agentIdentifier}/repositories/{identifier}:
    get:
      summary: Get returns a repository or its credentials
      description: Get returns a repository or its credentials.
      operationId: AgentRepositoryService_Get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Repository'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: query.repo
        description: Repo URL for query.
        in: query
        required: false
        schema:
          type: string
      - name: query.forceRefresh
        description: Whether to force a cache refresh on repo's connection state.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.project
        description: The associated project project.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Repositories
    delete:
      summary: DeleteRepository deletes a repository from the configuration
      description: DeleteRepository deletes a repository from the configuration.
      operationId: AgentRepositoryService_DeleteRepository
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repositoriesRepoResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: query.repo
        description: Repo URL for query.
        in: query
        required: false
        schema:
          type: string
      - name: query.forceRefresh
        description: Whether to force a cache refresh on repo's connection state.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.project
        description: The associated project project.
        in: query
        required: false
        schema:
          type: string
      - name: forceDelete
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Repositories
    put:
      summary: UpdateRepository updates a repository configuration
      description: UpdateRepository updates a repository configuration.
      operationId: AgentRepositoryService_UpdateRepository
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Repository'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/repositoriesRepoUpdateRequest'
        required: true
      tags:
      - Repositories
  /gitops/api/v1/agents/{agentIdentifier}/repositories/{identifier}/appdetails:
    get:
      summary: GetAppDetails returns application details by given path
      description: GetAppDetails returns application details by given path.
      operationId: AgentRepositoryService_GetAppDetails
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repositoriesRepoAppDetailsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.repoURL
        description: RepoURL is the URL to the repository (Git or Helm) that contains the application manifests.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.path
        description: Path is a directory path within the Git repository, and is only valid for applications sourced from Git.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.targetRevision
        description: 'TargetRevision defines the revision of the source to sync the application to.

          In case of Git, this can be commit, tag, or branch. If omitted, will equal to HEAD.

          In case of Helm, this is a semver tag for the Chart''s version.'
        in: query
        required: false
        schema:
          type: string
      - name: query.source.helm.valueFiles
        description: ValuesFiles is a list of Helm value files to use when generating a template.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.source.helm.releaseName
        description: ReleaseName is the Helm release name to use. If omitted it will use the application name.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.helm.values
        description: Values specifies Helm values to be passed to helm template, typically defined as a block.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.helm.version
        description: Version is the Helm version to use for templating (either "2" or "3").
        in: query
        required: false
        schema:
          type: string
      - name: query.source.helm.passCredentials
        description: PassCredentials pass credentials to all domains (Helm's --pass-credentials).
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.helm.ignoreMissingValueFiles
        description: IgnoreMissingValueFiles prevents helm template from failing when valueFiles do not exist locally by not appending them to helm template --values.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.helm.skipCrds
        description: SkipCrds skips custom resource definition installation step (Helm's --skip-crds).
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.helm.namespace
        description: Namespace is an optional namespace to template with. If left empty, defaults to the app's destination namespace.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.helm.kubeVersion
        description: 'KubeVersion specifies the Kubernetes API version to pass to Helm when templating manifests. By default, Argo CD

          uses the Kubernetes version of the target cluster.'
        in: query
        required: false
        schema:
          type: string
      - name: query.source.helm.apiVersions
        description: 'APIVersions specifies the Kubernetes resource API versions to pass to Helm when templating manifests. By default,

          Argo CD uses the API versions of the target cluster. The format is [group/]version/kind.'
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.source.helm.skipTests
        description: SkipTests skips test manifest installation step (Helm's --skip-tests).
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.helm.skipSchemaValidation
        description: SkipSchemaValidation skips JSON schema validation (Helm's --skip-schema-validation).
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.kustomize.namePrefix
        description: NamePrefix overrides the namePrefix in the kustomization.yaml for Kustomize apps.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.kustomize.nameSuffix
        description: NameSuffix overrides the nameSuffix in the kustomization.yaml for Kustomize apps.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.kustomize.images
        description: Images is a list of Kustomize image override specifications.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.source.kustomize.version
        description: Version controls which version of Kustomize to use for rendering manifests.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.kustomize.forceCommonLabels
        description: ForceCommonLabels specifies whether to force applying common labels to resources for Kustomize apps.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.kustomize.forceCommonAnnotations
        description: ForceCommonAnnotations specifies whether to force applying common annotations to resources for Kustomize apps.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.kustomize.namespace
        description: Namespace sets the namespace that Kustomize adds to all resources.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.kustomize.commonAnnotationsEnvsubst
        description: CommonAnnotationsEnvsubst specifies whether to apply env variables substitution for annotation values.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.kustomize.components
        description: Components specifies a list of kustomize components to add to the kustomization before building.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.source.kustomize.labelWithoutSelector
        description: LabelWithoutSelector specifies whether to apply common labels to resource selectors or not.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.kustomize.kubeVersion
        description: 'KubeVersion specifies the Kubernetes API version to pass to Helm when templating manifests. By default, Argo CD

          uses the Kubernetes version of the target cluster.'
        in: query
        required: false
        schema:
          type: string
      - name: query.source.kustomize.apiVersions
        description: 'APIVersions specifies the Kubernetes resource API versions to pass to Helm when templating manifests. By default,

          Argo CD uses the API versions of the target cluster. The format is [group/]version/kind.'
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.source.kustomize.ignoreMissingComponents
        description: IgnoreMissingComponents prevents kustomize from failing when components do not exist locally by not appending them to kustomization file.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.kustomize.labelIncludeTemplates
        description: LabelIncludeTemplates specifies whether to apply common labels to resource templates or not.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.ksonnet.environment
        description: Environment is a ksonnet application environment name.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.directory.recurse
        description: Recurse specifies whether to scan a directory recursively for manifests.
        in: query
        required: false
        schema:
          type: boolean
      - name: query.source.directory.jsonnet.libs
        description: Additional library search dirs.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.source.directory.exclude
        description: Exclude contains a glob pattern to match paths against that should be explicitly excluded from being used during manifest generation.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.directory.include
        description: Include contains a glob pattern to match paths against that should be explicitly included during manifest generation.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.plugin.name
        in: query
        required: false
        schema:
          type: string
      - name: query.source.chart
        description: Chart is a Helm chart name, and must be specified for applications sourced from a Helm repo.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.ref
        description: Ref is reference to another source within sources field. This field will not be used if used with a `source` tag.
        in: query
        required: false
        schema:
          type: string
      - name: query.source.name
        description: Name is used to refer to a source and is displayed in the UI. It is used in multi-source Applications.
        in: query
        required: false
        schema:
          type: string
      - name: query.appName
        in: query
        required: false
        schema:
          type: string
      - name: query.appProject
        in: query
        required: false
        schema:
          type: string
      - name: query.sourceIndex
        description: source index (for multi source apps).
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: query.versionId
        description: versionId from historical data (for multi source apps).
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Repositories
  /gitops/api/v1/agents/{agentIdentifier}/repositories/{identifier}/apps:
    get:
      summary: ListApps returns list of apps in the repo
      description: ListApps returns list of apps in the repo.
      operationId: AgentRepositoryService_ListApps
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repositoriesRepoAppsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: query.repo
        in: query
        required: false
        schema:
          type: string
      - name: query.revision
        in: query
        required: false
        schema:
          type: string
      - name: query.appName
        in: query
        required: false
        schema:
          type: string
      - name: query.appProject
        in: query
        required: false
        schema:
          type: string
      tags:
      - Repositories
  /gitops/api/v1/agents/{agentIdentifier}/repositories/{identifier}/helmcharts:
    get:
      summary: GetHelmCharts returns list of helm charts in the specified repository
