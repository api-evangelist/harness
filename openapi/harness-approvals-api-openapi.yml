      - name: limit
        in: query
        description: Limit is the number of records to return for a page.
        allowEmptyValue: true
        schema:
          type: integer
          description: Limit is the number of records to return for a page.
          default: 30
          example: 30
          format: int64
          minimum: 1
          maximum: 1000
        example: 30
      - name: page
        in: query
        description: Page is the page number to return relative to the page 'limit'.
        allowEmptyValue: true
        schema:
          type: integer
          description: Page is the page number to return relative to the page 'limit'.
          default: 1
          example: 1
          format: int64
          minimum: 1
        example: 1
      - name: workspace
        in: query
        description: Workspace identifier
        allowEmptyValue: true
        schema:
          type: string
          description: Workspace identifier
          example: Ipsa ratione.
        example: Eaque voluptas natus modi omnis.
      - name: pipeline_execution_id
        in: query
        description: Pipeline identifier
        allowEmptyValue: true
        schema:
          type: string
          description: Pipeline identifier
          example: Amet et sit qui.
        example: Omnis consequatur rerum amet deleniti ex.
      - name: pipeline_stage_id
        in: query
        description: Pipeline stage identifier
        allowEmptyValue: true
        schema:
          type: string
          description: Pipeline stage identifier
          example: Voluptas earum.
        example: Est a hic beatae non.
      - name: status_type
        in: query
        description: Status of the approval step
        allowEmptyValue: true
        schema:
          type: string
          description: Status of the approval step
          example: rejected
          enum:
          - approved
          - rejected
          - pending
        example: rejected
      - name: org
        in: path
        description: Org is the organisation identifier.
        required: true
        schema:
          type: string
          description: Org is the organisation identifier.
          example: q0
          minLength: 1
          maxLength: 128
        example: 2g
      - name: project
        in: path
        description: Project is the project identifier.
        required: true
        schema:
          type: string
          description: Project is the project identifier.
          example: '0'
          minLength: 1
          maxLength: 128
        example: u9
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          example: j
          minLength: 1
          maxLength: 128
        example: hw
