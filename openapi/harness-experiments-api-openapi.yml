openapi: 3.2.0
info:
  title: Harness Experiments API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Experiments
paths:
  /gateway/chaos/manager/api/rest/chaos-experiment-run/report/{experimentRunId}/{notifyId}:
    get:
      summary: Generate and return kubernetesV1 chaos experiment run report
      operationId: GetChaosExperimentRunReport
      parameters:
      - description: experimentRunId for kubernetesV1 experiment run report generation
        name: experimentRunId
        in: path
        required: true
        schema:
          type: string
      - description: notifyId for kubernetesV1 experiment run report generation
        name: notifyId
        in: path
        required: true
        schema:
          type: string
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Experiments
  /gateway/chaos/manager/api/rest/overview/experiment-stats:
    get:
      description: Get resource usage
      summary: Get chaos experiment run overview stats
      operationId: getExperimentRunsOverviewStats
      parameters:
      - description: Account Identifier
        name: accountIdentifier
        in: query
        schema:
          type: string
      - description: Organization Identifier
        name: orgIdentifier
        in: query
        schema:
          type: string
      - description: Project Identifier
        name: projectIdentifier
        in: query
        schema:
          type: string
      - description: Start Time
        name: startTime
        in: query
        schema:
          type: string
      - description: End Time
        name: endTime
        in: query
        schema:
          type: string
      - description: Group By Parameter
        name: groupBy
        in: query
        schema:
          type: string
          enum:
          - DAY
          - WEEK
          - MONTH
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ChaosExperimentRunsStatsResponse'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      tags:
      - Experiments
  /gateway/chaos/manager/api/rest/v2/bulkaction/bulkexperimentdelete:
    post:
      summary: Delete given experiments
      operationId: bulkExperimentDelete
      parameters:
      - description: account id that want to access the resource
