  /gateway/chaos/manager/api/rest/v2/experiment:
    get:
      summary: List chaos v2 experiments
      operationId: listChaosV2Experiment
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: page number
        name: page
        in: query
        required: true
        schema:
          type: integer
          default: 0
      - description: limit per page
        name: limit
        in: query
        required: true
        schema:
          type: integer
          default: 10
      - description: filter based on start time
        name: startDate
        in: query
        schema:
          type: string
      - description: filter based on end time
        name: endDate
        in: query
        schema:
          type: string
      - description: search based on experiment name
        name: experimentName
        in: query
        schema:
          type: string
      - description: search based on infra name
        name: infraName
        in: query
        schema:
          type: string
      - description: filter based on infraId
        name: infraId
        in: query
        schema:
          type: string
      - description: filter based on infra state
        name: infraActive
        in: query
        schema:
          type: boolean
      - description: filter based on tags
        name: tags
        in: query
        schema:
          type: string
      - description: filter based on experimentID
        name: experimentIds
        in: query
        schema:
          type: string
      - description: filter based on environmentID
        name: environmentIdentifier
        in: query
        schema:
          type: string
      - description: filter experiments based on experiment ids
        name: targetNetworkMapIds
        in: query
        schema:
          type: string
      - description: filter based on status
        name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ListExperimentV2Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Experiments
    post:
      summary: Save a chaos v2 experiment
      operationId: saveChaosV2Experiment
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.ExperimentCreationRequest'
        description: Save Experiment
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ExperimentCreationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Experiments
  /gateway/chaos/manager/api/rest/v2/experiment-runs/csv:
    post:
      description: Download experiment runs as CSV (no request body; only path + query params)
      tags:
      - Experiments
      summary: Download experiment runs as CSV
      operationId: getExperimentRunsCSV
      parameters:
      - description: account id to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: correlation id is used to debug micro svc communication
        name: correlationID
        in: query
        schema:
          type: string
      - name: endTime
        in: query
        schema:
          type: integer
      - description: organization id to access the resource
        name: organizationIdentifier
        in: query
        schema:
          type: string
      - description: project id to access the resource
        name: projectIdentifier
        in: query
        schema:
          type: string
      - description: name that you want to search
        name: search
        in: query
        schema:
          type: string
      - description: if sort order ascending or not
        name: sortAscending
        in: query
        schema:
          type: boolean
      - description: field  name that you want to sort
        name: sortField
        in: query
        schema:
          type: string
          enum:
          - name
          - lastUpdated
          - experimentName
      - name: startTime
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/api.RestError'
