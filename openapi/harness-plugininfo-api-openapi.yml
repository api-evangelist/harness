openapi: 3.2.0
info:
  title: Harness Plugin Info API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: PluginInfo
  description: Plugin Information
  x-displayName: Plugin Information
paths:
  /v1/plugins-info:
    get:
      summary: List Available Plugins
      tags:
      - PluginInfo
      responses:
        '200':
          $ref: '#/components/responses/PluginInfoResponseList'
      operationId: get-plugins
      description: Get all plugins available
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      x-internal: false
    post:
      summary: Save custom plugin info
      operationId: save-custom-plugins-info
      responses:
        '201':
          $ref: '#/components/responses/CustomPluginInfoResponse'
      x-stoplight:
        id: t4vsvfeuf169r
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      x-internal: true
      requestBody:
        $ref: '#/components/requestBodies/CustomPluginCreateRequest'
      tags:
      - PluginInfo
  /v1/plugins-info/{plugin-id}:
    parameters:
    - $ref: '#/components/parameters/PluginId'
    get:
      summary: Get Plugin
      tags:
      - PluginInfo
      responses:
        '200':
          $ref: '#/components/responses/PluginDetailedInfoResponse'
      operationId: get-plugins-info-plugin-id
      description: Get plugin details for given pluginId
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      - $ref: '#/components/parameters/Meta'
      x-internal: false
    put:
      summary: Update custom plugin info
      operationId: update-custom-plugins-info
      responses:
        '200':
          $ref: '#/components/responses/CustomPluginInfoResponse'
      x-stoplight:
        id: jt3xnyhpgnfe9
      security:
      - x-api-key: []
      requestBody:
        $ref: '#/components/requestBodies/CustomPluginInfoRequest'
      tags:
      - PluginInfo
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      x-internal: true
    delete:
      summary: Delete custom plugin info
      operationId: delete-custom-plugin-info
      responses:
        '204':
          description: No Content
      x-stoplight:
        id: 1brpcp6chep0j
      x-internal: true
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      - $ref: '#/components/parameters/PluginName'
      tags:
      - PluginInfo
  /v1/backstage-plugins-info:
    get:
      summary: List Available Backstage Plugins
      tags:
      - PluginInfo
      responses:
        '200':
          $ref: '#/components/responses/PluginInfoResponseList'
      operationId: get-backstage-plugins
      description: Get all backstage plugins available
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      x-internal: true
  /v1/plugin/request:
    post:
      summary: Request for a Plugin
      operationId: post-plugin-request
      responses:
        '201':
          description: Created
      tags:
      - PluginInfo
      x-internal: false
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      requestBody:
        $ref: '#/components/requestBodies/RequestPluginRequest'
    get:
      summary: Get all plugin requests for an account
      operationId: get-plugin-request
      responses:
        '200':
          $ref: '#/components/responses/PluginRequestResponseList'
      tags:
      - PluginInfo
      x-internal: false
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader5'
      - $ref: '#/components/parameters/Page1'
      - $ref: '#/components/parameters/Limit5'
components:
  schemas:
    CustomPluginDetailedInfo:
      title: CustomPluginDetailedInfo
      x-stoplight:
        id: 7d5vhhxgcinuj
      description: Metadata for custom plugin
      allOf:
      - $ref: '#/components/schemas/PluginDetailedInfo'
      - type: object
        x-stoplight:
          id: a3azbqof3qaa4
        properties:
          artifact:
            $ref: '#/components/schemas/Artifact'
          package_name:
            type: string
            x-stoplight:
              id: 6tclf6gflwbnm
    PluginRequestResponseList:
      title: PluginRequestResponseList
      x-stoplight:
        id: 5yzb7rxns0aw0
      type: object
      properties:
        plugin_requests:
          type: array
          x-stoplight:
            id: hi8z7q7omjfak
          items:
            $ref: '#/components/schemas/RequestPlugin'
            x-stoplight:
              id: la7xiemqky7f9
      required:
      - plugin_requests
      description: Returns all plugin requests for an account
    PluginDetails:
      title: PluginDetails
      x-stoplight:
        id: 560styu7fppwf
      type: object
      properties:
        plugin_details:
          $ref: '#/components/schemas/PluginInfo'
          x-stoplight:
            id: ar7hkpjerml0u
        config:
          type: string
          x-stoplight:
            id: 4yr6y6r9zxzdi
        exports:
          $ref: '#/components/schemas/Exports'
          x-stoplight:
            id: 43cv9jhplzytw
      required:
      - plugin_details
    PluginInfo:
      title: PluginInfo
      x-stoplight:
        id: rjdikftbwq4ku
      type: object
      properties:
        id:
          type: string
          x-stoplight:
            id: 08dcllgfdjnnf
        name:
          type: string
          x-stoplight:
            id: cs8sf1p0u0h6m
        created_by:
          type: string
          x-stoplight:
            id: muu0fnhfcfnq0
        icon_url:
          type: string
          x-stoplight:
            id: qi63qdmfx4ozx
        description:
          type: string
          x-stoplight:
            id: f3f9a3v15p8qx
        category:
          type: string
          x-stoplight:
            id: 2hcvvko282w2b
        source:
          type: string
          x-stoplight:
            id: 86jybcrx3x9hy
        image_url:
          type: string
        images:
          type: array
          x-stoplight:
            id: tn689mqkfth94
          items:
            x-stoplight:
              id: ybfwwjy9ere6h
            type: string
        documentation:
          type: string
          x-stoplight:
            id: g8pxx4u72mjyo
        core:
          type: boolean
          x-stoplight:
            id: h6xd4qngysrvl
        enabled:
          type: boolean
          x-stoplight:
            id: dye1mgrxvvkhj
        plugin_type:
          type: string
          x-stoplight:
            id: 3afv43ng1qibj
          enum:
          - DEFAULT
          - CUSTOM
      required:
      - id
    ProxyHostDetail:
      title: ProxyHostDetail
      x-stoplight:
        id: agl6s9vai35qw
      type: object
      description: Proxy Host Detail
      properties:
        host:
          type: string
          x-stoplight:
            id: oudzqrxaqnkjy
        proxy:
          type: boolean
          x-stoplight:
            id: 3h03au3y87lyv
        selectors:
          type: array
          x-stoplight:
            id: jdgn49nqlp49k
          items:
            x-stoplight:
              id: zvnhr2daor8lr
            type: string
        identifier:
          type: string
          x-stoplight:
            id: soyi91ysmnt8u
        pluginId:
          type: string
          x-stoplight:
            id: 7we0dzf0ap7v7
      required:
      - host
      - proxy
    PluginDetailedInfo:
      title: PluginDetailedInfo
      x-stoplight:
        id: 4mgb2xlg0qmuz
      allOf:
      - $ref: '#/components/schemas/PluginDetails'
      - type: object
        properties:
          env_variables:
            x-stoplight:
              id: dbvndzvgirvhx
            type: array
            items:
              $ref: '#/components/schemas/BackstageEnvSecretVariable'
          saved:
            type: boolean
            x-stoplight:
              id: zc7gzaskute7h
          proxy:
            x-stoplight:
              id: iihf5kiywsyft
            type: array
            items:
              $ref: '#/components/schemas/ProxyHostDetail'
        required:
        - env_variables
        - saved
    ExportDetails:
      title: ExportDetails
      x-stoplight:
        id: lh3kww6at9n87
      type: object
      properties:
        type:
          type: string
          x-stoplight:
            id: 69io5n1al727m
        name:
          type: string
          x-stoplight:
            id: rk3j3ohhxfadq
        add_by_default:
          type: boolean
          x-stoplight:
            id: yv6e7c9c2eyv6
        default_route:
          type: string
          x-stoplight:
            id: lg3iy2r2zvqhb
        layout_schema_specs:
          type: object
          x-stoplight:
            id: kqd59lko12kls
      required:
      - type
      - name
    BackstageEnvVariable:
      title: BackstageEnvVariable
      x-stoplight:
        id: nxqrkraenk753
      type: object
      description: Backstage Env Variable
      discriminator:
        propertyName: type
        mapping:
          Config: '#/components/schemas/BackstageEnvConfigVariable'
          Secret: '#/components/schemas/BackstageEnvSecretVariable'
      x-examples: {}
      properties:
        identifier:
          type: string
          x-stoplight:
            id: qcqog9dhfhhtn
        env_name:
          type: string
          x-stoplight:
            id: 0br1k8e9y4vds
        created:
          type: integer
          x-stoplight:
            id: jnkz49ajqu2ep
          format: int64
        updated:
          type: integer
          x-stoplight:
            id: f7vn66lecbehz
          format: int64
        type:
          type: string
          x-stoplight:
            id: bkpapdothjik6
          description: This specifies the type of backstage env variable
          enum:
          - Config
          - Secret
      required:
      - env_name
      - type
    BackstageEnvSecretVariable:
      title: BackstageEnvSecretVariable
      x-stoplight:
        id: 3h8ht8pko3bgz
      x-discriminator-value: Secret
      allOf:
      - $ref: '#/components/schemas/BackstageEnvVariable'
        x-stoplight:
          id: qv79339cmwg5d
      - type: object
        properties:
          type:
            type: string
            enum:
            - Secret
          harness_secret_identifier:
            type: string
            x-stoplight:
              id: ah15yig0jo9yb
          is_deleted:
            type: boolean
            x-stoplight:
              id: uvmj7ylwufxzc
            default: false
        required:
        - type
        - harness_secret_identifier
      x-examples: {}
    RequestPlugin:
      x-stoplight:
        id: r5zm7ltki4p8f
      type: object
      title: RequestPluginRequest
      description: Details of the plugin being requested
      properties:
        name:
          type: string
          x-stoplight:
            id: 56azi08e1q53b
        creator:
          type: string
          x-stoplight:
            id: 595gabner523j
        package_link:
          type: string
          x-stoplight:
            id: 92ietipnvu0ta
        doc_link:
          type: string
          x-stoplight:
            id: pgttm4b0sqx6l
      required:
      - name
      - creator
      - package_link
      - doc_link
    CustomPluginInfoResponse:
      title: CustomPluginInfoResponse
      x-stoplight:
        id: r9u1gb8tlw8jm
      type: object
      properties:
        info:
          $ref: '#/components/schemas/CustomPluginDetailedInfo'
    CustomPluginInfoRequest:
      title: CustomPluginInfoRequest
      x-stoplight:
        id: szco1w9ni5gg2
      type: object
      properties:
        info:
          $ref: '#/components/schemas/CustomPluginDetailedInfo'
    PluginInfoResponse:
      title: PluginInfoResponse
      x-stoplight:
        id: bzim96q2jdydq
      type: object
      properties:
        plugin:
          $ref: '#/components/schemas/PluginInfo'
          x-stoplight:
            id: b8e9wv7c3q2hb
      required:
      - plugin
    Artifact:
      title: Artifact
      x-stoplight:
        id: 647wjmduc547h
      type: object
      description: Artifact details for custom plugin
      properties:
        type:
          type: string
          x-stoplight:
            id: jkdjdyi0psnta
          enum:
          - NPM
          - ZIP
        url:
          type: string
          x-stoplight:
            id: kmk65kswz6xuz
      required:
      - type
      - url
    PluginDetailedInfoResponse:
      title: PluginDetailedInfoResponse
      x-stoplight:
        id: yga377lrqvzo3
      type: object
      properties:
        plugin:
          $ref: '#/components/schemas/PluginDetailedInfo'
          x-stoplight:
            id: bge1kvlvygjky
      required:
      - plugin
    Exports:
      title: Exports
      x-stoplight:
        id: krtrvpv2bw4rh
      type: object
      properties:
        pages:
          type: integer
          x-stoplight:
            id: z2sng2p0ckvs4
          default: 0
        tab_contents:
          type: integer
          x-stoplight:
            id: tv8hce8pm873b
          default: 0
        cards:
          type: integer
          x-stoplight:
            id: gvkk56i32twnh
          default: 0
        default_entity_types:
          type: array
          x-stoplight:
            id: jfdg348v4fwk7
          items:
            x-stoplight:
              id: zvqn4vs5z9xa8
            type: string
        export_details:
          x-stoplight:
            id: entxahp0fgx74
          type: array
          items:
            $ref: '#/components/schemas/ExportDetails'
            x-stoplight:
              id: 0sb28udqqiknj
      required:
      - pages
      - tab_contents
      - cards
      - default_entity_types
      - export_details
  requestBodies:
    CustomPluginCreateRequest:
      content:
        application/json:
          schema:
            type: object
    CustomPluginInfoRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomPluginInfoRequest'
        application/yaml:
          schema:
            $ref: '#/components/schemas/CustomPluginInfoRequest'
    RequestPluginRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestPlugin'
      description: Details of the plugin being requested
  parameters:
    PluginId:
      name: plugin-id
      in: path
      description: Plugin Identifier
      required: true
      schema:
        type: string
    Page1:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: null
      description: "Pagination page number strategy: Specify the page number within the paginated collection related to the number of items in each page\t"
    Limit5:
      name: limit
      in: query
      required: false
      schema:
        default: null
        type: integer
      description: 'Pagination: Number of items to return'
    Meta:
      name: meta
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Custom plugin metadata
    AccountHeader5:
      name: Harness-Account
      in: header
      required: false
      schema:
        type: string
      description: Identifier field of the account the resource is scoped to.
    PluginName:
      name: plugin_name
      in: query
      required: false
      schema:
        type: string
        default: null
      description: 'Plugin name for filtering '
  responses:
    PluginInfoResponseList:
      description: Example response
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PluginInfoResponse'
        application/yaml:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PluginInfoResponse'
    CustomPluginInfoResponse:
      description: Example response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomPluginInfoResponse'
        application/yaml:
          schema:
            $ref: '#/components/schemas/CustomPluginInfoResponse'
    PluginRequestResponseList:
      description: Returns all plugin requests for an account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PluginRequestResponseList'
      headers:
        X-Total-Elements:
          schema:
            type: integer
          description: Total number of elements returned in Paginated response.
        X-Page-Number:
          schema:
            type: integer
          description: Page number in Paginated response.
        X-Page-Size:
          schema:
            type: integer
          description: Maximum page size in Paginated response.
    PluginDetailedInfoResponse:
      description: Example response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PluginDetailedInfoResponse'
        application/yaml:
          schema:
            $ref: '#/components/schemas/PluginDetailedInfoResponse'
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
