          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        pipelineId:
          type: string
          description: Harness Organization ID
          example: your_harness_pipeline
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        productId:
          type: string
          description: The Scan Product used for the Scan
          example: product111111111111111
          pattern: ^[a-zA-Z0-9_-]{22}$
        productName:
          type: string
          description: The machine name of the Scan Product (scanner), e.g. snyk. Optional; populated by endpoints that join the product table.
          example: snyk
        productPrettyName:
          type: string
          description: The human-readable display name of the Scan Product (scanner), e.g. Snyk. Optional; populated by endpoints that join the product table.
          example: Snyk
        projectId:
          type: string
          description: Harness Project ID
          example: your_harness_project
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        refinementVersion:
          type: string
          description: The Issue refinement version used for this Scan
          example: 1.0.5
        scannerDiffKey:
          type: string
          description: Key used to differentiate scanner configurations for scan comparison (e.g. sast, sca, sast_sca)
          example: sast
        stageId:
          type: string
          description: Pipeline Stage ID associated with the Scan
          example: stage_id
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        status:
          type: string
          description: Current status of the Scan
          example: Succeeded
          enum:
          - Pending
          - Running
          - Succeeded
          - Failed
        stepId:
          type: string
          description: Pipeline Step ID associated with the Scan
          example: step_id
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        subproduct:
          type: string
          description: The Scan Subproduct used for the Scan
          example: owasp
          format: binary
        targetVariantId:
          type: string
          description: The Target Variant associated with the Scan
          example: variant111111111111111
          pattern: ^[a-zA-Z0-9_-]{22}$
      example:
        artifactFingerprint: abcdef1234567890ghijkl
        codeCoverage: 65.5
        executionId: abcdef1234567890ghijkl
        gitMetadata:
          commit: '0000000000000000000000000000000000000001'
          detectedName: Aut animi provident similique dignissimos mollitia deleniti.
          detectedVariant: Asperiores velit ut.
          droneCorrelated: true
          provider: Fugiat molestiae sit.
          pullRequestNumber: 11
          repositoryHttp: https://github.com/harness/drone-cli.git
          repositoryPath:
          - Pariatur eos voluptatibus nesciunt similique dolor placeat.
          - Magnam assumenda.
          - Consectetur veniam rem ullam explicabo rerum.
          - Reiciendis labore quis et laborum nulla.
          repositorySsh: git@github.com:harness/drone-cli.git
          sourceBranch: feat/shiny-object
          targetBranch: develop
          workspace: /harness
        metadata:
          baseImageDigest: sha256:abcdef1234567890ghijkl
          baseImageName: my-image
          baseImageTag: 1.0.0
        orgId: your_harness_org
        pipelineId: your_harness_pipeline
        productId: product111111111111111
        productName: snyk
        productPrettyName: Snyk
        projectId: your_harness_project
        refinementVersion: 1.0.5
        scannerDiffKey: sast
        stageId: stage_id
        status: Succeeded
        stepId: step_id
        subproduct: owasp
        targetVariantId: variant111111111111111
      required:
      - targetVariantId
      - orgId
      - projectId
      - pipelineId
      - executionId
      - stageId
      - stepId
      - productId
      - status
      - refinementVersion
      - created
      - lastModified
    OverrideResult:
      type: object
      properties:
        created:
          type: integer
          description: Unix timestamp at which the resource was created
          example: 1651578240
          format: int64
        fieldName:
          type: string
          description: Name of the field that is being overridden
          example: severityCode
        impactedTargetId:
          type: string
          description: ID of the impacted target
          example: target1111111111111111
        originalFieldValue:
          type: string
          description: Original value of the field that is being overridden
          example: Low
        overrideFieldValue:
          type: string
          description: Value of the field that is being overridden
          example: Low
          maxLength: 1024
        overrideId:
          type: string
          description: Override Id of the override
          example: override1234
        reason:
          type: string
          description: Text describing why this override is necessary
          example: Waiting on upstream bug fix
          maxLength: 1024
        requesterEmail:
          type: string
          description: Email of the user who requested this Exemption
          example: user@harness.io
        requesterId:
          type: string
          description: User ID of the user who requested the override
          example: user111111111111111111
        requesterName:
          type: string
          description: Name of the user who requested this Exemption
          example: firstname lastname
      example:
        created: 1651578240
        fieldName: severityCode
        impactedTargetId: target1111111111111111
        originalFieldValue: Low
        overrideFieldValue: Low
        overrideId: override1234
        reason: Waiting on upstream bug fix
        requesterEmail: user@harness.io
        requesterId: user111111111111111111
        requesterName: firstname lastname
      required:
      - fieldName
      - originalFieldValue
      - overrideFieldValue
      - reason
      - created
