  /sto/api/v2/scans/latest:
    get:
      tags:
      - Scans
      summary: Get Latest Scans
      description: Get the most recent successful scan for each product/subproduct of a target variant. A single product can emit multiple subproducts (e.g. SnykCode vs snykContainer), each of which is a distinct scan stream, so the result is an array with the latest succeeded scan per (product, subproduct). The optional productId and subproduct query params narrow the result to a single product and/or subproduct. Used by scanners needing previous scan context and by UIs to show latest scan status.
      operationId: Scans#LatestScan
      parameters:
      - name: accountId
        in: query
        description: Harness Account ID
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Harness Account ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        example: abcdef1234567890ghijkl
      - name: targetVariantId
        in: query
        description: The Target Variant ID
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: The Target Variant ID
          example: abcdefghijkl1234567890
          pattern: ^[a-zA-Z0-9_-]{22}$
        example: abcdefghijkl1234567890
      - name: productId
        in: query
        description: Optional Product ID (scanner) filter. When omitted, the latest scan for every product of the target variant is returned.
        allowEmptyValue: true
        schema:
          type: string
          description: Optional Product ID (scanner) filter. When omitted, the latest scan for every product of the target variant is returned.
          example: abcdefghijkl1234567890
          pattern: ^[a-zA-Z0-9_-]{22}$
        example: abcdefghijkl1234567890
      - name: subproduct
        in: query
        description: Optional subproduct filter to disambiguate scans within a product (e.g. SnykCode vs snykContainer). When omitted, the latest scan for every subproduct is returned.
        allowEmptyValue: true
        schema:
          type: string
          description: Optional subproduct filter to disambiguate scans within a product (e.g. SnykCode vs snykContainer). When omitted, the latest scan for every subproduct is returned.
          example: SnykCode
        example: SnykCode
      - name: X-Api-Key
        in: header
        description: Harness personal or service access token
        allowEmptyValue: true
        schema:
          type: string
          description: Harness personal or service access token
          example: Voluptas mollitia nisi blanditiis nesciunt exercitationem.
        example: Aut doloribus.
