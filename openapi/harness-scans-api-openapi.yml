    IssueInScan:
      type: object
      properties:
        aiTriaged:
          type: string
          description: Aggregate AI triage verdict. 'LikelyFP' if every occurrence is FALSE_POSITIVE; 'LikelyTP' if any is TRUE_POSITIVE; 'NotEvaluatedYet' if only some are triaged. Field is absent when no occurrence has been triaged yet.
          example: LikelyFP
          enum:
          - LikelyFP
          - LikelyTP
          - NotEvaluatedYet
        aiTriagedReasoning:
          type: string
          description: Representative LLM reasoning quoted from one of the per-occurrence triaged verdicts (FP-verdict reasoning preferred). Field is absent when no occurrence has been triaged yet.
          example: The argument to path.join is __dirname, a constant, not user input.
        baseImageName:
          type: string
          description: base image name of the issue
          example: baseImageName
        baseImageOrgId:
          type: string
          description: org id of the issue from where the base image is being referred
          example: default
        baseImageProjectId:
          type: string
          description: project id of the issue from where the base image is being referred
          example: STO
        baselineVariantId:
          type: string
          description: The Baseline Target Variant related to this Security Issue
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        created:
          type: integer
          description: Unix timestamp at which the resource was created
          example: 1651578240
          format: int64
        currentStatus:
          type: string
          description: Current status of the Exemption
          example: Rejected
          enum:
          - Pending
          - Approved
          - Rejected
          - Expired
        details:
          type: object
          description: Issue details common to all occurrences
          example:
            package: json-schema
            version: v0.2.3
          additionalProperties: true
        epssLastModified:
          type: string
          description: Last date the issue EPSS data was last modified
          example: '2025-05-01'
        epssPercentile:
          type: number
          description: EPSS percentile of the issue CVE identifier
          example: 0.15
          format: double
        epssScore:
          type: number
          description: EPSS score of the issue CVE identifier
          example: 0.035
          format: double
        exemptionCoverage:
          type: string
          description: Indicates if the Security Issue was found to be Exempted or PartiallyExempted.
          example: PartiallyExempted
        exemptionId:
          type: string
          description: ID of Security Test Exemption
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        exemptionStatusAtScan:
          type: string
          description: Exemption's status at the Security Scan created time
          example: Pending
          enum:
          - Pending
          - Approved
          - Rejected
          - Expired
        exploitability:
          type: string
          description: Exploitability status of the issue (yes or no)
          example: 'yes'
        fallbackSeverityCode:
          type: string
          description: Issue-table severity code used as occurrence fallback at read time; omitted from API responses
          example: High
          enum:
          - Critical
          - High
          - Medium
          - Low
          - Info
          - Unassigned
        gitMetadata:
          $ref: '#/components/schemas/GitMetadata'
        gracePeriodDays:
          type: integer
          description: Issue-level grace period rollup in days. Only populated when scan honorGracePeriod is enabled.
          example: 13
          format: int64
        harnessAugmentation:
          type: object
          description: Harness Augmentation details
          example:
            Ad harum ullam ut.: Sint voluptatum voluptatem error rerum sit.
            Fugit veritatis inventore odit praesentium.: Hic eum.
            Illum id maxime sit sunt beatae.: Omnis quia ut.
          additionalProperties: true
        hasRules:
          type: boolean
          description: Whether the account has at least one exemption rule. When false, clients can skip exemption rule evaluation (no rule-eval loaders).
          example: true
        id:
          type: string
          description: Resource identifier
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        inGrace:
          type: boolean
          description: 'True when the displayed severity is grace-sheltered: at the display-max severity band, all non-exempt occurrences are in grace. Only populated when scan honorGracePeriod is enabled.'
          example: true
        key:
          type: string
          description: Compression/deduplication key
          example: json-schema@0.2.3
          maxLength: 512
        lastBaseImageScanAt:
          type: integer
          description: last scan timestamp of the base image being referred
          example: 1651578240
          format: int64
        numNonExemptedOccurrences:
          type: integer
          description: Indicates the number of Occurrences which dont have an active exemption on the Occurrence
          default: 0
          example: 10
          format: int32
        numOccurrences:
          type: integer
          description: Indicates the number of Occurrences on the Issue
          example: 10
          format: int32
        occurrenceId:
          type: integer
          example: 12345
          format: int64
          minimum: 1
        occurrences:
          type: array
          items:
            type: object
            example:
              Laborum velit error sint.: Totam cumque reiciendis at.
              Odit harum occaecati et.: In veritatis ut voluptatem eveniet aut.
            additionalProperties: true
          description: Array of details unique to each occurrence
          example:
          - line: '42'
          - line: '666'
        occurrencesPagination:
          $ref: '#/components/schemas/StoPagination'
        originStatus:
          type: string
          description: The status of the origin, either 'approved' or 'unapproved'
          example: approved
        origins:
          type: array
          items:
            type: string
            example: Ipsum minima odio.
