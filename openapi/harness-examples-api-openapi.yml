components:
  schemas:
    Variable:
      type: object
      properties:
        default:
          type: array
          items:
            type: string
            example: Odio fuga tenetur sed omnis illum.
          description: The values that are selected by default
          example:
          - JiraUpdate
          - HarnessApproval
        desc:
          type: string
          description: Longer description of the variable to substitute
          example: The required steps that the policy enforces
        id:
          type: string
          description: The id of the variable to substitute in the rego
          example: requiredsteps
        name:
          type: string
          description: The human readable name of the variable to substitute in the rego
          example: Required Steps
        type:
          type: string
          description: The variable type
          example: selectOne
          enum:
          - text
          - textMultiple
          - selectOne
          - selectMultiple
        values:
          type: array
          items:
            type: string
            example: Sequi architecto eos ullam rerum.
          description: Pre populated sample values to substitute the variable with
          example:
          - JiraUpdate
          - HarnessApproval
      example:
        default:
        - JiraUpdate
        - HarnessApproval
        desc: The required steps that the policy enforces
        id: requiredsteps
        name: Required Steps
        type: selectOne
        values:
        - JiraUpdate
        - HarnessApproval
    PolicyExample:
      type: object
      properties:
        desc:
          type: string
          description: Longer description of the example
          example: This is a pipeline example
        input:
          type: string
          description: Example input to illustrate the rego policy
          example: '{"message": "everyone"}'
        name:
          type: string
          description: Example name
          example: Pipeline example
        rego:
          type: string
          description: Example rego policy
          example: 'package test

            deny["should say hello world"] {input.message != "world"}'
        type:
          type: string
          description: The type of entity illustrated in this example
          example: pipeline
        variables:
          type: array
          items:
            $ref: '#/components/schemas/Variable'
          description: The list of substitutable variables in the policy example
          example:
          - default:
            - JiraUpdate
            - HarnessApproval
            desc: The required steps that the policy enforces
            id: requiredsteps
            name: Required Steps
            type: selectOne
            values:
            - JiraUpdate
            - HarnessApproval
          - default:
            - JiraUpdate
            - HarnessApproval
            desc: The required steps that the policy enforces
            id: requiredsteps
            name: Required Steps
            type: selectOne
            values:
            - JiraUpdate
            - HarnessApproval
          - default:
            - JiraUpdate
            - HarnessApproval
            desc: The required steps that the policy enforces
            id: requiredsteps
            name: Required Steps
            type: selectOne
            values:
            - JiraUpdate
            - HarnessApproval
          - default:
            - JiraUpdate
            - HarnessApproval
            desc: The required steps that the policy enforces
            id: requiredsteps
            name: Required Steps
            type: selectOne
            values:
            - JiraUpdate
            - HarnessApproval
      description: Example policies and input
      example:
        desc: This is a pipeline example
        input: '{"message": "everyone"}'
        name: Pipeline example
        rego: 'package test

          deny["should say hello world"] {input.message != "world"}'
        type: pipeline
        variables:
        - default:
          - JiraUpdate
          - HarnessApproval
          desc: The required steps that the policy enforces
          id: requiredsteps
          name: Required Steps
          type: selectOne
          values:
          - JiraUpdate
          - HarnessApproval
        - default:
          - JiraUpdate
          - HarnessApproval
          desc: The required steps that the policy enforces
          id: requiredsteps
          name: Required Steps
          type: selectOne
          values:
          - JiraUpdate
          - HarnessApproval
        - default:
          - JiraUpdate
          - HarnessApproval
          desc: The required steps that the policy enforces
          id: requiredsteps
          name: Required Steps
          type: selectOne
          values:
          - JiraUpdate
          - HarnessApproval
        - default:
          - JiraUpdate
          - HarnessApproval
          desc: The required steps that the policy enforces
          id: requiredsteps
          name: Required Steps
          type: selectOne
          values:
          - JiraUpdate
          - HarnessApproval
      required:
      - name
      - desc
      - type
      - rego
      - input
    PolicyManagementError:
      type: object
      properties:
        fault:
          type: boolean
          description: Is the error a server-side fault?
          example: true
        id:
          type: string
          description: ID is a unique identifier for this particular occurrence of the problem.
          example: 123abc
        message:
          type: string
          description: Message is a human-readable explanation specific to this occurrence of the problem.
          example: parameter 'p' must be an integer
        name:
          type: string
          description: Name is the name of this class of errors.
          example: bad_request
        temporary:
          type: boolean
          description: Is the error temporary?
          example: true
        timeout:
          type: boolean
          description: Is the error a timeout?
          example: true
      example:
        fault: false
        id: 123abc
        message: parameter 'p' must be an integer
        name: bad_request
        temporary: true
        timeout: false
      required:
      - name
      - id
      - message
      - temporary
      - timeout
      - fault
