        total_error_budget:
          type: integer
          description: Total Error Budget of the SLO. The unit is "Minutes" if the Evaluation type is Window, for Request based it's "Request".
          format: int32
        slo_target_type:
          $ref: '#/components/schemas/SLOTargetType'
        slo_type:
          $ref: '#/components/schemas/ServiceLevelObjectiveType'
        slo_target_percentage:
          type: number
          description: Target Percentage of the SLO defined by the user.
          format: double
        no_of_active_alerts:
          type: integer
          description: Number of Notification Rules defined for the SLO.
          format: int32
        evaluation_type:
          $ref: '#/components/schemas/SLIEvaluationType'
        downtime_status_details:
          $ref: '#/components/schemas/DowntimeStatusDetails'
        project_params:
          $ref: '#/components/schemas/ProjectParams'
        slo_error:
          $ref: '#/components/schemas/SLOError'
        error_budget_risk:
          type: string
          description: 'Error Budget Risk for the SLO. - It''s Healthy if Error Budget Remaining Percentage >= 75. - It''s Observe if Error Budget Remaining Percentage >= 50 < 75. - It''s Need Attention if Error Budget Remaining Percentage >= 25 < 50. - It''s Unhealthy if Error Budget Remaining Percentage >= 0 < 25. - It''s Exhausted if Error Budget Remaining Percentage < 0. '
      description: Health List View of SLO.
    MetricGraph:
      required:
      - start_time
      type: object
      properties:
        start_time:
          type: integer
          description: Start time of the Graph Values.
          format: int64
        end_time:
          type: integer
          description: End time of the Graph Values.
          format: int64
        data_points:
          type: array
          description: List of the Data points between start and end times.
          items:
            $ref: '#/components/schemas/DataPoints'
        metric_name:
          type: string
          description: 'Name of the Metric. '
        metric_identifier:
          type: string
          description: 'Identifier of the Metric. '
      description: Metric Graph
    RestResponseListSLOErrorBudgetReset:
      type: object
      properties:
        metaData:
          type: object
          additionalProperties:
            type: object
        resource:
          type: array
          items:
            $ref: '#/components/schemas/SLOErrorBudgetReset'
        responseMessages:
          type: array
          items:
            $ref: '#/components/schemas/ResponseMessage'
    CVNGLogTag:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        type:
          type: string
          enum:
          - TIMESTAMP
          - STRING
          - DEBUG
    NotificationRuleResponse:
      required:
      - notificationRule
      type: object
      properties:
        notificationRule:
          $ref: '#/components/schemas/NotificationRule'
        enabled:
          type: boolean
        createdAt:
          type: integer
          format: int64
        lastModifiedAt:
          type: integer
          format: int64
    DataPoints:
      required:
      - timestamp
      type: object
      properties:
        value:
          type: number
          description: Value of the data point.
          format: double
        timestamp:
          type: integer
          description: Timestamp of the data point.
          format: int64
      description: Representation of one data point.
    SLOTargetType:
      type: object
      properties:
        type:
          type: string
      description: Types of SLO Target Period.
    SLOErrorBudgetReset:
      type: object
      properties:
        serviceLevelObjectiveIdentifier:
          type: string
        errorBudgetIncrementPercentage:
          type: number
          format: double
        errorBudgetIncrementMinutes:
          type: integer
          format: int32
        remainingErrorBudgetAtReset:
          type: integer
          format: int32
        errorBudgetAtReset:
          type: integer
          format: int32
        reason:
          type: string
        validUntil:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
      description: This is the SLO Error Budget Reset entity defined in Harness
    UserJourney:
      type: object
      properties:
        name:
          type: string
          description: Name of the User Journey.
        identifier:
          type: string
          description: Identifier of the User Journey.
      description: User Journey Details.
    CVNGNotificationChannelSpec:
      type: object
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
