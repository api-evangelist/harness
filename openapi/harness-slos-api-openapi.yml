openapi: 3.2.0
info:
  title: Harness SL Os API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: SLOs
  description: This contains APIs related to CRUD operations of SLOs
paths:
  /cv/api/slo/{identifier}/errorBudgetResetHistory:
    get:
      tags:
      - SLOs
      summary: Get Error budget reset history
      operationId: getErrorBudgetResetHistory
      parameters:
      - name: accountId
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: identifier
        in: path
        description: SLO identifier for the entity
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/CvError'
        default:
          description: Gets the error budget reset history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseListSLOErrorBudgetReset'
  /cv/api/slo/{identifier}/notification-rules:
    get:
      tags:
      - SLOs
      summary: Get notification rules for SLO
      operationId: getNotificationRulesForSLO
      parameters:
      - name: accountId
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: identifier
        in: path
        description: SLO identifier for the entity
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/CvError'
        default:
          description: Gets the notification rules for SLO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseNotificationRuleResponse'
  /cv/api/slo/{identifier}/logs:
    get:
      tags:
      - SLOs
      summary: Get SLO logs
      operationId: getServiceLevelObjectiveLogs
      parameters:
      - name: accountId
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: identifier
        in: path
        description: SLO identifier for the entity
        required: true
        schema:
          type: string
      - name: logType
        in: query
        required: true
        schema:
          type: string
          enum:
          - ApiCallLog
          - ExecutionLog
      - name: errorLogsOnly
        in: query
        schema:
          type: boolean
      - name: startTime
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: pageNumber
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/CvError'
        default:
          description: Gets the SLO's logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponsePageResponseCVNGLog'
  /cv/api/slo/{identifier}/resetErrorBudget:
    post:
      tags:
      - SLOs
      summary: Reset Error budget history
      operationId: resetErrorBudget
      parameters:
      - name: accountId
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: identifier
        in: path
        description: SLO identifier for the entity
        required: true
        schema:
          type: string
      requestBody:
        description: Details needed to reset error budget
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/SLOErrorBudgetReset'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/CvError'
        default:
          description: Reset Error budget history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseSLOErrorBudgetReset'
  /cv/api/v1/orgs/{org}/projects/{project}/metric-graph/{slo-identifier}:
    get:
      tags:
      - SLOs
      summary: Get Metric Graph For SLO
      description: Get Underlying Metrics Graph for SLO
      operationId: getMetricGraphForSLO
      parameters:
      - name: org
        in: path
        description: Organization identifier
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project identifier
        required: true
        schema:
          type: string
      - name: slo-identifier
        in: path
        description: SLO identifier.
        required: true
        schema:
          type: string
      - name: start_time
        in: query
        description: 'Start Time for the metric graphs. '
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: End Time for the metric graphs.
        schema:
          type: integer
          format: int64
      - name: Harness-Account
        in: header
        description: Identifier field of the account the resource is scoped to. This is required for Authorization methods other than the x-api-key header. If you are using the x-api-key header, this can be skipped.
        schema:
          type: string
      responses:
        '200':
          description: Metric Graph response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricGraph'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
      security:
      - x-api-key: []
  /cv/api/v1/orgs/{org}/projects/{project}/slo:
    get:
      tags:
      - SLOs
      summary: List SLOs
      description: Returns a list of Service Level Objectives
      operationId: listSlo
      parameters:
      - name: org
        in: path
        description: Organization identifier
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project identifier
        required: true
        schema:
          type: string
      - name: Harness-Account
        in: header
        description: Identifier field of the account the resource is scoped to. This is required for Authorization methods other than the x-api-key header. If you are using the x-api-key header, this can be skipped.
        schema:
          type: string
      - name: page
        in: query
        description: 'Pagination page number strategy: Specify the page number within the paginated collection related to the number of items on each page.'
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: 'Pagination: Number of items to return.'
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 20
      - name: composite_slo_identifier
        in: query
        description: Identifier for the Composite SLO for which underlying SLOs needs to be listed.
        schema:
          type: string
      - name: monitored_service_identifier
        in: query
        description: For filtering on the basis of monitored service identifier
        schema:
          type: string
      - name: user_journey_identifiers
        in: query
        description: List of User Journey identifiers on the basis of which the SLOs are filtered.
        schema:
          type: array
          items:
            type: string
      - name: filter
        in: query
        description: SLO Name on the basis of which the SLOs are filtered.
        schema:
          pattern: ^[a-zA-Z_][0-9a-zA-Z-_ ]{0,127}$
          type: string
      - name: slo_type
        in: query
        description: SLO Types on the basis of which the SLOs are filtered.
        schema:
          maxLength: 1024
          minLength: 0
          type: string
      - name: env_identifiers
        in: query
        description: Identifiers of Environments on the basis of which the SLOs are filtered.
        schema:
          maxItems: 128
          minItems: 0
          type: array
          items:
            type: string
      - name: target_types
        in: query
        description: Target Types on the basis of which the SLOs are filtered.
        schema:
          type: array
          items:
            type: string
      - name: error_budget_risks
        in: query
        description: Error Budgets on the basis of which the SLOs are filtered.
        schema:
          type: array
          items:
            type: string
      - name: evaluation_type
        in: query
        description: Evaluation Type on the basis of which the SLOs are filtered.
        schema:
          type: string
      - name: child_resource
        in: query
        description: For filtering the simple slo&#x27;s on the basis of accountId. Set it to true for Account Level SLOs.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: SLO List Response body
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SLOHealthListView'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
        '502':
          description: Bad Gateway
      security:
      - x-api-key: []
components:
  schemas:
    RestResponseSLOErrorBudgetReset:
      type: object
      properties:
        metaData:
          type: object
          additionalProperties:
            type: object
        resource:
          $ref: '#/components/schemas/SLOErrorBudgetReset'
        responseMessages:
          type: array
          items:
            $ref: '#/components/schemas/ResponseMessage'
    ResponseDTOPageResponseNotificationRuleResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
          - ERROR
        data:
          $ref: '#/components/schemas/PageResponseNotificationRuleResponse'
        metaData:
          type: object
        correlationId:
          type: string
    NotificationRuleCondition:
      required:
      - spec
      type: object
      properties:
        type:
          type: string
          enum:
          - ErrorBudgetRemainingPercentage
          - ErrorBudgetRemainingMinutes
          - SLIValue
          - ErrorBudgetBurnRate
          - ChangeImpact
          - HealthScore
          - ChangeObserved
          - CodeErrors
          - FireHydrantReport
          - DeploymentImpactReport
