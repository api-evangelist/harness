openapi: 3.2.0
info:
  title: Harness Config For Project API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: ConfigForProject
paths:
  /gateway/ssca-manager/v1/org/{org}/project/{project}/ssca-config/{config-id}:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - schema:
        type: string
      name: config-id
      in: path
      required: true
      description: Config ID
    get:
      summary: Get Config By ID
      responses:
        '200':
          $ref: '#/components/responses/ConfigResponseBody'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      operationId: getConfigById
      x-stoplight:
        id: 91ruzzd1vqr6e
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      tags:
      - ConfigForProject
    put:
      summary: Update Config By ID
      operationId: updateConfigById
      responses:
        '200':
          $ref: '#/components/responses/SaveResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      x-stoplight:
        id: 12tag1uia7n1b
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      requestBody:
        $ref: '#/components/requestBodies/ConfigRequestBody'
      tags:
      - ConfigForProject
