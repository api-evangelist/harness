          type: string
          example: pipeline1,pipeline2
          pattern: ^([a-zA-Z0-9_-]+)(,[a-zA-Z0-9_-]+)*$
        reasons:
          type: string
          example: Acceptable Risk,False Positive
          pattern: ^(Other|Fix Unavailable|Compensating Controls|False Positive|Acceptable Risk|Acceptable Use)(,Other|,Fix Unavailable|,Compensating Controls|,False Positive|,Acceptable Risk|,Acceptable Use)*$
        rejectedBy:
          type: string
          example: user1111111111111111,user2222222222222222
          pattern: ^([a-zA-Z0-9_-]{22})(,[a-zA-Z0-9_-]{22})*$
        requestedBy:
          type: string
          example: user1111111111111111,user2222222222222222
          pattern: ^([a-zA-Z0-9_-]{22})(,[a-zA-Z0-9_-]{22})*$
        scanners:
          type: string
          example: snyk,owasp
          pattern: ^([a-zA-Z0-9_-]+)(,[a-zA-Z0-9_-]+)*$
        scopes:
          type: string
          example: PROJECT,PIPELINE
          pattern: ^(ACCOUNT|ORG|PROJECT|PIPELINE|TARGET)(,ACCOUNT|,ORG|,PROJECT|,PIPELINE|,TARGET)*$
        severityCodes:
          type: string
          example: Critical,High,Medium
          pattern: ^(Critical|High|Medium|Low|Info)(,Critical|,High|,Medium|,Low|,Info)*$
        targetIds:
          type: string
          example: target1111111111111111,target2222222222222222
          pattern: ^([a-zA-Z0-9_-]{22})(,[a-zA-Z0-9_-]{22})*$
        targetTypes:
          type: string
          example: repository,container
          pattern: ^(repository|container|instance|configuration)(,repository|,container|,instance|,configuration)*$
      example:
        approvedBy: user1111111111111111,user2222222222222222
        issueTypes: SAST,SCA
        orgProjectFilter:
        - org1:project1
        - org1:project2
        pipelineIds: pipeline1,pipeline2
        reasons: Acceptable Risk,False Positive
        rejectedBy: user1111111111111111,user2222222222222222
        requestedBy: user1111111111111111,user2222222222222222
        scanners: snyk,owasp
        scopes: PROJECT,PIPELINE
        severityCodes: Critical,High,Medium
        targetIds: target1111111111111111,target2222222222222222
        targetTypes: repository,container
