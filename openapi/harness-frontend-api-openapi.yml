openapi: 3.2.0
info:
  title: Harness Frontend API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Frontend
  description: Endpoints that power the STO micro-frontend
paths:
  /sto/api/v2/frontend/all-issues/filters:
    x-internal: true
    get:
      description: Provide list of filters for a projects latest baseline scans
      operationId: Frontend#AllIssuesFilters
      parameters:
      - allowEmptyValue: true
        description: Harness Account ID
        example: abcdef1234567890ghijkl
        in: query
        name: accountId
        required: true
        schema:
          description: Harness Account ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
      - allowEmptyValue: true
        description: Harness Organization ID
        example: example_org
        in: query
        name: orgId
        required: true
        schema:
          description: Harness Organization ID
          example: example_org
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      - allowEmptyValue: true
        description: Harness Project ID
        example: example_project
        in: query
        name: projectId
        required: true
        schema:
          description: Harness Project ID
          example: example_project
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                exploitabilityFlag: true
                issueCategories:
                - Insecure Direct Object Reference (AI SAST)
                - SQL Injection
                latestBaselineScans:
                - pipelineId: pipeline_1
                  scanTool: owasp
                  scanToolName: OWASP
                  targetId: abcdef1234567890ghijkl
                  targetName: The Target
                  targetType: repository
                - pipelineId: pipeline_1
                  scanTool: owasp
                  scanToolName: OWASP
                  targetId: abcdef1234567890ghijkl
                  targetName: The Target
                  targetType: repository
                - pipelineId: pipeline_1
                  scanTool: owasp
                  scanToolName: OWASP
                  targetId: abcdef1234567890ghijkl
                  targetName: The Target
                  targetType: repository
                - pipelineId: pipeline_1
                  scanTool: owasp
                  scanToolName: OWASP
                  targetId: abcdef1234567890ghijkl
                  targetName: The Target
                  targetType: repository
                reachabilityFlag: true
              schema:
                $ref: '#/components/schemas/AllIssuesFiltersResult'
          description: OK response.
        '400':
          content:
            application/json:
              example:
                message: 'Bad Request: accountId parameter is required'
                status: 400
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'BadRequest: Bad Request response.'
        '401':
          content:
            application/json:
              example:
                message: Unauthorized
                status: 401
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'Unauthorized: Unauthorized response.'
        '403':
          content:
            application/json:
              example:
                message: Forbidden
                status: 403
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'Forbidden: Forbidden response.'
        '404':
          content:
            application/json:
              example:
                message: Not Found
                status: 404
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'NotFound: Not Found response.'
        '429':
          content:
            application/json:
              example:
                message: Too Many Requests
                status: 429
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'TooManyRequests: Too Many Requests response.'
        '500':
          content:
            application/json:
              example:
                message: Internal Server Error
                status: 500
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'InternalServerError: Internal Server Error response.'
      security:
      - jwt_header_Authorization:
        - sto_issue_view
      tags:
      - Frontend
      summary: Frontend#All issues filters
      x-summary-source: derived
  /sto/api/v2/frontend/all-issues/issues:
    x-internal: true
    get:
      description: Provides a paginated list of issues for a project found in the latest baseline scans
      operationId: Frontend#AllIssuesList
      parameters:
      - allowEmptyValue: true
        description: Harness Account ID
        example: abcdef1234567890ghijkl
        in: query
        name: accountId
        required: true
        schema:
          description: Harness Account ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
      - allowEmptyValue: true
        description: Harness Organization ID
        example: example_org
        in: query
        name: orgId
        required: true
        schema:
          description: Harness Organization ID
          example: example_org
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      - allowEmptyValue: true
        description: Harness Project ID
        example: example_project
        in: query
        name: projectId
        required: true
        schema:
          description: Harness Project ID
          example: example_project
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      - allowEmptyValue: true
        description: Page number to fetch (starting from 0)
        example: 4
        in: query
        name: page
        schema:
          default: 0
          description: Page number to fetch (starting from 0)
          example: 4
          format: int64
          minimum: 0
          type: integer
      - allowEmptyValue: true
        description: Number of results per page
        example: 50
        in: query
        name: pageSize
        schema:
          default: 30
          description: Number of results per page
          example: 50
          format: int64
          maximum: 100
          minimum: 1
          type: integer
      - allowEmptyValue: true
        example: target1111111111111111,abcdef1234567890abcdef
        in: query
        name: targetIds
        schema:
          example: target1111111111111111,abcdef1234567890abcdef
          pattern: ^([a-zA-Z0-9_-]{22})(,[a-zA-Z0-9_-]{22})*$
          type: string
      - allowEmptyValue: true
        example: repository,container
        in: query
        name: targetTypes
        schema:
          example: repository,container
          pattern: ^(repository|container|instance|configuration)(,repository|,container|,instance|,configuration)*$
          type: string
      - allowEmptyValue: true
        example: pipeline1,pipeline2
        in: query
        name: pipelineIds
        schema:
          example: pipeline1,pipeline2
          pattern: ^([a-zA-Z0-9_-]+)(,[a-zA-Z0-9_-]+)*$
          type: string
      - allowEmptyValue: true
        example: owasp,zap
        in: query
        name: scanTools
        schema:
          example: owasp,zap
          pattern: ^([a-zA-Z0-9_-]+)(,[a-zA-Z0-9_-]+)*$
          type: string
      - allowEmptyValue: true
        example: Critical,High,Medium
        in: query
        name: severityCodes
        schema:
          example: Critical,High,Medium
          pattern: ^(Critical|High|Medium|Low|Info)(,Critical|,High|,Medium|,Low|,Info)*$
          type: string
      - allowEmptyValue: true
        example: None,Pending,Rejected,Expired,PartiallyExempted
        in: query
        name: exemptionStatuses
        schema:
          example: None,Pending,Rejected,Expired,PartiallyExempted
          pattern: ^(None|Pending|Approved|Rejected|Expired|PartiallyExempted)(,None|,Pending|,Approved|,Rejected|,Expired|,PartiallyExempted)*$
          type: string
      - allowEmptyValue: true
        description: Filter issues by whether their severity has been overridden. Use 'Yes,No' for all issues.
        example: 'Yes'
        in: query
        name: severityOverriden
        schema:
          default: Yes,No
          description: Filter issues by whether their severity has been overridden. Use 'Yes,No' for all issues.
          example: 'Yes'
          pattern: ^(Yes|No)(,Yes|,No)*$
          type: string
      - allowEmptyValue: true
        example: CWE-123
        in: query
        name: search
        schema:
          example: CWE-123
          maxLength: 256
          type: string
      - allowEmptyValue: true
        description: Return only the baseline issue with this exact issue ID. Intended for deeplink targeting (e.g. opening the issue details side panel from a JIRA ticket); not exposed in the UI search box and applied independently of the free-text 'search' filter.
        example: abcdef1234567890abcdef
        in: query
        name: searchById
        schema:
          description: Return only the baseline issue with this exact issue ID. Intended for deeplink targeting (e.g. opening the issue details side panel from a JIRA ticket); not exposed in the UI search box and applied independently of the free-text 'search' filter.
          example: abcdef1234567890abcdef
          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
      - allowEmptyValue: true
        example: SAST
        in: query
        name: issueTypes
        schema:
          example: SAST
          pattern: ^(SAST|DAST|SCA|IAC|SECRET|MISCONFIG|BUG_SMELLS|CODE_SMELLS|CODE_COVERAGE|EXTERNAL_POLICY|UNKNOWN)(,SAST|,DAST|,SCA|,IAC|,SECRET|,MISCONFIG|,BUG_SMELLS|,CODE_SMELLS|,CODE_COVERAGE|,EXTERNAL_POLICY|,UNKNOWN)*$
          type: string
      - allowEmptyValue: true
        example: Active,Exempted,Remediated
        in: query
        name: statuses
        schema:
          example: Active,Exempted,Remediated
          pattern: ^(Active|Exempted|Remediated)(,Active|,Exempted|,Remediated)*$
          type: string
      - allowEmptyValue: true
        description: Filter by reachability status. 'reachable' shows issues with any reachable occurrence. 'unknown-reachability' shows issues where all occurrences are unreachable or have no reachability data.
        example: reachable
        in: query
        name: reachability
        schema:
          description: Filter by reachability status. 'reachable' shows issues with any reachable occurrence. 'unknown-reachability' shows issues where all occurrences are unreachable or have no reachability data.
          example: reachable
          pattern: ^(reachable|unknown-reachability)(,reachable|,unknown-reachability)*$
          type: string
      - allowEmptyValue: true
        description: Filter by exploitability status. 'yes' shows issues with any exploitable occurrence. 'no' shows issues where no occurrence is exploitable.
        example: 'yes'
        in: query
        name: exploitability
        schema:
          description: Filter by exploitability status. 'yes' shows issues with any exploitable occurrence. 'no' shows issues where no occurrence is exploitable.
          example: 'yes'
          pattern: ^(yes|no)(,yes|,no)*$
          type: string
      - allowEmptyValue: true
        description: Filter by AI triage verdict. Comma-separated list of enum values ('LikelyFP', 'LikelyTP', 'NotEvaluatedYet') or UI labels ('Likely FP', 'Likely TP', 'Not Evaluated Yet'). Issues with no triage data are excluded when this filter is set.
        example: Likely FP
        in: query
        name: aiTriaged
        schema:
          description: Filter by AI triage verdict. Comma-separated list of enum values ('LikelyFP', 'LikelyTP', 'NotEvaluatedYet') or UI labels ('Likely FP', 'Likely TP', 'Not Evaluated Yet'). Issues with no triage data are excluded when this filter is set.
          example: Likely FP
          pattern: ^(LikelyFP|LikelyTP|NotEvaluatedYet|Likely FP|Likely TP|Not Evaluated Yet)(,(LikelyFP|LikelyTP|NotEvaluatedYet|Likely FP|Likely TP|Not Evaluated Yet))*$
          type: string
      - allowEmptyValue: true
        description: Filter by Qwiet AI issue category from issue.details.category. Comma-separated. Use NA for issues without a category.
        example: Insecure Direct Object Reference (AI SAST),NA
        in: query
        name: categories
        schema:
          description: Filter by Qwiet AI issue category from issue.details.category. Comma-separated. Use NA for issues without a category.
          example: Insecure Direct Object Reference (AI SAST),NA
          maxLength: 4096
          type: string
      - allowEmptyValue: true
        description: 'EPSS Probability filter (single select): all (no filter), gte_15 (>=15%), gte_5 (>=5%), gte_1 (>=1%), na (N/A - No EPSS data)'
        example: gte_15
        in: query
        name: epss
        schema:
          description: 'EPSS Probability filter (single select): all (no filter), gte_15 (>=15%), gte_5 (>=5%), gte_1 (>=1%), na (N/A - No EPSS data)'
          example: gte_15
          pattern: ^(all|gte_15|gte_5|gte_1|na)$
          type: string
      - allowEmptyValue: true
        description: 'EPSS Percentile filter (single select): all (no filter), gte_99 (>=99th), gte_90 (>=90th), gte_80 (>=80th), na (N/A - No EPSS data)'
        example: gte_99
        in: query
        name: epssPercentile
        schema:
          description: 'EPSS Percentile filter (single select): all (no filter), gte_99 (>=99th), gte_90 (>=90th), gte_80 (>=80th), na (N/A - No EPSS data)'
          example: gte_99
          pattern: ^(all|gte_99|gte_90|gte_80|na)$
          type: string
      - allowEmptyValue: true
        description: 'CISA KEV catalog filter (multi-select, OR within): all (no filter), true (in KEV catalog), false (not in KEV catalog, including no CVE refs)'
        example: 'true'
        in: query
        name: inKev
        schema:
          description: 'CISA KEV catalog filter (multi-select, OR within): all (no filter), true (in KEV catalog), false (not in KEV catalog, including no CVE refs)'
          example: 'true'
          pattern: ^(all|true|false)(,true|,false)*$
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                hasRules: true
                issues:
                - aiTriaged: LikelyFP
                  epssLastModified: '2025-05-01'
                  epssPercentile: 0.15
                  epssScore: 0.035
