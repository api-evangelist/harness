    ImpactedTargetV2:
      type: object
      properties:
        aiTriaged:
          type: string
          description: Aggregate AI triage verdict. 'LikelyFP' if every occurrence is FALSE_POSITIVE; 'LikelyTP' if any is TRUE_POSITIVE; 'NotEvaluatedYet' if only some are triaged. Field is absent when no occurrence has been triaged yet.
          example: LikelyFP
          enum:
          - LikelyFP
          - LikelyTP
          - NotEvaluatedYet
        aiTriagedReasoning:
          type: string
          description: Representative LLM reasoning quoted from one of the per-occurrence triaged verdicts (FP-verdict reasoning preferred). Field is absent when no occurrence has been triaged yet.
          example: The argument to path.join is __dirname, a constant, not user input.
        executionId:
          type: string
          description: Harness Execution ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        exemptionId:
          type: string
          description: ID of Security Test Exemption
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        exemptionStatus:
          type: string
          description: Status of project scoped exemption for this issue
          example: Pending
        exploitability:
          type: string
          description: Exploitability status of the issue for this target. 'yes' if any occurrence is exploitable, 'no' if all are not exploitable.
          example: 'yes'
        id:
          type: string
          description: The ID of the impacted target
          example: target1111111111111111
        lastDetected:
          type: integer
          description: Timestamp of the last detection of this issue
          example: 1634836529
          format: int64
        name:
          type: string
          description: The name of the impacted target
          example: The Target Name
        numOccurrences:
          type: integer
          description: Indicates the number of Occurrences on the Issue
          example: 10
          format: int64
        pipelineId:
          type: string
          description: Harness Pipeline ID
          example: example_pipeline
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        reachability:
          type: string
          description: Reachability status of the issue for this target. 'reachable' if any occurrence is reachable, 'unreachable' if all are unreachable.
          example: reachable
        status:
          type: string
          description: Issue Status
          example: Remediated
          enum:
          - Active
          - Exempted
          - Remediated
        userEmail:
          type: string
          description: The email associated with the user id
          example: user@gmail.com
        userId:
          type: string
          description: The user id associated with the last scan run
          example: Ea nobis sit.
        userName:
          type: string
          description: The user name associated with the user id
          example: firstname lastname
        variantName:
          type: string
          description: Variant name
          example: Repellat illo ut repellat enim consectetur ullam.
