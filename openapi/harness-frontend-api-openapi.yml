  /sto/api/v2/frontend/all-issues/issues/{issueId}:
    x-internal: true
    get:
      description: Provides issue details for a project's latest baseline scans
      operationId: Frontend#AllIssuesDetails
      parameters:
      - allowEmptyValue: true
        description: Harness Account ID
        example: abcdef1234567890ghijkl
        in: query
        name: accountId
        required: true
        schema:
          description: Harness Account ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
      - allowEmptyValue: true
        description: Harness Organization ID
        example: example_org
        in: query
        name: orgId
        required: true
        schema:
          description: Harness Organization ID
          example: example_org
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      - allowEmptyValue: true
        description: Harness Project ID
        example: example_project
        in: query
        name: projectId
        required: true
        schema:
          description: Harness Project ID
          example: example_project
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      - allowEmptyValue: true
        example: None,Pending,Rejected,Expired,PartiallyExempted
        in: query
        name: exemptionStatuses
        schema:
          example: None,Pending,Rejected,Expired,PartiallyExempted
          pattern: ^(None|Pending|Approved|Rejected|Expired|PartiallyExempted)(,None|,Pending|,Approved|,Rejected|,Expired|,PartiallyExempted)*$
          type: string
      - allowEmptyValue: true
        example: A Target Name
        in: query
        name: search
        schema:
          example: A Target Name
          maxLength: 256
          type: string
      - allowEmptyValue: true
        description: Page number to fetch (starting from 0)
        example: 4
        in: query
        name: page
        schema:
          default: 0
          description: Page number to fetch (starting from 0)
          example: 4
          format: int64
          minimum: 0
          type: integer
      - allowEmptyValue: true
        description: Number of results per page
        example: 50
        in: query
        name: pageSize
        schema:
          default: 30
          description: Number of results per page
          example: 50
          format: int64
          maximum: 100
          minimum: 1
          type: integer
      - description: The ID of the Security Issue
        example: abcdef1234567890ghijkl
        in: path
        name: issueId
        required: true
        schema:
          description: The ID of the Security Issue
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
