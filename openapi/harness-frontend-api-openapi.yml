        name: The Target Name
        numOccurrences: 10
        pipelineId: example_pipeline
        reachability: reachable
        status: Remediated
        userEmail: user@gmail.com
        userId: Aut quod.
        userName: firstname lastname
        variantName: Hic omnis esse.
