openapi: 3.2.0
info:
  title: Harness Remediation API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Remediation
paths:
  /v1/orgs/{org}/projects/{project}/remediations:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    post:
      summary: Create Remediation Tracker
      tags:
      - Remediation
      responses:
        '200':
          $ref: '#/components/responses/RemediationTrackerCreateResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      operationId: createRemediationTracker
      x-stoplight:
        id: 8cdxntj5aqlu3
      description: Create Remediation Tracker.
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      requestBody:
        $ref: '#/components/requestBodies/RemediationTrackerCreateRequestBody'
  /v1/orgs/{org}/projects/{project}/remediations/list:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    post:
      summary: List All Remediation Trackers
      operationId: listRemediations
      responses:
        '200':
          $ref: '#/components/responses/RemediationListingResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      tags:
      - Remediation
      description: List all Remediation Trackers.
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          enum:
          - component
          - status
          - targetDate
          - contactName
          - cve
          - startTimeMilli
          default: startTimeMilli
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: order
        schema:
          enum:
          - DESC
          - ASC
          default: DESC
      security:
      - x-api-key: []
      requestBody:
        $ref: '#/components/requestBodies/RemediationListingRequestBody'
      x-stoplight:
        id: eb3hi5al80vx3
  /v1/orgs/{org}/projects/{project}/remediations/{remediation}:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - schema:
        type: string
      name: remediation
      in: path
      required: true
      description: Remediation Tracker ID
    put:
      summary: Update Remediation Tracker
      operationId: updateRemediationTracker
      responses:
        '200':
          $ref: '#/components/responses/RemediationTrackerUpdateResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      x-stoplight:
        id: w3z2s74z0zoeo
      tags:
      - Remediation
      description: Update Remediation Tracker.
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      requestBody:
        $ref: '#/components/requestBodies/RemediationTrackerUpdateRequestBody'
  /v1/orgs/{org}/projects/{project}/remediations/overall-summary:
