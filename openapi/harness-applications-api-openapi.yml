openapi: 3.2.0
info:
  title: Harness Applications API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Applications
paths:
  /gitops/api/v1/agents/{agentIdentifier}/applications:
    get:
      summary: List applications for a specific agent
      description: List returns a list of applications for a specific agent.
      operationId: AgentApplicationService_List
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationsApplicationList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: query.name
        description: the application's name.
        in: query
        required: false
        schema:
          type: string
      - name: query.refresh
        description: 'set to "normal" OR "hard" if an application refresh is required before fetching.


          normal refresh only if source has changed(commit, helm chart version, etc.)


          hard refresh will invalidate all generated manifest caches and force regeneration.'
        in: query
        required: false
        schema:
          type: string
      - name: query.project
        description: the project names to restrict returned list applications.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.resourceVersion
        description: when specified with a watch call, shows changes that occur after that particular version of a resource.
        in: query
        required: false
        schema:
          type: string
      - name: query.selector
        description: the selector to to restrict returned list to applications only with matched labels.
        in: query
        required: false
        schema:
          type: string
      - name: query.repo
        description: the repoURL to restrict returned list applications.
        in: query
        required: false
        schema:
          type: string
      - name: query.appNamespace
        in: query
        required: false
        schema:
          type: string
      - name: fetchFromHarness
        description: fetchFromHarness is used in Get Application API to fetch application directly from mongodb instead of from agent. Use in Get Application API to fetch application directly from harness. This is already the fallback if the task times out on Gitops Agent. Use with caution as this may not return the latest state of application.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Applications
    post:
      summary: Create an application
      description: Create creates a new application in the specified project.
      operationId: AgentApplicationService_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Application'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: clusterIdentifier
        in: query
        required: false
        schema:
          type: string
      - name: repoIdentifier
        in: query
        required: false
        schema:
          type: string
      - name: skipRepoValidation
        in: query
        required: false
        schema:
          type: boolean
      - name: repoIdentifiers
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationsApplicationCreateRequest'
        required: true
      tags:
      - Applications
