        message:
          type: string
          title: Message is a human-readable informational message describing the health status
        lastTransitionTime:
          $ref: '#/components/schemas/v1Time'
      title: HealthStatus contains information about the currently observed health state of a resource
    gitopsservicev1NamespaceList:
      type: object
      properties:
        namespaces:
          type: array
          items:
            $ref: '#/components/schemas/gitopsservicev1Namespace'
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
        pageItemCount:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        pageIndex:
          type: integer
          format: int32
        empty:
          type: boolean
