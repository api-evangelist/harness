          text/html:
            schema:
              $ref: '#/components/schemas/ConnectorFilterProperties'
          text/plain:
            schema:
              $ref: '#/components/schemas/ConnectorFilterProperties'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
