        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: connectorType
        in: query
        description: Connector type
        required: true
        schema:
          type: string
          enum:
          - K8sCluster
          - Git
          - Splunk
          - AppDynamics
          - Prometheus
          - Dynatrace
          - Vault
          - AzureKeyVault
          - DockerRegistry
          - Local
          - AwsKms
          - GcpKms
          - AwsSecretManager
          - Gcp
          - Aws
          - Azure
          - Artifactory
          - Jira
          - Jsm
          - Nexus
          - Github
          - Gitlab
          - Bitbucket
          - Codecommit
          - CEAws
          - CEAzure
          - GcpCloudCost
          - CEK8sCluster
          - HttpHelmRepo
          - NewRelic
          - Datadog
          - SumoLogic
          - PagerDuty
          - CustomHealth
          - ServiceNow
          - ErrorTracking
          - Pdc
          - AzureRepo
          - Jenkins
          - OciHelmRepo
          - CustomSecretManager
          - ElasticSearch
          - GcpSecretManager
          - AzureArtifacts
          - Tas
          - Spot
          - Bamboo
          - TerraformCloud
          - SignalFX
          - Harness
          - Rancher
