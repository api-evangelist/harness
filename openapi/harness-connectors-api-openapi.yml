openapi: 3.2.0
info:
  title: Harness Connectors API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Connectors
  description: This contains APIs related to Connectors as defined in Harness
paths:
  /ng/api/connectors/ccmK8sList:
    post:
      tags:
      - Connectors
      summary: Fetches the list of CCM K8S Connectors corresponding to the request's filter…
      operationId: getCCMK8SConnectorList
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: searchTerm
        in: query
        description: This would be used to filter Connectors. Any Connector having the specified string in its Name, ID and Tag would be filtered.
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: filterIdentifier
        in: query
        schema:
          type: string
      - name: includeAllConnectorsAvailableAtScope
        in: query
        description: Specify whether or not to include all the Connectors accessible at the scope. For eg if set as true, at the Project scope we will get org and account Connector also in the response
        schema:
          type: boolean
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      - name: getDistinctFromBranches
        in: query
        description: This when set to true along with GitSync enabled for the Connector, you can get one connector entity from each identifier. The connector entity can belong to any branch
        schema:
          type: boolean
      - name: pageIndex
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: 'Results per page(max 100)Default Value: 50'
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 50
      - name: sortOrders
        in: query
        description: Sort criteria for the elements.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SortOrder'
      - name: pageToken
        in: query
        description: 'Page Token of the next results to fetch.Default Value: '''''
        schema:
          type: string
      requestBody:
        description: Details of the filters applied
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorFilterProperties'
          text/yaml:
            schema:
              $ref: '#/components/schemas/ConnectorFilterProperties'
          text/html:
            schema:
              $ref: '#/components/schemas/ConnectorFilterProperties'
          text/plain:
            schema:
              $ref: '#/components/schemas/ConnectorFilterProperties'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the list of Connectors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseCcmK8sConnectorResponse'
            text/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseCcmK8sConnectorResponse'
            text/html:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseCcmK8sConnectorResponse'
  /ng/api/connectors:
    get:
      tags:
      - Connectors
      summary: List all Connectors using filters
      description: Lists all the Connectors matching the specified filters.
      operationId: getConnectorList
      parameters:
      - name: pageIndex
        in: query
        description: Page number of navigation. By default, it is set to 0.
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: Number of entries per page.The default number of entries per page is 100, while the maximum number allowed is 1000.
        schema:
          maximum: 1000
          type: integer
          format: int32
          default: 100
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: searchTerm
        in: query
        description: This would be used to filter Connectors. Any Connector having the specified string in its Name, ID and Tag would be filtered.
        schema:
          type: string
      - name: type
        in: query
        description: Filter Connectors by type
        schema:
          type: string
          enum:
          - K8sCluster
          - Git
          - Splunk
          - AppDynamics
          - Prometheus
          - Dynatrace
          - Vault
          - AzureKeyVault
          - DockerRegistry
          - Local
          - AwsKms
          - GcpKms
          - AwsSecretManager
          - Gcp
          - Aws
          - Azure
          - Artifactory
          - Jira
          - Jsm
          - Nexus
          - Github
          - Gitlab
          - Bitbucket
          - Codecommit
          - CEAws
          - CEAzure
          - GcpCloudCost
          - CEK8sCluster
          - HttpHelmRepo
          - NewRelic
          - Datadog
          - SumoLogic
          - PagerDuty
          - CustomHealth
          - ServiceNow
          - ErrorTracking
          - Pdc
          - AzureRepo
          - Jenkins
          - OciHelmRepo
          - CustomSecretManager
          - ElasticSearch
          - GcpSecretManager
          - AzureArtifacts
          - Tas
          - Spot
          - Bamboo
          - TerraformCloud
          - SignalFX
          - Harness
          - Rancher
          - JDBC
          - Zoom
          - MsTeams
          - Confluence
          - Slack
          - Salesforce
          - LangSmith
          - MLFlow
          - OpsGenie
          - GithubMcp
          - Mcp
          - OpenAI
          - Cursor
          - Devin
          - GithubCopilot
          - Anthropic
          - GoogleChat
          - XMatters
          - CustomHttp
      - name: category
        in: query
        description: Filter Connectors by category
        schema:
          type: string
          enum:
          - CLOUD_PROVIDER
          - SECRET_MANAGER
          - CLOUD_COST
          - ARTIFACTORY
          - CODE_REPO
          - MONITORING
          - TICKETING
          - DATABASE
          - COMMUNICATION
          - DOCUMENTATION
          - ML_OPS
          - MCP
          - AI
          - CUSTOM
      - name: source_category
        in: query
        description: Filter Connectors by Source Category. Available Source Categories are CLOUD_PROVIDER, SECRET_MANAGER, CLOUD_COST, ARTIFACTORY, CODE_REPO,  MONITORING and TICKETING
        schema:
          type: string
          enum:
          - CLOUD_PROVIDER
          - SECRET_MANAGER
          - CLOUD_COST
          - ARTIFACTORY
          - CODE_REPO
          - MONITORING
          - TICKETING
          - DATABASE
          - COMMUNICATION
          - DOCUMENTATION
          - ML_OPS
          - MCP
          - AI
          - CUSTOM
      - name: version
        in: query
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the list of Connectors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseConnectorResponse'
            text/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseConnectorResponse'
            text/html:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseConnectorResponse'
      deprecated: true
    put:
      tags:
      - Connectors
      summary: Update a Connector
      description: Updates a Connector for the given ID.
      operationId: updateConnector
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: rootFolder
        in: query
        description: Path to the root folder of the Entity. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: Commit Message to use for the merge commit.
        schema:
          type: string
      - name: lastObjectId
        in: query
        description: Its required field during update call request. It can be fetched from the response of GET API call for the entity
        schema:
          type: string
      - name: resolvedConflictCommitId
        in: query
        description: If the entity is git-synced, this parameter represents the commit id against which file conflicts are resolved
        schema:
          type: string
      - name: baseBranch
        in: query
        description: Name of the default branch.
        schema:
          type: string
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          type: string
      - name: lastCommitId
        in: query
        description: last commit id of the file
        schema:
          type: string
      - name: isNewBranch
        in: query
        description: Checks the new branch
        schema:
          type: boolean
          default: false
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
      requestBody:
        description: This is the updated Connector. Please provide values for all fields, not just the fields you are updating
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connector2'
          text/yaml:
            schema:
              $ref: '#/components/schemas/Connector2'
          text/html:
            schema:
              $ref: '#/components/schemas/Connector2'
          text/plain:
            schema:
              $ref: '#/components/schemas/Connector2'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the updated Connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOConnectorResponse'
            text/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOConnectorResponse'
            text/html:
              schema:
                $ref: '#/components/schemas/ResponseDTOConnectorResponse'
    post:
      tags:
      - Connectors
      summary: Create a Connector
      description: Creates a new Harness Connector.
      operationId: createConnector
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: rootFolder
        in: query
        description: Path to the root folder of the Entity. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: isNewBranch
        in: query
        description: Checks the new branch
        schema:
          type: boolean
          default: false
      - name: baseBranch
        in: query
        description: Name of the default branch.
        schema:
          type: string
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          type: string
      - name: storeType
        in: query
        description: Tells whether the Entity is to be saved on Git or not
        schema:
          type: string
          enum:
          - INLINE
          - REMOTE
          - INLINE_HC
      - name: repoName
        in: query
        description: Name of the repository.
        schema:
          type: string
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
      requestBody:
        description: Details of the Connector to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connector2'
          text/yaml:
            schema:
              $ref: '#/components/schemas/Connector2'
          text/html:
            schema:
              $ref: '#/components/schemas/Connector2'
          text/plain:
            schema:
              $ref: '#/components/schemas/Connector2'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns created Connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOConnectorResponse'
            text/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOConnectorResponse'
            text/html:
              schema:
                $ref: '#/components/schemas/ResponseDTOConnectorResponse'
  /ng/api/connectors/{identifier}:
    get:
      tags:
      - Connectors
      summary: Return Connector details
      description: Returns the Connector's details for the given Account and Connector ID.
      operationId: getConnector
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: identifier
        in: path
        description: Connector Identifier
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the connector with the requested accountIdentifier and connectorIdentifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOConnectorResponse'
            text/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOConnectorResponse'
            text/html:
              schema:
                $ref: '#/components/schemas/ResponseDTOConnectorResponse'
    delete:
      tags:
      - Connectors
      summary: Delete a Connector
      description: Deletes a Connector for the given ID.
      operationId: deleteConnector
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: identifier
        in: path
        description: Connector ID
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: rootFolder
        in: query
        description: Path to the root folder of the Entity. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: Commit Message to use for the merge commit.
        schema:
          type: string
      - name: lastObjectId
        in: query
        description: Last Object Id
        schema:
          type: string
      - name: forceDelete
        in: query
        description: If true, the Entity will be forced delete, without checking any references/usages
        schema:
          type: boolean
          default: false
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: It returns true if the Connector is deleted successfully and false if the Connector is not deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
            text/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
            text/html:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
  /ng/api/connectors/fieldValues:
    get:
      tags:
      - Connectors
      summary: List all the configured field values for the given Connector type
