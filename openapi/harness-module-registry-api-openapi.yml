      summary: List modules
      description: List all modules from the module registry
      operationId: module-registry#list_modules-by-account
      parameters:
      - name: limit
        in: query
        description: Limit is the number of records to return for a page.
        allowEmptyValue: true
        schema:
          type: integer
          description: Limit is the number of records to return for a page.
          default: 30
          example: 30
          format: int64
          minimum: 1
          maximum: 1000
        example: 30
      - name: page
        in: query
        description: Page is the page number to return relative to the page 'limit'.
        allowEmptyValue: true
        schema:
          type: integer
          description: Page is the page number to return relative to the page 'limit'.
          default: 1
          example: 1
          format: int64
          minimum: 1
        example: 1
      - name: searchTerm
        in: query
        description: Filter results by partial name or provider match
        allowEmptyValue: true
        schema:
          type: string
          description: Filter results by partial name or provider match
          default: ''
          example: mymod
        example: mymod
      - name: sort
        in: query
        description: Sort order for results
        allowEmptyValue: true
        schema:
          type: string
          description: Sort order for results
          default: name,ASC
          example: updated,DESC
          enum:
          - name,ASC
          - name,DESC
          - updated,ASC
          - updated,DESC
        example: name,DESC
      - name: scope_org
        in: query
        description: org name
        allowEmptyValue: true
        schema:
          type: string
          description: org name
          example: Et ipsa.
        example: Atque quaerat.
      - name: scope_project
        in: query
        description: project name
        allowEmptyValue: true
        schema:
          type: string
          description: project name
          example: Et cum numquam expedita veritatis perspiciatis.
        example: Aspernatur sint atque.
      - name: provider
        in: query
        description: Filter modules to these providers (module_system values). Repeatable query param.
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
            example: Natus sed quas doloremque.
          description: Filter modules to these providers (module_system values). Repeatable query param.
          example:
          - terraform
          - tofu
        example:
        - terraform
        - tofu
      - name: Harness-Account
        in: header
        description: account name
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: account name
          example: Consequatur exercitationem.
