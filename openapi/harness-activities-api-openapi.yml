openapi: 3.2.0
info:
  title: Harness Activities API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Activities
  description: Activities Service handles the API for workspace activities
paths:
  /iacm/api/orgs/{org}/projects/{project}/activities:
    get:
      tags:
      - Activities
      summary: List activities
      description: List all activities
      operationId: activities#list-activities
      parameters:
      - name: limit
        in: query
        description: Limit is the number of records to return for a page.
        allowEmptyValue: true
        schema:
          type: integer
          description: Limit is the number of records to return for a page.
          default: 30
          example: 30
          format: int64
          minimum: 1
          maximum: 1000
        example: 30
      - name: page
        in: query
        description: Page is the page number to return relative to the page 'limit'.
        allowEmptyValue: true
        schema:
          type: integer
          description: Page is the page number to return relative to the page 'limit'.
          default: 1
          example: 1
          format: int64
          minimum: 1
        example: 1
      - name: workspace
        in: query
        description: Workspace identifier
        allowEmptyValue: true
        schema:
          type: string
          description: Workspace identifier
          example: Non magnam quis deleniti voluptas.
        example: Culpa minima atque omnis.
      - name: pipeline
        in: query
        description: Pipeline filter
        allowEmptyValue: true
        schema:
          type: string
          description: Pipeline filter
          example: Nihil tenetur ut.
        example: Tempore voluptates.
      - name: pipeline_execution_id
        in: query
        description: Pipeline execution filter
        allowEmptyValue: true
        schema:
          type: string
          description: Pipeline execution filter
          example: Est et libero recusandae voluptas debitis.
        example: Quia molestiae repellat et.
      - name: pipeline_stage_id
        in: query
        description: Pipeline stage filter
        allowEmptyValue: true
        schema:
          type: string
          description: Pipeline stage filter
          example: Laborum suscipit ad molestiae deserunt quos.
        example: Voluptates qui nesciunt cupiditate ipsum provident quae.
      - name: activity_type
        in: query
        description: Activity type filter
        allowEmptyValue: true
        schema:
          type: string
          description: Activity type filter
          example: Eaque atque aperiam voluptatum quidem.
        example: Autem cumque mollitia nihil.
      - name: activity_status
        in: query
        description: Activity status filter
        allowEmptyValue: true
        schema:
          type: string
          description: Activity status filter
          example: Consequatur maiores in necessitatibus et et pariatur.
        example: Corporis nisi nihil id expedita molestiae eligendi.
      - name: start_time
        in: query
        description: Start time filter (Unix timestamp)
        allowEmptyValue: true
        schema:
          type: integer
          description: Start time filter (Unix timestamp)
          example: 317303704311037200
          format: int64
        example: 4523578234231308000
      - name: end_time
        in: query
        description: End time filter (Unix timestamp)
        allowEmptyValue: true
        schema:
          type: integer
          description: End time filter (Unix timestamp)
          example: 2918553615035180500
          format: int64
        example: 128157541012208500
      - name: org
        in: path
        description: Org is the organisation identifier.
        required: true
        schema:
          type: string
          description: Org is the organisation identifier.
          example: s
          minLength: 1
          maxLength: 128
        example: y6f
      - name: project
        in: path
        description: Project is the project identifier.
        required: true
        schema:
          type: string
          description: Project is the project identifier.
          example: er
          minLength: 1
          maxLength: 128
        example: x
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          example: bv
          minLength: 1
          maxLength: 128
        example: bm
      responses:
        '200':
          description: OK response.
          headers:
            x-page-size:
              description: Current page size
              schema:
                type: integer
                description: Current page size
                example: 50
                format: int64
              example: 50
            x-total-items:
              description: Total items available
              schema:
                type: integer
                description: Total items available
                example: 1800
                format: int64
              example: 1800
            x-total-pages:
              description: Total pages available
              schema:
                type: integer
                description: Total pages available
                example: 36
                format: int64
              example: 36
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResourceCollection'
