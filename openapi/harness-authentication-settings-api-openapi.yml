openapi: 3.2.0
info:
  title: Harness Authentication Settings API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Authentication Settings
  description: This contains APIs related to Authentication settings as defined in Harness
paths:
  /ng/api/authentication-settings/ldap/settings:
    get:
      tags:
      - Authentication Settings
      summary: Return configured Ldap settings for the account
      description: Returns configured Ldap settings and its details for the account.
      operationId: getLdapSettings
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns ldap setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseLDAPSettings'
    put:
      tags:
      - Authentication Settings
      summary: Updates Ldap setting
      description: Updates configured Ldap settings along with the user, group queries.
      operationId: updateLdapSettings
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: This is the updated LdapSettings. Values for all fields is needed, not just the fields you are updating
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDAPSettings'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Updated Ldap settings along with the user, group settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseLDAPSettings'
    post:
      tags:
      - Authentication Settings
      summary: Create Ldap setting
      description: Creates Ldap settings along with the user, group queries.
      operationId: createLdapSettings
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Create LdapSettings request body. Values for connection settings are needed, user and group settings can also be provided
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LDAPSettings'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Creates Ldap settings along with the user, group queries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseLDAPSettings'
    delete:
      tags:
      - Authentication Settings
      summary: Delete Ldap settings
      description: Delete configured Ldap settings on this account.
      operationId: deleteLdapSettings
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully deleted Ldap settings configured on account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseBoolean'
  /ng/api/authentication-settings/delete-saml-metadata:
    delete:
      tags:
      - Authentication Settings
      summary: Delete SAML meta data
      description: Deletes SAML metadata for the given Account ID.
      operationId: deleteSamlMetaData
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully deleted SAML meta associated with a SAML setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseSSOConfig'
  /ng/api/authentication-settings/saml-metadata/{samlSSOId}/delete:
    delete:
      tags:
      - Authentication Settings
      summary: Delete SAML meta data for given SAML sso id
      description: Deletes SAML metadata for the given Account and SAML sso id
      operationId: deleteSamlMetaDataForSamlSSOId
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: samlSSOId
        in: path
        description: Saml Settings Identifier
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully deleted SAML meta associated with a SAML SSO setting id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseSSOConfig'
  /ng/api/authentication-settings/saml-metadata-upload/{samlSSOId}/authentication:
    put:
      tags:
      - Authentication Settings
      summary: Update authentication enabled or not for given SAML setting
      description: Updates if authentication is enabled or not for given SAML setting in Account ID.
      operationId: enableDisableAuthenticationForSAMLSetting
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: enable
        in: query
        required: true
        schema:
          type: boolean
          default: true
      - name: samlSSOId
        in: path
        description: Saml Settings Identifier
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully updated login allowed status for SAML setting in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseBoolean'
  /ng/api/authentication-settings:
    get:
      tags:
      - Authentication Settings
      summary: Gets authentication settings for the given Account ID
      description: Gets authentication settings for the given Account ID.
      operationId: getAuthenticationSettings
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully returns authentication settings of an Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseAuthenticationSettingsResponse'
  /ng/api/authentication-settings/v2:
    get:
      tags:
      - Authentication Settings
      summary: Gets authentication settings version 2 for the given Account ID
      description: Gets authentication settings version 2 for the given Account ID.
      operationId: getAuthenticationSettingsV2
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully returns authentication settings of an Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseAuthenticationSettingsResponse'
  /ng/api/authentication-settings/login-settings/password-strength:
    get:
      tags:
      - Authentication Settings
      summary: Get password strength
      description: Gets password strength for the given Account ID.
      operationId: getPasswordStrengthSettings
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns password strength of an Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponsePasswordStrengthPolicy'
  /ng/api/authentication-settings/saml-login-test:
    get:
      tags:
      - Authentication Settings
      summary: Test SAML connectivity
      description: Tests SAML connectivity for the given Account ID.
      operationId: getSamlLoginTest
      parameters:
      - name: accountId
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns connectivity status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseLoginTypeResponse'
  /ng/api/authentication-settings/saml-login-test/{samlSSOId}:
    get:
      tags:
      - Authentication Settings
      summary: Test SAML connectivity
      description: Tests SAML connectivity for the given Account ID and SAML setting.
      operationId: getSamlLoginTestV2
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: samlSSOId
        in: path
        description: Saml Settings Identifier
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns connectivity status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseLoginTypeResponse'
  /ng/api/authentication-settings/oauth/remove-mechanism:
    delete:
      tags:
      - Authentication Settings
      summary: Delete OAuth Setting
      description: Deletes OAuth settings for a given Account ID.
      operationId: removeOauthMechanism
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully removed OAuth settings configured to an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseBoolean'
  /ng/api/authentication-settings/public-access:
    put:
      tags:
      - Authentication Settings
      summary: Enable/disable public access at account level
      description: Enable/disable public access for the given Account ID.
      operationId: setPublicAccess
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Information about the session timeout for all users of this account in minutes.
        content:
          application/json:
            schema:
              type: boolean
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully configured public access for an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseBoolean'
  /ng/api/authentication-settings/session-timeout-account-level:
    put:
      tags:
      - Authentication Settings
      summary: Set session timeout at account level
      description: Sets session timeout of all users for the given Account ID.
      operationId: setSessionTimeoutAtAccountLevel
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Information about the session timeout for all users of this account in minutes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTimeoutSettings'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully configured session timeout for an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseBoolean'
  /ng/api/authentication-settings/two-factor-admin-override-settings:
    put:
      tags:
      - Authentication Settings
      summary: Set two factor authorization
      description: Sets Two-Factor authorization for the given Account ID.
      operationId: setTwoFactorAuthAtAccountLevel
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Boolean that specify whether or not to override two factor enabled setting
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/TwoFactorAdminOverrideSettings'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully configured two factor authorization for an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseBoolean'
  /ng/api/authentication-settings/update-auth-mechanism:
    put:
      tags:
      - Authentication Settings
      summary: Update Auth mechanism
      description: Updates the authentication mechanism for the given Account ID.
      operationId: updateAuthMechanism
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: authenticationMechanism
        in: query
        description: Type of Authentication Mechanism SSO or NON_SSO
        schema:
          type: string
          enum:
          - USER_PASSWORD
          - SAML
          - LDAP
          - OAUTH
          - OIDC
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully updated Auth mechanism for an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseBoolean'
  /ng/api/authentication-settings/oauth/update-providers:
    put:
      tags:
      - Authentication Settings
      summary: Update Oauth providers
      description: Updates OAuth providers for the given Account ID.
      operationId: updateOauthProviders
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: This is the updated OAuthSettings. Please provide values for all fields, not just the fields you are updating
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/OAuthSettings'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully updated the Oauth providers for the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseBoolean'
  /ng/api/authentication-settings/saml-metadata-upload:
    put:
      tags:
      - Authentication Settings
      summary: Update SAML metadata
      description: Updates SAML metadata of the SAML configuration configured for an account
      operationId: updateSamlMetaData
      parameters:
      - name: accountId
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: object
                  description: SAML Metadata input file
                fileMetadata:
                  $ref: '#/components/schemas/FormDataContentDisposition'
                displayName:
                  type: string
                  description: Display Name of the SAML
                groupMembershipAttr:
                  type: string
                  description: Group membership attribute
                authorizationEnabled:
                  type: boolean
                  description: Specify whether or not to enable authorization
                logoutUrl:
                  type: string
                  description: Logout URL
                entityIdentifier:
                  type: string
                  description: SAML metadata Identifier
                samlProviderType:
                  type: string
                  description: SAML provider type
                clientId:
                  type: string
                  description: Optional SAML clientId for Azure SSO
                clientSecret:
                  type: string
                  description: Optional SAML clientSecret reference string for Azure SSO
                jitEnabled:
                  type: boolean
                  description: Enable Just in time user provision
                  default: false
                jitValidationKey:
                  type: string
                  description: Optional Key to match in SAML assertion for Just in time user provision
                jitValidationValue:
                  type: string
                  description: Optional Value to match in SAML assertion for Just in time user provision
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully updated SAML metadata of SAML setting configured for an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseSSOConfig'
    post:
      tags:
      - Authentication Settings
      summary: Upload SAML metadata
      description: Updates the SAML metadata for the given Account ID.
      operationId: uploadSamlMetaData
      parameters:
      - name: accountId
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: object
                  description: Saml Metadata input file
                fileMetadata:
                  $ref: '#/components/schemas/FormDataContentDisposition'
                displayName:
                  type: string
                  description: Display Name of the SAML
                groupMembershipAttr:
                  type: string
                  description: Group membership attribute
                authorizationEnabled:
                  type: boolean
                  description: Specify whether or not to enable authorization
                logoutUrl:
                  type: string
                  description: Logout URL
                entityIdentifier:
                  type: string
                  description: SAML metadata Identifier
                samlProviderType:
                  type: string
                  description: SAML provider type
                clientId:
                  type: string
                  description: Optional SAML clientId for Azure SSO
                clientSecret:
                  type: string
                  description: Optional SAML clientSecret reference string for Azure SSO
                friendlySamlName:
                  type: string
                  description: Friendly name of the app on SAML SSO provider end in Harness
                jitEnabled:
                  type: boolean
                  description: Enable Just in time user provision
                  default: false
                jitValidationKey:
                  type: string
                  description: Optional Key to match in SAML assertion for Just in time user provision
                jitValidationValue:
                  type: string
                  description: Optional Value to match in SAML assertion for Just in time user provision
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully uploads SAML metadata to the SAML setting configured for an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseSSOConfig'
  /ng/api/authentication-settings/saml-metadata-upload/{samlSSOId}:
    put:
      tags:
      - Authentication Settings
      summary: Update SAML metadata for a given SAML SSO Id
      description: Updates SAML metadata of the SAML configuration with given SSO Id, configured for an account
      operationId: updateSamlMetaDataForSamlSSOId
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: samlSSOId
        in: path
        description: Saml Settings Identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: object
                  description: SAML Metadata input file
                fileMetadata:
                  $ref: '#/components/schemas/FormDataContentDisposition'
                displayName:
                  type: string
                  description: Display Name of the SAML
                groupMembershipAttr:
                  type: string
                  description: Group membership attribute
                authorizationEnabled:
                  type: boolean
                  description: Specify whether or not to enable authorization
                logoutUrl:
                  type: string
                  description: Logout URL
                entityIdentifier:
                  type: string
                  description: SAML metadata Identifier
                samlProviderType:
                  type: string
                  description: SAML provider type
                clientId:
                  type: string
                  description: Optional SAML clientId for Azure SSO
                clientSecret:
                  type: string
                  description: Optional SAML clientSecret reference string for Azure SSO
                friendlySamlName:
                  type: string
                  description: Friendly name of the app on SAML SSO provider end in Harness
                jitEnabled:
                  type: boolean
                  description: Enable Just in time user provision
                  default: false
                jitValidationKey:
                  type: string
                  description: Optional Key to match in SAML assertion for Just in time user provision
                jitValidationValue:
                  type: string
                  description: Optional Value to match in SAML assertion for Just in time user provision
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Successfully updated SAML metadata of SAML setting configured for an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestResponseSSOConfig'
