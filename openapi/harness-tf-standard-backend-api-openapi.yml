components:
  schemas:
    HarnessIacmLockinfo:
      type: object
      properties:
        account:
          type: string
          description: Account is the internal customer account ID.
          example: p
          minLength: 1
          maxLength: 128
        created:
          type: integer
          description: Time that the lock was taken.
          example: 5845931977240394000
          format: int64
        id:
          type: string
          description: Unique ID for the lock. Generated by the terraform cli.
          example: 1ac4b858-bf0b-8539-9d80-8c521f6423cf
          minLength: 1
        info:
          type: string
          description: Extra information to store with the lock.
          default: ''
          example: production workspace lock
        locked_by_display_name:
          type: string
          description: Display name of who locked the workspace
          example: Deserunt aut fugiat consequatur.
        locked_by_principal_id:
          type: string
          description: Principal ID who created the manual lock
          example: Et tempore.
        locked_by_principal_type:
          type: string
          description: 'Type of principal: ''user'' or ''service_account'''
          example: Similique distinctio earum officiis assumenda eius doloribus.
        manual:
          type: boolean
          description: Whether the lock is manual (user-initiated). true = manual lock, false = automatic lock (Terraform CLI)
          default: false
          example: true
        operation:
          type: string
          description: Terraform operation.
          example: OperationTypePlan
        org:
          type: string
          description: Org is the organisation identifier.
          example: vk
          minLength: 1
          maxLength: 128
        path:
          type: string
          description: Path to the state file when applicable.
          default: ''
          example: /api/orgs/org1/projects/proj1/workspaces/production/data/fcdf0196-f5b3-49ab-87e3-ff102dfaf58c
        project:
          type: string
          description: Project is the project identifier.
          example: ye7
          minLength: 1
          maxLength: 128
        reason:
          type: string
          description: Reason for manual lock (optional, max 1024 chars)
          example: Consectetur corrupti sint.
        version:
          type: string
          description: Terraform version.
          example: 1.0.0
        who:
          type: string
          description: The machine user who is performing the operation.
          default: ''
          example: user1
        workspace:
          type: string
          description: Workspace identifier
          example: workspace123
      description: Terraform lock information resource.
      example:
        account: v
        created: 5134664667880166000
        id: 1ac4b858-bf0b-8539-9d80-8c521f6423cf
        info: production workspace lock
        locked_by_display_name: Eius ratione dolorem ratione qui.
        locked_by_principal_id: Et autem enim.
        locked_by_principal_type: Dolorum quaerat ratione amet vel veniam.
        manual: true
        operation: OperationTypePlan
        org: cy
        path: /api/orgs/org1/projects/proj1/workspaces/production/data/fcdf0196-f5b3-49ab-87e3-ff102dfaf58c
        project: ns
        reason: Eligendi sunt eveniet dicta explicabo et quod.
        version: 1.0.0
        who: user1
        workspace: workspace123
      required:
      - account
      - org
      - project
      - workspace
      - id
      - operation
      - version
      - created
    LockWorkspaceRequest:
      type: object
      properties:
        created:
          type: string
          description: Time that the lock was taken.
          example: Unde qui.
        id:
          type: string
          description: Unique ID for the lock. Generated by the terraform cli.
          example: 1ac4b858-bf0b-8539-9d80-8c521f6423cf
          minLength: 1
        info:
          type: string
          description: Extra information to store with the lock.
          default: ''
          example: production workspace lock
        operation:
          type: string
          description: Terraform operation.
          example: OperationTypePlan
        path:
          type: string
          description: Path to the state file when applicable.
          default: ''
          example: /api/orgs/org1/projects/proj1/workspaces/production/data/fcdf0196-f5b3-49ab-87e3-ff102dfaf58c
        version:
          type: string
          description: Terraform version.
          example: 1.0.0
        who:
          type: string
          description: The machine user who is performing the operation.
          default: ''
          example: user1
      example:
        created: Rem rem.
        id: 1ac4b858-bf0b-8539-9d80-8c521f6423cf
        info: production workspace lock
        operation: OperationTypePlan
        path: /api/orgs/org1/projects/proj1/workspaces/production/data/fcdf0196-f5b3-49ab-87e3-ff102dfaf58c
        version: 1.0.0
        who: user1
      required:
      - id
      - operation
      - version
      - created
    UnlockWorkspaceRequest:
      type: object
      properties:
        created:
          type: string
          description: Time that the lock was taken.
          example: Voluptas nemo ut est.
        id:
          type: string
          description: Unique ID for the lock. Generated by the terraform cli.
          example: 1ac4b858-bf0b-8539-9d80-8c521f6423cf
          minLength: 1
        info:
          type: string
          description: Extra information to store with the lock.
          default: ''
          example: production workspace lock
        operation:
          type: string
          description: Terraform operation.
          example: OperationTypePlan
        path:
          type: string
          description: Path to the state file when applicable.
          default: ''
          example: /api/orgs/org1/projects/proj1/workspaces/production/data/fcdf0196-f5b3-49ab-87e3-ff102dfaf58c
        version:
          type: string
          description: Terraform version.
          example: 1.0.0
        who:
          type: string
          description: The machine user who is performing the operation.
          default: ''
          example: user1
      example:
        created: Repudiandae voluptatum reprehenderit veniam.
        id: 1ac4b858-bf0b-8539-9d80-8c521f6423cf
        info: production workspace lock
        operation: OperationTypePlan
        path: /api/orgs/org1/projects/proj1/workspaces/production/data/fcdf0196-f5b3-49ab-87e3-ff102dfaf58c
        version: 1.0.0
        who: user1
      required:
      - id
      - operation
      - version
      - created
    IaCMError:
      type: object
      properties:
        fault:
          type: boolean
          description: Is the error a server-side fault?
          example: false
        id:
          type: string
          description: ID is a unique identifier for this particular occurrence of the problem.
          example: 123abc
        message:
          type: string
          description: Message is a human-readable explanation specific to this occurrence of the problem.
          example: parameter 'p' must be an integer
        name:
          type: string
          description: Name is the name of this class of errors.
          example: bad_request
        temporary:
          type: boolean
          description: Is the error temporary?
          example: false
        timeout:
          type: boolean
          description: Is the error a timeout?
          example: true
      example:
        fault: false
        id: 123abc
        message: parameter 'p' must be an integer
        name: bad_request
        temporary: false
        timeout: true
      required:
      - name
      - id
      - message
      - temporary
      - timeout
      - fault
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
