        description: Org is the organisation identifier.
        required: true
        schema:
          type: string
          description: Org is the organisation identifier.
          example: w
          minLength: 1
          maxLength: 128
        example: xut
      - name: project
        in: path
        description: Project is the project identifier.
        required: true
        schema:
          type: string
          description: Project is the project identifier.
          example: esk
          minLength: 1
          maxLength: 128
        example: f
      - name: workspace
        in: path
        description: Workspace identifier
        required: true
        schema:
          type: string
          description: Workspace identifier
          example: workspace123
        example: workspace123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockWorkspaceRequest'
            example:
              created: Quam quasi est a.
              id: 1ac4b858-bf0b-8539-9d80-8c521f6423cf
