        '502':
          description: 'BadGatewayError: Bad Gateway response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
    post:
      tags:
      - tf-standard-backend
      summary: Create terraform state
      operationId: tf-standard-backend#push-terraform-state
      parameters:
      - name: accountIdentifier
        in: query
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          example: f
          minLength: 1
          maxLength: 128
        example: '53'
      - name: ID
        in: query
        description: If the backend is locked, this value must match the persisted terraform lock id.
        allowEmptyValue: true
        schema:
          type: string
          description: If the backend is locked, this value must match the persisted terraform lock id.
          example: 1ac4b858-bf0b-8539-9d80-8c521f6423cf
        example: 1ac4b858-bf0b-8539-9d80-8c521f6423cf
      - name: org
        in: path
        description: Org is the organisation identifier.
        required: true
        schema:
          type: string
          description: Org is the organisation identifier.
          example: hl3
          minLength: 1
          maxLength: 128
        example: tk
      - name: project
        in: path
        description: Project is the project identifier.
        required: true
        schema:
          type: string
          description: Project is the project identifier.
          example: v
          minLength: 1
          maxLength: 128
        example: lao
      - name: workspace
        in: path
        description: Workspace identifier
        required: true
        schema:
          type: string
          description: Workspace identifier
          example: workspace123
        example: workspace123
      - name: Content-Length
        in: header
        description: Size in bytes of the state.
        allowEmptyValue: true
        schema:
          type: integer
          description: Size in bytes of the state.
          example: 501043638353866
          format: int64
        example: 5414030745992186000
      responses:
        '200':
          description: OK response.
        '400':
          description: 'BadRequestError: Bad Request response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '401':
          description: 'UnauthorizedError: Unauthorized response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '403':
          description: 'ForbiddenError: Forbidden response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '404':
          description: 'NotFoundError: Not Found response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '408':
          description: 'TimeoutError: Request Timeout response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '409':
          description: 'ConflictError: Conflict response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '423':
          description: 'LockedError: Locked response.'
          content:
