openapi: 3.2.0
info:
  title: Harness STO Data Frontend API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: STO Data Frontend
  description: Endpoints that power the other modules micro-frontend with STO data
paths:
  /sto/api/v2/sto-data-frontend/all-issues/filters:
    x-internal: true
    post:
      description: Provides the distinct set of filter values (severity, scanner, target, issueType) available for the issues produced by the provided target name and variant combinations. Variant name may be empty, in which case the target's baseline variant is used.
      operationId: STO Data Frontend#AllIssuesFilters
      parameters:
      - allowEmptyValue: true
        description: Harness Account ID
        example: abcdef1234567890ghijkl
        in: query
        name: accountId
        required: true
        schema:
          description: Harness Account ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
      - allowEmptyValue: true
        description: Harness Organization ID
        example: example_org
        in: query
        name: orgId
        required: true
        schema:
          description: Harness Organization ID
          example: example_org
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      - allowEmptyValue: true
        description: Harness Project ID
        example: example_project
        in: query
        name: projectId
        required: true
        schema:
          description: Harness Project ID
          example: example_project
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      requestBody:
        content:
          application/json:
            example:
              artifactFingerprints:
              - 3uo
              - 4mb
              - 68n
              targetVariants:
              - targetName: Rerum eos omnis accusamus fuga commodi.
                targetType: repository
                targetVariantName: Hic dolor.
              - targetName: Rerum eos omnis accusamus fuga commodi.
                targetType: repository
                targetVariantName: Hic dolor.
              - targetName: Rerum eos omnis accusamus fuga commodi.
                targetType: repository
                targetVariantName: Hic dolor.
            schema:
              $ref: '#/components/schemas/ExecutionArtifactSummaryRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                exploitabilityFlag: true
                issueCategories:
                - Insecure Direct Object Reference (AI SAST)
                - SQL Injection
                latestBaselineScans:
                - pipelineId: pipeline_1
                  scanTool: owasp
                  scanToolName: OWASP
                  targetId: abcdef1234567890ghijkl
                  targetName: The Target
                  targetType: repository
                - pipelineId: pipeline_1
                  scanTool: owasp
                  scanToolName: OWASP
                  targetId: abcdef1234567890ghijkl
                  targetName: The Target
                  targetType: repository
                - pipelineId: pipeline_1
                  scanTool: owasp
                  scanToolName: OWASP
                  targetId: abcdef1234567890ghijkl
                  targetName: The Target
                  targetType: repository
                - pipelineId: pipeline_1
                  scanTool: owasp
                  scanToolName: OWASP
                  targetId: abcdef1234567890ghijkl
                  targetName: The Target
                  targetType: repository
                reachabilityFlag: true
              schema:
                $ref: '#/components/schemas/AllIssuesFiltersResultV2'
          description: OK response.
        '400':
          content:
            application/json:
              example:
                message: 'Bad Request: accountId parameter is required'
                status: 400
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'BadRequest: Bad Request response.'
        '401':
          content:
            application/json:
              example:
                message: Unauthorized
                status: 401
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'Unauthorized: Unauthorized response.'
        '403':
          content:
            application/json:
              example:
                message: Forbidden
                status: 403
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'Forbidden: Forbidden response.'
        '404':
          content:
            application/json:
              example:
                message: Not Found
                status: 404
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'NotFound: Not Found response.'
        '429':
          content:
            application/json:
              example:
                message: Too Many Requests
                status: 429
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'TooManyRequests: Too Many Requests response.'
        '500':
          content:
            application/json:
              example:
                message: Internal Server Error
                status: 500
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'InternalServerError: Internal Server Error response.'
      security:
      - jwt_header_Authorization:
        - sto_issue_view
      summary: Distinct filter values for selected targets and variants
      tags:
      - STO Data Frontend
