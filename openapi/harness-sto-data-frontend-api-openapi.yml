components:
  schemas:
    TargetAndVariantName:
      type: object
      properties:
        targetName:
          type: string
          description: Target name
          example: Id dolorem ut et ducimus veritatis nobis.
        targetType:
          type: string
          description: Type of target
          example: repository
          enum:
          - container
          - repository
          - instance
          - configuration
        targetVariantName:
          type: string
          description: Variant name
          example: Rerum et tempore neque corporis exercitationem.
      example:
        targetName: Porro voluptatem ab.
        targetType: repository
        targetVariantName: Ut nulla consequatur.
    FrontendIssueCounts:
      type: object
      properties:
        active:
          type: integer
          description: The total of active Issues
          example: 150
          format: int32
        critical:
          type: integer
          description: The number of Critical-severity Issues
          example: 1
          format: int32
        high:
          type: integer
          description: The number of High-severity Issues
          example: 3
          format: int32
        ignored:
          type: integer
          description: The number of Issues ignored due to Exemptions, and therefore not included in other counts
          example: 1
          format: int32
