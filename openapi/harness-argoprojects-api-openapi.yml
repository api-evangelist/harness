openapi: 3.2.0
info:
  title: Harness Argo Projects API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: ArgoProjects
paths:
  /gitops/api/v2/agents/{agentIdentifier}/argoprojects:
    get:
      description: ListForAgent lists all ArgoCD AppProjects mapped to this agent.
      operationId: AgentArgoProjectService_ListForAgent
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ArgoProjectList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: query.name
        in: query
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - ArgoProjects
      summary: Agent argo project service list for agent
      x-summary-source: derived
    post:
      description: Create creates an ArgoCD AppProject CRD in the cluster and auto-creates a Harness mapping if one does not exist. If a mapping already exists it is reused.
      operationId: AgentArgoProjectService_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ArgoProject'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: mapToHarnessProject.projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: mapToHarnessProject.orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: mapToHarnessProject.autoCreateServiceEnv
        description: Enable automated creation of service,environment and cluster-env link. Defaults to false.
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        $ref: '#/components/requestBodies/projectsProjectCreateRequest'
      tags:
      - ArgoProjects
      summary: Agent argo project service create
      x-summary-source: derived
  /gitops/api/v2/agents/{agentIdentifier}/argoprojects/{query.name}:
    get:
      description: Get returns an ArgoCD AppProject by name. Must be mapped to a Harness project.
      operationId: AgentArgoProjectService_Get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ArgoProject'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: query.name
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - ArgoProjects
      summary: Agent argo project service get
      x-summary-source: derived
    delete:
      description: Delete deletes an ArgoCD AppProject from the cluster. Must be mapped. Does not remove the Harness mapping.
      operationId: AgentArgoProjectService_Delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/projectsEmptyResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: query.name
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - ArgoProjects
      summary: Agent argo project service delete
      x-summary-source: derived
  /gitops/api/v2/agents/{agentIdentifier}/argoprojects/{query.name}/events:
    get:
      description: ListEvents returns Kubernetes events for a named ArgoCD AppProject. Must be mapped.
      operationId: AgentArgoProjectService_ListEvents
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationsEventList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: query.name
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageIndex
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - ArgoProjects
      summary: Agent argo project service list events
      x-summary-source: derived
  /gitops/api/v2/agents/{agentIdentifier}/argoprojects/{request.project.metadata.name}:
    put:
      description: Update updates an ArgoCD AppProject spec. Must be mapped to a Harness project.
      operationId: AgentArgoProjectService_Update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ArgoProject'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: request.project.metadata.name
        description: 'Name must be unique within a namespace. Is required when creating resources, although

          some resources may allow a client to request the generation of an appropriate name

          automatically. Name is primarily intended for creation idempotence and configuration

          definition.

          Cannot be updated.

          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names

          +optional'
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/projectsProjectUpdateRequest'
      tags:
      - ArgoProjects
      summary: Agent argo project service update
      x-summary-source: derived
components:
  schemas:
    appprojectsProjectRole:
      type: object
      properties:
        name:
          type: string
          title: Name is a name for this role
        description:
          type: string
          title: Description is a description of the role
        policies:
          type: array
          items:
            type: string
          title: Policies Stores a list of casbin formatted strings that define access policies for the role in the project
        jwtTokens:
          type: array
          items:
            $ref: '#/components/schemas/appprojectsJWTToken'
          title: JWTTokens are a list of generated JWT tokens bound to this role
        groups:
          type: array
          items:
            type: string
          title: Groups are a list of OIDC group claims bound to this role
      title: ProjectRole represents a role that has access to a project
    appprojectsOrphanedResourcesMonitorSettings:
      type: object
      properties:
        warn:
          type: boolean
          title: Warn indicates if warning condition should be created for apps which have orphaned resources
        ignore:
          type: array
          items:
            $ref: '#/components/schemas/appprojectsOrphanedResourceKey'
          title: Ignore contains a list of resources that are to be excluded from orphaned resources monitoring
      title: OrphanedResourcesMonitorSettings holds settings of orphaned resources monitoring
    appprojectsAppProjectStatus:
      type: object
      properties:
        jwtTokensByRole:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/appprojectsJWTTokens'
          title: JWTTokensByRole contains a list of JWT tokens issued for a given role
      title: AppProjectStatus contains status information for AppProject CRs
    appprojectsSyncWindow:
      type: object
      properties:
        kind:
          type: string
          title: Kind defines if the window allows or blocks syncs
        schedule:
          type: string
          title: Schedule is the time the window will begin, specified in cron format
        duration:
          type: string
          title: Duration is the amount of time the sync window will be open
        applications:
          type: array
          items:
            type: string
          title: Applications contains a list of applications that the window will apply to
        namespaces:
          type: array
          items:
            type: string
          title: Namespaces contains a list of namespaces that the window will apply to
        clusters:
          type: array
          items:
            type: string
          title: Clusters contains a list of clusters that the window will apply to
        manualSync:
          type: boolean
          title: ManualSync enables manual syncs when they would otherwise be blocked
        timeZone:
          type: string
          title: TimeZone of the sync that will be applied to the schedule
        project:
          type: string
          title: 'Project this sync window belongs to

            this will be deprecated in future'
      title: SyncWindow contains the kind, time, duration and attributes that are used to assign the syncWindows to apps
    appprojectsAppProject:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMeta'
        spec:
          $ref: '#/components/schemas/appprojectsAppProjectSpec'
        status:
          $ref: '#/components/schemas/appprojectsAppProjectStatus'
      title: 'AppProject provides a logical grouping of applications, providing controls for:

        * where the apps may deploy to (cluster whitelist)

        * what may be deployed (repository whitelist, resource whitelist/blacklist)

        * who can access these applications (roles, OIDC group claims bindings)

        * and what they can do (RBAC policies)

        * automation access to these roles (JWT tokens)

        +genclient

        +genclient:noStatus

        +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object

        +kubebuilder:resource:path=appprojects,shortName=appproj;appprojs'
    appprojectsApplicationDestinationServiceAccount:
      type: object
      properties:
        server:
          type: string
          description: Server specifies the URL of the target cluster's Kubernetes control plane API.
        namespace:
          type: string
          description: Namespace specifies the target namespace for the application's resources.
        defaultServiceAccount:
          type: string
          title: DefaultServiceAccount to be used for impersonation during the sync operation
      description: ApplicationDestinationServiceAccount holds information about the service account to be impersonated for the application sync operation.
    applicationsEventSource:
      type: object
      properties:
        component:
          type: string
          title: 'Component from which the event is generated.

            +'
        host:
          type: string
          title: 'Node name on which the event is generated.

            +'
    applicationsObjectReference:
      type: object
      properties:
        kind:
          type: string
          title: 'Kind of the referent.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds

            +'
        namespace:
          type: string
          title: 'Namespace of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/

            +'
        name:
          type: string
          title: 'Name of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names

            +'
        uid:
          type: string
          title: 'UID of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids

            +'
        apiVersion:
          type: string
          title: 'API version of the referent.

            +'
        resourceVersion:
          type: string
          title: 'Specific resourceVersion to which this reference is made, if any.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency

            +'
        fieldPath:
          type: string
          title: 'If referring to a piece of an object instead of an entire object, this string

            should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].

            For example, if the object reference is to a container within a pod, this would take on a value like:

            "spec.containers{name}" (where "name" refers to the name of the container that triggered

            the event) or if no container name is specified "spec.containers[2]" (container with

            index 2 in this pod). This syntax is chosen only to have some well-defined way of

            referencing a part of an object.

            TODO: this design is not final and this field is subject to change in the future.

            +'
    v1ListMeta:
      type: object
      properties:
        selfLink:
          type: string
          title: 'Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.

            +optional'
        resourceVersion:
          type: string
          title: 'String that identifies the server''s internal version of this object that

            can be used by clients to determine when objects have changed.

            Value must be treated as opaque by clients and passed unmodified back to the server.

            Populated by the system.

            Read-only.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency

            +optional'
        continue:
          type: string
          description: 'continue may be set if the user set a limit on the number of items returned, and indicates that

            the server has more data available. The value is opaque and may be used to issue another request

            to the endpoint that served this list to retrieve the next set of available objects. Continuing a

            consistent list may not be possible if the server configuration has changed or more than a few

            minutes have passed. The resourceVersion field returned when using this continue value will be

            identical to the value in the first response, unless you have received this token from an error

            message.'
        remainingItemCount:
          type: string
          format: int64
          title: 'remainingItemCount is the number of subsequent items in the list which are not included in this

            list response. If the list request contained label or field selectors, then the number of

            remaining items is unknown and the field will be left unset and omitted during serialization.

            If the list is complete (either because it is not chunking or because this is the last chunk),

            then there are no more remaining items and this field will be left unset and omitted during

            serialization.

            Servers older than v1.15 do not set this field.

            The intended use of the remainingItemCount is *estimating* the size of a collection. Clients

            should not rely on the remainingItemCount to be set or to be exact.

            +optional'
      description: 'ListMeta describes metadata that synthetic resources must have, including lists and

        various status objects. A resource may have only one of {ObjectMeta, ListMeta}.'
    appprojectsOrphanedResourceKey:
      type: object
      properties:
        group:
          type: string
        kind:
          type: string
        name:
          type: string
      title: OrphanedResourceKey is a reference to a resource to be ignored from
    v1ManagedFieldsEntry:
      type: object
      properties:
        manager:
          type: string
          description: Manager is an identifier of the workflow managing these fields.
        operation:
          type: string
          description: 'Operation is the type of operation which lead to this ManagedFieldsEntry being created.

            The only valid values for this field are ''Apply'' and ''Update''.'
        apiVersion:
          type: string
          description: 'APIVersion defines the version of this resource that this field set

            applies to. The format is "group/version" just like the top-level

            APIVersion field. It is necessary to track the version of a field

            set because it cannot be automatically converted.'
        time:
          $ref: '#/components/schemas/v1Time'
        fieldsType:
          type: string
          title: 'FieldsType is the discriminator for the different fields format and version.

            There is currently only one possible value: "FieldsV1"'
        fieldsV1:
          $ref: '#/components/schemas/v1FieldsV1'
        subresource:
          type: string
          description: 'Subresource is the name of the subresource used to update that object, or

            empty string if the object was updated through the main resource. The

            value of this field is used to distinguish between managers, even if they

            share the same name. For example, a status update will be distinct from a

            regular update using the same manager name.

            Note that the APIVersion field is not related to the Subresource field and

            it always corresponds to the version of the main resource.'
      description: 'ManagedFieldsEntry is a workflow-id, a FieldSet and the group version of the resource

        that the fieldset applies to.'
    appprojectsJWTToken:
      type: object
      properties:
        iat:
          type: string
          format: int64
        exp:
          type: string
          format: int64
        id:
          type: string
      title: JWTToken holds the issuedAt and expiresAt values of a token
    v1ObjectMeta:
      type: object
      properties:
        name:
          type: string
          title: 'Name must be unique within a namespace. Is required when creating resources, although

            some resources may allow a client to request the generation of an appropriate name

            automatically. Name is primarily intended for creation idempotence and configuration

            definition.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names

            +optional'
        generateName:
          type: string
          description: 'GenerateName is an optional prefix, used by the server, to generate a unique

            name ONLY IF the Name field has not been provided.

            If this field is used, the name returned to the client will be different

            than the name passed. This value will also be combined with a unique suffix.

            The provided value has the same validation rules as the Name field,

            and may be truncated by the length of the suffix required to make the value

            unique on the server.


            If this field is specified and the generated name exists, the server will return a 409.


            Applied only if Name is not specified.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#idempotency

            +optional'
        namespace:
          type: string
          description: 'Namespace defines the space within which each name must be unique. An empty namespace is

            equivalent to the "default" namespace, but "default" is the canonical representation.

            Not all objects are required to be scoped to a namespace - the value of this field for

            those objects will be empty.


            Must be a DNS_LABEL.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces

            +optional'
        selfLink:
          type: string
          title: 'Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.

            +optional'
        uid:
          type: string
          description: 'UID is the unique in time and space value for this object. It is typically generated by

            the server on successful creation of a resource and is not allowed to change on PUT

            operations.


            Populated by the system.

            Read-only.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids

            +optional'
        resourceVersion:
          type: string
          description: 'An opaque value that represents the internal version of this object that can

            be used by clients to determine when objects have changed. May be used for optimistic

            concurrency, change detection, and the watch operation on a resource or set of resources.

            Clients must treat these values as opaque and passed unmodified back to the server.

            They may only be valid for a particular resource or set of resources.


            Populated by the system.

            Read-only.

            Value must be treated as opaque by clients and .

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency

            +optional'
        generation:
          type: string
          format: int64
          title: 'A sequence number representing a specific generation of the desired state.

            Populated by the system. Read-only.

            +optional'
        creationTimestamp:
          $ref: '#/components/schemas/v1Time'
        deletionTimestamp:
          $ref: '#/components/schemas/v1Time'
        deletionGracePeriodSeconds:
          type: string
          format: int64
          title: 'Number of seconds allowed for this object to gracefully terminate before

            it will be removed from the system. Only set when deletionTimestamp is also set.

            May only be shortened.

            Read-only.

            +optional'
        labels:
          type: object
          additionalProperties:
            type: string
          title: 'Map of string keys and values that can be used to organize and categorize

            (scope and select) objects. May match selectors of replication controllers

            and services.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels

            +optional'
        annotations:
          type: object
          additionalProperties:
            type: string
          title: 'Annotations is an unstructured key value map stored with a resource that may be

            set by external tools to store and retrieve arbitrary metadata. They are not

            queryable and should be preserved when modifying objects.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations

            +optional'
        ownerReferences:
          type: array
          items:
            $ref: '#/components/schemas/v1OwnerReference'
          title: 'List of objects depended by this object. If ALL objects in the list have

            been deleted, this object will be garbage collected. If this object is managed by a controller,

            then an entry in this list will point to this controller, with the controller field set to true.

            There cannot be more than one managing controller.

            +optional

            +patchMergeKey=uid

            +patchStrategy=merge

            +listType=map

            +listMapKey=uid'
        finalizers:
          type: array
          items:
            type: string
          title: 'Must be empty before the object is deleted from the registry. Each entry

            is an identifier for the responsible component that will remove the entry

            from the list. If the deletionTimestamp of the object is non-nil, entries

            in this list can only be removed.

            Finalizers may be processed and removed in any order.  Order is NOT enforced

            because it introduces significant risk of stuck finalizers.

            finalizers is a shared field, any actor with permission can reorder it.

            If the finalizer list is processed in order, then this can lead to a situation

            in which the component responsible for the first finalizer in the list is

            waiting for a signal (field value, external system, or other) produced by a

            component responsible for a finalizer later in the list, resulting in a deadlock.

            Without enforced ordering finalizers are free to order amongst themselves and

            are not vulnerable to ordering changes in the list.

            +optional

            +patchStrategy=merge

            +listType=set'
        managedFields:
          type: array
          items:
            $ref: '#/components/schemas/v1ManagedFieldsEntry'
          description: 'ManagedFields maps workflow-id and version to the set of fields

            that are managed by that workflow. This is mostly for internal

            housekeeping, and users typically shouldn''t need to set or

            understand this field. A workflow can be the user''s name, a

            controller''s name, or the name of a specific apply path like

            "ci-cd". The set of fields is always in the version that the

            workflow used when modifying the object.


            +optional

            +listType=atomic'
      description: 'ObjectMeta is metadata that all persisted resources must have, which includes all objects

        users must create.'
    applicationsEventList:
      type: object
      properties:
