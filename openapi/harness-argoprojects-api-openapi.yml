          description: 'Name is the name of the restricted resource. Glob patterns using Go''s filepath.Match syntax are supported.

            Unlike the group and kind fields, if no name is specified, all resources of the specified group/kind are matched.'
      title: ClusterResourceRestrictionItem is a cluster resource that is restricted by the project's whitelist or blacklist
    v1OwnerReference:
      type: object
      properties:
        apiVersion:
          type: string
          description: API version of the referent.
        kind:
          type: string
          title: 'Kind of the referent.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
        name:
          type: string
          title: 'Name of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names'
        uid:
          type: string
          title: 'UID of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids'
        controller:
          type: boolean
          title: 'If true, this reference points to the managing controller.

            +optional'
        blockOwnerDeletion:
          type: boolean
          title: 'If true, AND if the owner has the "foregroundDeletion" finalizer, then

            the owner cannot be deleted from the key-value store until this

            reference is removed.

            See https://kubernetes.io/docs/concepts/architecture/garbage-collection/#foreground-deletion

            for how the garbage collector interacts with this field and enforces the foreground deletion.

            Defaults to false.

            To set this field, a user needs "delete" permission of the owner,

            otherwise 422 (Unprocessable Entity) will be returned.

            +optional'
      title: 'OwnerReference contains enough information to let you identify an owning

        object. An owning object must be in the same namespace as the dependent, or

        be cluster-scoped, so there is no namespace field.

        +structType=atomic'
    v1GroupKind:
      type: object
      properties:
        group:
          type: string
        kind:
          type: string
      description: +protobuf.options.(gogoproto.goproto_stringer)=false
      title: 'GroupKind specifies a Group and a Kind, but does not force a version.  This is useful for identifying

        concepts during lookup stages without having partially valid types'
    v1Time:
      type: object
      properties:
        seconds:
          type: string
          format: int64
          description: 'Represents seconds of UTC time since Unix epoch

            1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to

