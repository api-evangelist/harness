        '499':
          description: 'ContextCancelledError:  response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '500':
          description: 'InternalServerError: Internal Server Error response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '502':
          description: 'BadGatewayError: Bad Gateway response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
    put:
      tags:
      - workspace_templates
      summary: Update workspace template
      description: Update a workspace template combo to change its version.
      operationId: workspace_templates#update-workspace-template
      parameters:
      - name: org
        in: path
        description: Org is the organisation identifier.
        required: true
        schema:
          type: string
          description: Org is the organisation identifier.
          example: q
          minLength: 1
          maxLength: 128
        example: y
      - name: project
        in: path
        description: Project is the project identifier.
        required: true
        schema:
          type: string
          description: Project is the project identifier.
          example: vtk
          minLength: 1
          maxLength: 128
        example: l0
      - name: template_id
        in: path
        description: Template identifier
        required: true
        schema:
          type: string
          description: Template identifier
          example: jo
          minLength: 1
          maxLength: 128
        example: 3pd
      - name: workspace_id
        in: path
        description: Workspace identifier
        required: true
        schema:
          type: string
          description: Workspace identifier
          example: 84d
          minLength: 1
          maxLength: 128
        example: '1'
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          example: x
          minLength: 1
          maxLength: 128
        example: l
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceTemplateRequest'
            example:
              version: he
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkspaceTemplateResponse'
              example:
                account: 14y
                created_at: 1627590400
                org: 0l
                project: h5a
                template_id: n
                updated_at: 1627686800
                version: fx
                workspace_id: '8'
        '400':
          description: 'BadRequestError: Bad Request response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '401':
          description: 'UnauthorizedError: Unauthorized response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '403':
          description: 'ForbiddenError: Forbidden response.'
          content:
            application/vnd.goa.error:
              schema:
