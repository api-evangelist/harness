              schema:
                $ref: '#/components/schemas/IaCMError'
        '502':
          description: 'BadGatewayError: Bad Gateway response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
  /iacm/api/orgs/{org}/projects/{project}/workspace/templates/{template_id}:
    get:
      tags:
      - workspace_templates
      summary: List workspaces by template id
      description: Get all workspaces associated with a specific template ID for a given scope.
      operationId: workspace_templates#get-workspaces-by-template-id
      parameters:
      - name: org
        in: path
        description: Org is the organisation identifier.
        required: true
        schema:
          type: string
          description: Org is the organisation identifier.
          example: w5a
          minLength: 1
          maxLength: 128
        example: z
      - name: project
        in: path
        description: Project is the project identifier.
        required: true
        schema:
          type: string
          description: Project is the project identifier.
          example: a
          minLength: 1
          maxLength: 128
        example: '7'
      - name: template_id
        in: path
        description: Template identifier to filter workspaces
        required: true
        schema:
          type: string
          description: Template identifier to filter workspaces
          example: kzp
          minLength: 1
          maxLength: 128
        example: x6u
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          example: un
          minLength: 1
          maxLength: 128
        example: f
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HarnessIacmWorkspaceTemplate'
                description: List of workspaces associated with the template ID
                example:
                - account: o9n
                  created_at: 1627590400
                  org: x96
                  project: 8jn
                  template_id: w8
                  updated_at: 1627686800
                  version: de
                  workspace_id: wx
                - account: o9n
                  created_at: 1627590400
                  org: x96
                  project: 8jn
                  template_id: w8
                  updated_at: 1627686800
                  version: de
                  workspace_id: wx
                - account: o9n
                  created_at: 1627590400
                  org: x96
                  project: 8jn
                  template_id: w8
                  updated_at: 1627686800
                  version: de
                  workspace_id: wx
              example:
              - account: o9n
                created_at: 1627590400
                org: x96
                project: 8jn
                template_id: w8
                updated_at: 1627686800
                version: de
                workspace_id: wx
              - account: o9n
                created_at: 1627590400
                org: x96
                project: 8jn
                template_id: w8
                updated_at: 1627686800
                version: de
                workspace_id: wx
        '400':
          description: 'BadRequestError: Bad Request response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '401':
