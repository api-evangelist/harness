          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '502':
          description: 'BadGatewayError: Bad Gateway response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
components:
  schemas:
    CreateWorkspaceTemplateResponse:
      type: object
      properties:
        account:
          type: string
          description: Account identifier.
          example: we
          minLength: 1
          maxLength: 128
        created_at:
          type: integer
          description: Timestamp when the workspace-template association was created.
          example: 1627590400
          format: int64
        org:
          type: string
          description: Organization identifier.
          example: 3ox
          minLength: 1
          maxLength: 128
        project:
          type: string
          description: Project identifier.
          example: ssv
          minLength: 1
          maxLength: 128
        template_id:
          type: string
          description: Template identifier.
          example: 5bn
          minLength: 1
          maxLength: 128
        updated_at:
          type: integer
          description: Timestamp when the workspace-template association was last updated.
          example: 1627686800
          format: int64
        version:
          type: string
          description: Template version associated with the workspace.
          example: l
          minLength: 1
          maxLength: 32
        workspace_id:
          type: string
          description: Workspace identifier.
          example: rw
          minLength: 1
          maxLength: 128
      example:
        account: '7'
        created_at: 1627590400
        org: 9eu
        project: zhn
        template_id: n9
        updated_at: 1627686800
        version: qsx
        workspace_id: c8a
      required:
      - workspace_id
      - template_id
      - created_at
      - updated_at
      - account
      - project
      - org
    CreateWorkspaceTemplateRequest:
      type: object
      properties:
        template_id:
          type: string
          description: Template identifier
          example: 8k
          minLength: 1
          maxLength: 128
        version:
          type: string
          description: Template version
          example: hw
          minLength: 1
          maxLength: 64
        workspace_id:
          type: string
          description: Workspace identifier
          example: k
          minLength: 1
          maxLength: 128
      example:
        template_id: 5n
        version: zw
        workspace_id: vra
      required:
      - workspace_id
      - template_id
      - version
    GetWorkspaceTemplateReconciliationDiffResponse:
      type: object
      properties:
        currentWorkspaceYaml:
          type: string
          description: Current workspace YAML
          example: Maiores omnis est pariatur ipsam veniam molestias.
        reconcilableWorkspaceYaml:
          type: string
          description: Workspace YAML after applying changes from the template
          example: Et eum.
        requiresReconciliation:
          type: boolean
          description: Indicates if the workspace needs template-based reconciliation
          example: true
      example:
        currentWorkspaceYaml: Ea totam dolorem in.
        reconcilableWorkspaceYaml: Rerum ad ducimus consectetur.
        requiresReconciliation: true
      required:
      - currentWorkspaceYaml
      - reconcilableWorkspaceYaml
      - requiresReconciliation
    HarnessIacmWorkspaceTemplate:
      type: object
      properties:
        account:
          type: string
          description: Account identifier.
          example: 9ea
          minLength: 1
          maxLength: 128
        created_at:
          type: integer
          description: Timestamp when the workspace-template association was created.
          example: 1627590400
          format: int64
        org:
          type: string
          description: Organization identifier.
          example: lgs
          minLength: 1
          maxLength: 128
        project:
          type: string
          description: Project identifier.
          example: h1
          minLength: 1
          maxLength: 128
        template_id:
          type: string
          description: Template identifier.
          example: fyc
          minLength: 1
          maxLength: 128
        updated_at:
          type: integer
          description: Timestamp when the workspace-template association was last updated.
          example: 1627686800
          format: int64
        version:
          type: string
          description: Template version associated with the workspace.
          example: n
          minLength: 1
          maxLength: 32
        workspace_id:
          type: string
          description: Workspace identifier.
          example: 4k
          minLength: 1
          maxLength: 128
      description: WorkspaceTemplateResource is the representation for a workspace-template association.
      example:
        account: '2'
        created_at: 1627590400
        org: hg
        project: jql
        template_id: '3'
        updated_at: 1627686800
        version: u
        workspace_id: '8'
      required:
      - workspace_id
      - template_id
      - created_at
      - updated_at
      - account
      - project
      - org
    IaCMError:
      type: object
      properties:
        fault:
          type: boolean
          description: Is the error a server-side fault?
          example: false
        id:
          type: string
          description: ID is a unique identifier for this particular occurrence of the problem.
          example: 123abc
        message:
          type: string
          description: Message is a human-readable explanation specific to this occurrence of the problem.
          example: parameter 'p' must be an integer
        name:
          type: string
          description: Name is the name of this class of errors.
          example: bad_request
        temporary:
          type: boolean
          description: Is the error temporary?
          example: false
        timeout:
          type: boolean
          description: Is the error a timeout?
          example: true
      example:
        fault: false
        id: 123abc
        message: parameter 'p' must be an integer
        name: bad_request
        temporary: false
        timeout: true
      required:
      - name
      - id
      - message
      - temporary
      - timeout
      - fault
    UpdateWorkspaceTemplateRequest:
      type: object
      properties:
        version:
          type: string
          description: New template version
          example: zgo
          minLength: 1
          maxLength: 64
      example:
        version: o
      required:
      - version
    UpdateWorkspaceTemplateResponse:
      type: object
      properties:
        account:
          type: string
          description: Account identifier.
          example: mq
          minLength: 1
          maxLength: 128
        created_at:
          type: integer
          description: Timestamp when the workspace-template association was created.
          example: 1627590400
          format: int64
        org:
          type: string
          description: Organization identifier.
          example: '6'
          minLength: 1
          maxLength: 128
        project:
          type: string
          description: Project identifier.
          example: k
          minLength: 1
          maxLength: 128
        template_id:
          type: string
          description: Template identifier.
          example: a7z
          minLength: 1
          maxLength: 128
        updated_at:
          type: integer
          description: Timestamp when the workspace-template association was last updated.
          example: 1627686800
          format: int64
        version:
          type: string
          description: Template version associated with the workspace.
          example: lj
          minLength: 1
          maxLength: 32
        workspace_id:
          type: string
          description: Workspace identifier.
          example: o
          minLength: 1
          maxLength: 128
      example:
        account: zs
        created_at: 1627590400
        org: wt0
        project: 5tu
        template_id: y
        updated_at: 1627686800
        version: vq
        workspace_id: d
      required:
      - workspace_id
      - template_id
      - created_at
      - updated_at
      - account
      - project
      - org
