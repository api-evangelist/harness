          type: string
          description: Display name of the commenter
          example: Priya Nair
        created:
          type: integer
          description: Unix timestamp (seconds)
          example: 1781391060
          format: int64
        durationDays:
          type: integer
          description: COALESCE(eh.state.duration_days, pending_changes fallback)
          example: 9210991542842275000
          format: int64
        exemptedOccurrenceCount:
          type: integer
          description: Count of occurrences covered (issue-level fingerprint or scan-scoped)
          example: 8118853364885305000
          format: int64
        exemptionId:
          type: string
          description: Parent exemption.id
          example: exmp111111111111111111
          pattern: ^[a-zA-Z0-9_-]{22}$
        expiration:
          type: integer
          description: Unix timestamp from eh.state.expiration when present
          example: 5621343883892058000
          format: int64
        id:
          type: string
          description: exemption_history.id
          example: hist111111111111111111
          pattern: ^[a-zA-Z0-9_-]{22}$
        isAutoExpiry:
          type: boolean
          description: True when status=Expired and commenter_id IS NULL
          default: false
          example: true
        isOccurrenceLevel:
          type: boolean
          description: True when exemption has exemption_occurrence rows at event time
          example: true
        orgId:
          type: string
          example: Quia labore.
        orgName:
          type: string
          description: Display name for orgId, resolved via ng-manager
