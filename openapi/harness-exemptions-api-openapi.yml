  schemas:
    ExemptionHistoryEvent:
      type: object
      properties:
        comment:
          type: string
          description: eh.comment when present
          example: qj7
          maxLength: 1024
        commenterEmail:
          type: string
          description: Email of the commenter
          example: priya.nair@harness.io
        commenterId:
          type: string
          description: User ID; absent for auto-expiry
          example: user111111111111111111
          pattern: ^[a-zA-Z0-9_-]{22}$
