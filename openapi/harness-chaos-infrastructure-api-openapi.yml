      type: object
      properties:
        isAutoUpgradeEnabled:
          type: boolean
        status:
          $ref: '#/components/schemas/infra_v2.UpgradeStatus'
    infra_v2.Volumes:
      type: object
      properties:
        name:
          type: string
        sizeLimit:
          type: string
    v1.TaintEffect:
      type: string
      enum:
      - NoSchedule
      - PreferNoSchedule
      - NoExecute
      x-enum-varnames:
      - TaintEffectNoSchedule
      - TaintEffectPreferNoSchedule
      - TaintEffectNoExecute
    infra.InfraVersionDetails:
      type: object
      properties:
        compatibleVersions:
          description: List of all infra versions supported
          type: array
          items:
            type: string
        latestVersion:
          description: Latest infra version supported
          type: string
    infra_v2.ListKubernetesInfraV2Request:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/infra_v2.KubernetesInfraV2FilterInput'
        identifier:
          $ref: '#/components/schemas/infra_v2.Identifiers'
        sort:
          $ref: '#/components/schemas/infra_v2.SortInput'
    infra.UpdateInfraResponse:
      type: object
      properties:
        correlationID:
          type: string
        message:
          type: string
    infra.EcsInstallationManifest:
      type: object
      properties:
        service:
          description: Service manifest
          type: string
        taskDefinition:
          description: TaskDefinition manifest
          type: string
    infra.PlatformType:
      type: string
      enum:
      - AWS_ECS
      - DOCKER_COMPOSE
      - HASHICORP_NOMAD
      x-enum-varnames:
      - PlatformTypeAwsEcs
      - PlatformTypeDockerCompose
      - PlatformTypeHashicorpNomad
    infra_v2.InstallationType:
      type: string
      enum:
      - CONNECTOR
      - MANIFEST
      - CONNECTOR_V2
      x-enum-varnames:
      - InstallationTypeConnector
      - InstallationTypeManifest
      - InstallationTypeConnectorV2
    infra_v2.UpgradeStatus:
      type: string
      enum:
      - UPGRADING_INFRA
      - UPGRADE_SKIPPED
      - UPGRADE_SUCCESSFUL
      - UPGRADE_FAILED
      - DETECTING_UPGRADER
      - UPGRADER_DISABLED
      x-enum-varnames:
      - UpgradeStatusUpgrading
      - UpgradeStatusSkipped
      - UpgradeStatusSuccessful
      - UpgradeStatusFailed
      - UpgradeStatusDetecting
      - UpgradeStatusDisabled
    shared.Error:
      type: object
      properties:
        code:
          type: integer
        correlationID:
          type: string
        message:
          type: string
    model.GetInfraStatsResponse:
      type: object
      properties:
        totalActiveInfrastructure:
          description: Total number of active infrastructures
          type: integer
        totalConfirmedInfrastructure:
          description: Total number of confirmed infrastructures
          type: integer
        totalInactiveInfrastructures:
          description: Total number of inactive infrastructures
          type: integer
        totalInfrastructures:
          description: Total number of infrastructures
          type: integer
        totalNonConfirmedInfrastructures:
          description: Total number of non confirmed infrastructures
          type: integer
    model.UpgradeStatus:
      type: string
      enum:
      - UPGRADING_INFRA
      - UPGRADE_SKIPPED
      - UPGRADE_SUCCESSFUL
      - UPGRADE_FAILED
      - DETECTING_UPGRADER
      - UPGRADER_DISABLED
      x-enum-varnames:
      - UpgradeStatusUpgradingInfra
      - UpgradeStatusUpgradeSkipped
      - UpgradeStatusUpgradeSuccessful
      - UpgradeStatusUpgradeFailed
      - UpgradeStatusDetectingUpgrader
      - UpgradeStatusUpgraderDisabled
