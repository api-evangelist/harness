openapi: 3.2.0
info:
  title: Harness GitX Webhooks Event File Validation API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: GitX Webhooks Event File Validation
paths:
  /v1/gitx-webhook-events/{gitx-webhook-event}/validation-info:
    get:
      summary: Get file validations for a given event identifier
      tags:
      - GitX Webhooks Event File Validation
      responses:
        '200':
          $ref: '#/components/responses/GetGitXWebhookEventFileValidationResponse'
      operationId: gitx-webhook-event-file-validation
      x-internal: true
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader'
      - schema:
          type: string
        in: path
        name: gitx-webhook-event
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit1'
components:
  parameters:
    AccountHeader:
      name: Harness-Account
      in: header
      required: false
      schema:
        type: string
      description: Identifier field of the account the resource is scoped to. This is required for Authorization methods other than the x-api-key header. If you are using the x-api-key header, this can be skipped.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: "Pagination page number strategy: Specify the page number within the paginated collection related to the number of items in each page\t"
    Limit1:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 1000
      description: Number of items to return per page.
  schemas:
    GetGitXWebhookEventFileValidationResponse:
      title: GetGitXWebhookEventFileValidationResponse
      x-stoplight:
        id: bq4d9by7xkllw
      type: object
      description: Get GitX Webhook Event File Validation Response
      properties:
        file_path:
          type: string
        file_url:
          type: string
        file_action_type:
          type: string
          enum:
          - ADDED
          - MODIFIED
          - DELETED
        entity_details:
          type: array
          items:
            $ref: '#/components/schemas/EntityDetails'
    EntityMetadata:
      title: EntityMetadata
      type: object
      description: Entity metadata
      properties:
        pipeline_identifier:
          type: string
        template_version_label:
          type: string
        environment_identifier:
          type: string
        override_type:
          type: string
    ErrorMetadata1:
      title: ErrorMetadata
      x-stoplight:
        id: k44xlbscpqhti
      type: object
      description: Error meta data
      properties:
        error_message:
          type: string
          x-stoplight:
            id: kkpconlup6wwr
        hint:
          type: string
          x-stoplight:
            id: k6z0qdp0rmuw4
        explanation:
          type: string
          x-stoplight:
            id: f3q0sm25vvdyp
    EntityDetails:
      title: EntityDetails
      x-stoplight:
        id: off09hxwghp46
      type: object
      description: 'Entity Details with its yaml validation result '
      properties:
        is_valid:
          type: boolean
        error_metadata:
          $ref: '#/components/schemas/ErrorMetadata1'
        entity_metadata:
          $ref: '#/components/schemas/EntityMetadata'
        identifier:
          type: string
        org:
          type: string
        project:
          type: string
        entity_type:
          type: string
          enum:
          - Pipelines
          - Template
          - InputSets
          - Service
          - Environment
          - Infrastructure
          - Overrides
          - Unknown
        entity_url:
          type: string
        branch:
          type: string
  responses:
    GetGitXWebhookEventFileValidationResponse:
      description: Get GitX Webhook Event File Validation Response
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/GetGitXWebhookEventFileValidationResponse'
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
