    experimenttemplate.Fault:
      type: object
      properties:
        authEnabled:
          type: boolean
        identity:
          type: string
        infraId:
          type: string
        isEnterprise:
          type: boolean
        name:
          type: string
        revision:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/template.VariableMinimum'
