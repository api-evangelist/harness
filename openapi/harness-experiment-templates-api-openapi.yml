      properties:
        apiVersion:
          type: string
        correlationID:
          type: string
        description:
          type: string
        hubIdentity:
          type: string
        identity:
          type: string
        isDefault:
          type: boolean
        kind:
          type: string
        name:
          type: string
        revision:
          type: string
        spec:
