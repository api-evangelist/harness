        templateResources:
          $ref: '#/components/schemas/types.TemplateResources'
        validateManifest:
          type: boolean
    api.ResponseErrorCode:
      type: string
      enum:
      - PIPELINE_NOT_FOUND
      x-enum-varnames:
      - PipelineNotFound
    experimenttemplate.VertexChild:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/experimenttemplate.VertexResource'
        faults:
          type: array
          items:
            $ref: '#/components/schemas/experimenttemplate.VertexResource'
        probes:
          type: array
          items:
