        tags:
          type: array
          items:
            type: string
    github_com_harness_hce-saas_graphql_server_graph_model.UserDetails:
      type: object
      properties:
        email:
          type: string
        userID:
          type: string
        username:
          type: string
    template.Variable:
      type: object
      required:
      - name
      - value
      properties:
        allowedValues:
          type: array
          items: {}
        category:
          $ref: '#/components/schemas/template.InputCategory'
        default: {}
        description:
          type: string
        name:
          type: string
        path:
          type: string
        required:
          type: boolean
        stringify:
          type: boolean
        tags:
          type: array
          items:
            type: string
        tooltipId:
          type: string
        type:
          $ref: '#/components/schemas/template.InputType'
        validator:
          type: string
        value: {}
    types.ExperimentCreationResponse:
      type: object
      properties:
        auditAction:
          $ref: '#/components/schemas/experiment.SaveChaosExperimentResponse'
        data:
          $ref: '#/components/schemas/types.ExperimentCreationRequest'
    experiment.SaveChaosExperimentResponse:
      type: object
      properties:
        auditAction:
          type: string
        response:
          type: string
    types.ExperimentCreationRequest:
      type: object
      properties:
        cronSyntax:
          type: string
        description:
          type: string
        eventsMetadata:
          type: array
          items:
            $ref: '#/components/schemas/model.EventMetadata'
        experimentType:
