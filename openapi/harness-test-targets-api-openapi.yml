    TargetExecution:
      type: object
      properties:
        branch:
          type: string
          description: Git branch scanned
          example: main
          maxLength: 256
        buildId:
          type: string
          description: 'CI build id/number shown in UI (e.g. #222)'
          example: '222'
        commitSha:
          type: string
          description: Git commit SHA
          example: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
