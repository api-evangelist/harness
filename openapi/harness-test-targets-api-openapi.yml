    TargetExecutionOccurrenceSummary:
      type: object
      properties:
        exemptionId:
          type: string
          description: ID of an occurrence-scoped exemption for this finding on the target, matched via exemption_occurrence fingerprint. Null/omitted when none exists. Issue-level exemptions are not returned.
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        issueId:
          type: string
          description: Issue ID used by the existing ticket and exemption APIs
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        issueType:
          type: string
          description: Finding issue type
          example: SAST
          enum:
          - SAST
          - DAST
          - SCA
          - IAC
          - SECRET
          - MISCONFIG
          - BUG_SMELLS
          - CODE_SMELLS
          - CODE_COVERAGE
          - EXTERNAL_POLICY
        occurrenceInternalId:
          type: integer
          description: Internal ID used to fetch occurrence details or request an occurrence-level exemption
          example: 12345
          format: int64
          minimum: 1
        scanId:
          type: string
          description: ID of the scan containing this occurrence
          example: scan111111111111111111
          pattern: ^[a-zA-Z0-9_-]{22}$
        severityCode:
          type: string
          description: Finding severity
          example: Critical
          enum:
          - Critical
          - High
          - Medium
          - Low
          - Info
          - Unassigned
        title:
          type: string
          description: Finding title
          example: SQL injection enables authentication bypass
      description: An occurrence summary for one scan within a target execution.
      example:
        exemptionId: abcdef1234567890ghijkl
        issueId: abcdef1234567890ghijkl
        issueType: SAST
        occurrenceInternalId: 12345
        scanId: scan111111111111111111
        severityCode: Critical
        title: SQL injection enables authentication bypass
      required:
      - occurrenceInternalId
      - issueId
      - scanId
      - title
      - severityCode
      - issueType
    IDResult:
      type: object
      properties:
        id:
          type: string
          description: Resource identifier
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
      example:
        id: abcdef1234567890ghijkl
      required:
      - id
