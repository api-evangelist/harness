    TargetExecutionMetadata:
      type: object
      properties:
        buildId:
          type: string
          description: 'CI build id/number shown in UI (e.g. #222). Falls back to executionId when build id is unset.'
          example: '222'
        executionId:
          type: string
          description: Harness Execution ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        findingsCount:
          type: integer
          description: Open findings (occurrence) count for this execution from execution_summary
          example: 39
          format: int64
          minimum: 0
        hasShiftLeftScan:
          type: boolean
          description: True when this execution includes at least one Succeeded ShiftLeft/Qwiet scan (shiftleftsast, shiftleftsca, or shiftleft). UI uses this to show/hide the SBOM tab.
          example: true
        pipelineName:
          type: string
          description: Pipeline name shown under the build id
          example: Security Gate
          maxLength: 256
        sbomCount:
          type: integer
          description: SBOM package count for this execution (ShiftLeft packages.oss + packages.container). 0 when unavailable.
          example: 0
          format: int64
          minimum: 0
        source:
          type: string
          description: CI/CD platform that ran this execution (harness, jenkins, github_actions, gitlab_ci, ...)
          example: harness
          maxLength: 64
      description: Header fields for the target scan history detail page.
      example:
        buildId: '222'
        executionId: abcdef1234567890ghijkl
        findingsCount: 39
        hasShiftLeftScan: true
        pipelineName: Security Gate
        sbomCount: 0
        source: harness
      required:
      - buildId
      - executionId
      - source
      - pipelineName
      - findingsCount
      - sbomCount
      - hasShiftLeftScan
