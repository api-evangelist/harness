components:
  schemas:
    WorkspaceLock:
      type: object
      properties:
        created_at:
          type: integer
          description: Unix timestamp (milliseconds) when the lock was created.
          example: 2366466165031176000
          format: int64
        id:
          type: string
          description: Lock ID.
          example: Velit et.
        locked_by_display_name:
          type: string
          description: Display name of who locked the workspace.
          example: Consequatur voluptas natus ducimus quam aut quia.
        locked_by_principal_id:
          type: string
          description: Principal ID who locked the workspace.
          example: Necessitatibus voluptatem corrupti dolorem ipsa omnis.
        locked_by_principal_type:
          type: string
          description: Type of principal who locked the workspace.
          example: Earum optio.
        manual:
          type: boolean
          description: Whether the lock is manual (user-initiated). true = manual lock, false = automatic lock.
          example: true
        reason:
          type: string
          description: Reason for the lock.
          example: Porro doloremque voluptatem dolorem sed est voluptatem.
      description: workspaceLock holds the details of an active workspace lock. Fields are populated for manual (user-initiated) locks and left empty for automatic (Terraform CLI) locks.
      example:
        created_at: 7499313894044522000
        id: Voluptas soluta.
        locked_by_display_name: Porro odit omnis quo.
        locked_by_principal_id: Aut doloremque et esse maxime eius at.
        locked_by_principal_type: Non voluptatem in ut.
        manual: false
        reason: Omnis laborum et deleniti.
    IaCMError:
      type: object
      properties:
        fault:
          type: boolean
          description: Is the error a server-side fault?
          example: false
        id:
          type: string
          description: ID is a unique identifier for this particular occurrence of the problem.
          example: 123abc
        message:
          type: string
          description: Message is a human-readable explanation specific to this occurrence of the problem.
          example: parameter 'p' must be an integer
        name:
          type: string
          description: Name is the name of this class of errors.
          example: bad_request
        temporary:
          type: boolean
          description: Is the error temporary?
          example: false
        timeout:
          type: boolean
          description: Is the error a timeout?
          example: true
      example:
        fault: false
        id: 123abc
        message: parameter 'p' must be an integer
        name: bad_request
        temporary: false
        timeout: true
      required:
      - name
      - id
      - message
      - temporary
      - timeout
      - fault
