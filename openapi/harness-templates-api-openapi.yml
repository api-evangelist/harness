        content:
          application/json:
            schema:
              type: string
            examples:
              Update:
                summary: Sample Update Template YAML
                description: Sample Template YAML
                value: "template:\n  name: pipelineTemplate\n  identifier: pipelineTemplate\n  versionLabel: v1\n  type: Pipeline\n  projectIdentifier: TemplateDemo\n  orgIdentifier: default\n  tags: {}\n  spec:\n    stages:\n      - stage:\n          name: stage1\n          identifier: stage1\n          description: \"\"\n          type: Deployment\n          spec:\n            deploymentType: Kubernetes\n            service:\n              serviceRef: <+input>\n              serviceInputs: <+input>\n            environment:\n              environmentRef: <+input>\n              deployToAll: false\n              environmentInputs: <+input>\n              infrastructureDefinitions: <+input>\n            execution:\n              steps:\n                - step:\n                    type: ShellScript\n                    name: Shell Script_1\n                    identifier: ShellScript_1\n                    spec:\n                      shell: Bash\n                      onDelegate: true\n                      source:\n                        type: Inline\n                        spec:\n                          script: <+input>\n                      environmentVariables: []\n                      outputVariables: []\n                    timeout: 10m\n              rollbackSteps: []\n          tags: {}\n          failureStrategies:\n            - onFailure:\n                errors:\n                  - AllErrors\n                action:\n                  type: StageRollback\n"
          application/yaml:
            schema:
              type: string
            examples:
              Update:
                summary: Sample Update Template YAML
                description: Sample Template YAML
                value: "template:\n  name: pipelineTemplate\n  identifier: pipelineTemplate\n  versionLabel: v1\n  type: Pipeline\n  projectIdentifier: TemplateDemo\n  orgIdentifier: default\n  tags: {}\n  spec:\n    stages:\n      - stage:\n          name: stage1\n          identifier: stage1\n          description: \"\"\n          type: Deployment\n          spec:\n            deploymentType: Kubernetes\n            service:\n              serviceRef: <+input>\n              serviceInputs: <+input>\n            environment:\n              environmentRef: <+input>\n              deployToAll: false\n              environmentInputs: <+input>\n              infrastructureDefinitions: <+input>\n            execution:\n              steps:\n                - step:\n                    type: ShellScript\n                    name: Shell Script_1\n                    identifier: ShellScript_1\n                    spec:\n                      shell: Bash\n                      onDelegate: true\n                      source:\n                        type: Inline\n                        spec:\n                          script: <+input>\n                      environmentVariables: []\n                      outputVariables: []\n                    timeout: 10m\n              rollbackSteps: []\n          tags: {}\n          failureStrategies:\n            - onFailure:\n                errors:\n                  - AllErrors\n                action:\n                  type: StageRollback\n"
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: Returns the updated Template Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateWrapperResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateWrapperResponse'
