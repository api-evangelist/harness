openapi: 3.2.0
info:
  title: Harness Templates API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Templates
  description: This contains a list of APIs specific to the Templates Validations and Refresh
paths:
  /template/api/refresh-template/refreshed-yaml:
    post:
      tags:
      - Templates
      summary: Get YAML with updated Template Inputs
      description: Returns YAML with updated Template Inputs for a given YAML
      operationId: getRefreshedYaml
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      - name: Load-From-Cache
        in: header
        schema:
          type: string
          default: 'false'
      - name: harnessYamlVersion
        in: query
        description: Harness YAML Version
        schema:
          type: string
          default: '0'
      requestBody:
        description: YAML
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestDTO'
          application/yaml:
            schema:
              $ref: '#/components/schemas/RefreshRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: Returns YAML with updated Template Inputs, when an underlying Template has been updated and a reconciliation is pending in a given YAML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTORefreshResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTORefreshResponse'
  /template/api/refresh-template/validate-template-inputs:
    get:
      tags:
      - Templates
      summary: Validate Template Inputs in a YAML
      description: Validates the Template Inputs in a pipeline's YAML specification. If the Template Inputs are invalid, the operation returns an error summary.
      operationId: TemplatevalidateTemplateInputs
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: templateIdentifier
        in: query
        description: Template Identifier for the entity
        required: true
        schema:
          type: string
      - name: versionLabel
        in: query
        description: Template version
        required: true
        schema:
          type: string
      - name: Load-From-Cache
        in: header
        schema:
          type: string
          default: 'false'
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: Returns a validation result for Template Inputs present in a YAML specification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponseDTOValidateTemplateInputsResponseDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateResponseDTOValidateTemplateInputsResponseDTO'
  /template/api/templates/v2/applyTemplates:
    post:
      tags:
      - Templates
      summary: Gets complete yaml with templateRefs resolved
      operationId: getYamlWithTemplateRefsResolvedV2
      parameters:
      - name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        schema:
          type: string
      - name: projectIdentifier
        in: query
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      - name: Load-From-Cache
        in: header
        schema:
          type: string
          default: 'false'
      - name: AppendInputSetValidator
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateApplyRequestDTO'
          application/yaml:
            schema:
              $ref: '#/components/schemas/TemplateApplyRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: Gets complete yaml with templateRefs resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateMergeResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateMergeResponse'
  /template/api/templates:
    post:
      tags:
      - Templates
      summary: Create a Template
      operationId: createTemplate
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: label
        in: query
        description: Optional labels for this version (repeat). Requires template labels FF.
        schema:
          type: array
          items:
            type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: rootFolder
        in: query
        description: Path to the root folder of the Entity. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: isNewBranch
        in: query
        description: Checks the new branch
        schema:
          type: boolean
          default: false
      - name: baseBranch
        in: query
        description: Name of the default branch.
        schema:
          type: string
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          type: string
      - name: storeType
        in: query
        description: Tells whether the Entity is to be saved on Git or not
        schema:
          type: string
          enum:
          - INLINE
          - REMOTE
          - INLINE_HC
      - name: repoName
        in: query
        description: Name of the repository.
        schema:
          type: string
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
      - name: setDefaultTemplate
        in: query
        description: Specify true if Default Template is to be set
        schema:
          type: boolean
          default: false
      - name: comments
        in: query
        description: Comments
        schema:
          type: string
      - name: isNewTemplate
        in: query
        description: When isNewTemplate flag is set user will not be able to create a new version for an existing template
        schema:
          type: boolean
          default: false
      - name: enableDAG
        in: query
        description: Set to true for Pipeline templates with DAG (Directed Acyclic Graph) execution
        schema:
          type: boolean
          default: false
      requestBody:
        description: Template YAML
        content:
          application/json:
            schema:
              type: string
            examples:
              Create:
                summary: Sample Create Template YAML
                description: Sample Template YAML
                value: "template:\n  name: pipelineTemplate\n  identifier: pipelineTemplate\n  versionLabel: v1\n  type: Pipeline\n  projectIdentifier: TemplateDemo\n  orgIdentifier: default\n  tags: {}\n  spec:\n    stages:\n      - stage:\n          name: stage1\n          identifier: stage1\n          description: \"\"\n          type: Deployment\n          spec:\n            deploymentType: Kubernetes\n            service:\n              serviceRef: <+input>\n              serviceInputs: <+input>\n            environment:\n              environmentRef: <+input>\n              deployToAll: false\n              environmentInputs: <+input>\n              infrastructureDefinitions: <+input>\n            execution:\n              steps:\n                - step:\n                    type: ShellScript\n                    name: Shell Script_1\n                    identifier: ShellScript_1\n                    spec:\n                      shell: Bash\n                      onDelegate: true\n                      source:\n                        type: Inline\n                        spec:\n                          script: <+input>\n                      environmentVariables: []\n                      outputVariables: []\n                    timeout: 10m\n              rollbackSteps: []\n          tags: {}\n          failureStrategies:\n            - onFailure:\n                errors:\n                  - AllErrors\n                action:\n                  type: StageRollback\n"
          application/yaml:
            schema:
              type: string
            examples:
              Create:
                summary: Sample Create Template YAML
                description: Sample Template YAML
                value: "template:\n  name: pipelineTemplate\n  identifier: pipelineTemplate\n  versionLabel: v1\n  type: Pipeline\n  projectIdentifier: TemplateDemo\n  orgIdentifier: default\n  tags: {}\n  spec:\n    stages:\n      - stage:\n          name: stage1\n          identifier: stage1\n          description: \"\"\n          type: Deployment\n          spec:\n            deploymentType: Kubernetes\n            service:\n              serviceRef: <+input>\n              serviceInputs: <+input>\n            environment:\n              environmentRef: <+input>\n              deployToAll: false\n              environmentInputs: <+input>\n              infrastructureDefinitions: <+input>\n            execution:\n              steps:\n                - step:\n                    type: ShellScript\n                    name: Shell Script_1\n                    identifier: ShellScript_1\n                    spec:\n                      shell: Bash\n                      onDelegate: true\n                      source:\n                        type: Inline\n                        spec:\n                          script: <+input>\n                      environmentVariables: []\n                      outputVariables: []\n                    timeout: 10m\n              rollbackSteps: []\n          tags: {}\n          failureStrategies:\n            - onFailure:\n                errors:\n                  - AllErrors\n                action:\n                  type: StageRollback\n"
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: Returns the created Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateWrapperResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateWrapperResponse'
  /template/api/templates/{templateIdentifier}/{versionLabel}:
    delete:
      tags:
      - Templates
      summary: Delete Template Version
      operationId: deleteTemplateVersion
      parameters:
      - name: If-Match
        in: header
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: templateIdentifier
        in: path
        description: Template Identifier for the entity
        required: true
        schema:
          type: string
      - name: versionLabel
        in: path
        description: Version Label
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: rootFolder
        in: query
        description: Path to the root folder of the Entity. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: Commit Message to use for the merge commit.
        schema:
          type: string
      - name: lastObjectId
        in: query
        description: Last Object Id
        schema:
          type: string
      - name: comments
        in: query
        schema:
          type: string
      - name: forceDelete
        in: query
        description: If true, the Entity will be forced delete, without checking any references/usages
        schema:
          type: boolean
          default: false
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: Returns true if the Template is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
  /template/api/templates/{templateIdentifier}:
    get:
      tags:
      - Templates
      summary: Get Template
      operationId: getTemplate
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: templateIdentifier
        in: path
        description: Template Identifier for the entity
        required: true
        schema:
          type: string
      - name: label
        in: query
        description: Label
        schema:
          type: string
      - name: versionLabel
        in: query
        description: Version Label
        schema:
          type: string
      - name: deleted
        in: query
        description: Specifies whether Template is deleted or not
        schema:
          type: boolean
          default: false
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      - name: Load-From-Cache
        in: header
        schema:
          type: string
          default: 'false'
      - name: loadFromFallbackBranch
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: Returns the saved Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateResponse'
  /template/api/templates/templateInputs/{templateIdentifier}:
    get:
      tags:
      - Templates
      summary: Gets Template Input Set YAML
      operationId: getTemplateInputSetYaml
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: templateIdentifier
        in: path
        description: Template Identifier for the entity
        required: true
        schema:
          type: string
      - name: label
        in: query
        description: Template Label
        schema:
          type: string
      - name: versionLabel
        in: query
        description: Template Version Label
        schema:
          type: string
      - name: Load-From-Cache
        in: header
        schema:
          type: string
          default: 'false'
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: Returns the Template Input Set YAML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOString'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOString'
  /template/api/templates/{templateIdentifier}/labels:
    get:
      tags:
      - Templates
      summary: Get custom labels per template version
      description: Per-version labels; optional version filter.
      operationId: getTemplateLabelsMap
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: templateIdentifier
        in: path
        description: Template Identifier for the entity
        required: true
        schema:
          type: string
      - name: versionLabel
        in: query
        description: Optional. Repeat to limit which versions are included.
        schema:
          type: array
          items:
            type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: account, org, project, identifier, versionToLabelsMapping, stableVersionLabel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateLabelMapResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOTemplateLabelMapResponse'
  /template/api/templates/entitySetupUsage/{templateIdentifier}:
    get:
      tags:
      - Templates
      summary: Get Entities referring this template
      operationId: listTemplateUsage
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 100
      - name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: templateIdentifier
        in: path
        description: Template Identifier for the entity
        required: true
        schema:
          type: string
      - name: versionLabel
        in: query
        description: Version Label
        schema:
          type: string
      - name: isStableTemplate
        in: query
        description: Is Stable Template
        schema:
          type: boolean
      - name: searchTerm
        in: query
        schema:
          type: string
      - name: allVersions
        in: query
        schema:
          type: string
          default: 'false'
      - name: templateEntityType
        in: query
        schema:
          type: string
          enum:
          - Step
          - Stage
          - Pipeline
          - CustomDeployment
          - MonitoredService
          - SecretManager
          - ArtifactSource
          - StepGroup
          - Workspace
          - Notification
          - Agent
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TemplateError'
        default:
          description: Returns Entities list referring this template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseEntitySetupUsage'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseEntitySetupUsage'
  /template/api/templates/list-metadata:
    post:
      tags:
      - Templates
      summary: Gets all metadata of template list
      operationId: getTemplateMetadataList
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: page
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 25
      - name: sort
        in: query
        description: Specifies sorting criteria of the list. Like sorting based on the last updated entity, alphabetical sorting in an ascending or descending order
        schema:
          type: array
          items:
            type: string
      - name: searchTerm
        in: query
        description: The word to be searched and included in the list response
        schema:
          type: string
      - name: filterIdentifier
        in: query
        description: Filter Identifier
        schema:
          type: string
      - name: templateListType
