openapi: 3.2.0
info:
  title: Harness Coverage Details API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Coverage Details
paths:
  /gateway/lw/api/accounts/{account_id}/v2/coverage/details/savingsplans:
    post:
      tags:
      - Coverage Details
      summary: Get Savings Plans coverage details
      description: Returns SP coverage detail rows grouped by (service, instance_family, region). Each row contains SP-covered spend, on-demand spend and coverage percentage for the given date range.
      operationId: SPCoverageDetails
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
        description: Account Identifier for the entity.
      - name: routingId
        in: query
        required: true
        schema:
          type: string
        description: Routing identifier for request processing.
      - name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
        description: Identifier of the account.
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2025-01-01'
        description: Start date for the coverage calculation period.
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2025-01-31'
        description: End date for the coverage calculation period.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopmputeCoverageFilter'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SPCoverageDetailsResponse'
        '400':
          description: Invalid request parameters
        '500':
          description: Internal server error
  /gateway/lw/api/accounts/{account_id}/v2/coverage/details/reservedinstances:
    post:
      tags:
      - Coverage Details
      summary: Get Reserved Instances coverage details
      description: Returns RI coverage detail rows grouped by (instance_type, platform, tenancy, region). Each row contains reservation covered hours, on-demand hours, total running hours, on-demand cost and average coverage percentage for the given date range.
      operationId: RICoverageDetails
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
        description: Account Identifier for the entity.
      - name: routingId
        in: query
        required: true
        schema:
          type: string
        description: Routing identifier for request processing.
      - name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
        description: Identifier of the account.
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2025-01-01'
        description: Start date for the coverage calculation period.
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2025-01-31'
        description: End date for the coverage calculation period.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopmputeCoverageFilter'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RICoverageDetailsResponse'
        '400':
          description: Invalid request parameters
        '500':
          description: Internal server error
components:
  schemas:
    RICoverageDetailRow:
      type: object
      properties:
        instance_type:
          type: string
          description: EC2 instance type (e.g. m5.2xlarge, t3.medium)
          example: m5.2xlarge
        platform:
          type: string
          description: Operating system platform
          example: Linux/UNIX
        tenancy:
          type: string
          description: Instance tenancy (Shared, Dedicated, Host)
          example: Shared
        region:
          type: string
          description: AWS region
          example: us-east-1
        average_coverage:
          type: number
          format: double
          description: Average RI coverage percentage (0-100)
        reservation_covered_hrs:
          type: number
          format: double
          description: Hours covered by reserved instances
        on_demand_hrs:
          type: number
          format: double
          description: Hours billed at on-demand rates
        total_running_hrs:
          type: number
          format: double
          description: Total running hours (reservation covered + on-demand)
        on_demand_cost:
          type: number
          format: double
          description: Cost for on-demand hours
    CopmputeCoverageFilter:
      type: object
      properties:
        regions:
          type: array
          items:
            type: string
        instance_types:
          type: array
          items:
            type: string
        cloud_account_ids:
          type: array
          items:
            type: string
        service:
          type: string
          enum:
          - Amazon Elastic Compute Cloud - Compute
          - Amazon Relational Database Service
        sort_by:
          type: string
          description: 'Field to sort by. SP: sp_covered_spend, on_demand_spend, coverage_percentage. RI: average_coverage, reservation_covered_hrs, on_demand_hrs, total_running_hrs, on_demand_cost.'
        sort_order:
          type: string
          enum:
          - asc
          - desc
          description: Sort direction. Defaults to desc if not specified.
    RICoverageDetailsResponse:
      type: object
      properties:
        ts:
          type: integer
          format: int64
          description: Timestamp of the response
        success:
          type: boolean
          description: Indicates whether the request was successful
        errors:
          type:
          - string
          - 'null'
          description: Error message, if any
        response:
          type: array
          items:
            $ref: '#/components/schemas/RICoverageDetailRow'
          description: List of RI coverage detail rows grouped by instance type, platform, tenancy and region
    SPCoverageDetailsResponse:
      type: object
      properties:
        ts:
          type: integer
          format: int64
          description: Timestamp of the response
        success:
          type: boolean
          description: Indicates whether the request was successful
        errors:
          type:
          - string
          - 'null'
          description: Error message, if any
        response:
          type: array
          items:
            $ref: '#/components/schemas/SPCoverageDetailRow'
          description: List of SP coverage detail rows grouped by service, instance family and region
    SPCoverageDetailRow:
      type: object
      properties:
        service:
          type: string
          description: AWS service name (e.g. Amazon Elastic Compute Cloud - Compute)
          example: Amazon Elastic Compute Cloud - Compute
        instance_family:
          type: string
          description: Instance family (e.g. t3, m5)
          example: t3
        region:
          type: string
          description: AWS region
          example: us-east-1
        sp_covered_spend:
          type: number
          format: double
          description: Spend covered by savings plans
        on_demand_spend:
          type: number
          format: double
          description: On-demand spend not covered by savings plans
        coverage_percentage:
          type: number
          format: double
          description: Percentage of total spend covered by savings plans (0-100)
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
externalDocs:
