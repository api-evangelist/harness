components:
  schemas:
    ExemptionConstraints:
      type: object
      properties:
        matchedRuleId:
          type: string
          description: ID of the rule that fired. Empty string if no rule matched (request is unconstrained by policy).
          example: rule11111111111111111a
        maxDurationDays:
          type: integer
          description: Maximum duration in days that this exemption may run. Null means no cap and indefinite ("All Time") is allowed; a non-null value forbids "All Time".
          example: 7
          format: int64
          minimum: 1
      description: Constraints that apply to an exemption request for a specific issue, computed by evaluating account-level exemption rules against the issue's attributes.
      example:
        matchedRuleId: rule11111111111111111a
        maxDurationDays: 7
      required:
      - matchedRuleId
    UpdateExemptionRuleRequestBody:
      type: object
      properties:
        actions:
          type: object
          description: 'Actions to apply when the rule matches. Today: duration only. Action handlers are pluggable; see the design doc for the planned set.'
          example:
            duration:
              maxDurationDays: 3
          additionalProperties: true
        conditions:
          type: object
          description: Matcher conditions. Keys are attribute names that appear in the issue context (severity_code, type, reachability, exploitability, epss, plus anything in issue.details). Missing keys are wildcards. Each value is either an array (OR-list), an object describing a numeric range, or a scalar (equality).
          example:
            epss_score:
              gte: 90
            reachable: true
            severity_code:
            - Critical
          additionalProperties: true
        description:
          type: string
          description: Free-form rule description.
          example: Critical findings that are reachable in production must be remediated quickly; cap exemptions at 3 days.
          maxLength: 1024
        enabled:
          type: boolean
          description: 'Whether the rule is active. Disabled rules are retained and still listed, but are skipped during evaluation. OPTIONAL: defaults to true on create; on update, omit to keep the current state or send false/true to toggle.'
          example: true
        name:
          type: string
          description: Human-readable rule name. Must be unique within an account.
          example: 'Critical reachable issues: 3 days max'
          minLength: 1
          maxLength: 256
        priority:
          type: integer
          description: '0-based rank within an account. Lower fires first (first-match-wins). OPTIONAL on both create and update: if omitted on CREATE the new rule is appended at the bottom (rank = current rule count); if omitted on UPDATE the rule keeps its current rank. When supplied, send 0 to insert at the top, 1..n to insert at that rank, or any value >= rule count to land at the tail.'
          example: 0
          format: int64
          minimum: 0
        userId:
          type: string
          description: Harness User ID
          example: abcdef1234567890ghijkl
      example:
        actions:
          duration:
            maxDurationDays: 3
        conditions:
