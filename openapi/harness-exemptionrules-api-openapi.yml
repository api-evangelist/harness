    ExemptionRule:
      type: object
      properties:
        actions:
          type: object
          description: 'Actions to apply when the rule matches. Today: duration only. Action handlers are pluggable; see the design doc for the planned set.'
          example:
            duration:
              maxDurationDays: 3
          additionalProperties: true
        conditions:
          type: object
          description: Matcher conditions. Keys are attribute names that appear in the issue context (severity_code, type, reachability, exploitability, epss, plus anything in issue.details). Missing keys are wildcards. Each value is either an array (OR-list), an object describing a numeric range, or a scalar (equality).
          example:
            epss_score:
              gte: 90
            reachable: true
            severity_code:
            - Critical
          additionalProperties: true
        created:
          type: integer
          description: Unix timestamp at which the resource was created
          example: 1651578240
          format: int64
        createdBy:
          type: string
          description: ID of the user who created the rule.
          example: user111111111111111111
          pattern: ^[a-zA-Z0-9_-]{22}$
        description:
          type: string
          description: Free-form rule description.
          example: Critical findings that are reachable in production must be remediated quickly; cap exemptions at 3 days.
          maxLength: 1024
        enabled:
          type: boolean
          description: 'Whether the rule is active. Disabled rules are retained and still listed, but are skipped during evaluation. OPTIONAL: defaults to true on create; on update, omit to keep the current state or send false/true to toggle.'
          example: true
        id:
          type: string
          description: Resource identifier
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        lastModified:
          type: integer
          description: Unix timestamp at which the resource was most recently modified
          example: 1651578240
          format: int64
        lastModifiedBy:
          type: string
          description: ID of the user who last modified the rule.
          example: user111111111111111111
          pattern: ^[a-zA-Z0-9_-]{22}$
        name:
          type: string
          description: Human-readable rule name. Must be unique within an account.
          example: 'Critical reachable issues: 3 days max'
          minLength: 1
          maxLength: 256
        priority:
          type: integer
          description: '0-based rank within an account. Lower fires first (first-match-wins). OPTIONAL on both create and update: if omitted on CREATE the new rule is appended at the bottom (rank = current rule count); if omitted on UPDATE the rule keeps its current rank. When supplied, send 0 to insert at the top, 1..n to insert at that rank, or any value >= rule count to land at the tail.'
          example: 0
          format: int64
          minimum: 0
      description: An admin-defined rule that gates Exemption creation and approval. Rules are evaluated against an exemption request; if a rule matches, its actions fire — typically capping the requested duration.
      example:
        actions:
          duration:
            maxDurationDays: 3
        conditions:
          epss_score:
            gte: 90
          reachable: true
          severity_code:
          - Critical
        created: 1651578240
        createdBy: user111111111111111111
        description: Critical findings that are reachable in production must be remediated quickly; cap exemptions at 3 days.
        enabled: true
        id: abcdef1234567890ghijkl
        lastModified: 1651578240
        lastModifiedBy: user111111111111111111
        name: 'Critical reachable issues: 3 days max'
        priority: 0
      required:
      - id
      - name
      - conditions
      - actions
      - priority
      - enabled
      - createdBy
      - lastModifiedBy
      - created
      - lastModified
