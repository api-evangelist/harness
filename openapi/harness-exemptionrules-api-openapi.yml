  /sto/api/v2/exemption-rules/constraints:
    post:
      tags:
      - ExemptionRules
      summary: Get exemption constraints for issues or occurrences
      description: 'Evaluate the exemption rule engine and return the **strictest** constraint that applies to an exemption request. Pass `items[]` (max 100); a single exemption is just a one-element list. Each item self-describes its own scope and kind:


        • **target-scoped issue**: set `targetId`.

        • **pipeline-scoped issue**: set `pipelineId` (mutually exclusive with `targetId`).

        • **project-scoped issue**: set neither (scope comes from the request-level `orgId`/`projectId`).

        • **occurrence-level**: set `occurrences[]`, or set `scanId` (with `targetId`) to evaluate all non-exempted occurrences from that scan — used when "Exempt all future occurrences" is unchecked.


        Items in a single batch may mix scopes and kinds freely. The response carries the strictest matched constraint across everything evaluated: `maxDurationDays` is the minimum of every non-null per-item cap (or null if all are unconstrained), and `matchedRuleId` names the rule contributing that minimum. Optional `type` carries the FE "Reason" dropdown value (same enum as POST /exemptions.type) so rules with `reason` conditions evaluate correctly.'
      operationId: ExemptionRules#GetExemptionConstraints
      parameters:
      - name: accountId
        in: query
        description: Harness Account ID
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Harness Account ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        example: abcdef1234567890ghijkl
      - name: X-Api-Key
        in: header
        description: Harness personal or service access token
        allowEmptyValue: true
        schema:
          type: string
          description: Harness personal or service access token
          example: Quia vel porro.
        example: Fuga consectetur occaecati.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetExemptionConstraintsRequestBody'
            example:
              items:
              - issueId: abcdef1234567890ghijkl
                occurrences:
                - 101
                - 102
                pipelineId: my_pipeline
                scanId: abcdef1234567890ghijkl
                targetId: abcdef1234567890ghijkl
              - issueId: abcdef1234567890ghijkl
                occurrences:
                - 101
                - 102
                pipelineId: my_pipeline
                scanId: abcdef1234567890ghijkl
                targetId: abcdef1234567890ghijkl
              - issueId: abcdef1234567890ghijkl
                occurrences:
                - 101
                - 102
                pipelineId: my_pipeline
                scanId: abcdef1234567890ghijkl
                targetId: abcdef1234567890ghijkl
              orgId: default
              projectId: my_project
              type: False Positive
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExemptionConstraints'
              example:
                matchedRuleId: rule11111111111111111a
                maxDurationDays: 7
        '400':
          description: 'BadRequest: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: 'Bad Request: accountId parameter is required'
                status: 400
        '401':
          description: 'Unauthorized: Unauthorized response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Unauthorized
                status: 401
        '403':
          description: 'Forbidden: Forbidden response.'
          content:
            application/json:
