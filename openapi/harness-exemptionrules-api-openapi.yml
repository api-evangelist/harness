    GetExemptionConstraintsRequestBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IssueItem'
          description: Evaluation entries (max 100). Each item self-describes its scope (`targetId` / `pipelineId` / neither) and kind (`occurrences[]` present ⇒ occurrence-level). A single exemption is a one-element list. Items may mix scopes and kinds.
          example:
          - issueId: abcdef1234567890ghijkl
            occurrences:
            - 101
            - 102
            pipelineId: my_pipeline
            scanId: abcdef1234567890ghijkl
            targetId: abcdef1234567890ghijkl
          - issueId: abcdef1234567890ghijkl
            occurrences:
            - 101
            - 102
            pipelineId: my_pipeline
            scanId: abcdef1234567890ghijkl
            targetId: abcdef1234567890ghijkl
          - issueId: abcdef1234567890ghijkl
            occurrences:
            - 101
            - 102
            pipelineId: my_pipeline
            scanId: abcdef1234567890ghijkl
            targetId: abcdef1234567890ghijkl
          maxItems: 100
        orgId:
          type: string
          description: 'Harness Organization id this exemption request is scoped to. Required: the backend resolves the project hierarchy (parent_unique_id) from `orgId`/`projectId` to scope attribute resolution for project- and pipeline-level evaluation, and rules conditioned on `org_id` evaluate correctly.'
          example: default
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        projectId:
          type: string
          description: 'Harness Project id this exemption request is scoped to. Required: the backend resolves the project hierarchy (parent_unique_id) from `orgId`/`projectId` to scope attribute resolution for project- and pipeline-level evaluation, and rules conditioned on `project_id` evaluate correctly.'
          example: my_project
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        type:
          type: string
          description: Value of the FE's "Reason" dropdown — i.e. the same enum sent as `type` on POST /exemptions ("False Positive", "Acceptable Risk", "Compensating Controls", "Acceptable Use", "Fix Unavailable", "Other"). When set, it is merged into every issue's context so rules with `reason` conditions evaluate correctly. Omit if the user has not picked from the dropdown yet — rules with reason conditions will be skipped in that case. Named `type` here for parity with POST /exemptions.type; internally the rule engine surfaces it as the `reason` axis (which matches the FE dropdown label customers see).
          example: False Positive
          enum:
          - Compensating Controls
          - Acceptable Use
          - Acceptable Risk
          - False Positive
          - Fix Unavailable
          - Other
      example:
        items:
        - issueId: abcdef1234567890ghijkl
          occurrences:
          - 101
          - 102
          pipelineId: my_pipeline
          scanId: abcdef1234567890ghijkl
          targetId: abcdef1234567890ghijkl
        - issueId: abcdef1234567890ghijkl
          occurrences:
          - 101
          - 102
          pipelineId: my_pipeline
          scanId: abcdef1234567890ghijkl
          targetId: abcdef1234567890ghijkl
        - issueId: abcdef1234567890ghijkl
          occurrences:
          - 101
          - 102
          pipelineId: my_pipeline
          scanId: abcdef1234567890ghijkl
          targetId: abcdef1234567890ghijkl
        orgId: default
        projectId: my_project
        type: False Positive
      required:
      - orgId
      - projectId
