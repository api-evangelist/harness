    IssueItem:
      type: object
      properties:
        issueId:
          type: string
          description: Issue ID to evaluate.
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        occurrences:
          type: array
          items:
            type: integer
            example: 6624826437369263000
            format: int64
          description: Occurrence internal IDs being exempted. When present, this item is an occurrence-level exemption (always target-scoped, `targetId` required). When omitted but `scanId` is set, all non-exempted occurrences for the issue in that scan are evaluated.
          example:
          - 101
          - 102
        pipelineId:
          type: string
          description: Pipeline id for this item (pipeline scope). Mutually exclusive with `targetId`. Different items may target different pipelines.
          example: my_pipeline
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        scanId:
          type: string
          description: Harness Scan ID. When set with `targetId` and without `occurrences[]`, expands to all non-exempted occurrences for the issue in that scan (current-occurrences-only exemption). Mutually exclusive with `pipelineId`.
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        targetId:
          type: string
          description: Target id for this item (target scope). Required when `occurrences[]` is set. Mutually exclusive with `pipelineId`.
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
      example:
        issueId: abcdef1234567890ghijkl
        occurrences:
        - 101
        - 102
        pipelineId: my_pipeline
        scanId: abcdef1234567890ghijkl
        targetId: abcdef1234567890ghijkl
      required:
      - issueId
