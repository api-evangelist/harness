    CreateOverrideRequestBody:
      type: object
      properties:
        issueId:
          type: string
          description: The ID of the Security Issue
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        link:
          type: string
          description: Link to a related ticket
          example: https://example.com/ABC-1234
          maxLength: 1024
        occurrences:
          type: array
          items:
            type: integer
            example: 8505674625192631000
            format: int64
          description: Array of occurrence Ids
          example:
          - 42
          - 666
        overrideFieldName:
          type: string
          description: Name of the field that is being overridden
          example: severity
          maxLength: 1024
        overrideFieldValue:
          type: string
          description: Value of the field that is being overridden
          example: Low
          maxLength: 1024
        overrideFutureOccurrences:
          type: boolean
          description: States if the user wants to override future occurrences of the issue
          default: true
          example: false
        pipelineId:
          type: string
          description: Harness Pipeline ID
          example: example_pipeline
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        reason:
          type: string
          description: Text describing why this override is necessary
          example: Waiting on upstream bug fix
          maxLength: 1024
        requesterId:
          type: string
          description: User ID of the user who requested this Exemption
          example: user111111111111111111
        scanId:
          type: string
          description: ID of the Harness Scan to determine all the occurrences for the scan-issue
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        search:
          type: string
          description: Search parameter to find filtered occurrences of the issue
          example: CWE-123,5
          maxLength: 256
        targetId:
          type: string
          description: Associated Target ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
      example:
        issueId: abcdef1234567890ghijkl
        link: https://example.com/ABC-1234
        occurrences:
        - 42
        - 666
        overrideFieldName: severity
        overrideFieldValue: Low
        overrideFutureOccurrences: false
        pipelineId: example_pipeline
        reason: Waiting on upstream bug fix
        requesterId: user111111111111111111
        scanId: abcdef1234567890ghijkl
        search: CWE-123,5
        targetId: abcdef1234567890ghijkl
      required:
      - issueId
      - reason
      - requesterId
      - overrideFieldName
      - overrideFieldValue
      - status
