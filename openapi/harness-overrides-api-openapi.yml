openapi: 3.2.0
info:
  title: Harness Overrides API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Overrides
  description: This contains APIs related to Overrides
paths:
  /ng/api/overrides:
    put:
      tags:
      - Overrides
      summary: Update an Override Entity
      operationId: updateOverride
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the Override to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
            examples:
              Update:
                summary: Sample Override update request
                description: Sample Override Request
                value:
                  orgIdentifier: defaultOrgId
                  projectIdentifier: defaultProjId
                  environmentRef: defaultEnvRef
                  serviceRef: defaultServiceRef
                  infraIdentifier: defaultInfraId
                  type: ENV_SERVICE_OVERRIDE
                  yaml: "overrides:\n  variables:\n    - name: v1\n      type: String\n      value: val1\n  manifests:\n    - manifest:\n        identifier: manifest1\n        type: K8sManifest\n        spec:\n          store:\n            type: Github\n            spec:\n              connectorRef: abcdConnector\n              gitFetchType: Branch\n              paths:\n                - files1\n              repoName: abcd\n              branch: master\n          skipResourceVersioning: false\n  configFiles:\n    - configFile:\n        identifier: configFile1\n        spec:\n          store:\n            type: Harness\n            spec:\n              files:\n                - /abcd\n"
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the updated Override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOOverrideResponse'
    post:
      tags:
      - Overrides
      summary: Create an Override Entity
      operationId: createOverride
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the Override to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
            examples:
              Create:
                summary: Sample Override update request
                description: Sample Override Request
                value:
                  orgIdentifier: defaultOrgId
                  projectIdentifier: defaultProjId
                  environmentRef: defaultEnvRef
                  serviceRef: defaultServiceRef
                  infraIdentifier: defaultInfraId
                  type: ENV_SERVICE_OVERRIDE
                  yaml: "overrides:\n  variables:\n    - name: v1\n      type: String\n      value: val1\n  manifests:\n    - manifest:\n        identifier: manifest1\n        type: K8sManifest\n        spec:\n          store:\n            type: Github\n            spec:\n              connectorRef: abcdConnector\n              gitFetchType: Branch\n              paths:\n                - files1\n              repoName: abcd\n              branch: master\n          skipResourceVersioning: false\n  configFiles:\n    - configFile:\n        identifier: configFile1\n        spec:\n          store:\n            type: Harness\n            spec:\n              files:\n                - /abcd\n"
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the created Override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOOverrideResponse'
  /ng/api/overrides/{identifier}:
    get:
      tags:
      - Overrides
      summary: Gets Overrides by Identifier
      operationId: getOverridesViaIdentifier
      parameters:
      - name: identifier
        in: path
        description: Identifier of the Override Entity.
        required: true
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the Override by the identifier and scope derived from accountId, org identifier and project identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOOverrideResponse'
    delete:
      tags:
      - Overrides
      summary: Delete a Override entity
      operationId: deleteOverride
      parameters:
      - name: identifier
        in: path
        description: Identifier of the Override Entity.
        required: true
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns true if the Override is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
  /ng/api/overrides/move-config:
    post:
      tags:
      - Overrides
      summary: Move Override YAML from inline to remote or remote to inline
      operationId: OverrideMoveConfigs
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          type: string
      - name: repoName
        in: query
        description: Name of the repository.
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: isNewBranch
        in: query
        description: Checks the new branch
        schema:
          type: boolean
          default: false
      - name: baseBranch
        in: query
        description: Name of the default branch.
        schema:
          type: string
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
          default: false
      - name: moveConfigType
        in: query
        description: Tells weather the entity has to be moved from inline to remote or remote to inline
        schema:
          type: string
          enum:
          - INLINE_TO_REMOTE
          - REMOTE_TO_INLINE
      - name: environmentRef
        in: query
        description: Environment Reference for the Entity.
        schema:
          type: string
      - name: serviceRef
        in: query
        description: Service Reference for Entity
        schema:
          type: string
      - name: infraIdentifier
        in: query
        description: infraIdentifier
        schema:
          type: string
      - name: serviceOverridesType
        in: query
        description: Type of the override which is based on source of overrides
        schema:
          type: string
          enum:
          - ENV_GLOBAL_OVERRIDE
          - ENV_SERVICE_OVERRIDE
          - INFRA_GLOBAL_OVERRIDE
          - INFRA_SERVICE_OVERRIDE
          - CLUSTER_GLOBAL_OVERRIDE
          - CLUSTER_SERVICE_OVERRIDE
      - name: identifier
        in: query
        description: Service Overrides Identifier. Can be user-provided during creation; if omitted, auto-generated from environmentRef, serviceRef, and infraIdentifier based on override type.
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Fetches Override YAML from Harness DB and creates a remote entity or Fetches Override YAML from remote repository and creates a inline entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOServiceOverrideMoveConfigResponse'
  /ng/api/overrides/update-git-metadata:
    put:
      tags:
      - Overrides
      summary: Update git-metadata in remote Override Entity
      description: Update git-metadata in remote Override and returns the identifier of updated Override
      operationId: updateOverrideGitDetails
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: identifier
        in: query
        description: Service Overrides Identifier. Can be user-provided during creation; if omitted, auto-generated from environmentRef, serviceRef, and infraIdentifier based on override type.
        schema:
          type: string
      - name: environmentRef
        in: query
        description: Environment Reference for the Entity.
        schema:
          type: string
      - name: serviceRef
        in: query
        description: Service Reference for Entity
        schema:
          type: string
      - name: infraIdentifier
        in: query
        description: infraIdentifier
        schema:
          type: string
      - name: serviceOverridesType
        in: query
        description: Type of the override which is based on source of overrides
        schema:
          type: string
          enum:
          - ENV_GLOBAL_OVERRIDE
          - ENV_SERVICE_OVERRIDE
          - INFRA_GLOBAL_OVERRIDE
          - INFRA_SERVICE_OVERRIDE
          - CLUSTER_GLOBAL_OVERRIDE
          - CLUSTER_SERVICE_OVERRIDE
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          $ref: '#/components/schemas/GitMetadataUpdateRequestInfo'
      - name: repoName
        in: query
        description: Name of the repository.
        schema:
          $ref: '#/components/schemas/GitMetadataUpdateRequestInfo'
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          $ref: '#/components/schemas/GitMetadataUpdateRequestInfo'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns identifier and associated environmentRef, serviceRef and infraIdentifier of updated Override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOServiceOverrideGitUpdateResponse'
  /sto/api/v2/overrides:
    get:
      tags:
      - Overrides
      description: List a collection of Overrides
      operationId: Overrides#ListOverrides
      parameters:
      - name: accountId
        in: query
        description: Harness Account ID
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Harness Account ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        example: abcdef1234567890ghijkl
      - name: page
        in: query
        description: Page number to fetch (starting from 0)
        allowEmptyValue: true
        schema:
          type: integer
          description: Page number to fetch (starting from 0)
          default: 0
          example: 4
          format: int64
          minimum: 0
        example: 4
      - name: pageSize
        in: query
        description: Number of results per page
        allowEmptyValue: true
        schema:
          type: integer
          description: Number of results per page
          default: 30
          example: 50
          format: int64
          minimum: 1
          maximum: 100
        example: 50
      - name: orgId
        in: query
        description: Harness Organization ID
        allowEmptyValue: true
        schema:
          type: string
          description: Harness Organization ID
          example: example_org
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        example: example_org
      - name: projectId
        in: query
        description: Harness Project ID
        allowEmptyValue: true
        schema:
          type: string
          description: Harness Project ID
          example: example_project
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        example: example_project
      - name: X-Api-Key
        in: header
        description: Harness personal or service access token
        allowEmptyValue: true
        schema:
          type: string
          description: Harness personal or service access token
          example: Voluptas delectus quia.
        example: Quia nam error doloremque nesciunt est.
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverridesListOverridesResponseBody'
              example:
                pagination:
                  link: ''
                  page: 4
                  pageSize: 20
                  totalItems: 230
                  totalPages: 12
                results:
                - approverId: user111111111111111111
                  created: 1651578240
                  id: abcdef1234567890ghijkl
                  isDeleted: true
                  issueId: abcdef1234567890ghijkl
                  lastModified: 1651578240
                  link: https://example.com/ABC-1234
                  occurrences:
                  - 42
                  - 666
                  orgId: example_org
                  overrideFieldName: severity
                  overrideFieldValue: Low
                  pipelineId: example_pipeline
                  projectId: example_project
                  reason: Waiting on upstream bug fix
                  requesterId: user111111111111111111
                  scanId: abcdef1234567890ghijkl
                  scope: PROJECT
                  search: CWE-123,5
                  status: Approved
                  targetId: abcdef1234567890ghijkl
                - approverId: user111111111111111111
                  created: 1651578240
                  id: abcdef1234567890ghijkl
                  isDeleted: true
                  issueId: abcdef1234567890ghijkl
                  lastModified: 1651578240
                  link: https://example.com/ABC-1234
                  occurrences:
                  - 42
                  - 666
                  orgId: example_org
                  overrideFieldName: severity
                  overrideFieldValue: Low
                  pipelineId: example_pipeline
                  projectId: example_project
                  reason: Waiting on upstream bug fix
                  requesterId: user111111111111111111
                  scanId: abcdef1234567890ghijkl
                  scope: PROJECT
                  search: CWE-123,5
                  status: Approved
                  targetId: abcdef1234567890ghijkl
                - approverId: user111111111111111111
                  created: 1651578240
                  id: abcdef1234567890ghijkl
                  isDeleted: true
                  issueId: abcdef1234567890ghijkl
                  lastModified: 1651578240
                  link: https://example.com/ABC-1234
                  occurrences:
                  - 42
                  - 666
                  orgId: example_org
                  overrideFieldName: severity
                  overrideFieldValue: Low
                  pipelineId: example_pipeline
                  projectId: example_project
                  reason: Waiting on upstream bug fix
                  requesterId: user111111111111111111
                  scanId: abcdef1234567890ghijkl
                  scope: PROJECT
                  search: CWE-123,5
                  status: Approved
                  targetId: abcdef1234567890ghijkl
        '400':
          description: 'BadRequest: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: 'Bad Request: accountId parameter is required'
                status: 400
        '401':
          description: 'Unauthorized: Unauthorized response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Unauthorized
                status: 401
        '403':
          description: 'Forbidden: Forbidden response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Forbidden
                status: 403
        '404':
          description: 'NotFound: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Not Found
                status: 404
        '429':
          description: 'TooManyRequests: Too Many Requests response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Too Many Requests
                status: 429
        '500':
          description: 'InternalServerError: Internal Server Error response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Internal Server Error
                status: 500
      security:
      - X-Api-Key_header_X-Api-Key: []
        jwt_header_Authorization:
        - sto_issue_view
      summary: Overrides#List overrides
      x-summary-source: derived
    post:
      tags:
      - Overrides
      description: Create a new Override
      operationId: Overrides#CreateOverride
      parameters:
      - name: accountId
        in: query
        description: Harness Account ID
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Harness Account ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        example: abcdef1234567890ghijkl
      - name: orgId
        in: query
        description: Harness Organization ID
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Harness Organization ID
          example: example_org
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        examples:
          default:
            summary: default
            value: example_org
      - name: projectId
        in: query
        description: Harness Project ID
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Harness Project ID
          example: example_project
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        examples:
          default:
            summary: default
            value: example_project
      - name: X-Api-Key
        in: header
        description: Harness personal or service access token
        allowEmptyValue: true
        schema:
          type: string
          description: Harness personal or service access token
          example: Ut excepturi quis repellendus suscipit voluptas incidunt.
        example: Commodi soluta et mollitia suscipit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOverrideRequestBody'
            example:
              issueId: abcdef1234567890ghijkl
              link: https://example.com/ABC-1234
              occurrences:
              - 42
              - 666
              overrideFieldName: severity
              overrideFieldValue: Low
              overrideFutureOccurrences: false
              pipelineId: example_pipeline
              reason: Waiting on upstream bug fix
              requesterId: user111111111111111111
              scanId: abcdef1234567890ghijkl
              search: CWE-123,5
              targetId: abcdef1234567890ghijkl
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResult'
              example:
                id: abcdef1234567890ghijkl
        '400':
          description: 'BadRequest: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: 'Bad Request: accountId parameter is required'
                status: 400
        '401':
          description: 'Unauthorized: Unauthorized response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Unauthorized
                status: 401
        '403':
          description: 'Forbidden: Forbidden response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Forbidden
                status: 403
        '429':
          description: 'TooManyRequests: Too Many Requests response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Too Many Requests
                status: 429
        '500':
          description: 'InternalServerError: Internal Server Error response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                message: Internal Server Error
                status: 500
      security:
      - X-Api-Key_header_X-Api-Key: []
        jwt_header_Authorization:
        - sto_issue_view
      summary: Overrides#Create override
      x-summary-source: derived
  /sto/api/v2/overrides/{id}:
    delete:
      description: Delete an existing Override
      operationId: Overrides#DeleteOverride
      parameters:
      - allowEmptyValue: true
        description: Harness Account ID
        example: abcdef1234567890ghijkl
        in: query
        name: accountId
        required: true
        schema:
          description: Harness Account ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
      - allowEmptyValue: true
        description: Harness Organization ID
        examples:
          default:
            summary: default
            value: example_org
        in: query
        name: orgId
        schema:
          description: Harness Organization ID
          example: example_org
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      - allowEmptyValue: true
        description: Harness Project ID
        examples:
          default:
            summary: default
            value: example_project
        in: query
        name: projectId
        schema:
          description: Harness Project ID
          example: example_project
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          type: string
      - description: The ID of the Override to delete
        example: abcdef1234567890ghijkl
        in: path
        name: id
        required: true
        schema:
          description: The ID of the Override to delete
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
      requestBody:
        content:
          application/json:
            example:
              overrideFieldName: severity
            schema:
              $ref: '#/components/schemas/DeleteOverrideRequestBody'
        required: true
      responses:
        '204':
          description: No Content response.
        '400':
          content:
            application/json:
              example:
                message: 'Bad Request: accountId parameter is required'
                status: 400
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'BadRequest: Bad Request response.'
        '401':
          content:
            application/json:
              example:
                message: Unauthorized
                status: 401
              schema:
                $ref: '#/components/schemas/NotFound'
          description: 'Unauthorized: Unauthorized response.'
        '403':
          content:
            application/json:
              example:
                message: Forbidden
                status: 403
              schema:
                $ref: '#/components/schemas/NotFound'
