    Override:
      type: object
      properties:
        approverId:
          type: string
          description: User ID of the user who approved this Exemption
          example: user111111111111111111
        created:
          type: integer
          description: Unix timestamp at which the resource was created
          example: 1651578240
          format: int64
        id:
          type: string
          description: Resource identifier
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        isDeleted:
          type: boolean
          description: States if the override is deleted
          default: false
          example: true
        issueId:
          type: string
          description: The ID of the Security Issue
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        lastModified:
          type: integer
          description: Unix timestamp at which the resource was most recently modified
          example: 1651578240
          format: int64
        link:
          type: string
          description: Link to a related ticket
          example: https://example.com/ABC-1234
          maxLength: 1024
        occurrences:
          type: array
          items:
            type: integer
            example: 9001076306294176000
            format: int64
          description: Array of occurrence Ids
          example:
          - 42
          - 666
        orgId:
          type: string
          description: Harness Organization ID
          example: example_org
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        overrideFieldName:
          type: string
          description: Name of the field that is being overridden
          example: severity
          maxLength: 1024
        overrideFieldValue:
          type: string
          description: Value of the field that is being overridden
          example: Low
          maxLength: 1024
        pipelineId:
          type: string
          description: Harness Pipeline ID
          example: example_pipeline
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        projectId:
          type: string
          description: Harness Project ID
          example: example_project
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          maxLength: 128
        reason:
          type: string
          description: Text describing why this override is necessary
          example: Waiting on upstream bug fix
          maxLength: 1024
        requesterId:
          type: string
          description: User ID of the user who requested this Exemption
          example: user111111111111111111
        scanId:
          type: string
          description: ID of the Harness Scan to determine all the occurrences for the scan-issue
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        scope:
          type: string
          description: States the scope for the override
          example: PROJECT
          enum:
          - PROJECT
          - TARGET
        search:
          type: string
          description: Search parameter to find filtered occurrences of the issue
          example: CWE-123,5
          maxLength: 256
        status:
          type: string
          description: Approval status of Override
          default: Pending
          example: Pending
          enum:
          - Pending
          - Approved
          - Rejected
          - Expired
          - Canceled
        targetId:
          type: string
          description: Associated Target ID
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
      description: Information about an Override
      example:
        approverId: user111111111111111111
        created: 1651578240
        id: abcdef1234567890ghijkl
        isDeleted: true
        issueId: abcdef1234567890ghijkl
        lastModified: 1651578240
        link: https://example.com/ABC-1234
        occurrences:
        - 42
        - 666
        orgId: example_org
        overrideFieldName: severity
        overrideFieldValue: Low
        pipelineId: example_pipeline
        projectId: example_project
        reason: Waiting on upstream bug fix
        requesterId: user111111111111111111
        scanId: abcdef1234567890ghijkl
        scope: PROJECT
        search: CWE-123,5
        status: Canceled
        targetId: abcdef1234567890ghijkl
      required:
      - issueId
      - reason
      - requesterId
      - overrideFieldName
      - overrideFieldValue
      - status
