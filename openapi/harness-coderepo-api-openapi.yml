openapi: 3.2.0
info:
  title: Harness Code Repo API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: codeRepo
paths:
  /v1/orgs/{org}/projects/{project}/code-repos/list:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    post:
      summary: List All Code Repositories
      operationId: codeRepositoriesList
      responses:
        '200':
          $ref: '#/components/responses/CodeRepositoryListingResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      tags:
      - codeRepo
      description: List Code Repositories
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Order2'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          type: string
          enum:
          - name
          - last_scan
          - compliance_results
          default: last-scan
      security:
      - x-api-key: []
      requestBody:
        $ref: '#/components/requestBodies/CodeRepositoryListingRequestBody'
      x-stoplight:
        id: r38yb2r4uttwp
  /v1/orgs/{org}/projects/{project}/code-repos/{code-repo}/overview:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - schema:
        type: string
      name: code-repo
      in: path
      required: true
      description: Code repository ID
    get:
      summary: Get Code Repository Overview
      tags:
      - codeRepo
      responses:
        '200':
          $ref: '#/components/responses/CodeRepositoryOverviewResponseBody'
      operationId: getCodeRepositoryOverview
      x-stoplight:
        id: q2jzrwo3zf8o7
      description: This API provides overview details of code repository.
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
  /v1/orgs/{org}/projects/{project}/code-repos/{code-repo}/rules/evalution-trend:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - schema:
        type: string
      name: code-repo
      in: path
      required: true
      description: Code Repository ID
    - $ref: '#/components/parameters/AccountHeader6'
    get:
      summary: GET Repo Rules Evaluation Trend
      tags:
      - codeRepo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CodeRepoRulesEvaluation'
      operationId: getRepoRulesEvaluationTrend
      x-stoplight:
        id: 8105jf556pwz3
      security:
      - x-api-key: []
      parameters:
      - schema:
          type: integer
          format: int64
        in: query
        name: start_time
        description: Start Time
        required: true
      - schema:
          type: integer
          format: int64
        in: query
        name: end_time
        description: End Time
  /v1/orgs/{org}/projects/{project}/code-repos/summary:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    get:
      summary: GET All Repositories Summary
      tags:
      - codeRepo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoriesSummary'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      operationId: getAllRepositoriesSummary
      x-stoplight:
        id: 6i10swrdmen5o
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
