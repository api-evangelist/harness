      - error
    CacheResponse:
      type: object
      properties:
        cache_state:
          type: string
          description: Cache state (UNKNOWN_STATE, VALID_CACHE, STALE_CACHE)
          example: STALE_CACHE
        is_sync_enabled:
          type: boolean
          description: Whether sync is enabled for this resource
          example: true
        last_updated_at:
          type: integer
          description: Timestamp (millis) when cache was last updated
          example: 1773917288158
          format: int64
        ttl_left:
          type: integer
          description: Remaining time-to-live in milliseconds
          example: 258234442
          format: int64
      description: Cache metadata from GitX getFile RPC
      example:
        cache_state: STALE_CACHE
        is_sync_enabled: true
        last_updated_at: 1773917288158
        ttl_left: 258234442
    EvaluateRequestBody:
      type: object
      properties:
        input:
          description: Input to evaluate
          example:
            message: everyone
        rego:
          type: string
          description: Arbitrary rego to be evaluated
          example: 'package test

            deny["should say hello world"] {input.message != "world"}'
          minLength: 1
      example:
        input:
          message: everyone
        rego: 'package test

          deny["should say hello world"] {input.message != "world"}'
      required:
      - rego
      - input
