      required:
      - identifier
      - name
      - rego
      - created
      - updated
      - account_id
      - org_id
      - project_id
    EvaluatedPolicy:
      type: object
      properties:
        deny_messages:
          type: array
          items:
            type: string
            example: Iste et dolores repellat atque est.
          description: The values of any `deny` rego rules as returned by the rego engine
          example:
          - deployment stage 'example-stage' does not have a HarnessApproval step
          - deployment stage 'example-stage' has step 'run-script' that is forbidden type 'ShellScript'
        error:
          type: string
          description: Any errors returned by the rego engine when this policy was evaluated
          example: 'policy.rego:25: rego_parse_error: non-terminated string m == "test'
        output:
          description: The output returned by the rego engine when this policy was evaluated
          example: "{\n    \"deny\": [\n        \"deployment stage 'deploy' does not have a HarnessApproval step\"\n    ],\n    \"stages_with_approval\": []\n}"
        policy:
          $ref: '#/components/schemas/PolicyManagementPolicy'
        policy_severity:
          type: string
          description: The severity of the policy that was selected while creating the policyset
          example: Warn & Continue
          enum:
          - Warn & Continue
          - Error & Exit
        status:
          type: string
          description: The overall status for this individual policy indicating whether it passed
          example: error
          enum:
          - error
          - warning
          - pass
          - pending
