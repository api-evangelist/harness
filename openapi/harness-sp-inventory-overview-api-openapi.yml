openapi: 3.2.0
info:
  title: Harness SP Inventory Overview API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: SP Inventory Overview
paths:
  /gateway/lw/api/accounts/{account_id}/v2/inventory/sp/overview:
    post:
      tags:
      - SP Inventory Overview
      summary: Get Savings Plans Inventory Overview
      description: Fetches overview of Savings Plans inventory including total counts, distribution, status, and pending actions
      operationId: GetSPInventoryOverview
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
        description: Account Identifier for the Entity
      - name: routingId
        in: query
        required: true
        schema:
          type: string
        description: Routing identifier for request processing
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
          example: '2024-01-01'
        description: Start date for the inventory period
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          example: '2025-08-30'
        description: End date for the inventory period
      requestBody:
        description: Optional filters for the SP inventory
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventorySPAPIFilter'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SPInventoryOverviewResponse'
        '400':
          description: Invalid request parameters
components:
  schemas:
    ActionsBreakdown:
      type: object
      properties:
        pending_approval:
          $ref: '#/components/schemas/StatusCount'
    PlanTypeDistribution:
      type: object
      properties:
        ec2_instance_savings_plans:
          $ref: '#/components/schemas/TypeCount'
        compute_savings_plans:
          $ref: '#/components/schemas/TypeCount'
        sage_maker_savings_plans:
          $ref: '#/components/schemas/TypeCount'
    InventorySPAPIFilter:
      type: object
      properties:
        account_ids:
          type: array
          items:
            type: string
          description: List of provider account IDs
        cloud_account_ids:
          type: array
          items:
            type: string
          description: List of cloud account IDs
        instance_families:
          type: array
          items:
            type: string
          description: List of instance families
        payment_options:
          type: array
          items:
            type: string
            enum:
            - No Upfront
            - Partial Upfront
            - All Upfront
          description: List of payment options
        terms:
          type: array
          items:
            type: number
            format: float64
          description: List of term lengths in years
        plan_types:
          type: array
          items:
            type: string
            enum:
            - ComputeSavingsPlans
            - EC2InstanceSavingsPlans
            - SageMakerSavingsPlans
          description: List of Savings Plan types
        status:
          type: array
          items:
            type: string
            enum:
            - active
            - expired
            - pending
            - retired
          description: List of statuses
        is_harness_managed:
          type:
          - boolean
          - 'null'
          description: Filter by Harness managed status
        service:
          type: string
          description: Service to filter by
        regions:
          type: array
          items:
            type: string
          description: List of regions
    StatusCount:
      type: object
      properties:
        count:
          type: integer
          description: Count of items in this status
        label:
          type: string
          description: Display label for the status
    SPInventoryOverviewResponse:
      type: object
      properties:
        ts:
          type: integer
          description: Response timestamp
        success:
          type: boolean
          description: Indicates if the request was successful
        errors:
          type:
          - string
          - 'null'
          description: Error details, if any
        response:
          $ref: '#/components/schemas/SPInventoryOverview'
    SPDistribution:
      type: object
      properties:
        purchased:
          $ref: '#/components/schemas/PlanTypeDistribution'
        managed:
          $ref: '#/components/schemas/PlanTypeDistribution'
    TotalCount:
      type: object
      properties:
        purchased:
          type: integer
          description: Total number of purchased RIs
        managed:
          type: integer
          description: Total number of managed RIs
    StatusBreakdown:
      type: object
      properties:
        expired:
          $ref: '#/components/schemas/StatusCount'
        expiring_soon:
          $ref: '#/components/schemas/StatusCount'
        active:
          $ref: '#/components/schemas/StatusCount'
    TypeCount:
      type: object
      properties:
        count:
          type: integer
          description: Number of instances of this type
        percentage:
          type: number
          format: float
          description: Percentage of total instances
    SPInventoryOverview:
      type: object
      properties:
        total:
          $ref: '#/components/schemas/TotalCount'
        distribution:
          $ref: '#/components/schemas/SPDistribution'
        status:
          $ref: '#/components/schemas/StatusBreakdown'
        actions:
          $ref: '#/components/schemas/ActionsBreakdown'
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
