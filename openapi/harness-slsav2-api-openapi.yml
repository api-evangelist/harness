openapi: 3.2.0
info:
  title: Harness Slsa V2 API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: slsaV2
paths:
  /v2/orgs/{org}/projects/{project}/provenance/{provenance}:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/ProvenanceId'
    servers: []
    post:
      summary: Save Provenance
      tags:
      - slsaV2
      security:
      - x-api-key: []
      responses:
        '200':
          $ref: '#/components/responses/SaveResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      operationId: saveProvenanceV2
      x-stoplight:
        id: qxnsz67gv81xu
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      requestBody:
        $ref: '#/components/requestBodies/ProvenanceRequestBodyV2'
  /v2/orgs/{org}/projects/{project}/slsa-verification/{provenance}:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/ProvenanceId'
    post:
      summary: Save SLSA Verification Status
      tags:
      - slsaV2
      responses:
        '200':
          $ref: '#/components/responses/SaveResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      operationId: saveSlsaVerificationV2
      security:
      - x-api-key: []
      x-stoplight:
        id: 3fps8yinohu8r
      requestBody:
        $ref: '#/components/requestBodies/SLSAVerificationRequestBodyV2'
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
components:
  schemas:
    ExecutionDetail:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/ExecutionType'
        github:
          $ref: '#/components/schemas/GithubExecutionDetail'
        harness:
          $ref: '#/components/schemas/HarnessExecutionDetail'
    ArtifactModelPipeline:
      title: ArtifactModelPipeline
      x-stoplight:
        id: 61ctnoe7t4ss3
      type: object
      properties:
        id:
          type: string
          x-stoplight:
            id: yefth9vlf9svq
        type:
          type: string
          x-stoplight:
            id: tv59jsryuwpbn
          enum:
          - image
          - repository
        name:
          type: string
          x-stoplight:
            id: 1pqx5aj5zkzlf
        registry_url:
          type: string
          x-stoplight:
            id: 2d0pchss1tcw3
        variant:
          $ref: '#/components/schemas/ArtifactVariant'
        tag:
          type: string
          x-stoplight:
            id: 69micl0vn4rn8
        digest:
          type: string
          x-stoplight:
            id: 6z1z7v5v1zv5z
        metadata:
          type: object
          additionalProperties: true
          x-stoplight:
            id: bcmiu856m2sf8
        source_id:
          type: string
          x-stoplight:
            id: fstrqsl3noow2
    GithubExecutionDetail:
      title: GithubExecutionDetail
      x-stoplight:
        id: nfcbibnr1z2rw
      type: object
      properties:
        repository:
          type: string
          x-stoplight:
            id: sac861lasuewn
        github_action:
          type: string
          x-stoplight:
            id: l8azkn1th708h
        action_path:
          type: string
          x-stoplight:
            id: twcllxr8bibkc
        job_id:
          type: string
          x-stoplight:
            id: gxvhjwmosdutz
        run_id:
          type: string
          x-stoplight:
            id: cunrcn7ohnpy2
        workflow_ref:
          type: string
          x-stoplight:
            id: gnclwe27klokp
        runner_detail:
          $ref: '#/components/schemas/GithubRunner'
      description: Github Pipeline Execution Details
    ProvenanceRequestBodyV2:
      title: ProvenanceRequestBody
      x-stoplight:
        id: 7fk0tu5tr18ey
      type: object
      required:
      - provenance_data
      properties:
        artifact:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactModelPipeline'
        provenance_data:
          type: string
          x-stoplight:
            id: dhufvf7s3aoh6
        execution_context:
          $ref: '#/components/schemas/ExecutionDetail'
    HarnessRunner:
      title: HarnessRunner
      x-stoplight:
        id: vfsaqcya7qwfx
      type: object
      properties:
        trigger_type:
          type: string
          x-stoplight:
            id: rzkmd5bqoc9r9
        trigger_by_id:
          type: string
          x-stoplight:
            id: b36ytjxzv2yq6
        trigger_by_name:
          type: string
          x-stoplight:
            id: a7g4t02vts8gf
    ArtifactVariant:
      title: ArtifactVariant
      x-stoplight:
        id: uyb3jwhgs9wjh
      type: object
      properties:
        type:
          type: string
          x-stoplight:
            id: 2r8lmxejmwqbf
          enum:
          - tag
          - branch
          - gitTag
          - commit
          description: type of the variant of the artifact.
        value:
          type: string
          x-stoplight:
            id: hd1p3s7bugn88
          description: Value of the variant of the artifact.
    SLSAVerificationRequestBodyV2:
      title: SLSAVerificationRequestBody
      x-stoplight:
        id: 8t7dukf8hgxhy
      type: object
      required:
      - provenance_data
      properties:
        artifact:
          $ref: '#/components/schemas/ArtifactModelPipeline'
        verification_status:
          type: string
          x-stoplight:
            id: qqz5h836cnx7p
          enum:
          - passed
          - failed
        provenance_data:
          type: string
          x-stoplight:
            id: 0hfc9st05b64o
        execution_context:
          $ref: '#/components/schemas/ExecutionDetail'
    ExecutionType:
      type: string
      enum:
      - harness
      - github
    SaveResponse:
      title: SaveResponse
      x-stoplight:
        id: uqzrp59icfge8
      type: object
      description: 'response for Save/Update operations '
      properties:
        status:
          type: string
          x-stoplight:
            id: 0kwqjkjtppozz
        response:
          $ref: '#/components/schemas/PluginResponseBody'
    PluginResponseBody:
      title: PluginResponseBody
      type: object
      required:
      - source_id
      - artifact
      - response_url
      properties:
        source_id:
          type: string
          x-stoplight:
            id: itkxv1ghux6aa
        artifact:
          type: object
          x-stoplight:
            id: ysaq85xiuzjsw
          properties:
            id:
              type: string
              x-stoplight:
                id: sgyd78hu7w5gl
            name:
              type: string
              x-stoplight:
                id: khrj2i162jh3x
            url:
              type: string
              x-stoplight:
                id: zgc35mjt90crt
        response_url:
          type: string
          x-stoplight:
            id: uadidz06nvmyn
    GithubRunner:
      title: GithubRunner
      x-stoplight:
        id: 32axq2gn4gemv
      type: object
      properties:
        name:
          type: string
          x-stoplight:
            id: x0aeloqpvaybd
        account_id:
          type: string
          x-stoplight:
            id: aod8pc43fmjbt
    HarnessExecutionDetail:
      title: HarnessExecutionDetail
      x-stoplight:
        id: 26kpn09zundb0
      type: object
      properties:
        org:
          type: string
          x-stoplight:
            id: zf78rh1u21y55
        project:
          type: string
          x-stoplight:
            id: lghyhop0hsg0f
        pipeline_execution_id:
          type: string
          x-stoplight:
            id: svsw1myd4slwa
        pipeline_id:
          type: string
          x-stoplight:
            id: 6ms1cohmjf8rv
        pipeline_name:
          type: string
          x-stoplight:
            id: qecka5f2dfvxx
        sequence_id:
          type: string
          x-stoplight:
            id: tvb3c7trq28pt
        step_id:
          type: string
          x-stoplight:
            id: bj8ul3cpt9061
        step_execution_id:
          type: string
          x-stoplight:
            id: eyon9kxjzpuu5
        step_name:
          type: string
          x-stoplight:
            id: li446ik3qfg8l
        stage_id:
          type: string
          x-stoplight:
            id: uk4e6msb1annk
        stage_execution_id:
          type: string
          x-stoplight:
            id: ltrcdcpqky4rv
        stage_name:
          type: string
          x-stoplight:
            id: n27q5wlhtrd65
        stage_type:
          type: string
          x-stoplight:
            id: 22ha61i5fiwzc
          description: Stage type in which the step executed
        runner_detail:
          $ref: '#/components/schemas/HarnessRunner'
      description: Harness Pipeline Execution Details
  parameters:
    OrgParam1:
      name: org
      in: path
      required: true
      schema:
        type: string
      description: Harness organization ID
    AccountHeader6:
      name: Harness-Account
      in: header
      required: true
      schema:
        type: string
      description: Identifier field of the account the resource is scoped to. This is required for Authorization methods other than the x-api-key header. If you are using the x-api-key header, this can be skipped.
    ProjectParam1:
      in: path
      required: true
      schema:
        type: string
      description: Harness project ID
      name: project
    ProvenanceId:
      name: provenance
      in: path
      required: true
      schema:
        type: string
      description: Provenance Id
  requestBodies:
    SLSAVerificationRequestBodyV2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SLSAVerificationRequestBodyV2'
    ProvenanceRequestBodyV2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProvenanceRequestBodyV2'
  responses:
    SaveResponse:
      description: Example response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SaveResponse'
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
