openapi: 3.2.0
info:
  title: Harness Permissions API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Permissions
  description: This contains the APIs related to permissions
paths:
  /authz/api/permissions:
    get:
      tags:
      - Permissions
      summary: List Permissions
      description: Get all permissions in a scope or all permissions in the system
      operationId: getPermissionList
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: scopeFilterDisabled
        in: query
        description: This is to enable or disable filtering by scope. The default value is false. If the value is true, all the permissions in the system are fetched.
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AuthzError'
        default:
          description: List of all permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOListPermissionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOListPermissionResponse'
  /authz/api/permissions/resourcetypes:
    get:
      tags:
      - Permissions
      summary: List Resource Types
      description: Get all resource types for permissions in a scope or in the system.
      operationId: getPermissionResourceTypesList
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: scopeFilterDisabled
        in: query
        description: This is to enable or disable filtering by scope. The default value is false. If the value is true, all the permissions in the system are fetched.
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AuthzError'
        default:
          description: List of resource types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOSetString'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOSetString'
components:
  schemas:
    ResponseDTOListPermissionResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
          - ERROR
        data:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
        metaData:
          type: object
        correlationId:
          type: string
    AuthzPermission:
      required:
      - action
      - identifier
      - name
      - resourceType
      type: object
      properties:
        identifier:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - STAGING
          - EXPERIMENTAL
          - ACTIVE
          - DEPRECATED
          - INACTIVE
        includeInAllRoles:
          type: boolean
        allowedScopeLevels:
          uniqueItems: true
          type: array
          items:
            type: string
        resourceType:
          type: string
        action:
          type: string
    Failure:
      type: object
