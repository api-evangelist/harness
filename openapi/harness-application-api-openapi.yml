openapi: 3.2.0
info:
  title: Harness Application API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Application
paths:
  /gitops/api/v1/applications:
    post:
      summary: List applications
      description: ListApps retrieves a list of applications.
      operationId: ApplicationService_ListApps
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Applicationlist'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      requestBody:
        $ref: '#/components/requestBodies/servicev1ApplicationQuery'
      tags:
      - Application
components:
  schemas:
    applicationsBackoff:
      type: object
      properties:
        duration:
          type: string
          title: Duration is the amount to back off. Default unit is seconds, but could also be a duration (e.g. "2m", "1h")
        factor:
          type: string
          format: int64
          title: Factor is a factor to multiply the base duration after each failed retry
        maxDuration:
          type: string
          title: MaxDuration is the maximum amount of time allowed for the backoff strategy
      title: Backoff is the backoff strategy to use on subsequent retries for failing syncs
    applicationsApplicationSourceHelm:
      type: object
      properties:
        valueFiles:
          type: array
          items:
            type: string
          title: ValuesFiles is a list of Helm value files to use when generating a template
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/applicationsHelmParameter'
          title: Parameters is a list of Helm parameters which are passed to the helm template command upon manifest generation
        releaseName:
          type: string
          title: ReleaseName is the Helm release name to use. If omitted it will use the application name
        values:
          type: string
          title: Values specifies Helm values to be passed to helm template, typically defined as a block
        fileParameters:
          type: array
          items:
            $ref: '#/components/schemas/applicationsHelmFileParameter'
          title: FileParameters are file parameters to the helm template
        version:
          type: string
          title: Version is the Helm version to use for templating (either "2" or "3")
        passCredentials:
          type: boolean
          title: PassCredentials pass credentials to all domains (Helm's --pass-credentials)
        ignoreMissingValueFiles:
          type: boolean
          title: IgnoreMissingValueFiles prevents helm template from failing when valueFiles do not exist locally by not appending them to helm template --values
        skipCrds:
          type: boolean
          title: SkipCrds skips custom resource definition installation step (Helm's --skip-crds)
        valuesObject:
          type: object
          title: 'ValuesObject specifies Helm values to be passed to helm template, defined as a map. This takes precedence over Values.

            +kubebuilder:pruning:PreserveUnknownFields'
        namespace:
          type: string
          description: Namespace is an optional namespace to template with. If left empty, defaults to the app's destination namespace.
        kubeVersion:
          type: string
          description: 'KubeVersion specifies the Kubernetes API version to pass to Helm when templating manifests. By default, Argo CD

            uses the Kubernetes version of the target cluster.'
        apiVersions:
          type: array
          items:
            type: string
          description: 'APIVersions specifies the Kubernetes resource API versions to pass to Helm when templating manifests. By default,

            Argo CD uses the API versions of the target cluster. The format is [group/]version/kind.'
        skipTests:
          type: boolean
          description: SkipTests skips test manifest installation step (Helm's --skip-tests).
        skipSchemaValidation:
          type: boolean
          title: SkipSchemaValidation skips JSON schema validation (Helm's --skip-schema-validation)
      title: ApplicationSourceHelm holds helm specific options
    applicationsApplicationSource:
      type: object
      properties:
        repoURL:
          type: string
          title: RepoURL is the URL to the repository (Git or Helm) that contains the application manifests
        path:
          type: string
          description: Path is a directory path within the Git repository, and is only valid for applications sourced from Git.
        targetRevision:
          type: string
          description: 'TargetRevision defines the revision of the source to sync the application to.

            In case of Git, this can be commit, tag, or branch. If omitted, will equal to HEAD.

            In case of Helm, this is a semver tag for the Chart''s version.'
        helm:
          $ref: '#/components/schemas/applicationsApplicationSourceHelm'
        kustomize:
          $ref: '#/components/schemas/applicationsApplicationSourceKustomize'
        ksonnet:
          $ref: '#/components/schemas/applicationsApplicationSourceKsonnet'
        directory:
          $ref: '#/components/schemas/applicationsApplicationSourceDirectory'
        plugin:
          $ref: '#/components/schemas/applicationsApplicationSourcePlugin'
        chart:
          type: string
          description: Chart is a Helm chart name, and must be specified for applications sourced from a Helm repo.
        ref:
          type: string
          description: Ref is reference to another source within sources field. This field will not be used if used with a `source` tag.
        name:
          type: string
          description: Name is used to refer to a source and is displayed in the UI. It is used in multi-source Applications.
      title: ApplicationSource contains all information about the source of an application
    applicationsManagedNamespaceMetadata:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    applicationsSyncSource:
      type: object
      properties:
        targetBranch:
          type: string
          description: 'TargetBranch is the branch from which hydrated manifests will be synced.

            If HydrateTo is not set, this is also the branch to which hydrated manifests are committed.'
        path:
          type: string
          description: 'Path is a directory path within the git repository where hydrated manifests should be committed to and synced

            from. The Path should never point to the root of the repo. If hydrateTo is set, this is just the path from which

            hydrated manifests will be synced.


            +kubebuilder:validation:Required

            +kubebuilder:validation:MinLength=1

            +kubebuilder:validation:Pattern=`^.{2,}|[^./]$`'
      description: 'SyncSource specifies a location from which hydrated manifests may be synced. RepoURL is assumed based on the

        associated DrySource config in the SourceHydrator.'
    applicationsKustomizePatch:
      type: object
      properties:
        path:
          type: string
        patch:
          type: string
        target:
          $ref: '#/components/schemas/applicationsKustomizeSelector'
        options:
          type: object
          additionalProperties:
            type: boolean
    servicev1Applicationlist:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/servicev1Application'
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
        pageItemCount:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        pageIndex:
          type: integer
          format: int32
        empty:
          type: boolean
    applicationsHelmParameter:
      type: object
      properties:
        name:
          type: string
          title: Name is the name of the Helm parameter
        value:
          type: string
          title: Value is the value for the Helm parameter
        forceString:
          type: boolean
          title: ForceString determines whether to tell Helm to interpret booleans and numbers as strings
      title: HelmParameter is a parameter that's passed to helm template during manifest generation
    applicationsSourceHydratorStatus:
      type: object
      properties:
        lastSuccessfulOperation:
          $ref: '#/components/schemas/applicationsSuccessfulHydrateOperation'
        currentOperation:
          $ref: '#/components/schemas/applicationsHydrateOperation'
      title: SourceHydratorStatus contains information about the current state of source hydration
    applicationsApplicationCondition:
      type: object
      properties:
        type:
          type: string
          title: Type is an application condition type
        message:
          type: string
          title: Message contains human-readable message indicating details about condition
        lastTransitionTime:
          $ref: '#/components/schemas/v1Time'
        lastTransitionTimeTs:
          type: string
          format: date-time
          title: LastTransitionTimeTs is the google timestamp variation of LastTransitionTime
      title: ApplicationCondition contains details about an application condition, which is usally an error or warning
    applicationsOperationState:
      type: object
      properties:
        operation:
          $ref: '#/components/schemas/applicationsOperation'
        phase:
          type: string
          title: Phase is the current phase of the operation
        message:
          type: string
          description: Message holds any pertinent messages when attempting to perform operation (typically errors).
        syncResult:
          $ref: '#/components/schemas/applicationsSyncOperationResult'
        startedAt:
          $ref: '#/components/schemas/v1Time'
        finishedAt:
          $ref: '#/components/schemas/v1Time'
        retryCount:
          type: string
          format: int64
          title: RetryCount contains time of operation retries
        startedAtTs:
          type: string
          format: date-time
          title: Started at Timestamp
        finishedAtTs:
          type: string
          format: date-time
          title: Finised at Timestamp
      title: OperationState contains information about state of a running operation
    applicationsDrySource:
      type: object
      properties:
        repoURL:
          type: string
          title: RepoURL is the URL to the git repository that contains the application manifests
        targetRevision:
          type: string
          title: TargetRevision defines the revision of the source to hydrate
        path:
          type: string
          title: Path is a directory path within the Git repository where the manifests are located
        helm:
          $ref: '#/components/schemas/applicationsApplicationSourceHelm'
        kustomize:
          $ref: '#/components/schemas/applicationsApplicationSourceKustomize'
        directory:
          $ref: '#/components/schemas/applicationsApplicationSourceDirectory'
        plugin:
          $ref: '#/components/schemas/applicationsApplicationSourcePlugin'
      description: DrySource specifies a location for dry "don't repeat yourself" manifest source information.
    applicationsApplication:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMeta'
        spec:
          $ref: '#/components/schemas/applicationsApplicationSpec'
        status:
          $ref: '#/components/schemas/applicationsApplicationStatus'
        operation:
          $ref: '#/components/schemas/applicationsOperation'
        creationTimestampTs:
          type: string
          format: date-time
          title: Protobuf-safe copy of ObjectMeta.CreationTimestamp (v1.Time doesn't survive gRPC serialization)
    ApplicationQueryApplicationSortByOptions:
      type: string
      enum:
      - SORT_BY_NOT_SET
      - NAME
      - GITOPS_AGENT
      - SOURCE
      - DESTINATION
      default: SORT_BY_NOT_SET
    v1SortOrderOptions:
      type: string
      enum:
      - SORT_ORDER_NOT_SET
      - ASC
      - DESC
      default: SORT_ORDER_NOT_SET
    applicationsResourceStatus:
      type: object
      properties:
        group:
          type: string
          description: Group represents the API group of the resource (e.g., "apps" for Deployments).
        version:
          type: string
          description: Version indicates the API version of the resource (e.g., "v1", "v1beta1").
        kind:
          type: string
          description: Kind specifies the type of the resource (e.g., "Deployment", "Service").
        namespace:
          type: string
          description: Namespace defines the Kubernetes namespace where the resource is located.
        name:
          type: string
          description: Name is the unique name of the resource within the namespace.
        status:
          type: string
          description: Status represents the synchronization state of the resource (e.g., Synced, OutOfSync).
        health:
          $ref: '#/components/schemas/applicationsHealthStatus'
        hook:
          type: boolean
          description: Hook is true if the resource is used as a lifecycle hook in an Argo CD application.
        requiresPruning:
          type: boolean
          description: RequiresPruning is true if the resource needs to be pruned (deleted) as part of synchronization.
        syncWave:
          type: string
          format: int64
          description: 'SyncWave determines the order in which resources are applied during a sync operation.

            Lower values are applied first.'
        requiresDeletionConfirmation:
          type: boolean
          description: RequiresDeletionConfirmation is true if the resource requires explicit user confirmation before deletion.
      description: ResourceStatus holds the current synchronization and health status of a Kubernetes resource.
    applicationsApplicationSourcePlugin:
      type: object
      properties:
        name:
          type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/applicationsEnvEntry'
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/applicationsApplicationSourcePluginParameter'
      title: ApplicationSourcePlugin holds options specific to config management plugins
    applicationsKsonnetParameter:
      type: object
      properties:
        component:
          type: string
        name:
          type: string
        value:
          type: string
      title: KsonnetParameter is a ksonnet component parameter
    applicationsApplicationSpec:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/applicationsApplicationSource'
        destination:
          $ref: '#/components/schemas/applicationsApplicationDestination'
        project:
          type: string
          description: 'Project is a reference to the project this application belongs to.

            The empty string means that application belongs to the ''default'' project.'
        syncPolicy:
          $ref: '#/components/schemas/applicationsSyncPolicy'
        ignoreDifferences:
          type: array
          items:
            $ref: '#/components/schemas/applicationsResourceIgnoreDifferences'
          title: IgnoreDifferences is a list of resources and their fields which should be ignored during comparison
        info:
          type: array
          items:
            $ref: '#/components/schemas/applicationsInfo'
          title: Info contains a list of information (URLs, email addresses, and plain text) that relates to the application
        revisionHistoryLimit:
          type: string
          format: int64
          description: 'RevisionHistoryLimit limits the number of items kept in the application''s revision history, which is used for informational purposes as well as for rollbacks to previous versions.

            This should only be changed in exceptional circumstances.

            Setting to zero will store no history. This will reduce storage used.

            Increasing will increase the space used to store the history, so we do not recommend increasing it.

            Default is 10.'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/applicationsApplicationSource'
          title: Sources is a reference to the location of the application's manifests or chart
        sourceHydrator:
          $ref: '#/components/schemas/applicationsSourceHydrator'
      description: ApplicationSpec represents desired application state. Contains link to repository with application definition and additional parameters link definition revision.
    applicationsKustomizeSelector:
      type: object
      properties:
        resId:
          $ref: '#/components/schemas/applicationsKustomizeResId'
        annotationSelector:
          type: string
        labelSelector:
          type: string
    applicationsOptionalArray:
      type: object
      properties:
        array:
          type: array
          items:
            type: string
          title: 'Array is the value of an array type parameter.

            +optional'
    applicationsSyncStatus:
      type: object
      properties:
        status:
          type: string
          title: Status is the sync state of the comparison
        comparedTo:
          $ref: '#/components/schemas/applicationsComparedTo'
        revision:
          type: string
          title: Revision contains information about the revision the comparison has been performed to
        revisions:
          type: array
          items:
            type: string
          title: Revisions contains information about the revisions of multiple sources the comparison has been performed to
      title: SyncStatus contains information about the currently observed live and desired states of an application
    applicationsRevisionHistory:
      type: object
      properties:
        revision:
          type: string
          title: Revision holds the revision the sync was performed against
        deployedAt:
          $ref: '#/components/schemas/v1Time'
        id:
          type: string
          format: int64
          title: ID is an auto incrementing identifier of the RevisionHistory
        source:
          $ref: '#/components/schemas/applicationsApplicationSource'
        deployStartedAt:
          $ref: '#/components/schemas/v1Time'
        deployedAtTs:
          type: string
          format: date-time
        deployStartedAtTs:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: '#/components/schemas/applicationsApplicationSource'
          title: Sources is a reference to the application sources used for the sync operation
        revisions:
          type: array
          items:
            type: string
          title: Revisions holds the revision of each source in sources field the sync was performed against
        initiatedBy:
          $ref: '#/components/schemas/applicationsOperationInitiator'
      title: RevisionHistory contains history information about a previous sync
    v1PolicySetDetail:
      type: object
      properties:
        policySetId:
          type: string
          description: Unique ID of the policy set
        policySetName:
          type: string
          description: Name of the policy set
        identifier:
          type: string
          description: User-defined identifier of the policy set
        deny:
          type: boolean
          description: Whether this policy set denied the action
        status:
          type: string
          description: 'Status: pass, warning, or error'
        accountId:
          type: string
          description: Account ID
        orgId:
          type: string
          description: Organization ID
        projectId:
          type: string
          description: Project ID
        description:
          type: string
          description: Description of the policy set
        created:
          type: string
          description: Creation timestamp
        policyMetadata:
          type: array
          items:
            $ref: '#/components/schemas/v1PolicyMetadata'
          description: Individual policy evaluation results
      description: PolicySetDetail contains evaluation results for a single policy set.
    applicationsApplicationSourceDirectory:
      type: object
      properties:
        recurse:
          type: boolean
          title: Recurse specifies whether to scan a directory recursively for manifests
        jsonnet:
          $ref: '#/components/schemas/applicationsApplicationSourceJsonnet'
        exclude:
          type: string
          title: Exclude contains a glob pattern to match paths against that should be explicitly excluded from being used during manifest generation
        include:
          type: string
          title: Include contains a glob pattern to match paths against that should be explicitly included during manifest generation
      title: ApplicationSourceDirectory holds options for applications of type plain YAML or Jsonnet
    v1ManagedFieldsEntry:
      type: object
      properties:
        manager:
          type: string
          description: Manager is an identifier of the workflow managing these fields.
        operation:
          type: string
          description: 'Operation is the type of operation which lead to this ManagedFieldsEntry being created.

            The only valid values for this field are ''Apply'' and ''Update''.'
        apiVersion:
          type: string
          description: 'APIVersion defines the version of this resource that this field set

            applies to. The format is "group/version" just like the top-level

            APIVersion field. It is necessary to track the version of a field

            set because it cannot be automatically converted.'
        time:
          $ref: '#/components/schemas/v1Time'
        fieldsType:
          type: string
          title: 'FieldsType is the discriminator for the different fields format and version.

            There is currently only one possible value: "FieldsV1"'
        fieldsV1:
          $ref: '#/components/schemas/v1FieldsV1'
        subresource:
          type: string
          description: 'Subresource is the name of the subresource used to update that object, or

            empty string if the object was updated through the main resource. The

            value of this field is used to distinguish between managers, even if they

            share the same name. For example, a status update will be distinct from a

            regular update using the same manager name.

            Note that the APIVersion field is not related to the Subresource field and

            it always corresponds to the version of the main resource.'
      description: 'ManagedFieldsEntry is a workflow-id, a FieldSet and the group version of the resource

        that the fieldset applies to.'
    applicationsKustomizeResId:
      type: object
      properties:
        gvk:
          $ref: '#/components/schemas/applicationsKustomizeGvk'
        name:
          type: string
        namespace:
          type: string
    v1ObjectMeta:
      type: object
      properties:
        name:
          type: string
          title: 'Name must be unique within a namespace. Is required when creating resources, although

            some resources may allow a client to request the generation of an appropriate name

            automatically. Name is primarily intended for creation idempotence and configuration

            definition.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names

            +optional'
        generateName:
          type: string
          description: 'GenerateName is an optional prefix, used by the server, to generate a unique

            name ONLY IF the Name field has not been provided.

            If this field is used, the name returned to the client will be different

            than the name passed. This value will also be combined with a unique suffix.

            The provided value has the same validation rules as the Name field,

            and may be truncated by the length of the suffix required to make the value

            unique on the server.


            If this field is specified and the generated name exists, the server will return a 409.


            Applied only if Name is not specified.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#idempotency

            +optional'
        namespace:
          type: string
          description: 'Namespace defines the space within which each name must be unique. An empty namespace is

            equivalent to the "default" namespace, but "default" is the canonical representation.

            Not all objects are required to be scoped to a namespace - the value of this field for

            those objects will be empty.


            Must be a DNS_LABEL.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces

            +optional'
        selfLink:
          type: string
          title: 'Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.

            +optional'
        uid:
          type: string
          description: 'UID is the unique in time and space value for this object. It is typically generated by

            the server on successful creation of a resource and is not allowed to change on PUT

            operations.


            Populated by the system.

            Read-only.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids

            +optional'
        resourceVersion:
          type: string
          description: 'An opaque value that represents the internal version of this object that can

            be used by clients to determine when objects have changed. May be used for optimistic

            concurrency, change detection, and the watch operation on a resource or set of resources.

            Clients must treat these values as opaque and passed unmodified back to the server.

            They may only be valid for a particular resource or set of resources.


            Populated by the system.

            Read-only.

            Value must be treated as opaque by clients and .

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency

            +optional'
        generation:
          type: string
          format: int64
          title: 'A sequence number representing a specific generation of the desired state.

            Populated by the system. Read-only.

            +optional'
        creationTimestamp:
          $ref: '#/components/schemas/v1Time'
        deletionTimestamp:
          $ref: '#/components/schemas/v1Time'
        deletionGracePeriodSeconds:
          type: string
          format: int64
          title: 'Number of seconds allowed for this object to gracefully terminate before

            it will be removed from the system. Only set when deletionTimestamp is also set.

            May only be shortened.

            Read-only.

            +optional'
        labels:
          type: object
          additionalProperties:
            type: string
          title: 'Map of string keys and values that can be used to organize and categorize

            (scope and select) objects. May match selectors of replication controllers

            and services.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels

            +optional'
        annotations:
          type: object
          additionalProperties:
            type: string
          title: 'Annotations is an unstructured key value map stored with a resource that may be

            set by external tools to store and retrieve arbitrary metadata. They are not

            queryable and should be preserved when modifying objects.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations

            +optional'
        ownerReferences:
          type: array
          items:
            $ref: '#/components/schemas/v1OwnerReference'
          title: 'List of objects depended by this object. If ALL objects in the list have

            been deleted, this object will be garbage collected. If this object is managed by a controller,

            then an entry in this list will point to this controller, with the controller field set to true.

            There cannot be more than one managing controller.

            +optional

            +patchMergeKey=uid

            +patchStrategy=merge

            +listType=map

            +listMapKey=uid'
        finalizers:
          type: array
          items:
            type: string
          title: 'Must be empty before the object is deleted from the registry. Each entry

            is an identifier for the responsible component that will remove the entry

            from the list. If the deletionTimestamp of the object is non-nil, entries

            in this list can only be removed.

            Finalizers may be processed and removed in any order.  Order is NOT enforced

            because it introduces significant risk of stuck finalizers.

            finalizers is a shared field, any actor with permission can reorder it.

            If the finalizer list is processed in order, then this can lead to a situation

            in which the component responsible for the first finalizer in the list is

            waiting for a signal (field value, external system, or other) produced by a

            component responsible for a finalizer later in the list, resulting in a deadlock.

            Without enforced ordering finalizers are free to order amongst themselves and

            are not vulnerable to ordering changes in the list.

            +optional

            +patchStrategy=merge

            +listType=set'
        managedFields:
          type: array
          items:
            $ref: '#/components/schemas/v1ManagedFieldsEntry'
          description: 'ManagedFields maps workflow-id and version to the set of fields

            that are managed by that workflow. This is mostly for internal

            housekeeping, and users typically shouldn''t need to set or

            understand this field. A workflow can be the user''s name, a

            controller''s name, or the name of a specific apply path like

            "ci-cd". The set of fields is always in the version that the

            workflow used when modifying the object.


            +optional

            +listType=atomic'
      description: 'ObjectMeta is metadata that all persisted resources must have, which includes all objects

        users must create.'
    applicationsResourceResult:
      type: object
      properties:
        group:
          type: string
          title: Group specifies the API group of the resource
        version:
          type: string
          title: Version specifies the API version of the resource
        kind:
          type: string
          title: Kind specifies the API kind of the resource
        namespace:
          type: string
          title: Namespace specifies the target namespace of the resource
        name:
          type: string
          title: Name specifies the name of the resource
        status:
          type: string
          title: Status holds the final result of the sync. Will be empty if the resources is yet to be applied/pruned and is always zero-value for hooks
        message:
          type: string
