            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names'
        uid:
          type: string
          title: 'UID of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids'
        controller:
          type: boolean
          title: 'If true, this reference points to the managing controller.

            +optional'
        blockOwnerDeletion:
          type: boolean
          title: 'If true, AND if the owner has the "foregroundDeletion" finalizer, then

            the owner cannot be deleted from the key-value store until this

            reference is removed.

            See https://kubernetes.io/docs/concepts/architecture/garbage-collection/#foreground-deletion

            for how the garbage collector interacts with this field and enforces the foreground deletion.

            Defaults to false.

            To set this field, a user needs "delete" permission of the owner,

            otherwise 422 (Unprocessable Entity) will be returned.

            +optional'
      title: 'OwnerReference contains enough information to let you identify an owning

        object. An owning object must be in the same namespace as the dependent, or

        be cluster-scoped, so there is no namespace field.

        +structType=atomic'
    applicationsKustomizeGvk:
      type: object
      properties:
        group:
          type: string
        version:
          type: string
        kind:
          type: string
    applicationsResourceIgnoreDifferences:
      type: object
      properties:
        group:
          type: string
        kind:
          type: string
        name:
          type: string
        namespace:
          type: string
        jsonPointers:
          type: array
          items:
            type: string
        jqPathExpressions:
          type: array
          items:
            type: string
        managedFieldsManagers:
          type: array
          items:
            type: string
          title: 'ManagedFieldsManagers is a list of trusted managers. Fields mutated by those managers will take precedence over the

            desired state defined in the SCM and won''t be displayed in diffs'
      description: ResourceIgnoreDifferences contains resource filter and list of json paths which should be ignored during comparison with live state.
    applicationsHealthStatus:
      type: object
      properties:
        status:
          type: string
          title: Status holds the status code of the application or resource
        message:
          type: string
          title: Message is a human-readable informational message describing the health status
        lastTransitionTime:
          $ref: '#/components/schemas/v1Time'
      title: HealthStatus contains information about the currently observed health state of a resource
    v1Time:
      type: object
      properties:
        seconds:
          type: string
          format: int64
          description: 'Represents seconds of UTC time since Unix epoch

            1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to

            9999-12-31T23:59:59Z inclusive.'
        nanos:
          type: integer
          format: int32
          description: 'Non-negative fractions of a second at nanosecond resolution. Negative

            second values with fractions must still have non-negative nanos values

            that count forward in time. Must be from 0 to 999,999,999

            inclusive. This field may be limited in precision depending on context.'
      description: 'Time is a wrapper around time.Time which supports correct

        marshaling to YAML and JSON.  Wrappers are provided for many

        of the factory methods that the time package offers.


        +protobuf.options.marshal=false

        +protobuf.as=Timestamp

        +protobuf.options.(gogoproto.goproto_stringer)=false'
    applicationsSuccessfulHydrateOperation:
      type: object
      properties:
        drySHA:
          type: string
          title: DrySHA holds the resolved revision (sha) of the dry source as of the most recent reconciliation
        hydratedSHA:
          type: string
          title: HydratedSHA holds the resolved revision (sha) of the hydrated source as of the most recent reconciliation
        sourceHydrator:
          $ref: '#/components/schemas/applicationsSourceHydrator'
      title: SuccessfulHydrateOperation contains information about the most recent successful hydrate operation
    applicationsJsonnetVar:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        code:
          type: boolean
      title: JsonnetVar represents a variable to be passed to jsonnet during manifest generation
  requestBodies:
    servicev1ApplicationQuery:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/servicev1ApplicationQuery'
      required: true
