          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
      - description: The ID of the Security Issue to delete
        example: abcdef1234567890ghijkl
        in: path
        name: id
        required: true
        schema:
          description: The ID of the Security Issue to delete
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
          type: string
