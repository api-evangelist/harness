components:
  schemas:
    Issue:
      type: object
      properties:
        baseImageName:
          type: string
          description: base image name of the issue
          example: baseImageName
        baselineVariantId:
          type: string
          description: The Baseline Target Variant related to this Security Issue
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        created:
          type: integer
          description: Unix timestamp at which the resource was created
          example: 1651578240
          format: int64
        currentStatus:
          type: string
          description: Current status of the Exemption
          example: Pending
          enum:
          - Pending
          - Approved
          - Rejected
          - Expired
        details:
          type: object
          description: Issue details common to all occurrences
          example:
            package: json-schema
            version: v0.2.3
          additionalProperties: true
        epssLastModified:
          type: string
          description: Last date the issue EPSS data was last modified
          example: '2025-05-01'
        epssPercentile:
          type: number
          description: EPSS percentile of the issue CVE identifier
          example: 0.15
          format: double
        epssScore:
          type: number
          description: EPSS score of the issue CVE identifier
          example: 0.035
          format: double
        exemptionCoverage:
          type: string
          description: Indicates if the Security Issue was found to be Exempted or PartiallyExempted.
          example: PartiallyExempted
        exemptionId:
          type: string
          description: ID of Security Test Exemption
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        exemptionStatusAtScan:
          type: string
          description: Exemption's status at the Security Scan created time
          example: Expired
          enum:
          - Pending
          - Approved
          - Rejected
          - Expired
        exploitability:
          type: string
          description: Exploitability status of the issue (yes or no)
          example: 'yes'
        fallbackSeverityCode:
          type: string
          description: Issue-table severity code used as occurrence fallback at read time; omitted from API responses
          example: High
          enum:
          - Critical
          - High
          - Medium
          - Low
          - Info
          - Unassigned
        gracePeriodDays:
          type: integer
          description: Issue-level grace period rollup in days. Only populated when scan honorGracePeriod is enabled.
          example: 13
          format: int64
        harnessAugmentation:
          type: object
          description: Harness Augmentation details
          example:
            Dolores et illum repellat.: Est suscipit architecto eum voluptatem.
            Rerum quia facere at.: Nesciunt ratione et natus voluptas voluptatem placeat.
            Tempore eius cum.: Aliquid similique qui hic molestias quia aut.
          additionalProperties: true
        id:
          type: string
          description: Resource identifier
          example: abcdef1234567890ghijkl
          pattern: ^[a-zA-Z0-9_-]{22}$
        inGrace:
          type: boolean
          description: 'True when the displayed severity is grace-sheltered: at the display-max severity band, all non-exempt occurrences are in grace. Only populated when scan honorGracePeriod is enabled.'
          example: true
        key:
          type: string
          description: Compression/deduplication key
          example: json-schema@0.2.3
          maxLength: 512
        numOccurrences:
          type: integer
          description: Indicates the number of Occurrences on the Issue
          example: 10
          format: int32
        occurrenceId:
          type: integer
          example: 12345
          format: int64
          minimum: 1
        occurrences:
          type: array
          items:
            type: object
            example:
              Aliquam omnis itaque laboriosam quis eos.: Et dolores aut rerum facere quae.
              Dolor consequatur.: Nobis et aut laboriosam amet reprehenderit.
              Repellendus ratione voluptas alias eveniet.: Unde cum ipsum accusamus.
            additionalProperties: true
          description: Array of details unique to each occurrence
          example:
          - line: '42'
          - line: '666'
        originStatus:
          type: string
