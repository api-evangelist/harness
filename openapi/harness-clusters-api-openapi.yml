openapi: 3.2.0
info:
  title: Harness Clusters API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Clusters
  description: This contains APIs related to Gitops Clusters
paths:
  /ng/api/gitops/clusters/{identifier}:
    get:
      tags:
      - Clusters
      summary: Get a Cluster linked to an environment by identifier
      operationId: getCluster
      parameters:
      - name: identifier
        in: path
        description: Cluster Identifier for the entity
        required: true
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: environmentIdentifier
        in: query
        description: environmentIdentifier
        required: true
        schema:
          type: string
      - name: agentIdentifier
        in: query
        description: agentIdentifier
        schema:
          type: string
      - name: deleted
        in: query
        description: Specify whether cluster is deleted or not
        schema:
          type: boolean
          default: false
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: The saved Cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOClusterResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOClusterResponse'
    delete:
      tags:
      - Clusters
      summary: Unlink a cluster by identifier
      description: Unlink a cluster from an environment by identifier
      operationId: deleteCluster
      parameters:
      - name: identifier
        in: path
        description: Cluster Identifier for the entity
        required: true
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: environmentIdentifier
        in: query
        description: environmentIdentifier
        required: true
        schema:
          type: string
      - name: agentIdentifier
        in: query
        description: agentIdentifier
        schema:
          type: string
      - name: scope
        in: query
        description: Scope for the gitops cluster
        schema:
          type: string
          enum:
          - ACCOUNT
          - ORGANIZATION
          - PROJECT
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns true if the Cluster is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
  /ng/api/gitops/clusters:
    get:
      tags:
      - Clusters
      summary: Gets cluster list
      description: Gets a list of GitOps clusters linked to an environment
      operationId: getClusterList
      parameters:
      - name: page
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 100
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: environmentIdentifier
        in: query
        description: Environment Identifier of the clusters
        required: true
        schema:
          type: string
      - name: searchTerm
        in: query
        description: The word to be searched and included in the list response
        schema:
          type: string
      - name: identifiers
        in: query
        description: List of cluster identifiers
        schema:
          type: array
          items:
            type: string
      - name: sort
        in: query
        description: Specifies the sorting criteria of the list. Like sorting based on the last updated entity, alphabetical sorting in an ascending or descending order
        schema:
          type: array
          items:
            type: string
      - name: scope
        in: query
        description: Scope of linked clusters to be returned, ACCOUNT/ORGANIZATION/PROJECT. Returns all by default if this is not specified
        schema:
          type: string
          enum:
          - ACCOUNT
          - ORGANIZATION
          - PROJECT
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the list of cluster for a Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseClusterResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseClusterResponse'
    post:
      tags:
      - Clusters
      summary: Link a Cluster
      description: Link a GitOps cluster to an environment by identifier
      operationId: linkCluster
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the createCluster to be linked
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/ClusterRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the linked Cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOClusterResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOClusterResponse'
  /ng/api/gitops/clusters/batch:
    post:
      tags:
      - Clusters
      summary: Link Clusters
      operationId: linkClusters
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier of the environment.
        required: true
        schema:
          type: string
      requestBody:
        description: Request body for linking clusters to an environment. Either provide a list of clusters in the clusters field OR use linkAllClusters=true with searchTerm to link all matching clusters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterLinkRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/ClusterLinkRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the linked Clusters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOClusterBatchResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOClusterBatchResponse'
  /ng/api/gitops/clusters/batchunlink:
    post:
      tags:
      - Clusters
      summary: Unlink Clusters
      operationId: unlinkClustersInBatch
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Request body for unlinking clusters from an environment. Either provide a list of specific clusters OR use unlinkAllClusters=true to unlink all.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUnlinkRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/ClusterUnlinkRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns true if all the Clusters are deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOClusterBatchResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOClusterBatchResponse'
  /gitops/api/v1/agents/{agentIdentifier}/cluster_byname:
    get:
      summary: Get a cluster managed by an agent by name
      description: Get a cluster managed by agent using name
      operationId: AgentClusterService_GetByName
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Cluster'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: fetchScopePrefixedIdentifier
        description: Indicates whether the identifier of cluster fetched must contain harness scope prefix (account./org.)
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Clusters
  /gitops/api/v1/agents/{agentIdentifier}/cluster_byurl:
    get:
      summary: Get a cluster managed by an agent by URL
      description: Get a cluster managed by agent using URL
      operationId: AgentClusterService_GetByUrl
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Cluster'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: server
        in: query
        required: false
        schema:
          type: string
      - name: fetchScopePrefixedIdentifier
        description: Indicates whether the identifier of cluster fetched must contain harness scope prefix (account./org.)
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Clusters
  /gitops/api/v1/agents/{agentIdentifier}/clusters:
    get:
      summary: List returns list of clusters
      description: List clusters.
      operationId: AgentClusterService_List
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/clustersClusterList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: identifier
        in: query
        required: false
        schema:
          type: string
      - name: query.server
        in: query
        required: false
        schema:
          type: string
      - name: query.name
        in: query
        required: false
        schema:
          type: string
      - name: query.id.type
        description: type is the type of the specified cluster identifier ( "server" - default, "name" ).
        in: query
        required: false
        schema:
          type: string
      - name: query.id.value
        description: value holds the cluster server URL or cluster name.
        in: query
        required: false
        schema:
          type: string
      - name: query.project
        in: query
        required: false
        schema:
          type: string
      tags:
      - Clusters
    post:
      summary: Create creates a cluster
      description: Create cluster.
      operationId: AgentClusterService_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Cluster'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: identifier
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/clustersClusterCreateRequest'
        required: true
      tags:
      - Clusters
  /gitops/api/v1/agents/{agentIdentifier}/clusters/{identifier}:
    get:
      summary: Get returns a cluster by identifier
      description: Get cluster.
      operationId: AgentClusterService_Get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Cluster'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: query.server
        in: query
        required: false
        schema:
          type: string
      - name: query.name
        in: query
        required: false
        schema:
          type: string
      - name: query.id.type
        description: type is the type of the specified cluster identifier ( "server" - default, "name" ).
        in: query
        required: false
        schema:
          type: string
      - name: query.id.value
        description: value holds the cluster server URL or cluster name.
        in: query
        required: false
        schema:
          type: string
      - name: query.project
        in: query
        required: false
        schema:
          type: string
      tags:
      - Clusters
    delete:
      summary: Delete deletes a cluster
      description: Delete cluster.
      operationId: AgentClusterService_Delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/clustersClusterResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: query.server
        in: query
        required: false
        schema:
          type: string
      - name: query.name
        in: query
        required: false
        schema:
          type: string
      - name: query.id.type
        description: type is the type of the specified cluster identifier ( "server" - default, "name" ).
        in: query
        required: false
        schema:
          type: string
      - name: query.id.value
        description: value holds the cluster server URL or cluster name.
        in: query
        required: false
        schema:
          type: string
      - name: query.project
        in: query
        required: false
        schema:
          type: string
      - name: forceDelete
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Clusters
    put:
      summary: Update updates a cluster
      description: Update cluster.
      operationId: AgentClusterService_Update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Cluster'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: forceUpdate
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/clustersClusterUpdateRequest'
        required: true
      tags:
      - Clusters
  /gitops/api/v1/agents/{agentIdentifier}/gpgkeys:
    get:
      summary: List all available repository certificates
      description: List all available repository certificates.
      operationId: AgentGPGKeyService_List
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
