  /gitops/api/v1/agents/{agentIdentifier}/hosted/cluster:
    post:
      summary: CreateHosted creates a harness hosted cluster
      description: Creates Harness hosted cluster.
      operationId: AgentClusterService_CreateHosted
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1Cluster'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Clusters
  /gitops/api/v1/clusters:
    post:
      summary: List clusters
      description: ListClusters returns a list of clusters.
      operationId: ClusterService_ListClusters
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Clusterlist'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/servicev1ClusterQuery'
        required: true
      tags:
      - Clusters
  /gitops/api/v1/clusters/exists:
    get:
      summary: Check if a cluster exists
      description: Exists checks whether a cluster with the given identifier exists.
      operationId: ClusterService_Exists
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: boolean
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: query
        required: false
        schema:
          type: string
      - name: server
        in: query
        required: false
        schema:
          type: string
      tags:
      - Clusters
components:
  schemas:
    ClusterBasicDTO:
