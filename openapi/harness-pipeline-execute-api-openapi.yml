openapi: 3.2.0
info:
  title: Harness Pipeline Execute API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Pipeline Execute
  description: This contains APIs for Executing a Pipeline
paths:
  /pipeline/api/pipeline/execute/retryHistory/{planExecutionId}:
    get:
      tags:
      - Pipeline Execute
      summary: Retry History for a given execution
      operationId: retryHistory
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pipelineIdentifier
        in: query
        description: Pipeline Identifier
        required: true
        schema:
          type: string
      - name: planExecutionId
        in: path
        description: planExecutionId of the execution of whose we need to find the retry history
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns retry history execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTORetryHistoryResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTORetryHistoryResponse'
  /pipeline/api/pipeline/execute/interrupt/{planExecutionId}:
    put:
      tags:
      - Pipeline Execute
      summary: Execute an Interrupt
      description: Executes an Interrupt on a Given Execution
      operationId: putHandleInterrupt
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: interruptType
        in: query
        description: The Interrupt type needed to be applied to the execution. Choose a value from the enum list.
        required: true
        schema:
          type: string
          enum:
          - AbortAll
          - UserMarkedFailure
      - name: planExecutionId
        in: path
        description: The Pipeline Execution Id on which the Interrupt needs to be applied.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Takes a possible Interrupt value and applies it onto the execution referred by the planExecutionId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOInterruptResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOInterruptResponse'
  /pipeline/api/pipeline/execute/manual-execution/{nodeExecutionId}:
    post:
      tags:
      - Pipeline Execute
      summary: Marks the Manual Execution as fail or resume
      operationId: markManualExecution
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: nodeExecutionId
        in: path
        description: Node execution id on which the manual execution action is required
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the manual execution action that needs to be taken
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualExecutionRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/ManualExecutionRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns status of api request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOManualExecutionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOManualExecutionResponse'
  /pipeline/api/pipeline/execute/interrupt/{planExecutionId}/{nodeExecutionId}:
    put:
      tags:
      - Pipeline Execute
      summary: Handles the interrupt for a given stage in a pipeline
      operationId: handleStageInterrupt
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: interruptType
        in: query
        description: The Interrupt type needed to be applied to the execution. Choose a value from the enum list.
        required: true
        schema:
          type: string
          enum:
          - AbortAll
          - UserMarkedFailure
      - name: planExecutionId
        in: path
        description: The Pipeline Execution Id on which the Interrupt needs to be applied.
        required: true
        schema:
          type: string
      - name: nodeExecutionId
        in: path
        description: The runtime Id of the step/stage on which the Interrupt needs to be applied.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Takes a possible Interrupt value and applies it onto the given stage in the execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOInterruptResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOInterruptResponse'
  /pipeline/api/pipeline/execute/retry/{identifier}:
    post:
      tags:
      - Pipeline Execute
      summary: Retry a executed pipeline with inputSet pipeline yaml
      operationId: retryPipeline
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: moduleType
        in: query
        description: Module type for the entity. If its from deployments,type will be CD , if its from build type will be CI
        schema:
          type: string
      - name: planExecutionId
        in: query
        description: This param contains the previous execution execution id. This is basically when we are rerunning a Pipeline.
        required: true
        schema:
          type: string
      - name: retryStages
        in: query
        description: 'This param contains the identifier of stages from where to resume. It will be a list if we want to retry from parallel group '
        required: true
        schema:
          type: array
          items:
            type: string
      - name: runAllStages
        in: query
        description: This param provides an option to run only the failed stages when Pipeline fails at parallel group. By default, it will run all the stages in the failed parallel group.
        schema:
          type: boolean
          default: true
      - name: identifier
        in: path
        description: Pipeline Identifier
        required: true
        schema:
          type: string
      - name: notesForPipelineExecution
        in: query
        description: Notes of a pipeline execution
        schema:
          type: string
          default: ''
      - name: asyncPlanCreation
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        description: Retry a executed pipeline with inputSet pipeline yaml
        content:
          application/yaml:
            schema:
              type: string
            examples:
              Retry a executed pipeline with Runtime Input YAML:
                summary: Retry a executed pipeline with Runtime Input YAML
                description: Retry a executed pipeline with Runtime Input YAML
                value: "pipeline:\n  identifier: \"Sample_Pipeline\"\n  stages:\n      - stage:\n          identifier: \"Sample_Stage\"\n          type: \"Approval\"\n          spec:\n              execution:\n                  steps:\n                      - step:\n                          identifier: \"Approval_Step\"\n                          type: \"HarnessApproval\"\n                          spec:\n                            approvers:\n                              userGroups: \n                                - account._account_all_users:\n                      - step:\n                          identifier: \"Shellscript_Step\"\n                          type: \"ShellScript\"\n                          spec:\n                            source:\n                              type: \"Inline\"\n                              spec:\n                                script: \"exit 0\"\n      - stage:\n          identifier: \"Sample_Deploy_Stage\"\n          type: \"Deployment\"\n          spec:\n            serviceConfig:\n              serviceRef: \"service1\"\n            infrastructure:\n                environmentRef: \"env1\"\n                infrastructureDefinition:\n                              type: \"KubernetesDirect\"\n                              spec:\n                                connectorRef: \"KubernetesConnector>\"\n                                namespace: \"default\"\n"
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanExecutionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PlanExecutionResponse'
  /pipeline/api/pipeline/execute/retry/v2/{identifier}:
    post:
      tags:
      - Pipeline Execute
      summary: Retry a executed pipeline with Runtime Input YAML V2
      description: Retry a executed pipeline with Runtime Input YAML and Expression Values V2
      operationId: retryPipelineV2
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: moduleType
        in: query
        description: Module type for the entity. If its from deployments,type will be CD , if its from build type will be CI
        schema:
          type: string
      - name: planExecutionId
        in: query
        description: This param contains the previous execution execution id. This is basically when we are rerunning a Pipeline.
        required: true
        schema:
          type: string
      - name: retryStages
        in: query
        description: 'This param contains the identifier of stages from where to resume. It will be a list if we want to retry from parallel group '
        required: true
        schema:
          type: array
          items:
            type: string
      - name: runAllStages
        in: query
        description: This param provides an option to run only the failed stages when Pipeline fails at parallel group. By default, it will run all the stages in the failed parallel group.
        schema:
          type: boolean
          default: true
      - name: identifier
        in: path
        description: Pipeline Identifier
        required: true
        schema:
          type: string
      - name: notesForPipelineExecution
        in: query
        description: Notes of a pipeline execution
        schema:
          type: string
          default: ''
      - name: asyncPlanCreation
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        description: Request body containing Runtime Input YAML and Expression Values for retry execution
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryPipelineRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/RetryPipelineRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns pipeline execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanExecutionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PlanExecutionResponse'
  /pipeline/api/pipeline/execute/{identifier}/inputSetList:
    post:
      tags:
      - Pipeline Execute
      summary: Execute a Pipeline with Input Set References
      operationId: postPipelineExecuteWithInputSetList
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: moduleType
        in: query
        description: Module type for the entity. If its from deployments,type will be CD , if its from build type will be CI
        schema:
          type: string
      - name: identifier
        in: path
        description: Pipeline identifier for the entity. Identifier of the Pipeline to be executed
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      - name: useFQNIfError
        in: query
        schema:
          type: boolean
          default: false
      - name: notesForPipelineExecution
        in: query
        description: Notes of a pipeline execution
        schema:
          type: string
          default: ''
      - name: asyncPlanCreation
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeInputSetRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/MergeInputSetRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns pipeline execution details V2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPlanExecutionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPlanExecutionResponse'
  /pipeline/api/pipeline/execute/{identifier}:
    post:
      tags:
      - Pipeline Execute
      summary: Execute a Pipeline with Runtime Input YAML
      operationId: postPipelineExecuteWithInputSetYaml
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: moduleType
        in: query
        description: Module type for the entity. If its from deployments,type will be CD , if its from build type will be CI
        schema:
          type: string
      - name: identifier
        in: path
        description: Pipeline identifier for the entity. Identifier of the Pipeline to be executed
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      - name: useFQNIfError
        in: query
        schema:
          type: boolean
          default: false
      - name: notifyOnlyUser
        in: query
        schema:
          type: boolean
          default: false
      - name: notesForPipelineExecution
        in: query
        description: Notes of a pipeline execution
        schema:
          type: string
          default: ''
      - name: inputSetIdentifiers
        in: query
        description: Input set identifiers for tracking and filtering pipeline executions. A list of input set identifiers to apply.
        schema:
          type: array
          items:
            type: string
      - name: asyncPlanCreation
        in: query
        schema:
          type: boolean
          default: false
      - name: shouldRunAsV1
        in: query
        description: Execute V0 pipeline using unified mode for enhanced features
        schema:
          type: boolean
          default: false
      requestBody:
        description: Enter Runtime Input YAML if the Pipeline contains Runtime Inputs. Template for this can be Fetched from /inputSets/template API.
        content:
          application/yaml:
            schema:
              type: string
            examples:
              Execute Runtime Input YAML:
                summary: Execute Pipeline with Runtime Input YAML
                description: Execute Runtime Input YAML
                value: "pipeline:\n  identifier: \"Sample_Pipeline\"\n  stages:\n      - stage:\n          identifier: \"Sample_Stage\"\n          type: \"Approval\"\n          spec:\n              execution:\n                  steps:\n                      - step:\n                          identifier: \"Approval_Step\"\n                          type: \"HarnessApproval\"\n                          spec:\n                            approvers:\n                              userGroups: \n                                - account._account_all_users:\n                      - step:\n                          identifier: \"Shellscript_Step\"\n                          type: \"ShellScript\"\n                          spec:\n                            source:\n                              type: \"Inline\"\n                              spec:\n                                script: \"exit 0\"\n      - stage:\n          identifier: \"Sample_Deploy_Stage\"\n          type: \"Deployment\"\n          spec:\n            serviceConfig:\n              serviceRef: \"service1\"\n            infrastructure:\n                environmentRef: \"env1\"\n                infrastructureDefinition:\n                              type: \"KubernetesDirect\"\n                              spec:\n                                connectorRef: \"KubernetesConnector>\"\n                                namespace: \"default\"\n"
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Returns pipeline execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanExecutionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PlanExecutionResponse'
  /pipeline/api/pipeline/execute/{identifier}/stages:
    post:
      tags:
      - Pipeline Execute
      summary: Execute given Stages of a Pipeline
      operationId: postExecuteStages
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: moduleType
        in: query
        description: Module type for the entity. If its from deployments,type will be CD , if its from build type will be CI
        schema:
          type: string
      - name: identifier
        in: path
        description: Pipeline Identifier
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
        in: query
        description: Git Sync Config Id. [Applicable for Old Git Sync only]
        schema:
          type: string
      - name: getDefaultFromOtherRepo
        in: query
        description: if true, return all the default entities
        schema:
          type: boolean
      - name: useFQNIfError
        in: query
        schema:
          type: boolean
          default: false
      - name: notesForPipelineExecution
        in: query
        description: Notes of a pipeline execution
        schema:
          type: string
          default: ''
      - name: inputSetIdentifiers
        in: query
        description: Input set identifiers for tracking and filtering pipeline executions. A list of input set identifiers to apply.
        schema:
          type: array
          items:
            type: string
      - name: asyncPlanCreation
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunStageRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/RunStageRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PipelineError'
        default:
          description: Execute given Stages of a Pipeline with Runtime Input Yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPlanExecutionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPlanExecutionResponse'
components:
  schemas:
    FeatureSupportOrBuilder:
      type: object
      properties:
        editionIntroduced:
          type: string
          enum:
          - EDITION_UNKNOWN
          - EDITION_LEGACY
          - EDITION_PROTO2
          - EDITION_PROTO3
          - EDITION_2023
          - EDITION_2024
          - EDITION_1_TEST_ONLY
          - EDITION_2_TEST_ONLY
          - EDITION_99997_TEST_ONLY
          - EDITION_99998_TEST_ONLY
          - EDITION_99999_TEST_ONLY
          - EDITION_MAX
        editionDeprecated:
          type: string
          enum:
          - EDITION_UNKNOWN
          - EDITION_LEGACY
          - EDITION_PROTO2
          - EDITION_PROTO3
          - EDITION_2023
          - EDITION_2024
          - EDITION_1_TEST_ONLY
          - EDITION_2_TEST_ONLY
          - EDITION_99997_TEST_ONLY
          - EDITION_99998_TEST_ONLY
          - EDITION_99999_TEST_ONLY
          - EDITION_MAX
        deprecationWarning:
          type: string
        deprecationWarningBytes:
          $ref: '#/components/schemas/ByteString'
        editionRemoved:
          type: string
          enum:
          - EDITION_UNKNOWN
          - EDITION_LEGACY
          - EDITION_PROTO2
          - EDITION_PROTO3
          - EDITION_2023
          - EDITION_2024
          - EDITION_1_TEST_ONLY
          - EDITION_2_TEST_ONLY
          - EDITION_99997_TEST_ONLY
          - EDITION_99998_TEST_ONLY
          - EDITION_99999_TEST_ONLY
