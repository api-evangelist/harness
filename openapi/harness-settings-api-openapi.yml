  /iacm/api/orgs/{org}/projects/{project}/settings/drift-config:
    delete:
      tags:
      - Settings
      summary: Disable drift automation for all workspaces in a project
      description: Enqueues a background job that removes drift triggers for every workspace in the project.
      operationId: settings#disable-project-drift
      parameters:
      - name: provisioner
        in: query
        description: Provisioner type to disable drift for
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Provisioner type to disable drift for
          example: terragrunt
          enum:
          - terraform
          - opentofu
          - terragrunt
          - awscdk
        example: terraform
      - name: org
        in: path
        description: Org is the organisation identifier.
        required: true
        schema:
          type: string
          description: Org is the organisation identifier.
          example: 8qf
          minLength: 1
          maxLength: 128
        example: r
      - name: project
        in: path
        description: Project is the project identifier.
        required: true
        schema:
          type: string
          description: Project is the project identifier.
          example: r0s
          minLength: 1
          maxLength: 128
        example: '9'
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          example: v
          minLength: 1
          maxLength: 128
        example: sz
      responses:
        '202':
          description: Accepted response.
          content:
            application/json:
              schema:
