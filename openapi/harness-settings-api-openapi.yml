          - apply
          - destroy
          - drift
          - synth
          - diff
          - deploy
          - remediation
        pipeline:
          type: string
          description: The default pipeline associated with the provisioner operation
          example: testpipeline
        provisioner:
          type: string
          description: The default pipeline is associated with this provisioner
          example: opentofu
          enum:
          - terraform
          - opentofu
          - terragrunt
          - awscdk
        updated:
          type: integer
          description: Time the default pipeline was last updated
          example: 1636669297674
          format: int64
        workspace:
          type: string
          description: The default pipeline is associated with this workspace if specified
          default: ''
          example: plan
      example:
        operation: plan
        pipeline: testpipeline
        provisioner: opentofu
        updated: 1636669297674
        workspace: plan
      required:
      - provisioner
      - operation
      - pipeline
      - updated
    SettingsGeneralSettingsSpace:
      properties:
        default_branch:
          description: default branch name
          type:
          - string
          - 'null'
      type: object
    GetProjectDriftResponse:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether project-level drift automation is currently enabled for this provisioner
          example: false
        pipeline_id:
          type: string
          description: Pipeline configured to run for drift detection
          example: Sunt aut nobis illum commodi.
        provisioner:
          type: string
          description: Provisioner this configuration applies to
          example: Optio et.
        run_every:
          type: integer
          description: Repeat interval; set when drift is enabled
          example: 7090462606487867000
          format: int64
        run_every_unit:
          type: string
          description: hours or days
          example: hours
          enum:
          - seconds
          - minutes
          - hours
          - days
      example:
        enabled: false
        pipeline_id: Quia dolorum eum voluptatem officiis.
        provisioner: Impedit libero quam.
        run_every: 7669625684478075000
        run_every_unit: hours
      required:
      - enabled
      - provisioner
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
