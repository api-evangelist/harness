openapi: 3.2.0
info:
  title: Harness Insights API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Insights
  description: Insights Service lists insights for a workspace.
paths:
  /iacm/api/orgs/{org}/projects/{project}/workspaces/{workspace}/insights:
    get:
      tags:
      - Insights
      summary: List insights for a workspace
      description: Returns a paginated list of insights for a workspace. v1 returns only cost-optimization insights.
      operationId: insights#list-insights
      parameters:
      - name: limit
        in: query
        description: Limit is the number of records to return for a page. When omitted, all records are returned.
        allowEmptyValue: true
        schema:
          type: integer
          description: Limit is the number of records to return for a page. When omitted, all records are returned.
          example: 30
          format: int64
          minimum: 1
          maximum: 1000
        example: 30
      - name: page
        in: query
        description: Page is the page number to return relative to the page 'limit'. When omitted, all records are returned.
        allowEmptyValue: true
        schema:
          type: integer
          description: Page is the page number to return relative to the page 'limit'. When omitted, all records are returned.
          example: 1
          format: int64
          minimum: 1
        example: 1
      - name: type
        in: query
        description: Filter by insight type. When omitted, all types are returned.
        allowEmptyValue: true
        schema:
          type: string
          description: Filter by insight type. When omitted, all types are returned.
          example: cost
          enum:
          - cost
        example: cost
      - name: state
        in: query
        description: Filter by insight state. When omitted, all states are returned.
        allowEmptyValue: true
        schema:
          type: string
          description: Filter by insight state. When omitted, all states are returned.
          example: APPLIED
          enum:
          - OPEN
          - APPLIED
        example: OPEN
      - name: org
        in: path
        description: Org is the organisation identifier.
        required: true
        schema:
          type: string
          description: Org is the organisation identifier.
          example: 6y
          minLength: 1
          maxLength: 128
        example: om
      - name: project
        in: path
        description: Project is the project identifier.
        required: true
        schema:
          type: string
          description: Project is the project identifier.
          example: dtr
          minLength: 1
          maxLength: 128
        example: 8v
      - name: workspace
        in: path
        description: Workspace identifier.
        required: true
        schema:
          type: string
          description: Workspace identifier.
          example: 2ll
          minLength: 1
          maxLength: 128
        example: yl7
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          example: i
          minLength: 1
          maxLength: 128
        example: suc
      responses:
        '200':
          description: OK response.
          headers:
            x-page-size:
              description: Current page size
              schema:
                type: integer
                description: Current page size
                example: 50
                format: int64
              example: 50
            x-total-items:
              description: Total items available
              schema:
                type: integer
                description: Total items available
                example: 1800
                format: int64
              example: 1800
            x-total-pages:
              description: Total pages available
              schema:
                type: integer
                description: Total pages available
                example: 36
                format: int64
              example: 36
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightCollection'
              example:
              - action: MigrateToGraviton
                details_link: Quo ut.
                id: Sed et voluptatum dolore consequuntur est.
                monthly_saving: 0.827122981880376
                monthly_spend: 0.3175470411269389
                resource:
                  account_id: '000000000000'
                  instance_id: i-0123456789abcdef0
                  instance_type: c4.4xlarge
                resource_type: EC2_INSTANCE
                state: OPEN
                type: cost
              - action: MigrateToGraviton
                details_link: Quo ut.
                id: Sed et voluptatum dolore consequuntur est.
                monthly_saving: 0.827122981880376
                monthly_spend: 0.3175470411269389
                resource:
                  account_id: '000000000000'
                  instance_id: i-0123456789abcdef0
                  instance_type: c4.4xlarge
                resource_type: EC2_INSTANCE
                state: OPEN
                type: cost
              - action: MigrateToGraviton
                details_link: Quo ut.
                id: Sed et voluptatum dolore consequuntur est.
                monthly_saving: 0.827122981880376
                monthly_spend: 0.3175470411269389
                resource:
                  account_id: '000000000000'
                  instance_id: i-0123456789abcdef0
                  instance_type: c4.4xlarge
                resource_type: EC2_INSTANCE
                state: OPEN
                type: cost
        '400':
          description: 'BadRequestError: Bad Request response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '401':
          description: 'UnauthorizedError: Unauthorized response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '403':
          description: 'ForbiddenError: Forbidden response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '404':
          description: 'NotFoundError: Not Found response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '408':
          description: 'TimeoutError: Request Timeout response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '409':
          description: 'ConflictError: Conflict response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '423':
          description: 'LockedError: Locked response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '499':
          description: 'ContextCancelledError:  response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '500':
          description: 'InternalServerError: Internal Server Error response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
        '502':
          description: 'BadGatewayError: Bad Gateway response.'
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/IaCMError'
components:
  schemas:
    HarnessIacmInsight:
      type: object
      properties:
        action:
          type: string
          description: Raw suggested-action string for the insight; empty when not applicable.
          example: MigrateToGraviton
        details_link:
          type: string
          description: Deep link to view the insight in the source system.
          example: Omnis nam.
        id:
          type: string
          description: Stable per-insight identifier.
          example: Consequatur est et aliquid.
        monthly_saving:
          type: number
          description: Potential monthly saving if the insight is acted on.
          example: 0.6989747993856403
          format: double
        monthly_spend:
          type: number
          description: Current monthly spend on the resource.
          example: 0.9973556600297729
          format: double
        resource:
          type: object
          description: Curated, resource-type-specific key/value details.
          example:
            account_id: '000000000000'
            instance_id: i-0123456789abcdef0
            instance_type: c4.4xlarge
          additionalProperties: true
        resource_type:
          type: string
          description: Raw resource-type string.
          example: EC2_INSTANCE
        state:
          type: string
          description: 'Insight state: OPEN or APPLIED.'
          example: OPEN
        type:
          type: string
          description: Insight type. v1 always "cost".
          example: cost
          enum:
          - cost
      description: A single insight for a workspace resource.
      example:
        action: MigrateToGraviton
        details_link: Et beatae impedit quia.
        id: Doloribus et autem molestiae iusto.
        monthly_saving: 0.237300775327745
        monthly_spend: 0.7868457891327997
        resource:
          account_id: '000000000000'
          instance_id: i-0123456789abcdef0
          instance_type: c4.4xlarge
        resource_type: EC2_INSTANCE
        state: OPEN
        type: cost
      required:
      - id
      - type
      - monthly_saving
      - monthly_spend
      - state
    InsightCollection:
      type: array
      items:
        $ref: '#/components/schemas/HarnessIacmInsight'
      example:
      - action: MigrateToGraviton
        details_link: Quo ut.
        id: Sed et voluptatum dolore consequuntur est.
        monthly_saving: 0.827122981880376
        monthly_spend: 0.3175470411269389
        resource:
          account_id: '000000000000'
          instance_id: i-0123456789abcdef0
          instance_type: c4.4xlarge
        resource_type: EC2_INSTANCE
        state: OPEN
        type: cost
      - action: MigrateToGraviton
        details_link: Quo ut.
        id: Sed et voluptatum dolore consequuntur est.
        monthly_saving: 0.827122981880376
        monthly_spend: 0.3175470411269389
        resource:
          account_id: '000000000000'
          instance_id: i-0123456789abcdef0
          instance_type: c4.4xlarge
        resource_type: EC2_INSTANCE
        state: OPEN
        type: cost
      - action: MigrateToGraviton
        details_link: Quo ut.
        id: Sed et voluptatum dolore consequuntur est.
        monthly_saving: 0.827122981880376
        monthly_spend: 0.3175470411269389
        resource:
          account_id: '000000000000'
          instance_id: i-0123456789abcdef0
          instance_type: c4.4xlarge
        resource_type: EC2_INSTANCE
        state: OPEN
        type: cost
    IaCMError:
      type: object
      properties:
        fault:
          type: boolean
          description: Is the error a server-side fault?
          example: false
        id:
          type: string
          description: ID is a unique identifier for this particular occurrence of the problem.
          example: 123abc
        message:
          type: string
          description: Message is a human-readable explanation specific to this occurrence of the problem.
          example: parameter 'p' must be an integer
        name:
          type: string
          description: Name is the name of this class of errors.
          example: bad_request
        temporary:
          type: boolean
          description: Is the error temporary?
          example: false
        timeout:
          type: boolean
          description: Is the error a timeout?
          example: true
      example:
        fault: false
        id: 123abc
        message: parameter 'p' must be an integer
        name: bad_request
        temporary: false
        timeout: true
      required:
      - name
      - id
      - message
      - temporary
      - timeout
      - fault
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
