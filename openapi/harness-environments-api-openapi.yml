openapi: 3.2.0
info:
  title: Harness Environments API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Environments
  description: This contains APIs related to Environments
paths:
  /ng/api/environmentsV2/check-allowed-values:
    post:
      tags:
      - Environments
      summary: Check for allowed-values in the Environments
      operationId: checkAllowedValuesInEnvs
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the list of Environments using allowed-values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOAllowedValuesUsagesInternalDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOAllowedValuesUsagesInternalDTO'
  /ng/api/environmentsV2:
    get:
      tags:
      - Environments
      summary: Gets Environment list for a project
      operationId: getEnvironmentList
      parameters:
      - name: page
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 100
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: searchTerm
        in: query
        description: The word to be searched and included in the list response
        schema:
          type: string
      - name: envIdentifiers
        in: query
        description: List of EnvironmentIds
        schema:
          type: array
          items:
            type: string
      - name: sort
        in: query
        description: Specifies sorting criteria of the list. Like sorting based on the last updated entity, alphabetical sorting in an ascending or descending order
        schema:
          type: array
          items:
            type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the list of Environments for a Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseEnvironmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseEnvironmentResponse'
    put:
      tags:
      - Environments
      summary: Update an Environment by identifier
      operationId: updateEnvironmentV2
      parameters:
      - name: If-Match
        in: header
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the Environment to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the updated Environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentResponse'
    post:
      tags:
      - Environments
      summary: Create an Environment
      operationId: createEnvironmentV2
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the Environment to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the created Environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentResponse'
  /ng/api/environmentsV2/batch:
    post:
      tags:
      - Environments
      summary: Create Environments in batch with partial success support
      operationId: createEnvironmentsV2
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the Environments to be created, maximum 1000 environments can be created.
        content:
          application/json:
            schema:
              maxItems: 1000
              minItems: 0
              type: array
              items:
                $ref: '#/components/schemas/EnvironmentRequest'
          application/yaml:
            schema:
              maxItems: 1000
              minItems: 0
              type: array
              items:
                $ref: '#/components/schemas/EnvironmentRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the batch creation result with successful and failed environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentBatchResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentBatchResponse'
  /ng/api/environmentsV2/{environmentIdentifier}:
    get:
      tags:
      - Environments
      summary: Gets an Environment by identifier
      operationId: getEnvironmentV2
      parameters:
      - name: environmentIdentifier
        in: path
        description: Environment Identifier for the entity
        required: true
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: deleted
        in: query
        description: Specify whether Environment is deleted or not
        schema:
          type: boolean
          default: false
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: The saved Environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentResponse'
    delete:
      tags:
      - Environments
      summary: Delete an Environment by identifier
      operationId: deleteEnvironmentV2
      parameters:
      - name: If-Match
        in: header
        schema:
          type: string
      - name: environmentIdentifier
        in: path
        description: Environment Identifier for the entity
        required: true
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: forceDelete
        in: query
        description: If true, the Entity will be forced delete, without checking any references/usages
        schema:
          type: boolean
          default: false
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns true if the Environment is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
  /ng/api/environmentsV2/serviceOverrides:
    get:
      tags:
      - Environments
      summary: Gets Service Overrides list
      operationId: getServiceOverridesList
      parameters:
      - name: page
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Results per page
        schema:
          type: integer
          format: int32
          default: 500
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: environmentIdentifier
        in: query
        description: Environment Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: serviceIdentifier
        in: query
        description: Service Identifier for the Entity.
        schema:
          type: string
      - name: sort
        in: query
        description: Specifies the sorting criteria of the list. Like sorting based on the last updated entity, alphabetical sorting in an ascending or descending order
        schema:
          type: array
          items:
            type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the list of Service Overrides for an Environment.serviceIdentifier, if passed, can be used to get the overrides for that particular Service in the Environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseServiceOverrideResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOPageResponseServiceOverrideResponse'
    post:
      tags:
      - Environments
      summary: upsert a Service Override for an Environment
      operationId: upsertServiceOverride
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the Service Override to be upserted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOverrideRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/ServiceOverrideRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Upsert ( Create/Update )  a Service Override in an Environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOServiceOverrideResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOServiceOverrideResponse'
    delete:
      tags:
      - Environments
      summary: Delete a ServiceOverride entity
      operationId: deleteServiceOverride
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: environmentIdentifier
        in: query
        description: Environment Identifier for the Entity.
        schema:
          type: string
      - name: serviceIdentifier
        in: query
        description: Service Identifier for the Entity.
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns true if the Service Override is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
  /ng/api/environmentsV2/import:
    post:
      tags:
      - Environments
      summary: Import and Create Environment from Git Repository
      operationId: importEnvironment
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: environmentIdentifier
        in: query
        description: Environment Identifier for the entity
        schema:
          type: string
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          type: string
      - name: repoName
        in: query
        description: Name of the repository.
        required: true
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        required: true
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        required: true
        schema:
          type: string
      - name: isForceImport
        in: query
        description: isForceImport
        schema:
          type: boolean
          default: false
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Import and Create Environment from Git Repository and saves a record for it in Harness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentImportResponseDetails'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentImportResponseDetails'
  /ng/api/environmentsV2/list/access:
    get:
      tags:
      - Environments
      summary: Gets Environment Access list
      operationId: getEnvironmentAccessList
      parameters:
      - name: page
        in: query
        description: page
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: size
        schema:
          type: integer
          format: int32
          default: 100
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: searchTerm
        in: query
        description: The word to be searched and included in the list response
        schema:
          type: string
      - name: envIdentifiers
        in: query
        description: List of EnvironmentIds
        schema:
          type: array
          items:
            type: string
      - name: envGroupIdentifier
        in: query
        description: Environment group identifier
        schema:
          type: string
      - name: type
        in: query
        description: Environment type for the entity
        schema:
          type: string
          enum:
          - PreProduction
          - Production
      - name: sort
        in: query
        description: Specifies sorting criteria of the list. Like sorting based on the last updated entity, alphabetical sorting in an ascending or descending order
        schema:
          type: array
          items:
            type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Returns the list of Environments that are accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOListEnvironmentResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOListEnvironmentResponse'
  /ng/api/environmentsV2/move-config/{environmentIdentifier}:
    post:
      tags:
      - Environments
      summary: Move environment YAML from inline to remote
      operationId: moveEnvironmentConfigs
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: environmentIdentifier
        in: path
        description: Environment Identifier for the entity
        required: true
        schema:
          type: string
      - name: connectorRef
        in: query
        description: Identifier of Connector needed for CRUD operations on the respective Entity
        schema:
          type: string
      - name: repoName
        in: query
        description: Name of the repository.
        schema:
          type: string
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: filePath
        in: query
        description: File Path of the Entity.
        schema:
          type: string
      - name: commitMsg
        in: query
        description: Commit Message to use for the merge commit.
        schema:
          type: string
      - name: isNewBranch
        in: query
        description: Checks the new branch
        schema:
          type: boolean
          default: false
      - name: baseBranch
        in: query
        description: Name of the default branch.
        schema:
          type: string
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
          default: false
      - name: moveConfigType
        in: query
        description: Tells weather the entity has to be moved from inline to remote or remote to inline
        required: true
        schema:
          type: string
          enum:
          - INLINE_TO_REMOTE
          - REMOTE_TO_INLINE
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Move environment YAML from inline to remote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentMoveConfigResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentMoveConfigResponse'
  /ng/api/environmentsV2/{environmentIdentifier}/update-git-metadata:
