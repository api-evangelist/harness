            application/yaml:
              schema:
                $ref: '#/components/schemas/ResponseDTOEnvironmentGitUpdateResponse'
  /ng/api/environmentsV2/upsert:
    put:
      tags:
      - Environments
      summary: Upsert an Environment by identifier
      operationId: upsertEnvironmentV2
      parameters:
      - name: If-Match
        in: header
        schema:
          type: string
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the Environment to be updated
        content:
          application/json:
            schema:
