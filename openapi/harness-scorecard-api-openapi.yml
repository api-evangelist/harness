openapi: 3.2.0
info:
  title: Harness Scorecard API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Scorecard
paths:
  /v1/org/{org}/project/{project}/orchestration/{orchestration-id}/sbom-scorecard:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - schema:
        type: string
      name: orchestration-id
      in: path
      required: true
      description: Orchestration ID
    post:
      summary: Save Scorecard
      operationId: saveSbomScorecard
      responses:
        '200':
          $ref: '#/components/responses/SaveResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      x-stoplight:
        id: x9zs9hnpf2qui
      description: Save SBOM Scorecard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SbomScorecardRequest'
        description: ''
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      tags:
      - Scorecard
    get:
      summary: Get Scorecard
      operationId: getSbomScorecard
      responses:
        '200':
          $ref: '#/components/responses/SbomScorecardResponseBody'
        '400':
          description: Bad Request
      x-stoplight:
        id: cogck106pn3l9
      description: Get SBOM Scorecard
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      tags:
      - Scorecard
