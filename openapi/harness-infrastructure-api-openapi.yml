          type: string
          description: ID of the infrastructure
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureExecutionList'
        '400':
          description: 'bad_request: Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'not_found: Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'already_exists: Already Exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal_error: Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'unimplemented: Not Implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
  /api/infrastructures/{id}/specs:
    get:
      tags:
      - Infrastructure
      summary: ListSpecs Infrastructure
      description: Endpoint for listing specs for a specific infrastructure.
      operationId: Infrastructure#ListSpecs
      parameters:
      - name: offset
        in: query
        description: Offset for pagination
        allowEmptyValue: true
        schema:
          type: integer
          description: Offset for pagination
          format: int64
      - name: limit
        in: query
        description: Limit for pagination
        allowEmptyValue: true
        schema:
          type: integer
          description: Limit for pagination
          format: int64
      - name: desc
        in: query
        description: Order by descending order
        allowEmptyValue: true
        schema:
          type: boolean
          description: Order by descending order
      - name: orgIdentifier
        in: query
        description: Org is the organization identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Org is the organization identifier.
      - name: projectIdentifier
        in: query
        description: Project is the project identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Project is the project identifier.
      - name: id
        in: path
        description: ID of the infrastructure
        required: true
        schema:
          type: string
          description: ID of the infrastructure
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureSpecList'
        '400':
          description: 'bad_request: Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'not_found: Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'already_exists: Already Exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal_error: Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'unimplemented: Not Implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
  /api/infrastructures/approve:
    post:
      tags:
      - Infrastructure
      summary: ApprovePipelineExecution Infrastructure
      description: Endpoint for approving a pipeline approval step.
      operationId: Infrastructure#ApprovePipelineExecution
      parameters:
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePipelineExecutionRequestBody'
      responses:
        '200':
          description: OK response.
        '400':
          description: 'bad_request: Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'not_found: Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'already_exists: Already Exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal_error: Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'unimplemented: Not Implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
  /api/infrastructures/execute:
    post:
      tags:
      - Infrastructure
      summary: Execute Infrastructure
      description: Endpoint for executing an infrastructure, with the options of either dryrunning this process, or forcing it.
      operationId: Infrastructure#Execute
      parameters:
      - name: dryRun
        in: query
        description: Dry run the infrastructure
        allowEmptyValue: true
        schema:
          type: boolean
          description: Dry run the infrastructure
      - name: force
        in: query
        description: Force updates to all instances in the infrastructure
        allowEmptyValue: true
        schema:
          type: boolean
          description: Force updates to all instances in the infrastructure
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequestBody'
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: 'bad_request: Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'not_found: Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'already_exists: Already Exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal_error: Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'unimplemented: Not Implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
  /api/infrastructures/executions/{id}:
    get:
      tags:
      - Infrastructure
      summary: GetExecution Infrastructure
      description: Endpoint for retrieving a specific execution for a specific infrastructure.
      operationId: Infrastructure#GetExecution
      parameters:
      - name: orgIdentifier
        in: query
        description: Org is the organization identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Org is the organization identifier.
      - name: projectIdentifier
        in: query
        description: Project is the project identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Project is the project identifier.
      - name: id
        in: path
        description: ID of the event to fetch
        required: true
        schema:
          type: string
          description: ID of the event to fetch
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureExecution'
        '400':
          description: 'bad_request: Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'not_found: Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'already_exists: Already Exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal_error: Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'unimplemented: Not Implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
components:
  schemas:
    InfrastructureState:
      type: object
      properties:
        createdAt:
          type: string
          description: date (RFC3339) when the spec was created
        sessionEndedAt:
          type: string
        sessionStartedAt:
          type: string
        updatedAt:
          type: string
          description: date (RFC3339) when the spec was updated
    InfrastructureList:
      type: object
      properties:
        infrastructures:
          type: array
          items:
            $ref: '#/components/schemas/InfrastructureOutput'
        total:
          type: integer
          format: int64
    InstanceApproval:
      type: object
      properties:
        instanceId:
          type: string
        pipelineApprovals:
          type: array
          items:
            $ref: '#/components/schemas/PipelineApproval'
      required:
      - instanceId
      - pipelineApprovals
    Output:
      type: object
      properties:
        description:
          type: string
        type:
          type: string
          enum:
          - string
          - integer
          - number
          - object
          - boolean
          - array
        value: {}
      required:
      - value
      additionalProperties: false
    Infrastructure1:
      type: object
      properties:
        identifier:
          type: string
        instances:
          type: array
          items:
            $ref: '#/components/schemas/InfraInstance'
        metadata:
          type: object
          additionalProperties: true
        outputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Output'
        targetState:
          $ref: '#/components/schemas/State'
      required:
      - identifier
      - targetState
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        message:
          type: string
        name:
          type: string
      required:
      - name
      - message
    Dependency:
      type: object
      properties:
        identifier:
          type: string
        optional:
          type: boolean
      required:
      - identifier
      additionalProperties: false
    InfrastructureSpecList:
      type: object
      properties:
        specs:
          type: array
          items:
            $ref: '#/components/schemas/InfrastructureSpec'
        total:
          type: integer
          format: int64
    ExecuteRequestBody:
      type: object
      properties:
        infrastructureYaml:
          type: string
          description: infrastructure to Execute
        orgIdentifier:
          type: string
          description: Org is the organization identifier.
        projectIdentifier:
          type: string
          description: Project is the project identifier.
      description: Scope for the request, including account, org and project.
      required:
      - infrastructureYaml
    ExecutionOutput:
      type: object
      properties:
        description:
          type: string
          description: Description of the output
        value:
          description: Value of the output
      required:
      - value
      additionalProperties: false
    ExecutionEvent:
      type: object
      properties:
        createdAt:
          type: string
        event:
          $ref: '#/components/schemas/InfrastructureProgress'
        message:
          type: string
          description: Message associated with the event
      required:
      - event
      - createdAt
    InfrastructureSpec:
      type: object
      properties:
        createdAt:
          type: string
          description: date (RFC3339) when the spec was created
        infrastructure:
          $ref: '#/components/schemas/Infrastructure1'
        revision:
          type: integer
          format: int64
    Steps:
      type: object
      properties:
        apply:
          type: object
          additionalProperties: true
        create:
          type: object
          additionalProperties: true
        delete:
          type: object
          additionalProperties: true
        destroy:
          type: object
          additionalProperties: true
        pause:
          type: object
          additionalProperties: true
        resume:
          type: object
          additionalProperties: true
      required:
      - apply
      - destroy
      additionalProperties: false
    PipelineApproval:
      type: object
      properties:
        approvalID:
          type: string
        deadline:
          type: string
        message:
          type: string
        orgID:
          type: string
        pipelineExecutionId:
          type: string
        pipelineId:
          type: string
        pipelineUrl:
          type: string
        projectID:
          type: string
      required:
      - approvalID
      - pipelineExecutionId
      - orgID
      - projectID
      - message
    InfrastructureOutput:
      type: object
      properties:
        activeExecutions:
          type: array
          items:
            $ref: '#/components/schemas/InfrastructureExecution'
        identifier:
          type: string
          description: ID of the infrastructure
        spec:
          $ref: '#/components/schemas/InfrastructureSpec'
        state:
          $ref: '#/components/schemas/InfrastructureState'
      required:
      - identifier
      - state
      - activeExecutions
    ApprovePipelineExecutionRequestBody:
      type: object
      properties:
        action:
          type: string
          enum:
          - APPROVE
          - REJECT
        approvalID:
          type: string
          description: ID of the approval
        message:
          type: string
          description: Message to send with the approval
      required:
      - approvalID
      - action
    SchemasRequestBody:
      type: object
      properties:
        orgIdentifier:
          type: string
          description: Org is the organization identifier.
        projectIdentifier:
          type: string
          description: Project is the project identifier.
      description: Scope for the request, including account, org and project.
    InfrastructureProgress:
      type: object
      properties:
        progress:
          type: string
          enum:
          - unknown
          - pending
          - processing
          - done
          - failed
          - aborted
          - deleted
          - replaced
      required:
      - progress
    InfraInstance:
      type: object
      properties:
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Dependency'
        identifier:
          type: string
        implementation:
          $ref: '#/components/schemas/Implementation'
        metadata:
          type: object
          additionalProperties: true
        outputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Output'
        targetState:
          $ref: '#/components/schemas/State'
      required:
      - identifier
      additionalProperties: false
    Implementation:
      type: object
      properties:
        backend:
          type: string
        steps:
          $ref: '#/components/schemas/Steps'
        values:
          type: object
          additionalProperties: true
      required:
      - backend
      - steps
      additionalProperties: false
    State:
      type: object
      properties:
        state:
          type: string
          enum:
          - unknown
          - inactive
          - instantiated
          - running
          - paused
      required:
      - state
    InfrastructureExecution:
      type: object
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/InstanceApproval'
        completedInstanceIds:
          type: array
          items:
            type: string
          description: Instances fully updated by the execution
        events:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionEvent'
        id:
          type: string
        infrastructureId:
          type: string
        instanceIds:
          type: array
          items:
            type: string
          description: Instances updated by the execution
        message:
          type: string
          description: Message associated with the execution
        outputs:
          type: object
          description: Outputs of the infrastructure execution
          additionalProperties:
            $ref: '#/components/schemas/ExecutionOutput'
        pipelineUrl:
          type: string
        progress:
          $ref: '#/components/schemas/InfrastructureProgress'
        spec:
          $ref: '#/components/schemas/Infrastructure1'
        specRevision:
          type: integer
          format: int64
        startedAt:
          type: string
        stoppedAt:
          type: string
        targetState:
          $ref: '#/components/schemas/State'
      required:
      - id
      - infrastructureId
      - instanceIds
      - specRevision
      - spec
      - startedAt
      - targetState
      - progress
      - completedInstanceIds
    InfrastructureExecutionList:
      type: object
      properties:
        executions:
          type: array
          items:
            $ref: '#/components/schemas/InfrastructureExecution'
        total:
          type: integer
          format: int64
