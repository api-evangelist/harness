        '501':
          description: 'unimplemented: Not Implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
  /api/infrastructures/{id}:
    delete:
      tags:
      - Infrastructure
      summary: Delete Infrastructure
      description: Endpoint for deleting a specific infrastructure.
      operationId: Infrastructure#Delete
      parameters:
      - name: orgIdentifier
        in: query
        description: Org is the organization identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Org is the organization identifier.
      - name: projectIdentifier
        in: query
        description: Project is the project identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Project is the project identifier.
      - name: id
        in: path
        description: ID of the infrastructure
        required: true
        schema:
          type: string
          description: ID of the infrastructure
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: OK response.
        '400':
          description: 'bad_request: Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'not_found: Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'already_exists: Already Exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal_error: Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'unimplemented: Not Implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
    get:
      tags:
      - Infrastructure
      summary: Get Infrastructure
      description: Endpoint for retrieving a specific infrastructure.
      operationId: Infrastructure#Get
      parameters:
      - name: orgIdentifier
        in: query
        description: Org is the organization identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Org is the organization identifier.
      - name: projectIdentifier
        in: query
        description: Project is the project identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Project is the project identifier.
      - name: id
        in: path
        description: ID of the infrastructure
        required: true
        schema:
          type: string
          description: ID of the infrastructure
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureOutput'
        '400':
          description: 'bad_request: Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'not_found: Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'already_exists: Already Exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal_error: Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'unimplemented: Not Implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
  /api/infrastructures/{id}/executions:
    get:
      tags:
      - Infrastructure
      summary: ListExecutions Infrastructure
      description: Endpoint for listing executions for a specific infrastructure.
      operationId: Infrastructure#ListExecutions
      parameters:
      - name: offset
        in: query
        description: Offset for pagination
        allowEmptyValue: true
        schema:
          type: integer
          description: Offset for pagination
          format: int64
      - name: limit
        in: query
        description: Limit for pagination
        allowEmptyValue: true
        schema:
          type: integer
          description: Limit for pagination
          format: int64
      - name: desc
        in: query
        description: Order by descending order
        allowEmptyValue: true
        schema:
          type: boolean
          description: Order by descending order
      - name: orgIdentifier
        in: query
        description: Org is the organization identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Org is the organization identifier.
      - name: projectIdentifier
        in: query
        description: Project is the project identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Project is the project identifier.
      - name: id
        in: path
        description: ID of the infrastructure
        required: true
