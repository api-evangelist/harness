openapi: 3.2.0
info:
  title: Harness Infrastructure API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Infrastructure
  description: The infrastructure service for working with infrastructures
paths:
  /api/infrastructures:
    get:
      tags:
      - Infrastructure
      summary: List Infrastructure
      description: Endpoint for listing all infrastructures.
      operationId: Infrastructure#List
      parameters:
      - name: offset
        in: query
        description: Offset for pagination
        allowEmptyValue: true
        schema:
          type: integer
          description: Offset for pagination
          format: int64
      - name: limit
        in: query
        description: Limit for pagination
        allowEmptyValue: true
        schema:
          type: integer
          description: Limit for pagination
          format: int64
      - name: desc
        in: query
        description: Order by descending order
        allowEmptyValue: true
        schema:
          type: boolean
          description: Order by descending order
      - name: orgIdentifier
        in: query
        description: Org is the organization identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Org is the organization identifier.
      - name: projectIdentifier
        in: query
        description: Project is the project identifier.
        allowEmptyValue: true
        schema:
          type: string
          description: Project is the project identifier.
      - name: Harness-Account
        in: header
        description: Account is the internal customer account ID.
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account is the internal customer account ID.
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureList'
        '400':
          description: 'bad_request: Bad Request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'not_found: Not Found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'already_exists: Already Exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal_error: Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'unimplemented: Not Implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
  /api/infrastructures/{executionID}/abort:
    post:
      tags:
      - Infrastructure
      summary: Abort Infrastructure
      description: Endpoint for aborting an infrastructure execution.
      operationId: Infrastructure#Abort
      parameters:
      - name: executionID
        in: path
        description: ID of the execution to abort
        required: true
        schema:
          type: string
          description: ID of the execution to abort
      - name: Harness-Account
        in: header
