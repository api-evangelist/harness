  /iacm/api/enforcement/client/usage/{metric}:
    put:
      tags:
      - Usage
      summary: Show usage
      description: Retrieve a single usage
      operationId: usage#getUsage
      parameters:
      - name: accountIdentifier
        in: query
        description: Account identifier
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account identifier
          example: Laborum dicta dolor voluptatem.
        example: Alias praesentium.
      - name: metric
        in: path
        description: Usage metric
        required: true
        schema:
          type: string
          description: Usage metric
          example: Qui occaecati explicabo quaerat.
        example: Cum accusamus ut.
      responses:
        '200':
          description: OK response.
          content:
            application/json:
