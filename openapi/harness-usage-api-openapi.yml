      operationId: listSRMActiveMonitoredServices
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        schema:
          type: string
      - name: page
        in: query
        description: 'Page Index of the results to fetch.Default Value: 0'
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Results per page
        schema:
          maximum: 50
          type: integer
          format: int32
          default: 20
      - name: sort
        in: query
        description: Sort criteria for the elements.
        schema:
          type: array
          items:
            type: string
      - name: timestamp
        in: query
