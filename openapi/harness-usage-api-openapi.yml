          type: string
          description: Account identifier
          example: y
          minLength: 1
          maxLength: 128
        ansible:
          $ref: '#/components/schemas/AnsibleLicenceData'
        isLicenced:
          type: boolean
          description: True when this account is currently licenced to execute apply operations
          example: false
        isPaid:
          type: boolean
          description: True when this account is a paid account
          example: false
        reason:
          type: string
          description: If the account is not licenced, this is the reason why
          example: Ut tenetur aspernatur.
        startTime:
          type: integer
          description: The unix timestamp of the current period over which usage was calculated
          example: 2001261465280041500
          format: int64
        total:
          type: integer
          description: The total number of successful apply operations this account is licenced to perform
          example: 3368063249136320000
          format: int64
        used:
          type: integer
          description: The count of successful apply operations already performed
          example: 4730380683385593000
          format: int64
      example:
        account: pb
        ansible:
          total: 6834376389754827000
          used: 277876406161876320
        isLicenced: true
        isPaid: false
        reason: Ad praesentium atque maxime eius aut.
        startTime: 8232350283070003000
        total: 1982933751674987000
        used: 7946422012286740000
      required:
      - account
      - used
      - total
      - startTime
      - isPaid
      - isLicenced
