      type: object
      properties:
        uniqueHosts30d:
          type: integer
          description: Unique hosts with runs in last 30 days
          example: 8142608687666944000
          format: int64
      example:
        uniqueHosts30d: 3829730573454693000
      required:
      - uniqueHosts30d
    IaCMError:
      type: object
      properties:
        fault:
          type: boolean
          description: Is the error a server-side fault?
          example: false
        id:
          type: string
          description: ID is a unique identifier for this particular occurrence of the problem.
          example: 123abc
        message:
          type: string
          description: Message is a human-readable explanation specific to this occurrence of the problem.
          example: parameter 'p' must be an integer
        name:
          type: string
          description: Name is the name of this class of errors.
          example: bad_request
        temporary:
          type: boolean
          description: Is the error temporary?
          example: false
        timeout:
          type: boolean
          description: Is the error a timeout?
          example: true
      example:
        fault: false
        id: 123abc
        message: parameter 'p' must be an integer
        name: bad_request
        temporary: false
        timeout: true
      required:
      - name
      - id
      - message
      - temporary
      - timeout
      - fault
    UsageData:
      type: object
      properties:
        ansible:
          $ref: '#/components/schemas/AnsibleUsageData'
        count:
          type: integer
          description: Metric value (IACM successful applies)
          example: 4385665767261763600
          format: int64
      example:
        ansible:
          uniqueHosts30d: 3091984324795238400
        count: 651445018340867600
      required:
      - count
    AnsibleLicenceData:
      type: object
      properties:
        total:
          type: integer
          description: Total ansible hosts allowed by license
          example: 7701931872545664000
          format: int64
        used:
          type: integer
          description: Unique hosts with runs in last 30 days
          example: 2488105792437196300
          format: int64
      example:
        total: 8422866544782249000
        used: 8604031699433627000
      required:
      - used
      - total
