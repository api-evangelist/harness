  /iacm/api/usage/check-licence:
    get:
      tags:
      - Usage
      summary: Show licence
      description: Check whether the account is currently licenced
      operationId: usage#checkLicence
      parameters:
      - name: Harness-Account
        in: header
        description: Account identifier
        allowEmptyValue: true
        required: true
        schema:
          type: string
          description: Account identifier
          example: Magnam est beatae aut odio.
        example: Dolores asperiores ipsa numquam unde exercitationem.
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowLicenceResponse'
              example:
                account: ed
                ansible:
                  total: 6834376389754827000
                  used: 277876406161876320
                isLicenced: true
                isPaid: false
                reason: Qui delectus sit.
