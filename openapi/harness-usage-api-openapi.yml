      type: object
      properties:
        data:
          $ref: '#/components/schemas/UsageData'
        status:
          type: string
          example: Et illum laudantium impedit voluptatum autem.
      example:
        data:
          ansible:
            uniqueHosts30d: 4993966439619897000
          count: 7484279815988722000
        status: Eos est quidem vel aut temporibus.
      required:
      - status
      - data
