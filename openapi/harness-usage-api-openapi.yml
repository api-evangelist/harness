openapi: 3.2.0
info:
  title: Harness Usage API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Usage
  description: This contains APIs specific to CD license usage
paths:
  /ng/api/license-usage-cd/v2/{usageType}/csv/download:
    get:
      tags:
      - Usage
      summary: Download CD Usage CSV report
      operationId: downloadCDUsageCSVReport
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        schema:
          type: string
      - name: usageType
        in: path
        required: true
        schema:
          type: string
          enum:
          - ServiceDeployment
          - Gitops
          - PipelineExecution
      - name: timestamp
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Download CSV Active Services report
