openapi: 3.2.0
info:
  title: Harness Rollouts API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Rollouts
paths:
  /gitops/api/v1/agents/{agentIdentifier}/applications/{request.name}/rollouts/status:
    get:
      description: Get current status for the given Rollout resource
      operationId: RolloutsService_GetRolloutStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1RolloutInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: path
        required: true
        schema:
          type: string
      - name: request.name
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: request.namespace
        in: query
        required: false
        schema:
          type: string
      - name: request.resourceName
        in: query
        required: false
        schema:
          type: string
      - name: request.version
        in: query
        required: false
        schema:
          type: string
      - name: request.group
        in: query
        required: false
        schema:
          type: string
      - name: request.kind
        in: query
        required: false
        schema:
          type: string
      - name: request.appNamespace
        in: query
        required: false
        schema:
          type: string
      - name: request.project
        in: query
        required: false
        schema:
          type: string
      tags:
      - Rollouts
      summary: Rollouts service get rollout status
      x-summary-source: derived
components:
  schemas:
    v1AzureFileVolumeSource:
      type: object
      properties:
        secretName:
          type: string
          title: secretName is the  name of secret that contains Azure Storage Account Name and Key
        shareName:
          type: string
          title: shareName is the azure share Name
        readOnly:
          type: boolean
          title: 'readOnly defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional'
      description: AzureFile represents an Azure File Service mount on the host and bind mount to the pod.
    v1RolloutExperimentStepAnalysisTemplateRef:
      type: object
      properties:
        name:
          type: string
          title: Name is a name for this analysis template invocation
        templateName:
          type: string
          title: TemplateName reference of the AnalysisTemplate name used by the Experiment to create the run
        clusterScope:
          type: boolean
          title: 'Whether to look for the templateName at cluster scope or namespace scope

            +optional'
        args:
          type: array
          items:
            $ref: '#/components/schemas/v1AnalysisRunArgument'
          title: 'Args the arguments that will be added to the AnalysisRuns

            +patchMergeKey=name

            +patchStrategy=merge'
        requiredForCompletion:
          type: boolean
          title: RequiredForCompletion blocks the Experiment from completing until the analysis has completed
    v1DownwardAPIProjection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/v1DownwardAPIVolumeFile'
          title: 'Items is a list of DownwardAPIVolume file

            +optional

            +listType=atomic'
      description: 'Represents downward API info for projecting into a projected volume.

        Note that this is identical to a downwardAPI volume source without the default

        mode.'
    v1CephFSVolumeSource:
      type: object
      properties:
        monitors:
          type: array
          items:
            type: string
          title: 'monitors is Required: Monitors is a collection of Ceph monitors

            More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it

            +listType=atomic'
        path:
          type: string
          title: 'path is Optional: Used as the mounted root, rather than the full Ceph tree, default is /

            +optional'
        user:
          type: string
          title: 'user is optional: User is the rados user name, default is admin

            More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it

            +optional'
        secretFile:
          type: string
          title: 'secretFile is Optional: SecretFile is the path to key ring for User, default is /etc/ceph/user.secret

            More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it

            +optional'
        secretRef:
          $ref: '#/components/schemas/v1LocalObjectReference'
        readOnly:
          type: boolean
          title: 'readOnly is Optional: Defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it

            +optional'
      description: 'Represents a Ceph Filesystem mount that lasts the lifetime of a pod

        Cephfs volumes do not support ownership management or SELinux relabeling.'
    v1DownwardAPIVolumeFile:
      type: object
      properties:
        path:
          type: string
          title: 'Required: Path is  the relative path name of the file to be created. Must not be absolute or contain the ''..'' path. Must be utf-8 encoded. The first item of the relative path must not start with ''..'''
        fieldRef:
          $ref: '#/components/schemas/v1ObjectFieldSelector'
        resourceFieldRef:
          $ref: '#/components/schemas/v1ResourceFieldSelector'
        mode:
          type: integer
          format: int32
          title: 'Optional: mode bits used to set permissions on this file, must be an octal value

            between 0000 and 0777 or a decimal value between 0 and 511.

            YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.

            If not specified, the volume defaultMode will be used.

            This might be in conflict with other options that affect the file

            mode, like fsGroup, and the result can be other mode bits set.

            +optional'
      title: DownwardAPIVolumeFile represents information to create the file containing the pod field
    v1KeyToPath:
      type: object
      properties:
        key:
          type: string
          description: key is the key to project.
        path:
          type: string
          description: 'path is the relative path of the file to map the key to.

            May not be an absolute path.

            May not contain the path element ''..''.

            May not start with the string ''..''.'
        mode:
          type: integer
          format: int32
          title: 'mode is Optional: mode bits used to set permissions on this file.

            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.

            YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.

            If not specified, the volume defaultMode will be used.

            This might be in conflict with other options that affect the file

            mode, like fsGroup, and the result can be other mode bits set.

            +optional'
      description: Maps a string key to a path within a volume.
    v1PodFailurePolicy:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/v1PodFailurePolicyRule'
          title: 'A list of pod failure policy rules. The rules are evaluated in order.

            Once a rule matches a Pod failure, the remaining of the rules are ignored.

            When no rule matches the Pod failure, the default handling applies - the

            counter of pod failures is incremented and it is checked against

            the backoffLimit. At most 20 elements are allowed.

            +listType=atomic'
      description: PodFailurePolicy describes how failed pods influence the backoffLimit.
    v1RouteMatch:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/v1StringMatch'
        path:
          $ref: '#/components/schemas/v1StringMatch'
        headers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/v1StringMatch'
          title: 'Headers What request with matching headers should be mirrored

            +optional'
    v1NewRelicMetric:
      type: object
      properties:
        profile:
          type: string
          title: Profile is the name of the secret holding NR account configuration
        query:
          type: string
          title: Query is a raw newrelic NRQL query to perform
      title: NewRelicMetric defines the newrelic query to perform canary analysis
    v1EnvVarSource:
      type: object
      properties:
        fieldRef:
          $ref: '#/components/schemas/v1ObjectFieldSelector'
        resourceFieldRef:
          $ref: '#/components/schemas/v1ResourceFieldSelector'
        configMapKeyRef:
          $ref: '#/components/schemas/v1ConfigMapKeySelector'
        secretKeyRef:
          $ref: '#/components/schemas/v1SecretKeySelector'
        fileKeyRef:
          $ref: '#/components/schemas/v1FileKeySelector'
      description: EnvVarSource represents a source for the value of an EnvVar.
    v1SecurityContext:
      type: object
      properties:
        capabilities:
          $ref: '#/components/schemas/v1Capabilities'
        privileged:
          type: boolean
          title: 'Run container in privileged mode.

            Processes in privileged containers are essentially equivalent to root on the host.

            Defaults to false.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
        seLinuxOptions:
          $ref: '#/components/schemas/v1SELinuxOptions'
        windowsOptions:
          $ref: '#/components/schemas/v1WindowsSecurityContextOptions'
        runAsUser:
          type: string
          format: int64
          title: 'The UID to run the entrypoint of the container process.

            Defaults to user specified in image metadata if unspecified.

            May also be set in PodSecurityContext.  If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
        runAsGroup:
          type: string
          format: int64
          title: 'The GID to run the entrypoint of the container process.

            Uses runtime default if unset.

            May also be set in PodSecurityContext.  If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
        runAsNonRoot:
          type: boolean
          title: 'Indicates that the container must run as a non-root user.

            If true, the Kubelet will validate the image at runtime to ensure that it

            does not run as UID 0 (root) and fail to start the container if it does.

            If unset or false, no such validation will be performed.

            May also be set in PodSecurityContext.  If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence.

            +optional'
        readOnlyRootFilesystem:
          type: boolean
          title: 'Whether this container has a read-only root filesystem.

            Default is false.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
        allowPrivilegeEscalation:
          type: boolean
          title: 'AllowPrivilegeEscalation controls whether a process can gain more

            privileges than its parent process. This bool directly controls if

            the no_new_privs flag will be set on the container process.

            AllowPrivilegeEscalation is true always when the container is:

            1) run as Privileged

            2) has CAP_SYS_ADMIN

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
        procMount:
          type: string
          title: 'procMount denotes the type of proc mount to use for the containers.

            The default value is Default which uses the container runtime defaults for

            readonly paths and masked paths.

            This requires the ProcMountType feature flag to be enabled.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
        seccompProfile:
          $ref: '#/components/schemas/v1SeccompProfile'
        appArmorProfile:
          $ref: '#/components/schemas/v1AppArmorProfile'
      description: 'SecurityContext holds security configuration that will be applied to a container.

        Some fields are present in both SecurityContext and PodSecurityContext.  When both

        are set, the values in SecurityContext take precedence.'
    v1FlexVolumeSource:
      type: object
      properties:
        driver:
          type: string
          description: driver is the name of the driver to use for this volume.
        fsType:
          type: string
          title: 'fsType is the filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". The default filesystem depends on FlexVolume script.

            +optional'
        secretRef:
          $ref: '#/components/schemas/v1LocalObjectReference'
        readOnly:
          type: boolean
          title: 'readOnly is Optional: defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional'
        options:
          type: object
          additionalProperties:
            type: string
          title: 'options is Optional: this field holds extra command options if any.

            +optional'
      description: 'FlexVolume represents a generic volume resource that is

        provisioned/attached using an exec based plugin.'
    v1NodeAffinity:
      type: object
      properties:
        requiredDuringSchedulingIgnoredDuringExecution:
          $ref: '#/components/schemas/v1NodeSelector'
        preferredDuringSchedulingIgnoredDuringExecution:
          type: array
          items:
            $ref: '#/components/schemas/v1PreferredSchedulingTerm'
          title: 'The scheduler will prefer to schedule pods to nodes that satisfy

            the affinity expressions specified by this field, but it may choose

            a node that violates one or more of the expressions. The node that is

            most preferred is the one with the greatest sum of weights, i.e.

            for each node that meets all of the scheduling requirements (resource

            request, requiredDuringScheduling affinity expressions, etc.),

            compute a sum by iterating through the elements of this field and adding

            "weight" to the sum if the node matches the corresponding matchExpressions; the

            node(s) with the highest sum are the most preferred.

            +optional

            +listType=atomic'
      description: Node affinity is a group of node affinity scheduling rules.
    v1Probe:
      type: object
      properties:
        handler:
          $ref: '#/components/schemas/v1ProbeHandler'
        initialDelaySeconds:
          type: integer
          format: int32
          title: 'Number of seconds after the container has started before liveness probes are initiated.

            More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes

            +optional'
        timeoutSeconds:
          type: integer
          format: int32
          title: 'Number of seconds after which the probe times out.

            Defaults to 1 second. Minimum value is 1.

            More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes

            +optional'
        periodSeconds:
          type: integer
          format: int32
          title: 'How often (in seconds) to perform the probe.

            Default to 10 seconds. Minimum value is 1.

            +optional'
        successThreshold:
          type: integer
          format: int32
          title: 'Minimum consecutive successes for the probe to be considered successful after having failed.

            Defaults to 1. Must be 1 for liveness and startup. Minimum value is 1.

            +optional'
        failureThreshold:
          type: integer
          format: int32
          title: 'Minimum consecutive failures for the probe to be considered failed after having succeeded.

            Defaults to 3. Minimum value is 1.

            +optional'
        terminationGracePeriodSeconds:
          type: string
          format: int64
          title: 'Optional duration in seconds the pod needs to terminate gracefully upon probe failure.

            The grace period is the duration in seconds after the processes running in the pod are sent

            a termination signal and the time when the processes are forcibly halted with a kill signal.

            Set this value longer than the expected cleanup time for your process.

            If this value is nil, the pod''s terminationGracePeriodSeconds will be used. Otherwise, this

            value overrides the value provided by the pod spec.

            Value must be non-negative integer. The value zero indicates stop immediately via

            the kill signal (no opportunity to shut down).

            This is a beta field and requires enabling ProbeTerminationGracePeriod feature gate.

            Minimum value is 1. spec.terminationGracePeriodSeconds is used if unset.

            +optional'
      description: 'Probe describes a health check to be performed against a container to determine whether it is

        alive or ready to receive traffic.'
    v1PodDNSConfig:
      type: object
      properties:
        nameservers:
          type: array
          items:
            type: string
          title: 'A list of DNS name server IP addresses.

            This will be appended to the base nameservers generated from DNSPolicy.

            Duplicated nameservers will be removed.

            +optional

            +listType=atomic'
        searches:
          type: array
          items:
            type: string
          title: 'A list of DNS search domains for host-name lookup.

            This will be appended to the base search paths generated from DNSPolicy.

            Duplicated search paths will be removed.

            +optional

            +listType=atomic'
        options:
          type: array
          items:
            $ref: '#/components/schemas/v1PodDNSConfigOption'
          title: 'A list of DNS resolver options.

            This will be merged with the base options generated from DNSPolicy.

            Duplicated entries will be removed. Resolution options given in Options

            will override those that appear in the base DNSPolicy.

            +optional

            +listType=atomic'
      description: 'PodDNSConfig defines the DNS parameters of a pod in addition to

        those generated from DNSPolicy.'
    v1CloudWatchMetricStat:
      type: object
      properties:
        metric:
          $ref: '#/components/schemas/v1CloudWatchMetricStatMetric'
        period:
          $ref: '#/components/schemas/intstrIntOrString'
        stat:
          type: string
        unit:
          type: string
    v1DownwardAPIVolumeSource:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/v1DownwardAPIVolumeFile'
          title: 'Items is a list of downward API volume file

            +optional

            +listType=atomic'
        defaultMode:
          type: integer
          format: int32
          title: 'Optional: mode bits to use on created files by default. Must be a

            Optional: mode bits used to set permissions on created files by default.

            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.

            YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.

            Defaults to 0644.

            Directories within the path are not affected by this setting.

            This might be in conflict with other options that affect the file

            mode, like fsGroup, and the result can be other mode bits set.

            +optional'
      description: 'DownwardAPIVolumeSource represents a volume containing downward API info.

        Downward API volumes support ownership management and SELinux relabeling.'
    v1HostAlias:
      type: object
      properties:
        ip:
          type: string
          title: 'IP address of the host file entry.

            +required'
        hostnames:
          type: array
          items:
            type: string
          title: 'Hostnames for the above IP address.

            +listType=atomic'
      description: 'HostAlias holds the mapping between IP and hostnames that will be injected as an entry in the

        pod''s hosts file.'
    v1AppArmorProfile:
      type: object
      properties:
        type:
          type: string
          title: "type indicates which kind of AppArmor profile will be applied.\nValid options are:\n  Localhost - a profile pre-loaded on the node.\n  RuntimeDefault - the container runtime's default profile.\n  Unconfined - no AppArmor enforcement.\n+unionDiscriminator"
        localhostProfile:
          type: string
          title: 'localhostProfile indicates a profile loaded on the node that should be used.

            The profile must be preconfigured on the node to work.

            Must match the loaded name of the profile.

            Must be set if and only if type is "Localhost".

            +optional'
      title: 'AppArmorProfile defines a pod or container''s AppArmor settings.

        +union'
    v1ManagedFieldsEntry:
      type: object
      properties:
        manager:
          type: string
          description: Manager is an identifier of the workflow managing these fields.
        operation:
          type: string
          description: 'Operation is the type of operation which lead to this ManagedFieldsEntry being created.

            The only valid values for this field are ''Apply'' and ''Update''.'
        apiVersion:
          type: string
          description: 'APIVersion defines the version of this resource that this field set

            applies to. The format is "group/version" just like the top-level

            APIVersion field. It is necessary to track the version of a field

            set because it cannot be automatically converted.'
        time:
          $ref: '#/components/schemas/v1Time'
        fieldsType:
          type: string
          title: 'FieldsType is the discriminator for the different fields format and version.

            There is currently only one possible value: "FieldsV1"'
        fieldsV1:
          $ref: '#/components/schemas/v1FieldsV1'
        subresource:
          type: string
          description: 'Subresource is the name of the subresource used to update that object, or

            empty string if the object was updated through the main resource. The

            value of this field is used to distinguish between managers, even if they

            share the same name. For example, a status update will be distinct from a

            regular update using the same manager name.

            Note that the APIVersion field is not related to the Subresource field and

            it always corresponds to the version of the main resource.'
      description: 'ManagedFieldsEntry is a workflow-id, a FieldSet and the group version of the resource

        that the fieldset applies to.'
    v1ContainerRestartRuleOnExitCodes:
      type: object
      properties:
        operator:
          type: string
          title: "Represents the relationship between the container exit code(s) and the\nspecified values. Possible values are:\n- In: the requirement is satisfied if the container exit code is in the\n  set of specified values.\n- NotIn: the requirement is satisfied if the container exit code is\n  not in the set of specified values.\n+required"
        values:
          type: array
          items:
            type: integer
            format: int32
          title: 'Specifies the set of values to check for container exit codes.

            At most 255 elements are allowed.

            +optional

            +listType=set'
      description: 'ContainerRestartRuleOnExitCodes describes the condition

        for handling an exited container based on its exit codes.'
    v1CloudWatchMetricStatMetricDimension:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
    v1CSIVolumeSource:
      type: object
      properties:
        driver:
          type: string
          description: 'driver is the name of the CSI driver that handles this volume.

            Consult with your admin for the correct name as registered in the cluster.'
        readOnly:
          type: boolean
          title: 'readOnly specifies a read-only configuration for the volume.

            Defaults to false (read/write).

            +optional'
        fsType:
          type: string
          title: 'fsType to mount. Ex. "ext4", "xfs", "ntfs".

            If not provided, the empty value is passed to the associated CSI driver

            which will determine the default filesystem to apply.

            +optional'
        volumeAttributes:
          type: object
          additionalProperties:
            type: string
          title: 'volumeAttributes stores driver-specific properties that are passed to the CSI

            driver. Consult your driver''s documentation for supported values.

            +optional'
        nodePublishSecretRef:
          $ref: '#/components/schemas/v1LocalObjectReference'
      title: Represents a source location of a volume to mount, managed by an external CSI driver
    v1PrometheusAuth:
      type: object
      properties:
        sigv4:
          $ref: '#/components/schemas/v1Sigv4Config'
      title: PrometheusMetric defines the prometheus query to perform canary analysis
    v1ServiceAccountTokenProjection:
      type: object
      properties:
        audience:
          type: string
          title: 'audience is the intended audience of the token. A recipient of a token

            must identify itself with an identifier specified in the audience of the

            token, and otherwise should reject the token. The audience defaults to the

            identifier of the apiserver.

            +optional'
        expirationSeconds:
          type: string
          format: int64
          title: 'expirationSeconds is the requested duration of validity of the service

            account token. As the token approaches expiration, the kubelet volume

            plugin will proactively rotate the service account token. The kubelet will

            start trying to rotate the token if the token is older than 80 percent of

            its time to live or if the token is older than 24 hours.Defaults to 1 hour

            and must be at least 10 minutes.

            +optional'
        path:
          type: string
          description: 'path is the path relative to the mount point of the file to project the

            token into.'
      description: 'ServiceAccountTokenProjection represents a projected service account token

        volume. This projection can be used to insert a service account token into

        the pods runtime filesystem for use against APIs (Kubernetes API Server or

        otherwise).'
    v1ResourceFieldSelector:
      type: object
      properties:
        containerName:
          type: string
          title: 'Container name: required for volumes, optional for env vars

            +optional'
        resource:
          type: string
          title: 'Required: resource to select'
        divisor:
          $ref: '#/components/schemas/resourceQuantity'
      title: 'ResourceFieldSelector represents container resources (cpu, memory) and their output format

        +structType=atomic'
    v1EphemeralVolumeSource:
      type: object
      properties:
        volumeClaimTemplate:
          $ref: '#/components/schemas/v1PersistentVolumeClaimTemplate'
      description: Represents an ephemeral volume that is handled by a normal storage driver.
    v1RolloutAnalysisTemplate:
      type: object
      properties:
        templateName:
          type: string
          title: 'TemplateName name of template to use in AnalysisRun

            +optional'
        clusterScope:
          type: boolean
          title: 'Whether to look for the templateName at cluster scope or namespace scope

            +optional'
    v1RolloutPause:
      type: object
      properties:
        duration:
          $ref: '#/components/schemas/intstrIntOrString'
      title: RolloutPause defines a pause stage for a rollout
    v1Sysctl:
      type: object
      properties:
        name:
          type: string
          title: Name of a property to set
        value:
          type: string
          title: Value of a property to set
      title: Sysctl defines a kernel parameter to be set
    v1FCVolumeSource:
      type: object
      properties:
        targetWWNs:
          type: array
          items:
            type: string
          title: 'targetWWNs is Optional: FC target worldwide names (WWNs)

            +optional

            +listType=atomic'
        lun:
          type: integer
          format: int32
          title: 'lun is Optional: FC target lun number

            +optional'
        fsType:
          type: string
          title: 'fsType is the filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

