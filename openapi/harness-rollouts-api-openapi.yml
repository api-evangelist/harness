        system:
          type: string
          description: system is the name of the storage system as configured in ScaleIO.
        secretRef:
          $ref: '#/components/schemas/v1LocalObjectReference'
        sslEnabled:
          type: boolean
          title: 'sslEnabled Flag enable/disable SSL communication with Gateway, default false

            +optional'
        protectionDomain:
          type: string
          title: 'protectionDomain is the name of the ScaleIO Protection Domain for the configured storage.

            +optional'
        storagePool:
          type: string
          title: 'storagePool is the ScaleIO Storage Pool associated with the protection domain.

            +optional'
        storageMode:
          type: string
          title: 'storageMode indicates whether the storage for a volume should be ThickProvisioned or ThinProvisioned.

            Default is ThinProvisioned.

            +optional

            +default="ThinProvisioned"'
        volumeName:
          type: string
          description: 'volumeName is the name of a volume already created in the ScaleIO system

            that is associated with this volume source.'
        fsType:
          type: string
          title: 'fsType is the filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs".

            Default is "xfs".

