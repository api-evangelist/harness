            +optional'
        replicas:
          type: integer
          format: int32
          title: 'Replicas sets the number of replicas the newRS should have

            +optional'
        matchTrafficWeight:
          type: boolean
          title: 'MatchTrafficWeight cancels out previously set Replicas or Weight, effectively activating SetWeight

            +optional'
      title: SetCanaryScale defines how to scale the newRS without changing traffic weight
    v1SecretVolumeSource:
      type: object
      properties:
        secretName:
          type: string
          title: 'secretName is the name of the secret in the pod''s namespace to use.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#secret

            +optional'
        items:
          type: array
          items:
            $ref: '#/components/schemas/v1KeyToPath'
          title: 'items If unspecified, each key-value pair in the Data field of the referenced

            Secret will be projected into the volume as a file whose name is the

            key and content is the value. If specified, the listed keys will be

            projected into the specified paths, and unlisted keys will not be

            present. If a key is specified which is not present in the Secret,

            the volume setup will error unless it is marked optional. Paths must be

            relative and may not contain the ''..'' path or start with ''..''.

            +optional

            +listType=atomic'
        defaultMode:
          type: integer
          format: int32
          title: 'defaultMode is Optional: mode bits used to set permissions on created files by default.

            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.

            YAML accepts both octal and decimal values, JSON requires decimal values

            for mode bits. Defaults to 0644.

            Directories within the path are not affected by this setting.

            This might be in conflict with other options that affect the file

            mode, like fsGroup, and the result can be other mode bits set.

            +optional'
        optional:
          type: boolean
          title: 'optional field specify whether the Secret or its keys must be defined

            +optional'
      description: 'Adapts a Secret into a volume.


        The contents of the target Secret''s Data field will be presented in a volume

        as files using the keys in the Data field as the file names.

        Secret volumes support ownership management and SELinux relabeling.'
    v1EnvVar:
      type: object
      properties:
        name:
          type: string
          description: 'Name of the environment variable.

            May consist of any printable ASCII characters except ''=''.'
        value:
          type: string
          title: 'Variable references $(VAR_NAME) are expanded

            using the previously defined environment variables in the container and

            any service environment variables. If a variable cannot be resolved,

            the reference in the input string will be unchanged. Double $$ are reduced

            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.

            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".

            Escaped references will never be expanded, regardless of whether the variable

            exists or not.

            Defaults to "".

            +optional'
        valueFrom:
          $ref: '#/components/schemas/v1EnvVarSource'
      description: EnvVar represents an environment variable present in a Container.
    v1ContainerRestartRule:
      type: object
      properties:
        action:
          type: string
          title: 'Specifies the action taken on a container exit if the requirements

            are satisfied. The only possible value is "Restart" to restart the

            container.

            +required'
        exitCodes:
          $ref: '#/components/schemas/v1ContainerRestartRuleOnExitCodes'
      description: ContainerRestartRule describes how a container exit is handled.
    v1PodSecurityContext:
      type: object
      properties:
        seLinuxOptions:
          $ref: '#/components/schemas/v1SELinuxOptions'
        windowsOptions:
          $ref: '#/components/schemas/v1WindowsSecurityContextOptions'
        runAsUser:
          type: string
          format: int64
          title: 'The UID to run the entrypoint of the container process.

            Defaults to user specified in image metadata if unspecified.

            May also be set in SecurityContext.  If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence

            for that container.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
        runAsGroup:
          type: string
          format: int64
          title: 'The GID to run the entrypoint of the container process.

            Uses runtime default if unset.

            May also be set in SecurityContext.  If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence

            for that container.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
        runAsNonRoot:
          type: boolean
          title: 'Indicates that the container must run as a non-root user.

            If true, the Kubelet will validate the image at runtime to ensure that it

            does not run as UID 0 (root) and fail to start the container if it does.

            If unset or false, no such validation will be performed.

            May also be set in SecurityContext.  If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence.

            +optional'
        supplementalGroups:
          type: array
          items:
            type: string
            format: int64
          title: 'A list of groups applied to the first process run in each container, in

            addition to the container''s primary GID and fsGroup (if specified).  If

            the SupplementalGroupsPolicy feature is enabled, the

            supplementalGroupsPolicy field determines whether these are in addition

            to or instead of any group memberships defined in the container image.

            If unspecified, no additional groups are added, though group memberships

            defined in the container image may still be used, depending on the

            supplementalGroupsPolicy field.

            Note that this field cannot be set when spec.os.name is windows.

            +optional

            +listType=atomic'
        supplementalGroupsPolicy:
          type: string
          title: 'Defines how supplemental groups of the first container processes are calculated.

            Valid values are "Merge" and "Strict". If not specified, "Merge" is used.

            (Alpha) Using the field requires the SupplementalGroupsPolicy feature gate to be enabled

            and the container runtime must implement support for this feature.

            Note that this field cannot be set when spec.os.name is windows.

            TODO: update the default value to "Merge" when spec.os.name is not windows in v1.34

            +featureGate=SupplementalGroupsPolicy

            +optional'
        fsGroup:
          type: string
          format: int64
          description: '1. The owning GID will be the FSGroup

            2. The setgid bit is set (new files created in the volume will be owned by FSGroup)

            3. The permission bits are OR''d with rw-rw----


            If unset, the Kubelet will not modify the ownership and permissions of any volume.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
          title: 'A special supplemental group that applies to all containers in a pod.

            Some volume types allow the Kubelet to change the ownership of that volume

            to be owned by the pod:'
        sysctls:
          type: array
          items:
            $ref: '#/components/schemas/v1Sysctl'
          title: 'Sysctls hold a list of namespaced sysctls used for the pod. Pods with unsupported

            sysctls (by the container runtime) might fail to launch.

            Note that this field cannot be set when spec.os.name is windows.

            +optional

            +listType=atomic'
        fsGroupChangePolicy:
          type: string
          title: 'fsGroupChangePolicy defines behavior of changing ownership and permission of the volume

            before being exposed inside Pod. This field will only apply to

            volume types which support fsGroup based ownership(and permissions).

            It will have no effect on ephemeral volume types such as: secret, configmaps

            and emptydir.

            Valid values are "OnRootMismatch" and "Always". If not specified, "Always" is used.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
        seccompProfile:
          $ref: '#/components/schemas/v1SeccompProfile'
        appArmorProfile:
          $ref: '#/components/schemas/v1AppArmorProfile'
        seLinuxChangePolicy:
          type: string
          description: 'seLinuxChangePolicy defines how the container''s SELinux label is applied to all volumes used by the Pod.

            It has no effect on nodes that do not support SELinux or to volumes does not support SELinux.

            Valid values are "MountOption" and "Recursive".


            "Recursive" means relabeling of all files on all Pod volumes by the container runtime.

            This may be slow for large volumes, but allows mixing privileged and unprivileged Pods sharing the same volume on the same node.


            "MountOption" mounts all eligible Pod volumes with `-o context` mount option.

            This requires all Pods that share the same volume to use the same SELinux label.

            It is not possible to share the same volume among privileged and unprivileged Pods.

            Eligible volumes are in-tree FibreChannel and iSCSI volumes, and all CSI volumes

            whose CSI driver announces SELinux support by setting spec.seLinuxMount: true in their

            CSIDriver instance. Other volumes are always re-labelled recursively.

            "MountOption" value is allowed only when SELinuxMount feature gate is enabled.


            If not specified and SELinuxMount feature gate is enabled, "MountOption" is used.

            If not specified and SELinuxMount feature gate is disabled, "MountOption" is used for ReadWriteOncePod volumes

            and "Recursive" for all other volumes.


            This field affects only Pods that have SELinux label set, either in PodSecurityContext or in SecurityContext of all containers.


            All Pods that use the same volume should use the same seLinuxChangePolicy, otherwise some pods can get stuck in ContainerCreating state.

            Note that this field cannot be set when spec.os.name is windows.

            +featureGate=SELinuxChangePolicy

            +optional'
      description: 'PodSecurityContext holds pod-level security attributes and common container settings.

        Some fields are also present in container.securityContext.  Field values of

        container.securityContext take precedence over field values of PodSecurityContext.'
    v1WebMetric:
      type: object
      properties:
        method:
          type: string
          title: Method is the method of the web metric (empty defaults to GET)
        url:
          type: string
          title: URL is the address of the web metric
        headers:
          type: array
          items:
            $ref: '#/components/schemas/v1WebMetricHeader'
          title: '+patchMergeKey=key

            +patchStrategy=merge

            Headers are HTTP headers to use in the request'
        body:
          type: string
          title: Body is the body of the web metric (must be POST/PUT)
        timeoutSeconds:
          type: string
          format: int64
          title: 'TimeoutSeconds is the timeout for the request in seconds (default: 10)'
        jsonPath:
          type: string
          title: 'JSONPath is a JSON Path to use as the result variable (default: "{$}")'
        insecure:
          type: boolean
          title: Insecure skips host TLS verification
        jsonBody:
          type: string
          format: byte
          title: '+kubebuilder:validation:Schemaless

            +kubebuilder:pruning:PreserveUnknownFields

            +kubebuilder:validation:Type=object

            JSONBody is the body of the web metric in a json format (method must be POST/PUT)'
    v1SleepAction:
      type: object
      properties:
        seconds:
          type: string
          format: int64
          description: Seconds is the number of seconds to sleep.
      description: SleepAction describes a "sleep" action.
    v1TypedLocalObjectReference:
      type: object
      properties:
        apiGroup:
          type: string
          title: 'APIGroup is the group for the resource being referenced.

            If APIGroup is not specified, the specified Kind must be in the core API group.

            For any other third-party types, APIGroup is required.

            +optional'
        kind:
          type: string
          title: Kind is the type of resource being referenced
        name:
          type: string
          title: Name is the name of resource being referenced
      description: "TypedLocalObjectReference contains enough information to let you locate the\ntyped referenced object inside the same namespace.\n---\nNew uses of this type are discouraged because of difficulty describing its usage when embedded in APIs.\n 1. Invalid usage help.  It is impossible to add specific help for individual usage.  In most embedded usages, there are particular\n    restrictions like, \"must refer only to types A and B\" or \"UID not honored\" or \"name must be restricted\".\n    Those cannot be well described when embedded.\n 2. Inconsistent validation.  Because the usages are different, the validation rules are different by usage, which makes it hard for users to predict what will happen.\n 3. The fields are both imprecise and overly precise.  Kind is not a precise mapping to a URL. This can produce ambiguity\n    during interpretation and require a REST mapping.  In most cases, the dependency is on the group,resource tuple\n    and the version of the actual struct is irrelevant.\n 4. We cannot easily change it.  Because this type is embedded in many locations, updates to this type\n    will affect numerous schemas.  Don't make new APIs embed an underspecified API type they do not control.\n\nInstead of using this type, create a locally provided and used type that is well-focused on your reference.\nFor example, ServiceReferences for admission registration: https://github.com/kubernetes/api/blob/release-1.17/admissionregistration/v1/types.go#L533 .\n+structType=atomic"
    v1FlockerVolumeSource:
      type: object
      properties:
        datasetName:
          type: string
          title: 'datasetName is Name of the dataset stored as metadata -> name on the dataset for Flocker

            should be considered as deprecated

            +optional'
        datasetUUID:
          type: string
          title: 'datasetUUID is the UUID of the dataset. This is unique identifier of a Flocker dataset

            +optional'
      description: 'Represents a Flocker volume mounted by the Flocker agent.

        One and only one of datasetName and datasetUUID should be set.

        Flocker volumes do not support ownership management or SELinux relabeling.'
    v1VolumeMount:
      type: object
      properties:
        name:
          type: string
          description: This must match the Name of a Volume.
        readOnly:
          type: boolean
          title: 'Mounted read-only if true, read-write otherwise (false or unspecified).

            Defaults to false.

            +optional'
        recursiveReadOnly:
          type: string
          description: 'RecursiveReadOnly specifies whether read-only mounts should be handled

            recursively.


            If ReadOnly is false, this field has no meaning and must be unspecified.


            If ReadOnly is true, and this field is set to Disabled, the mount is not made

            recursively read-only.  If this field is set to IfPossible, the mount is made

            recursively read-only, if it is supported by the container runtime.  If this

            field is set to Enabled, the mount is made recursively read-only if it is

            supported by the container runtime, otherwise the pod will not be started and

            an error will be generated to indicate the reason.


            If this field is set to IfPossible or Enabled, MountPropagation must be set to

            None (or be unspecified, which defaults to None).


            If this field is not specified, it is treated as an equivalent of Disabled.


            +featureGate=RecursiveReadOnlyMounts

            +optional'
        mountPath:
          type: string
          description: 'Path within the container at which the volume should be mounted.  Must

            not contain '':''.'
        subPath:
          type: string
          title: 'Path within the volume from which the container''s volume should be mounted.

            Defaults to "" (volume''s root).

            +optional'
        mountPropagation:
          type: string
          title: 'mountPropagation determines how mounts are propagated from the host

            to container and the other way around.

            When not set, MountPropagationNone is used.

            This field is beta in 1.10.

            When RecursiveReadOnly is set to IfPossible or to Enabled, MountPropagation must be None or unspecified

            (which defaults to None).

            +optional'
        subPathExpr:
          type: string
          title: 'Expanded path within the volume from which the container''s volume should be mounted.

            Behaves similarly to SubPath but environment variable references $(VAR_NAME) are expanded using the container''s environment.

            Defaults to "" (volume''s root).

            SubPathExpr and SubPath are mutually exclusive.

            +optional'
      description: VolumeMount describes a mounting of a Volume within a container.
    v1RolloutJobInfo:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMeta'
        status:
          type: string
        icon:
          type: string
        metricName:
          type: string
        startedAt:
          $ref: '#/components/schemas/v1Time'
    v1CloudWatchMetricDataQuery:
