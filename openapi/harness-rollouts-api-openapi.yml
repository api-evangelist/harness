          type: string
          title: SpecRef indicates where the rollout should get the RS template from
        replicas:
          type: integer
          format: int32
          title: 'Replicas replica count for the template

            +optional'
        metadata:
          $ref: '#/components/schemas/v1PodTemplateMetadata'
        selector:
          $ref: '#/components/schemas/v1LabelSelector'
        weight:
          type: integer
          format: int32
          title: Weight sets the percentage of traffic the template's replicas should receive
        service:
          $ref: '#/components/schemas/v1TemplateService'
      title: RolloutExperimentTemplate defines the template used to create experiments for the Rollout's experiment canary step
    v1Toleration:
      type: object
      properties:
        key:
          type: string
          title: 'Key is the taint key that the toleration applies to. Empty means match all taint keys.

            If the key is empty, operator must be Exists; this combination means to match all values and all keys.

            +optional'
        operator:
          type: string
          title: 'Operator represents a key''s relationship to the value.

            Valid operators are Exists and Equal. Defaults to Equal.

            Exists is equivalent to wildcard for value, so that a pod can

            tolerate all taints of a particular category.

            +optional'
        value:
          type: string
          title: 'Value is the taint value the toleration matches to.

            If the operator is Exists, the value should be empty, otherwise just a regular string.

            +optional'
        effect:
          type: string
          title: 'Effect indicates the taint effect to match. Empty means match all taint effects.

            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.

            +optional'
        tolerationSeconds:
          type: string
          format: int64
          title: 'TolerationSeconds represents the period of time the toleration (which must be

            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,

            it is not set, which means tolerate the taint forever (do not evict). Zero and

            negative values will be treated as 0 (evict immediately) by the system.

            +optional'
      description: 'The pod this Toleration is attached to tolerates any taint that matches

        the triple <key,value,effect> using the matching operator <operator>.'
    v1PreferredSchedulingTerm:
      type: object
      properties:
        weight:
          type: integer
          format: int32
          description: Weight associated with matching the corresponding nodeSelectorTerm, in the range 1-100.
        preference:
          $ref: '#/components/schemas/v1NodeSelectorTerm'
      description: 'An empty preferred scheduling term matches all objects with implicit weight 0

        (i.e. it''s a no-op). A null preferred scheduling term matches no objects (i.e. is also a no-op).'
    v1LabelSelector:
      type: object
      properties:
        matchLabels:
          type: object
          additionalProperties:
            type: string
          title: 'matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels

            map is equivalent to an element of matchExpressions, whose key field is "key", the

            operator is "In", and the values array contains only "value". The requirements are ANDed.

            +optional'
        matchExpressions:
          type: array
          items:
            $ref: '#/components/schemas/v1LabelSelectorRequirement'
          title: 'matchExpressions is a list of label selector requirements. The requirements are ANDed.

            +optional

            +listType=atomic'
      title: 'A label selector is a label query over a set of resources. The result of matchLabels and

        matchExpressions are ANDed. An empty label selector matches all objects. A null

        label selector matches no objects.

        +structType=atomic'
    v1TypedObjectReference:
      type: object
      properties:
        apiGroup:
          type: string
          title: 'APIGroup is the group for the resource being referenced.

            If APIGroup is not specified, the specified Kind must be in the core API group.

            For any other third-party types, APIGroup is required.

            +optional'
        kind:
          type: string
          title: Kind is the type of resource being referenced
        name:
          type: string
          title: Name is the name of resource being referenced
        namespace:
          type: string
          title: 'Namespace is the namespace of resource being referenced

            Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace''s owner to accept the reference. See the ReferenceGrant documentation for details.

            (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.

            +featureGate=CrossNamespaceVolumeDataSource

            +optional'
      title: TypedObjectReference contains enough information to let you locate the typed referenced object
    v1MeasurementRetention:
      type: object
      properties:
        metricName:
          type: string
          description: MetricName is the name of the metric on which this retention policy should be applied.
        limit:
          type: integer
          format: int32
          description: Limit is the maximum number of measurements to be retained for this given metric.
      description: MeasurementRetention defines the settings for retaining the number of measurements during the analysis.
    v1PodAntiAffinity:
      type: object
      properties:
        requiredDuringSchedulingIgnoredDuringExecution:
          type: array
          items:
            $ref: '#/components/schemas/v1PodAffinityTerm'
          title: 'If the anti-affinity requirements specified by this field are not met at

            scheduling time, the pod will not be scheduled onto the node.

            If the anti-affinity requirements specified by this field cease to be met

            at some point during pod execution (e.g. due to a pod label update), the

            system may or may not try to eventually evict the pod from its node.

            When there are multiple elements, the lists of nodes corresponding to each

            podAffinityTerm are intersected, i.e. all terms must be satisfied.

            +optional

            +listType=atomic'
        preferredDuringSchedulingIgnoredDuringExecution:
          type: array
          items:
            $ref: '#/components/schemas/v1WeightedPodAffinityTerm'
          title: 'The scheduler will prefer to schedule pods to nodes that satisfy

            the anti-affinity expressions specified by this field, but it may choose

            a node that violates one or more of the expressions. The node that is

            most preferred is the one with the greatest sum of weights, i.e.

            for each node that meets all of the scheduling requirements (resource

            request, requiredDuringScheduling anti-affinity expressions, etc.),

            compute a sum by iterating through the elements of this field and subtracting

            "weight" from the sum if the node has pods which matches the corresponding podAffinityTerm; the

            node(s) with the highest sum are the most preferred.

            +optional

            +listType=atomic'
      description: Pod anti affinity is a group of inter pod anti affinity scheduling rules.
    v1PodFailurePolicyOnExitCodesRequirement:
      type: object
      properties:
        containerName:
          type: string
          title: 'Restricts the check for exit codes to the container with the

            specified name. When null, the rule applies to all containers.

            When specified, it should match one the container or initContainer

            names in the pod template.

            +optional'
        operator:
          type: string
          description: "- In: the requirement is satisfied if at least one container exit code\n  (might be multiple if there are multiple containers not restricted\n  by the 'containerName' field) is in the set of specified values.\n- NotIn: the requirement is satisfied if at least one container exit code\n  (might be multiple if there are multiple containers not restricted\n  by the 'containerName' field) is not in the set of specified values.\nAdditional values are considered to be added in the future. Clients should\nreact to an unknown operator by assuming the requirement is not satisfied."
          title: 'Represents the relationship between the container exit code(s) and the

            specified values. Containers completed with success (exit code 0) are

            excluded from the requirement check. Possible values are:'
        values:
          type: array
          items:
            type: integer
            format: int32
          title: 'Specifies the set of values. Each returned container exit code (might be

            multiple in case of multiple containers) is checked against this set of

            values with respect to the operator. The list of values must be ordered

            and must not contain duplicates. Value ''0'' cannot be used for the In operator.

            At least one element is required. At most 255 elements are allowed.

            +listType=set'
      description: 'PodFailurePolicyOnExitCodesRequirement describes the requirement for handling

        a failed pod based on its container exit codes. In particular, it lookups the

        .state.terminated.exitCode for each app container and init container status,

        represented by the .status.containerStatuses and .status.initContainerStatuses

        fields in the Pod status, respectively. Containers completed with success

        (exit code 0) are excluded from the requirement check.'
    v1NodeSelectorTerm:
      type: object
      properties:
        matchExpressions:
          type: array
          items:
            $ref: '#/components/schemas/v1NodeSelectorRequirement'
          title: 'A list of node selector requirements by node''s labels.

            +optional

            +listType=atomic'
        matchFields:
          type: array
          items:
            $ref: '#/components/schemas/v1NodeSelectorRequirement'
          title: 'A list of node selector requirements by node''s fields.

            +optional

            +listType=atomic'
      title: 'A null or empty node selector term matches no objects. The requirements of

        them are ANDed.

        The TopologySelectorTerm type implements a subset of the NodeSelectorTerm.

        +structType=atomic'
    v1ImageVolumeSource:
      type: object
      properties:
        reference:
          type: string
          title: 'Required: Image or artifact reference to be used.

            Behaves in the same way as pod.spec.containers[*].image.

            Pull secrets will be assembled in the same way as for the container image by looking up node credentials, SA image pull secrets, and pod spec image pull secrets.

            More info: https://kubernetes.io/docs/concepts/containers/images

            This field is optional to allow higher level config management to default or override

            container images in workload controllers like Deployments and StatefulSets.

            +optional'
        pullPolicy:
          type: string
          title: 'Policy for pulling OCI objects. Possible values are:

            Always: the kubelet always attempts to pull the reference. Container creation will fail If the pull fails.

            Never: the kubelet never pulls the reference and only uses a local image or artifact. Container creation will fail if the reference isn''t present.

            IfNotPresent: the kubelet pulls if the reference isn''t already present on disk. Container creation will fail if the reference isn''t present and the pull fails.

            Defaults to Always if :latest tag is specified, or IfNotPresent otherwise.

            +optional'
      description: ImageVolumeSource represents a image volume resource.
    v1GRPCAction:
      type: object
      properties:
        port:
          type: integer
          format: int32
          description: Port number of the gRPC service. Number must be in the range 1 to 65535.
        service:
          type: string
          description: 'Service is the name of the service to place in the gRPC HealthCheckRequest

            (see https://github.com/grpc/grpc/blob/master/doc/health-checking.md).


            If this is not specified, the default behavior is defined by gRPC.

            +optional

            +default=""'
      description: GRPCAction specifies an action involving a GRPC service.
    v1ProjectedVolumeSource:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/v1VolumeProjection'
          title: 'sources is the list of volume projections. Each entry in this list

            handles one source.

            +optional

            +listType=atomic'
        defaultMode:
          type: integer
          format: int32
          title: 'defaultMode are the mode bits used to set permissions on created files by default.

            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.

            YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.

            Directories within the path are not affected by this setting.

            This might be in conflict with other options that affect the file

            mode, like fsGroup, and the result can be other mode bits set.

            +optional'
      title: Represents a projected volume source
    v1PersistentVolumeClaimTemplate:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMeta'
        spec:
          $ref: '#/components/schemas/v1PersistentVolumeClaimSpec'
      description: 'PersistentVolumeClaimTemplate is used to produce

        PersistentVolumeClaim objects as part of an EphemeralVolumeSource.'
    v1AnalysisRunArgument:
      type: object
      properties:
        name:
          type: string
          title: Name argument name
        value:
          type: string
          title: Value a hardcoded value for the argument. This field is a one of field with valueFrom
        valueFrom:
          $ref: '#/components/schemas/v1ArgumentValueFrom'
      title: AnalysisRunArgument argument to add to analysisRun
    v1StorageOSVolumeSource:
      type: object
      properties:
        volumeName:
          type: string
          description: 'volumeName is the human-readable name of the StorageOS volume.  Volume

            names are only unique within a namespace.'
        volumeNamespace:
          type: string
          title: 'volumeNamespace specifies the scope of the volume within StorageOS.  If no

            namespace is specified then the Pod''s namespace will be used.  This allows the

            Kubernetes name scoping to be mirrored within StorageOS for tighter integration.

            Set VolumeName to any name to override the default behaviour.

            Set to "default" if you are not using namespaces within StorageOS.

            Namespaces that do not pre-exist within StorageOS will be created.

            +optional'
        fsType:
          type: string
          title: 'fsType is the filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            +optional'
        readOnly:
          type: boolean
          title: 'readOnly defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional'
        secretRef:
          $ref: '#/components/schemas/v1LocalObjectReference'
      description: Represents a StorageOS persistent volume resource.
    v1SELinuxOptions:
      type: object
      properties:
        user:
          type: string
          title: 'User is a SELinux user label that applies to the container.

            +optional'
        role:
          type: string
          title: 'Role is a SELinux role label that applies to the container.

            +optional'
        type:
          type: string
          title: 'Type is a SELinux type label that applies to the container.

            +optional'
        level:
          type: string
          title: 'Level is SELinux level label that applies to the container.

            +optional'
      title: SELinuxOptions are the labels to be applied to the container
    v1PrometheusMetric:
      type: object
      properties:
        address:
          type: string
          title: Address is the HTTP address and port of the prometheus server
        query:
          type: string
          title: Query is a raw prometheus query to perform
        authentication:
          $ref: '#/components/schemas/v1PrometheusAuth'
        timeout:
          type: string
          format: int64
          title: 'Timeout represents the duration within which a prometheus query should complete. It is expressed in seconds.

            +optional'
        insecure:
          type: boolean
          title: Insecure skips host TLS verification
        headers:
          type: array
          items:
            $ref: '#/components/schemas/v1WebMetricHeader'
          title: 'Headers are HTTP headers to use in the request

            +optional

            +patchMergeKey=key

            +patchStrategy=merge'
      title: PrometheusMetric defines the prometheus query to perform canary analysis
    v1ClusterTrustBundleProjection:
      type: object
      properties:
        name:
          type: string
          title: 'Select a single ClusterTrustBundle by object name.  Mutually-exclusive

            with signerName and labelSelector.

            +optional'
        signerName:
          type: string
          title: 'Select all ClusterTrustBundles that match this signer name.

            Mutually-exclusive with name.  The contents of all selected

            ClusterTrustBundles will be unified and deduplicated.

            +optional'
        labelSelector:
          $ref: '#/components/schemas/v1LabelSelector'
        optional:
          type: boolean
          title: 'If true, don''t block pod startup if the referenced ClusterTrustBundle(s)

            aren''t available.  If using name, then the named ClusterTrustBundle is

            allowed not to exist.  If using signerName, then the combination of

            signerName and labelSelector is allowed to match zero

            ClusterTrustBundles.

            +optional'
        path:
          type: string
          description: Relative path from the volume root to write the bundle.
      description: 'ClusterTrustBundleProjection describes how to select a set of

        ClusterTrustBundle objects and project their contents into the pod

        filesystem.'
    v1GraphiteMetric:
      type: object
      properties:
        address:
          type: string
          title: Address is the HTTP address and port of the Graphite server
        query:
          type: string
          title: Query is a raw Graphite query to perform
      title: GraphiteMetric defines the Graphite query to perform canary analysis
    v1CloudWatchMetric:
      type: object
      properties:
        interval:
          type: string
        metricDataQueries:
          type: array
          items:
            $ref: '#/components/schemas/v1CloudWatchMetricDataQuery'
      title: CloudWatchMetric defines the cloudwatch query to perform canary analysis
    v1ResourceRequirements:
      type: object
      properties:
        limits:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/resourceQuantity'
          title: 'Limits describes the maximum amount of compute resources allowed.

            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

            +optional'
        requests:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/resourceQuantity'
          title: 'Requests describes the minimum amount of compute resources required.

            If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,

            otherwise to an implementation-defined value. Requests cannot exceed Limits.

            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

            +optional'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/v1ResourceClaim'
          description: 'Claims lists the names of resources, defined in spec.resourceClaims,

            that are used by this container.


            This field depends on the

            DynamicResourceAllocation feature gate.


            This field is immutable. It can only be set for containers.


            +listType=map

            +listMapKey=name

            +featureGate=DynamicResourceAllocation

            +optional'
      description: ResourceRequirements describes the compute resource requirements.
    v1FieldRef:
      type: object
      properties:
        fieldPath:
          type: string
          title: 'Required: Path of the field to select in the specified API version'
    v1WeightedPodAffinityTerm:
      type: object
      properties:
        weight:
          type: integer
          format: int32
          description: 'weight associated with matching the corresponding podAffinityTerm,

            in the range 1-100.'
        podAffinityTerm:
          $ref: '#/components/schemas/v1PodAffinityTerm'
      title: The weights of all of the matched WeightedPodAffinityTerm fields are added per-node to find the most preferred node(s)
    v1SetMirrorRoute:
      type: object
      properties:
        name:
          type: string
          title: 'Name this is the name of the route to use for the mirroring of traffic this also needs

            to be included in the `spec.strategy.canary.trafficRouting.managedRoutes` field'
        match:
          type: array
          items:
            $ref: '#/components/schemas/v1RouteMatch'
          title: 'Match Contains a list of rules that if mated will mirror the traffic to the services

            +optional'
        percentage:
          type: integer
          format: int32
          title: 'Services The list of services to mirror the traffic to if the method, path, headers match

            Service string `json:"service" protobuf:"bytes,3,opt,name=service"`

            Percentage What percent of the traffic that matched the rules should be mirrored'
    v1TemplateService:
      type: object
      properties:
        name:
          type: string
          title: Name of the service generated by the experiment
    v1PhotonPersistentDiskVolumeSource:
      type: object
      properties:
        pdID:
          type: string
          title: pdID is the ID that identifies Photon Controller persistent disk
        fsType:
          type: string
          description: 'fsType is the filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.'
      description: Represents a Photon Controller persistent disk resource.
    v1HTTPGetAction:
      type: object
      properties:
        path:
          type: string
          title: 'Path to access on the HTTP server.

            +optional'
        port:
          $ref: '#/components/schemas/intstrIntOrString'
        host:
          type: string
          title: 'Host name to connect to, defaults to the pod IP. You probably want to set

            "Host" in httpHeaders instead.

            +optional'
        scheme:
          type: string
          title: 'Scheme to use for connecting to the host.

            Defaults to HTTP.

            +optional'
        httpHeaders:
          type: array
          items:
            $ref: '#/components/schemas/v1HTTPHeader'
          title: 'Custom headers to set in the request. HTTP allows repeated headers.

            +optional

            +listType=atomic'
      description: HTTPGetAction describes an action based on HTTP Get requests.
    v1PodSpec:
      type: object
      properties:
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/v1Volume'
          title: 'List of volumes that can be mounted by containers belonging to the pod.

            More info: https://kubernetes.io/docs/concepts/storage/volumes

            +optional

            +patchMergeKey=name

            +patchStrategy=merge,retainKeys

            +listType=map

            +listMapKey=name'
        initContainers:
          type: array
          items:
            $ref: '#/components/schemas/v1Container'
          title: 'List of initialization containers belonging to the pod.

            Init containers are executed in order prior to containers being started. If any

            init container fails, the pod is considered to have failed and is handled according

            to its restartPolicy. The name for an init container or normal container must be

            unique among all containers.

            Init containers may not have Lifecycle actions, Readiness probes, Liveness probes, or Startup probes.

            The resourceRequirements of an init container are taken into account during scheduling

            by finding the highest request/limit for each resource type, and then using the max of

            that value or the sum of the normal containers. Limits are applied to init containers

            in a similar fashion.

            Init containers cannot currently be added or removed.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/

            +patchMergeKey=name

            +patchStrategy=merge

            +listType=map

            +listMapKey=name'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/v1Container'
          title: 'List of containers belonging to the pod.

            Containers cannot currently be added or removed.

            There must be at least one container in a Pod.

            Cannot be updated.

            +patchMergeKey=name

            +patchStrategy=merge

            +listType=map

            +listMapKey=name'
        ephemeralContainers:
          type: array
          items:
            $ref: '#/components/schemas/v1EphemeralContainer'
          title: 'List of ephemeral containers run in this pod. Ephemeral containers may be run in an existing

            pod to perform user-initiated actions such as debugging. This list cannot be specified when

            creating a pod, and it cannot be modified by updating the pod spec. In order to add an

            ephemeral container to an existing pod, use the pod''s ephemeralcontainers subresource.

            +optional

            +patchMergeKey=name

            +patchStrategy=merge

            +listType=map

            +listMapKey=name'
        restartPolicy:
          type: string
          title: 'Restart policy for all containers within the pod.

            One of Always, OnFailure, Never. In some contexts, only a subset of those values may be permitted.

            Default to Always.

            More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#restart-policy

            +optional'
        terminationGracePeriodSeconds:
          type: string
          format: int64
          title: 'Optional duration in seconds the pod needs to terminate gracefully. May be decreased in delete request.

            Value must be non-negative integer. The value zero indicates stop immediately via

            the kill signal (no opportunity to shut down).

            If this value is nil, the default grace period will be used instead.

            The grace period is the duration in seconds after the processes running in the pod are sent

            a termination signal and the time when the processes are forcibly halted with a kill signal.

            Set this value longer than the expected cleanup time for your process.

            Defaults to 30 seconds.

            +optional'
        activeDeadlineSeconds:
          type: string
          format: int64
          title: 'Optional duration in seconds the pod may be active on the node relative to

            StartTime before the system will actively try to mark it failed and kill associated containers.

            Value must be a positive integer.

            +optional'
        dnsPolicy:
          type: string
          title: 'Set DNS policy for the pod.

            Defaults to "ClusterFirst".

            Valid values are ''ClusterFirstWithHostNet'', ''ClusterFirst'', ''Default'' or ''None''.

            DNS parameters given in DNSConfig will be merged with the policy selected with DNSPolicy.

            To have DNS options set along with hostNetwork, you have to specify DNS policy

            explicitly to ''ClusterFirstWithHostNet''.

            +optional'
        nodeSelector:
          type: object
          additionalProperties:
            type: string
          title: 'NodeSelector is a selector which must be true for the pod to fit on a node.

            Selector which must match a node''s labels for the pod to be scheduled on that node.

            More info: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/

            +optional

            +mapType=atomic'
        serviceAccountName:
          type: string
          title: 'ServiceAccountName is the name of the ServiceAccount to use to run this pod.

            More info: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/

            +optional'
        serviceAccount:
          type: string
          title: 'DeprecatedServiceAccount is a deprecated alias for ServiceAccountName.

            Deprecated: Use serviceAccountName instead.

            +k8s:conversion-gen=false

            +optional'
        automountServiceAccountToken:
          type: boolean
          title: 'AutomountServiceAccountToken indicates whether a service account token should be automatically mounted.

            +optional'
        nodeName:
          type: string
          title: 'NodeName indicates in which node this pod is scheduled.

            If empty, this pod is a candidate for scheduling by the scheduler defined in schedulerName.

            Once this field is set, the kubelet for this node becomes responsible for the lifecycle of this pod.

            This field should not be used to express a desire for the pod to be scheduled on a specific node.

            https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodename

            +optional'
        hostNetwork:
          type: boolean
          title: 'Host networking requested for this pod. Use the host''s network namespace.

            When using HostNetwork you should specify ports so the scheduler is aware.

            When `hostNetwork` is true, specified `hostPort` fields in port definitions must match `containerPort`,

            and unspecified `hostPort` fields in port definitions are defaulted to match `containerPort`.

            Default to false.

            +k8s:conversion-gen=false

            +optional'
        hostPID:
          type: boolean
          title: 'Use the host''s pid namespace.

            Optional: Default to false.

            +k8s:conversion-gen=false

            +optional'
        hostIPC:
          type: boolean
          title: 'Use the host''s ipc namespace.

            Optional: Default to false.

            +k8s:conversion-gen=false

            +optional'
        shareProcessNamespace:
          type: boolean
          title: 'Share a single process namespace between all of the containers in a pod.

            When this is set containers will be able to view and signal processes from other containers

            in the same pod, and the first process in each container will not be assigned PID 1.

            HostPID and ShareProcessNamespace cannot both be set.

            Optional: Default to false.

            +k8s:conversion-gen=false

            +optional'
        securityContext:
          $ref: '#/components/schemas/v1PodSecurityContext'
        imagePullSecrets:
          type: array
          items:
            $ref: '#/components/schemas/v1LocalObjectReference'
          title: 'ImagePullSecrets is an optional list of references to secrets in the same namespace to use for pulling any of the images used by this PodSpec.

            If specified, these secrets will be passed to individual puller implementations for them to use.

            More info: https://kubernetes.io/docs/concepts/containers/images#specifying-imagepullsecrets-on-a-pod

            +optional

            +patchMergeKey=name

            +patchStrategy=merge

            +listType=map

            +listMapKey=name'
        hostname:
          type: string
          title: 'Specifies the hostname of the Pod

            If not specified, the pod''s hostname will be set to a system-defined value.

            +optional'
        subdomain:
          type: string
          title: 'If specified, the fully qualified Pod hostname will be "<hostname>.<subdomain>.<pod namespace>.svc.<cluster domain>".

            If not specified, the pod will not have a domainname at all.

            +optional'
        affinity:
          $ref: '#/components/schemas/v1Affinity'
        schedulerName:
          type: string
          title: 'If specified, the pod will be dispatched by specified scheduler.

            If not specified, the pod will be dispatched by default scheduler.

            +optional'
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/v1Toleration'
          title: 'If specified, the pod''s tolerations.

            +optional

            +listType=atomic'
        hostAliases:
          type: array
          items:
            $ref: '#/components/schemas/v1HostAlias'
          title: 'HostAliases is an optional list of hosts and IPs that will be injected into the pod''s hosts

            file if specified.

            +optional

            +patchMergeKey=ip

            +patchStrategy=merge

            +listType=map

            +listMapKey=ip'
        priorityClassName:
          type: string
          title: 'If specified, indicates the pod''s priority. "system-node-critical" and

            "system-cluster-critical" are two special keywords which indicate the

            highest priorities with the former being the highest priority. Any other

            name must be defined by creating a PriorityClass object with that name.

            If not specified, the pod priority will be default or zero if there is no

            default.

            +optional'
        priority:
          type: integer
          format: int32
          title: 'The priority value. Various system components use this field to find the

            priority of the pod. When Priority Admission Controller is enabled, it

            prevents users from setting this field. The admission controller populates

            this field from PriorityClassName.

            The higher the value, the higher the priority.

            +optional'
        dnsConfig:
          $ref: '#/components/schemas/v1PodDNSConfig'
        readinessGates:
          type: array
          items:
            $ref: '#/components/schemas/v1PodReadinessGate'
          title: 'If specified, all readiness gates will be evaluated for pod readiness.

            A pod is ready when all its containers are ready AND

            all conditions specified in the readiness gates have status equal to "True"

            More info: https://git.k8s.io/enhancements/keps/sig-network/580-pod-readiness-gates

            +optional

            +listType=atomic'
        runtimeClassName:
          type: string
          title: 'RuntimeClassName refers to a RuntimeClass object in the node.k8s.io group, which should be used

            to run this pod.  If no RuntimeClass resource matches the named class, the pod will not be run.

            If unset or empty, the "legacy" RuntimeClass will be used, which is an implicit class with an

            empty definition that uses the default runtime handler.

            More info: https://git.k8s.io/enhancements/keps/sig-node/585-runtime-class

            +optional'
        enableServiceLinks:
          type: boolean
          title: 'EnableServiceLinks indicates whether information about services should be injected into pod''s

            environment variables, matching the syntax of Docker links.

            Optional: Defaults to true.

            +optional'
        preemptionPolicy:
          type: string
          title: 'PreemptionPolicy is the Policy for preempting pods with lower priority.

            One of Never, PreemptLowerPriority.

            Defaults to PreemptLowerPriority if unset.

            +optional'
        overhead:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/resourceQuantity'
          title: 'Overhead represents the resource overhead associated with running a pod for a given RuntimeClass.

            This field will be autopopulated at admission time by the RuntimeClass admission controller. If

            the RuntimeClass admission controller is enabled, overhead must not be set in Pod create requests.

            The RuntimeClass admission controller will reject Pod create requests which have the overhead already

            set. If RuntimeClass is configured and selected in the PodSpec, Overhead will be set to the value

            defined in the corresponding RuntimeClass, otherwise it will remain unset and treated as zero.

            More info: https://git.k8s.io/enhancements/keps/sig-node/688-pod-overhead/README.md

            +optional'
        topologySpreadConstraints:
          type: array
          items:
            $ref: '#/components/schemas/v1TopologySpreadConstraint'
          title: 'TopologySpreadConstraints describes how a group of pods ought to spread across topology

            domains. Scheduler will schedule pods in a way which abides by the constraints.

            All topologySpreadConstraints are ANDed.

            +optional

            +patchMergeKey=topologyKey

            +patchStrategy=merge

            +listType=map

            +listMapKey=topologyKey

            +listMapKey=whenUnsatisfiable'
        setHostnameAsFQDN:
          type: boolean
          title: 'If true the pod''s hostname will be configured as the pod''s FQDN, rather than the leaf name (the default).

            In Linux containers, this means setting the FQDN in the hostname field of the kernel (the nodename field of struct utsname).

            In Windows containers, this means setting the registry value of hostname for the registry key HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters to FQDN.

            If a pod does not have FQDN, this has no effect.

            Default to false.

            +optional'
        os:
          $ref: '#/components/schemas/v1PodOS'
        hostUsers:
          type: boolean
          title: 'Use the host''s user namespace.

            Optional: Default to true.

            If set to true or not present, the pod will be run in the host user namespace, useful

            for when the pod needs a feature only available to the host user namespace, such as

            loading a kernel module with CAP_SYS_MODULE.

            When set to false, a new userns is created for the pod. Setting false is useful for

            mitigating container breakout vulnerabilities even allowing users to run their

            containers as root without actually having root privileges on the host.

            This field is alpha-level and is only honored by servers that enable the UserNamespacesSupport feature.

            +k8s:conversion-gen=false

            +optional'
        schedulingGates:
          type: array
          items:
            $ref: '#/components/schemas/v1PodSchedulingGate'
          description: 'SchedulingGates is an opaque list of values that if specified will block scheduling the pod.

            If schedulingGates is not empty, the pod will stay in the SchedulingGated state and the

            scheduler will not attempt to schedule the pod.


            SchedulingGates can only be set at pod creation time, and be removed only afterwards.


            +patchMergeKey=name

            +patchStrategy=merge

            +listType=map

            +listMapKey=name

            +optional'
        resourceClaims:
          type: array
          items:
            $ref: '#/components/schemas/v1PodResourceClaim'
          description: 'ResourceClaims defines which ResourceClaims must be allocated

            and reserved before the Pod is allowed to start. The resources

            will be made available to those containers which consume them

            by name.


            This is an alpha field and requires enabling the

            DynamicResourceAllocation feature gate.


            This field is immutable.


            +patchMergeKey=name

            +patchStrategy=merge,retainKeys

            +listType=map

            +listMapKey=name

            +featureGate=DynamicResourceAllocation

            +optional'
        resources:
          $ref: '#/components/schemas/v1ResourceRequirements'
        hostnameOverride:
          type: string
          description: 'HostnameOverride specifies an explicit override for the pod''s hostname as perceived by the pod.

            This field only specifies the pod''s hostname and does not affect its DNS records.

            When this field is set to a non-empty string:

            - It takes precedence over the values set in `hostname` and `subdomain`.

            - The Pod''s hostname will be set to this value.

            - `setHostnameAsFQDN` must be nil or set to false.

            - `hostNetwork` must be set to false.


            This field must be a valid DNS subdomain as defined in RFC 1123 and contain at most 64 characters.

            Requires the HostnameOverride feature gate to be enabled.


            +featureGate=HostnameOverride

            +optional'
      description: PodSpec is a description of a pod.
    v1Capabilities:
      type: object
      properties:
        add:
          type: array
          items:
            type: string
          title: 'Added capabilities

            +optional

            +listType=atomic'
        drop:
          type: array
          items:
            type: string
          title: 'Removed capabilities

            +optional

            +listType=atomic'
      description: Adds and removes POSIX capabilities from running containers.
    v1NodeSelector:
      type: object
      properties:
        nodeSelectorTerms:
          type: array
          items:
            $ref: '#/components/schemas/v1NodeSelectorTerm'
          title: 'Required. A list of node selector terms. The terms are ORed.

            +listType=atomic'
      title: 'A node selector represents the union of the results of one or more label queries

        over a set of nodes; that is, it represents the OR of the selectors represented

        by the node selector terms.

        +structType=atomic'
    v1PodDNSConfigOption:
      type: object
      properties:
        name:
          type: string
          description: 'Name is this DNS resolver option''s name.

            Required.'
        value:
          type: string
          title: 'Value is this DNS resolver option''s value.

            +optional'
      description: PodDNSConfigOption defines DNS resolver options of a pod.
    v1SecretProjection:
      type: object
      properties:
        localObjectReference:
          $ref: '#/components/schemas/v1LocalObjectReference'
        items:
          type: array
          items:
            $ref: '#/components/schemas/v1KeyToPath'
          title: 'items if unspecified, each key-value pair in the Data field of the referenced

            Secret will be projected into the volume as a file whose name is the

            key and content is the value. If specified, the listed keys will be

            projected into the specified paths, and unlisted keys will not be

            present. If a key is specified which is not present in the Secret,

            the volume setup will error unless it is marked optional. Paths must be

            relative and may not contain the ''..'' path or start with ''..''.

            +optional

            +listType=atomic'
        optional:
          type: boolean
          title: 'optional field specify whether the Secret or its key must be defined

            +optional'
      description: 'Adapts a secret into a projected volume.


        The contents of the target Secret''s Data field will be presented in a

        projected volume as files using the keys in the Data field as the file names.

        Note that this is identical to a secret volume source without the default

        mode.'
    v1WavefrontMetric:
      type: object
      properties:
        address:
          type: string
          title: Address is the HTTP address and port of the wavefront server
        query:
          type: string
          title: Query is a raw wavefront query to perform
      title: WavefrontMetric defines the wavefront query to perform canary analysis
    v1KayentaScope:
      type: object
      properties:
        name:
          type: string
        controlScope:
          $ref: '#/components/schemas/v1ScopeDetail'
        experimentScope:
          $ref: '#/components/schemas/v1ScopeDetail'
    v1StringMatch:
      type: object
      properties:
        exact:
          type: string
          title: Exact The string must match exactly
        prefix:
          type: string
          title: Prefix The string will be prefixed matched
        regex:
          type: string
          title: Regex The string will be regular expression matched
      title: StringMatch Used to define what type of matching we will use exact, prefix, or regular expression
    v1PodTemplateSpec:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMeta'
        spec:
          $ref: '#/components/schemas/v1PodSpec'
      title: PodTemplateSpec describes the data a pod should have when created from a template
    v1DryRun:
      type: object
      properties:
        metricName:
          type: string
          description: 'Name of the metric which needs to be evaluated in the Dry-Run mode. Wildcard ''*'' is supported and denotes all

            the available metrics.'
      description: DryRun defines the settings for running the analysis in Dry-Run mode.
    v1KayentaMetric:
      type: object
      properties:
        address:
          type: string
        application:
          type: string
        canaryConfigName:
          type: string
        metricsAccountName:
          type: string
        configurationAccountName:
          type: string
        storageAccountName:
          type: string
        threshold:
          $ref: '#/components/schemas/v1KayentaThreshold'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/v1KayentaScope'
    v1GCEPersistentDiskVolumeSource:
      type: object
      properties:
        pdName:
          type: string
          title: 'pdName is unique name of the PD resource in GCE. Used to identify the disk in GCE.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk'
        fsType:
          type: string
          title: 'fsType is filesystem type of the volume that you want to mount.

            Tip: Ensure that the filesystem type is supported by the host operating system.

            Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk

            TODO: how do we prevent errors in the filesystem from compromising the machine

            +optional'
        partition:
          type: integer
          format: int32
          title: 'partition is the partition in the volume that you want to mount.

            If omitted, the default is to mount by volume name.

            Examples: For volume /dev/sda1, you specify the partition as "1".

            Similarly, the volume partition for /dev/sda is "0" (or you can leave the property empty).

            More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk

            +optional'
        readOnly:
          type: boolean
          title: 'readOnly here will force the ReadOnly setting in VolumeMounts.

            Defaults to false.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk

            +optional'
      description: 'Represents a Persistent Disk resource in Google Compute Engine.


        A GCE PD must exist before mounting to a container. The disk must

        also be in the same GCE project and zone as the kubelet. A GCE PD

        can only be mounted as read/write once or read-only many times. GCE

        PDs support ownership management and SELinux relabeling.'
    v1ConfigMapVolumeSource:
      type: object
      properties:
        localObjectReference:
          $ref: '#/components/schemas/v1LocalObjectReference'
        items:
          type: array
          items:
            $ref: '#/components/schemas/v1KeyToPath'
          title: 'items if unspecified, each key-value pair in the Data field of the referenced

            ConfigMap will be projected into the volume as a file whose name is the

            key and content is the value. If specified, the listed keys will be

            projected into the specified paths, and unlisted keys will not be

            present. If a key is specified which is not present in the ConfigMap,

            the volume setup will error unless it is marked optional. Paths must be

            relative and may not contain the ''..'' path or start with ''..''.

            +optional

            +listType=atomic'
        defaultMode:
          type: integer
          format: int32
          title: 'defaultMode is optional: mode bits used to set permissions on created files by default.

            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.

            YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.

            Defaults to 0644.

            Directories within the path are not affected by this setting.

            This might be in conflict with other options that affect the file

            mode, like fsGroup, and the result can be other mode bits set.

            +optional'
        optional:
          type: boolean
          title: 'optional specify whether the ConfigMap or its keys must be defined

            +optional'
      description: 'Adapts a ConfigMap into a volume.


        The contents of the target ConfigMap''s Data field will be presented in a

        volume as files using the keys in the Data field as the file names, unless

        the items element is populated with specific mappings of keys to paths.

        ConfigMap volumes support ownership management and SELinux relabeling.'
    v1WebMetricHeader:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    v1NFSVolumeSource:
      type: object
      properties:
        server:
          type: string
          title: 'server is the hostname or IP address of the NFS server.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#nfs'
        path:
          type: string
          title: 'path that is exported by the NFS server.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#nfs'
        readOnly:
          type: boolean
          title: 'readOnly here will force the NFS export to be mounted with read-only permissions.

            Defaults to false.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#nfs

            +optional'
      description: 'Represents an NFS mount that lasts the lifetime of a pod.

        NFS volumes do not support ownership management or SELinux relabeling.'
    v1ObjectFieldSelector:
      type: object
      properties:
        apiVersion:
          type: string
          title: 'Version of the schema the FieldPath is written in terms of, defaults to "v1".

            +optional'
        fieldPath:
          type: string
          description: Path of the field to select in the specified API version.
      title: 'ObjectFieldSelector selects an APIVersioned field of an object.

        +structType=atomic'
    v1PortworxVolumeSource:
      type: object
      properties:
        volumeID:
          type: string
          title: volumeID uniquely identifies a Portworx volume
        fsType:
          type: string
          description: 'fSType represents the filesystem type to mount

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs". Implicitly inferred to be "ext4" if unspecified.'
        readOnly:
          type: boolean
          title: 'readOnly defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional'
      description: PortworxVolumeSource represents a Portworx volume resource.
    v1PersistentVolumeClaimSpec:
      type: object
      properties:
        accessModes:
          type: array
          items:
            type: string
          title: 'accessModes contains the desired access modes the volume should have.

            More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#access-modes-1

            +optional

            +listType=atomic'
        selector:
          $ref: '#/components/schemas/v1LabelSelector'
        resources:
          $ref: '#/components/schemas/v1VolumeResourceRequirements'
        volumeName:
          type: string
          title: 'volumeName is the binding reference to the PersistentVolume backing this claim.

            +optional'
        storageClassName:
          type: string
          title: 'storageClassName is the name of the StorageClass required by the claim.

            More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#class-1

            +optional'
        volumeMode:
          type: string
          title: 'volumeMode defines what type of volume is required by the claim.

            Value of Filesystem is implied when not included in claim spec.

            +optional'
        dataSource:
          $ref: '#/components/schemas/v1TypedLocalObjectReference'
        dataSourceRef:
          $ref: '#/components/schemas/v1TypedObjectReference'
        volumeAttributesClassName:
          type: string
          title: 'volumeAttributesClassName may be used to set the VolumeAttributesClass used by this claim.

            If specified, the CSI driver will create or update the volume with the attributes defined

            in the corresponding VolumeAttributesClass. This has a different purpose than storageClassName,

            it can be changed after the claim is created. An empty string or nil value indicates that no

            VolumeAttributesClass will be applied to the claim. If the claim enters an Infeasible error state,

            this field can be reset to its previous value (including nil) to cancel the modification.

            If the resource referred to by volumeAttributesClass does not exist, this PersistentVolumeClaim will be

            set to a Pending state, as reflected by the modifyVolumeStatus field, until such as a resource

            exists.

            More info: https://kubernetes.io/docs/concepts/storage/volume-attributes-classes/

            +featureGate=VolumeAttributesClass

            +optional'
      title: 'PersistentVolumeClaimSpec describes the common attributes of storage devices

        and allows a Source for provider-specific attributes'
    gatewayruntimeError:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/protobufAny'
    v1ProbeHandler:
      type: object
      properties:
        exec:
          $ref: '#/components/schemas/v1ExecAction'
        httpGet:
          $ref: '#/components/schemas/v1HTTPGetAction'
        tcpSocket:
          $ref: '#/components/schemas/v1TCPSocketAction'
        grpc:
          $ref: '#/components/schemas/v1GRPCAction'
      description: 'ProbeHandler defines a specific action that should be taken in a probe.

        One and only one of the fields must be specified.'
    v1KayentaThreshold:
      type: object
      properties:
        pass:
          type: string
          format: int64
        marginal:
          type: string
          format: int64
    v1ArgumentValueFrom:
      type: object
      properties:
        podTemplateHashValue:
          type: string
          title: PodTemplateHashValue gets the value from one of the children ReplicaSet's Pod Template Hash
        fieldRef:
          $ref: '#/components/schemas/v1FieldRef'
      title: ArgumentValueFrom defines references to fields within resources to grab for the value (i.e. Pod Template Hash)
    v1Time:
      type: object
      properties:
        seconds:
          type: string
          format: int64
          description: 'Represents seconds of UTC time since Unix epoch

            1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to

            9999-12-31T23:59:59Z inclusive.'
        nanos:
          type: integer
          format: int32
          description: 'Non-negative fractions of a second at nanosecond resolution. Negative

            second values with fractions must still have non-negative nanos values

            that count forward in time. Must be from 0 to 999,999,999

            inclusive. This field may be limited in precision depending on context.'
      description: 'Time is a wrapper around time.Time which supports correct

        marshaling to YAML and JSON.  Wrappers are provided for many

        of the factory methods that the time package offers.


        +protobuf.options.marshal=false

        +protobuf.as=Timestamp

        +protobuf.options.(gogoproto.goproto_stringer)=false'
    v1RolloutContainerInfo:
      type: object
      properties:
        name:
          type: string
        image:
          type: string
    v1PodAffinityTerm:
      type: object
      properties:
        labelSelector:
          $ref: '#/components/schemas/v1LabelSelector'
        namespaces:
          type: array
          items:
            type: string
          title: 'namespaces specifies a static list of namespace names that the term applies to.

            The term is applied to the union of the namespaces listed in this field

            and the ones selected by namespaceSelector.

            null or empty namespaces list and null namespaceSelector means "this pod''s namespace".

            +optional

            +listType=atomic'
        topologyKey:
          type: string
          description: 'This pod should be co-located (affinity) or not co-located (anti-affinity) with the pods matching

            the labelSelector in the specified namespaces, where co-located is defined as running on a node

            whose value of the label with key topologyKey matches that of any node on which any of the

            selected pods is running.

            Empty topologyKey is not allowed.'
        namespaceSelector:
          $ref: '#/components/schemas/v1LabelSelector'
        matchLabelKeys:
          type: array
          items:
            type: string
          description: 'MatchLabelKeys is a set of pod label keys to select which pods will

            be taken into consideration. The keys are used to lookup values from the

            incoming pod labels, those key-value labels are merged with `labelSelector` as `key in (value)`

            to select the group of existing pods which pods will be taken into consideration

            for the incoming pod''s pod (anti) affinity. Keys that don''t exist in the incoming

            pod labels will be ignored. The default value is empty.

            The same key is forbidden to exist in both matchLabelKeys and labelSelector.

            Also, matchLabelKeys cannot be set when labelSelector isn''t set.


            +listType=atomic

            +optional'
        mismatchLabelKeys:
          type: array
          items:
            type: string
          description: 'MismatchLabelKeys is a set of pod label keys to select which pods will

            be taken into consideration. The keys are used to lookup values from the

            incoming pod labels, those key-value labels are merged with `labelSelector` as `key notin (value)`

            to select the group of existing pods which pods will be taken into consideration

            for the incoming pod''s pod (anti) affinity. Keys that don''t exist in the incoming

            pod labels will be ignored. The default value is empty.

            The same key is forbidden to exist in both mismatchLabelKeys and labelSelector.

            Also, mismatchLabelKeys cannot be set when labelSelector isn''t set.


            +listType=atomic

            +optional'
      title: 'Defines a set of pods (namely those matching the labelSelector

        relative to the given namespace(s)) that this pod should be

        co-located (affinity) or not co-located (anti-affinity) with,

        where co-located is defined as running on a node whose value of

        the label with key <topologyKey> matches that of any node on which

        a pod of the set of pods is running'
    v1LifecycleHandler:
      type: object
      properties:
        exec:
          $ref: '#/components/schemas/v1ExecAction'
        httpGet:
          $ref: '#/components/schemas/v1HTTPGetAction'
        tcpSocket:
          $ref: '#/components/schemas/v1TCPSocketAction'
        sleep:
          $ref: '#/components/schemas/v1SleepAction'
      description: 'LifecycleHandler defines a specific action that should be taken in a lifecycle

        hook. One and only one of the fields, except TCPSocket must be specified.'
    v1TCPSocketAction:
      type: object
      properties:
        port:
          $ref: '#/components/schemas/intstrIntOrString'
        host:
          type: string
          title: 'Optional: Host name to connect to, defaults to the pod IP.

            +optional'
      title: TCPSocketAction describes an action based on opening a socket
    v1SecretKeySelector:
      type: object
      properties:
        localObjectReference:
          $ref: '#/components/schemas/v1LocalObjectReference'
        key:
          type: string
          description: The key of the secret to select from.  Must be a valid secret key.
        optional:
          type: boolean
          title: 'Specify whether the Secret or its key must be defined

            +optional'
      title: 'SecretKeySelector selects a key of a Secret.

        +structType=atomic'
    v1GitRepoVolumeSource:
      type: object
      properties:
        repository:
          type: string
          title: repository is the URL
        revision:
          type: string
          title: 'revision is the commit hash for the specified revision.

            +optional'
        directory:
          type: string
          title: 'directory is the target directory name.

            Must not contain or start with ''..''.  If ''.'' is supplied, the volume directory will be the

            git repository.  Otherwise, if specified, the volume will contain the git repository in

            the subdirectory with the given name.

            +optional'
      description: 'Represents a volume that is populated with the contents of a git repository.

        Git repo volumes do not support ownership management.

        Git repo volumes support SELinux relabeling.


        DEPRECATED: GitRepo is deprecated. To provision a container with a git repo, mount an

        EmptyDir into an InitContainer that clones the repo using git, then mount the EmptyDir

        into the Pod''s container.'
    v1CinderVolumeSource:
      type: object
      properties:
        volumeID:
          type: string
          title: 'volumeID used to identify the volume in cinder.

            More info: https://examples.k8s.io/mysql-cinder-pd/README.md'
        fsType:
          type: string
          title: 'fsType is the filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            More info: https://examples.k8s.io/mysql-cinder-pd/README.md

            +optional'
        readOnly:
          type: boolean
          title: 'readOnly defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            More info: https://examples.k8s.io/mysql-cinder-pd/README.md

            +optional'
        secretRef:
          $ref: '#/components/schemas/v1LocalObjectReference'
      description: 'Represents a cinder volume resource in Openstack.

        A Cinder volume must exist before mounting to a container.

        The volume must also be in the same region as the kubelet.

        Cinder volumes support ownership management and SELinux relabeling.'
    v1RBDVolumeSource:
      type: object
      properties:
        monitors:
          type: array
          items:
            type: string
          title: 'monitors is a collection of Ceph monitors.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it

            +listType=atomic'
        image:
          type: string
          title: 'image is the rados image name.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it'
        fsType:
          type: string
          title: 'fsType is the filesystem type of the volume that you want to mount.

            Tip: Ensure that the filesystem type is supported by the host operating system.

            Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#rbd

            TODO: how do we prevent errors in the filesystem from compromising the machine

            +optional'
        pool:
          type: string
          title: 'pool is the rados pool name.

            Default is rbd.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it

            +optional

            +default="rbd"'
        user:
          type: string
          title: 'user is the rados user name.

            Default is admin.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it

            +optional

            +default="admin"'
        keyring:
          type: string
          title: 'keyring is the path to key ring for RBDUser.

            Default is /etc/ceph/keyring.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it

            +optional

            +default="/etc/ceph/keyring"'
        secretRef:
          $ref: '#/components/schemas/v1LocalObjectReference'
        readOnly:
          type: boolean
          title: 'readOnly here will force the ReadOnly setting in VolumeMounts.

            Defaults to false.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it

            +optional'
      description: 'Represents a Rados Block Device mount that lasts the lifetime of a pod.

        RBD volumes support ownership management and SELinux relabeling.'
    v1TopologySpreadConstraint:
      type: object
      properties:
        maxSkew:
          type: integer
          format: int32
          description: 'MaxSkew describes the degree to which pods may be unevenly distributed.

            When `whenUnsatisfiable=DoNotSchedule`, it is the maximum permitted difference

            between the number of matching pods in the target topology and the global minimum.

            The global minimum is the minimum number of matching pods in an eligible domain

            or zero if the number of eligible domains is less than MinDomains.

            For example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same

            labelSelector spread as 2/2/1:

            In this case, the global minimum is 1.

            +-------+-------+-------+

            | zone1 | zone2 | zone3 |

            +-------+-------+-------+

            |  P P  |  P P  |   P   |

            +-------+-------+-------+

            - if MaxSkew is 1, incoming pod can only be scheduled to zone3 to become 2/2/2;

            scheduling it onto zone1(zone2) would make the ActualSkew(3-1) on zone1(zone2)

            violate MaxSkew(1).

            - if MaxSkew is 2, incoming pod can be scheduled onto any zone.

            When `whenUnsatisfiable=ScheduleAnyway`, it is used to give higher precedence

            to topologies that satisfy it.

            It''s a required field. Default value is 1 and 0 is not allowed.'
        topologyKey:
          type: string
          description: 'TopologyKey is the key of node labels. Nodes that have a label with this key

            and identical values are considered to be in the same topology.

            We consider each <key, value> as a "bucket", and try to put balanced number

            of pods into each bucket.

            We define a domain as a particular instance of a topology.

            Also, we define an eligible domain as a domain whose nodes meet the requirements of

            nodeAffinityPolicy and nodeTaintsPolicy.

            e.g. If TopologyKey is "kubernetes.io/hostname", each Node is a domain of that topology.

            And, if TopologyKey is "topology.kubernetes.io/zone", each zone is a domain of that topology.

            It''s a required field.'
        whenUnsatisfiable:
          type: string
          description: "WhenUnsatisfiable indicates how to deal with a pod if it doesn't satisfy\nthe spread constraint.\n- DoNotSchedule (default) tells the scheduler not to schedule it.\n- ScheduleAnyway tells the scheduler to schedule the pod in any location,\n  but giving higher precedence to topologies that would help reduce the\n  skew.\nA constraint is considered \"Unsatisfiable\" for an incoming pod\nif and only if every possible node assignment for that pod would violate\n\"MaxSkew\" on some topology.\nFor example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same\nlabelSelector spread as 3/1/1:\n+-------+-------+-------+\n| zone1 | zone2 | zone3 |\n+-------+-------+-------+\n| P P P |   P   |   P   |\n+-------+-------+-------+\nIf WhenUnsatisfiable is set to DoNotSchedule, incoming pod can only be scheduled\nto zone2(zone3) to become 3/2/1(3/1/2) as ActualSkew(2-1) on zone2(zone3) satisfies\nMaxSkew(1). In other words, the cluster can still be imbalanced, but scheduler\nwon't make it *more* imbalanced.\nIt's a required field."
        labelSelector:
          $ref: '#/components/schemas/v1LabelSelector'
        minDomains:
          type: integer
          format: int32
          description: 'MinDomains indicates a minimum number of eligible domains.

            When the number of eligible domains with matching topology keys is less than minDomains,

            Pod Topology Spread treats "global minimum" as 0, and then the calculation of Skew is performed.

            And when the number of eligible domains with matching topology keys equals or greater than minDomains,

            this value has no effect on scheduling.

            As a result, when the number of eligible domains is less than minDomains,

            scheduler won''t schedule more than maxSkew Pods to those domains.

            If value is nil, the constraint behaves as if MinDomains is equal to 1.

            Valid values are integers greater than 0.

            When value is not nil, WhenUnsatisfiable must be DoNotSchedule.


            For example, in a 3-zone cluster, MaxSkew is set to 2, MinDomains is set to 5 and pods with the same

            labelSelector spread as 2/2/2:

            +-------+-------+-------+

            | zone1 | zone2 | zone3 |

            +-------+-------+-------+

            |  P P  |  P P  |  P P  |

            +-------+-------+-------+

            The number of domains is less than 5(MinDomains), so "global minimum" is treated as 0.

            In this situation, new pod with the same labelSelector cannot be scheduled,

            because computed skew will be 3(3 - 0) if new Pod is scheduled to any of the three zones,

            it will violate MaxSkew.

            +optional'
        nodeAffinityPolicy:
          type: string
          description: 'NodeAffinityPolicy indicates how we will treat Pod''s nodeAffinity/nodeSelector

            when calculating pod topology spread skew. Options are:

            - Honor: only nodes matching nodeAffinity/nodeSelector are included in the calculations.

            - Ignore: nodeAffinity/nodeSelector are ignored. All nodes are included in the calculations.


            If this value is nil, the behavior is equivalent to the Honor policy.

            +optional'
        nodeTaintsPolicy:
          type: string
          description: 'NodeTaintsPolicy indicates how we will treat node taints when calculating

            pod topology spread skew. Options are:

            - Honor: nodes without taints, along with tainted nodes for which the incoming pod

            has a toleration, are included.

            - Ignore: node taints are ignored. All nodes are included.


            If this value is nil, the behavior is equivalent to the Ignore policy.

            +optional'
        matchLabelKeys:
          type: array
          items:
            type: string
          description: 'MatchLabelKeys is a set of pod label keys to select the pods over which

            spreading will be calculated. The keys are used to lookup values from the

            incoming pod labels, those key-value labels are ANDed with labelSelector

            to select the group of existing pods over which spreading will be calculated

            for the incoming pod. The same key is forbidden to exist in both MatchLabelKeys and LabelSelector.

            MatchLabelKeys cannot be set when LabelSelector isn''t set.

            Keys that don''t exist in the incoming pod labels will

            be ignored. A null or empty list means only match against labelSelector.


            This is a beta field and requires the MatchLabelKeysInPodTopologySpread feature gate to be enabled (enabled by default).

            +listType=atomic

            +optional'
      description: TopologySpreadConstraint specifies how to spread matching pods among the given topology.
    v1Affinity:
      type: object
      properties:
        nodeAffinity:
          $ref: '#/components/schemas/v1NodeAffinity'
        podAffinity:
          $ref: '#/components/schemas/v1PodAffinity'
        podAntiAffinity:
          $ref: '#/components/schemas/v1PodAntiAffinity'
      description: Affinity is a group of affinity scheduling rules.
