    v1FileKeySelector:
      type: object
      properties:
        volumeName:
          type: string
          title: 'The name of the volume mount containing the env file.

            +required'
        path:
          type: string
          title: 'The path within the volume from which to select the file.

            Must be relative and may not contain the ''..'' path or start with ''..''.

            +required'
        key:
          type: string
