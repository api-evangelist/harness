        setMirrorRoute:
          $ref: '#/components/schemas/v1SetMirrorRoute'
      description: CanaryStep defines a step of a canary deployment.
    v1JobSpec:
      type: object
      properties:
        parallelism:
          type: integer
          format: int32
          title: 'Specifies the maximum desired number of pods the job should

            run at any given time. The actual number of pods running in steady state will

            be less than this number when ((.spec.completions - .status.successful) < .spec.parallelism),

            i.e. when the work left to do is less than max parallelism.

            More info: https://kubernetes.io/docs/concepts/workloads/controllers/jobs-run-to-completion/

            +optional'
        completions:
          type: integer
          format: int32
          title: 'Specifies the desired number of successfully finished pods the

            job should be run with.  Setting to null means that the success of any

            pod signals the success of all pods, and allows parallelism to have any positive

            value.  Setting to 1 means that parallelism is limited to 1 and the success of that

            pod signals the success of the job.

            More info: https://kubernetes.io/docs/concepts/workloads/controllers/jobs-run-to-completion/

            +optional'
        activeDeadlineSeconds:
          type: string
          format: int64
          title: 'Specifies the duration in seconds relative to the startTime that the job

            may be continuously active before the system tries to terminate it; value

            must be positive integer. If a Job is suspended (at creation or through an

            update), this timer will effectively be stopped and reset when the Job is

            resumed again.

            +optional'
        podFailurePolicy:
          $ref: '#/components/schemas/v1PodFailurePolicy'
        successPolicy:
          $ref: '#/components/schemas/v1SuccessPolicy'
        backoffLimit:
          type: integer
          format: int32
          title: 'Specifies the number of retries before marking this job failed.

            Defaults to 6, unless backoffLimitPerIndex (only Indexed Job) is specified.

            When backoffLimitPerIndex is specified, backoffLimit defaults to 2147483647.

            +optional'
        backoffLimitPerIndex:
          type: integer
          format: int32
          title: 'Specifies the limit for the number of retries within an

            index before marking this index as failed. When enabled the number of

            failures per index is kept in the pod''s

            batch.kubernetes.io/job-index-failure-count annotation. It can only

            be set when Job''s completionMode=Indexed, and the Pod''s restart

            policy is Never. The field is immutable.

            +optional'
        maxFailedIndexes:
          type: integer
          format: int32
          title: 'Specifies the maximal number of failed indexes before marking the Job as

            failed, when backoffLimitPerIndex is set. Once the number of failed

            indexes exceeds this number the entire Job is marked as Failed and its

            execution is terminated. When left as null the job continues execution of

            all of its indexes and is marked with the `Complete` Job condition.

            It can only be specified when backoffLimitPerIndex is set.

            It can be null or up to completions. It is required and must be

            less than or equal to 10^4 when is completions greater than 10^5.

            +optional'
        selector:
          $ref: '#/components/schemas/v1LabelSelector'
        manualSelector:
          type: boolean
          title: 'manualSelector controls generation of pod labels and pod selectors.

            Leave `manualSelector` unset unless you are certain what you are doing.

            When false or unset, the system pick labels unique to this job

            and appends those labels to the pod template.  When true,

            the user is responsible for picking unique labels and specifying

            the selector.  Failure to pick a unique label may cause this

            and other jobs to not function correctly.  However, You may see

            `manualSelector=true` in jobs that were created with the old `extensions/v1beta1`

            API.

            More info: https://kubernetes.io/docs/concepts/workloads/controllers/jobs-run-to-completion/#specifying-your-own-pod-selector

            +optional'
        template:
          $ref: '#/components/schemas/v1PodTemplateSpec'
        ttlSecondsAfterFinished:
          type: integer
          format: int32
          title: 'ttlSecondsAfterFinished limits the lifetime of a Job that has finished

            execution (either Complete or Failed). If this field is set,

            ttlSecondsAfterFinished after the Job finishes, it is eligible to be

            automatically deleted. When the Job is being deleted, its lifecycle

            guarantees (e.g. finalizers) will be honored. If this field is unset,

            the Job won''t be automatically deleted. If this field is set to zero,

            the Job becomes eligible to be deleted immediately after it finishes.

            +optional'
        completionMode:
          type: string
          description: 'completionMode specifies how Pod completions are tracked. It can be

            `NonIndexed` (default) or `Indexed`.


            `NonIndexed` means that the Job is considered complete when there have

            been .spec.completions successfully completed Pods. Each Pod completion is

            homologous to each other.


            `Indexed` means that the Pods of a

            Job get an associated completion index from 0 to (.spec.completions - 1),

            available in the annotation batch.kubernetes.io/job-completion-index.

            The Job is considered complete when there is one successfully completed Pod

            for each index.

            When value is `Indexed`, .spec.completions must be specified and

            `.spec.parallelism` must be less than or equal to 10^5.

            In addition, The Pod name takes the form

            `$(job-name)-$(index)-$(random-string)`,

            the Pod hostname takes the form `$(job-name)-$(index)`.


            More completion modes can be added in the future.

            If the Job controller observes a mode that it doesn''t recognize, which

            is possible during upgrades due to version skew, the controller

            skips updates for the Job.

            +optional'
        suspend:
          type: boolean
          description: 'suspend specifies whether the Job controller should create Pods or not. If

            a Job is created with suspend set to true, no Pods are created by the Job

            controller. If a Job is suspended after creation (i.e. the flag goes from

            false to true), the Job controller will delete all active Pods associated

            with this Job. Users must design their workload to gracefully handle this.

            Suspending a Job will reset the StartTime field of the Job, effectively

            resetting the ActiveDeadlineSeconds timer too. Defaults to false.


            +optional'
        podReplacementPolicy:
          type: string
          description: "podReplacementPolicy specifies when to create replacement Pods.\nPossible values are:\n- TerminatingOrFailed means that we recreate pods\n  when they are terminating (has a metadata.deletionTimestamp) or failed.\n- Failed means to wait until a previously created Pod is fully terminated (has phase\n  Failed or Succeeded) before creating a replacement Pod.\n\nWhen using podFailurePolicy, Failed is the the only allowed value.\nTerminatingOrFailed and Failed are allowed values when podFailurePolicy is not in use.\n+optional"
        managedBy:
          type: string
          description: 'ManagedBy field indicates the controller that manages a Job. The k8s Job

            controller reconciles jobs which don''t have this field at all or the field

            value is the reserved string `kubernetes.io/job-controller`, but skips

            reconciling Jobs with a custom value for this field.

            The value must be a valid domain-prefixed path (e.g. acme.io/foo) -

            all characters before the first "/" must be a valid subdomain as defined

            by RFC 1123. All characters trailing the first "/" must be valid HTTP Path

            characters as defined by RFC 3986. The value cannot exceed 63 characters.

            This field is immutable.


            This field is beta-level. The job controller accepts setting the field

            when the feature gate JobManagedBy is enabled (enabled by default).

            +optional'
      description: JobSpec describes how the job execution will look like.
    v1RolloutAnalysisRunInfo:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMeta'
        icon:
          type: string
        revision:
          type: string
        status:
          type: string
        successful:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        inconclusive:
          type: integer
          format: int32
        error:
          type: integer
          format: int32
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/v1RolloutJobInfo'
        nonJobInfo:
          type: array
          items:
            $ref: '#/components/schemas/v1RolloutNonJobInfo'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/v1Metric'
    v1ConfigMapProjection:
      type: object
      properties:
        localObjectReference:
          $ref: '#/components/schemas/v1LocalObjectReference'
        items:
          type: array
          items:
            $ref: '#/components/schemas/v1KeyToPath'
          title: 'items if unspecified, each key-value pair in the Data field of the referenced

            ConfigMap will be projected into the volume as a file whose name is the

            key and content is the value. If specified, the listed keys will be

            projected into the specified paths, and unlisted keys will not be

            present. If a key is specified which is not present in the ConfigMap,

            the volume setup will error unless it is marked optional. Paths must be

            relative and may not contain the ''..'' path or start with ''..''.

            +optional

            +listType=atomic'
        optional:
          type: boolean
          title: 'optional specify whether the ConfigMap or its keys must be defined

            +optional'
      description: 'Adapts a ConfigMap into a projected volume.


        The contents of the target ConfigMap''s Data field will be presented in a

        projected volume as files using the keys in the Data field as the file names,

        unless the items element is populated with specific mappings of keys to paths.

        Note that this is identical to a configmap volume source without the default

        mode.'
    v1ContainerResizePolicy:
      type: object
      properties:
        resourceName:
          type: string
          description: 'Name of the resource to which this resource resize policy applies.

            Supported values: cpu, memory.'
        restartPolicy:
          type: string
          description: 'Restart policy to apply when specified resource is resized.

            If not specified, it defaults to NotRequired.'
      description: ContainerResizePolicy represents resource resize policy for the container.
    v1PodFailurePolicyRule:
      type: object
      properties:
        action:
          type: string
          description: "- FailJob: indicates that the pod's job is marked as Failed and all\n  running pods are terminated.\n- FailIndex: indicates that the pod's index is marked as Failed and will\n  not be restarted.\n- Ignore: indicates that the counter towards the .backoffLimit is not\n  incremented and a replacement pod is created.\n- Count: indicates that the pod is handled in the default way - the\n  counter towards the .backoffLimit is incremented.\nAdditional values are considered to be added in the future. Clients should\nreact to an unknown action by skipping the rule."
          title: 'Specifies the action taken on a pod failure when the requirements are satisfied.

            Possible values are:'
        onExitCodes:
          $ref: '#/components/schemas/v1PodFailurePolicyOnExitCodesRequirement'
        onPodConditions:
          type: array
          items:
            $ref: '#/components/schemas/v1PodFailurePolicyOnPodConditionsPattern'
          title: 'Represents the requirement on the pod conditions. The requirement is represented

            as a list of pod condition patterns. The requirement is satisfied if at

            least one pattern matches an actual pod condition. At most 20 elements are allowed.

            +listType=atomic

            +optional'
      description: 'PodFailurePolicyRule describes how a pod failure is handled when the requirements are met.

        One of onExitCodes and onPodConditions, but not both, can be used in each rule.'
    v1OwnerReference:
      type: object
      properties:
        apiVersion:
          type: string
          description: API version of the referent.
        kind:
          type: string
          title: 'Kind of the referent.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
        name:
          type: string
          title: 'Name of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names'
        uid:
          type: string
          title: 'UID of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids'
        controller:
          type: boolean
          title: 'If true, this reference points to the managing controller.

            +optional'
        blockOwnerDeletion:
          type: boolean
          title: 'If true, AND if the owner has the "foregroundDeletion" finalizer, then

            the owner cannot be deleted from the key-value store until this

            reference is removed.

            See https://kubernetes.io/docs/concepts/architecture/garbage-collection/#foreground-deletion

            for how the garbage collector interacts with this field and enforces the foreground deletion.

            Defaults to false.

            To set this field, a user needs "delete" permission of the owner,

            otherwise 422 (Unprocessable Entity) will be returned.

            +optional'
      title: 'OwnerReference contains enough information to let you identify an owning

        object. An owning object must be in the same namespace as the dependent, or

        be cluster-scoped, so there is no namespace field.

        +structType=atomic'
    v1Volume:
      type: object
      properties:
        name:
          type: string
          title: 'name of the volume.

            Must be a DNS_LABEL and unique within the pod.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
        volumeSource:
          $ref: '#/components/schemas/v1VolumeSource'
      description: Volume represents a named volume in a pod that may be accessed by any container in the pod.
    v1EphemeralContainerCommon:
      type: object
      properties:
        name:
          type: string
          description: 'Name of the ephemeral container specified as a DNS_LABEL.

            This name must be unique among all containers, init containers and ephemeral containers.'
        image:
          type: string
          title: 'Container image name.

            More info: https://kubernetes.io/docs/concepts/containers/images'
        command:
          type: array
          items:
            type: string
          title: 'Entrypoint array. Not executed within a shell.

            The image''s ENTRYPOINT is used if this is not provided.

            Variable references $(VAR_NAME) are expanded using the container''s environment. If a variable

            cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced

            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will

            produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless

            of whether the variable exists or not. Cannot be updated.

            More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell

            +optional

            +listType=atomic'
        args:
          type: array
          items:
            type: string
          title: 'Arguments to the entrypoint.

            The image''s CMD is used if this is not provided.

            Variable references $(VAR_NAME) are expanded using the container''s environment. If a variable

            cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced

            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will

            produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless

            of whether the variable exists or not. Cannot be updated.

            More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell

            +optional

            +listType=atomic'
        workingDir:
          type: string
          title: 'Container''s working directory.

            If not specified, the container runtime''s default will be used, which

            might be configured in the container image.

            Cannot be updated.

            +optional'
        ports:
          type: array
          items:
            $ref: '#/components/schemas/v1ContainerPort'
          title: 'Ports are not allowed for ephemeral containers.

            +optional

            +patchMergeKey=containerPort

            +patchStrategy=merge

            +listType=map

            +listMapKey=containerPort

            +listMapKey=protocol'
        envFrom:
          type: array
          items:
            $ref: '#/components/schemas/v1EnvFromSource'
          title: 'List of sources to populate environment variables in the container.

            The keys defined within a source may consist of any printable ASCII characters except ''=''.

            When a key exists in multiple

            sources, the value associated with the last source will take precedence.

            Values defined by an Env with a duplicate key will take precedence.

            Cannot be updated.

            +optional

            +listType=atomic'
        env:
          type: array
          items:
            $ref: '#/components/schemas/v1EnvVar'
          title: 'List of environment variables to set in the container.

            Cannot be updated.

            +optional

            +patchMergeKey=name

            +patchStrategy=merge

            +listType=map

            +listMapKey=name'
        resources:
          $ref: '#/components/schemas/v1ResourceRequirements'
        resizePolicy:
          type: array
          items:
            $ref: '#/components/schemas/v1ContainerResizePolicy'
          title: 'Resources resize policy for the container.

            +featureGate=InPlacePodVerticalScaling

            +optional

            +listType=atomic'
        restartPolicy:
          type: string
          title: 'Restart policy for the container to manage the restart behavior of each

            container within a pod.

            You cannot set this field on ephemeral containers.

            +featureGate=SidecarContainers

            +optional'
        restartPolicyRules:
          type: array
          items:
            $ref: '#/components/schemas/v1ContainerRestartRule'
          title: 'Represents a list of rules to be checked to determine if the

            container should be restarted on exit. You cannot set this field on

            ephemeral containers.

            +featureGate=ContainerRestartRules

            +optional

            +listType=atomic'
        volumeMounts:
          type: array
          items:
            $ref: '#/components/schemas/v1VolumeMount'
          title: 'Pod volumes to mount into the container''s filesystem. Subpath mounts are not allowed for ephemeral containers.

            Cannot be updated.

            +optional

            +patchMergeKey=mountPath

            +patchStrategy=merge

            +listType=map

            +listMapKey=mountPath'
        volumeDevices:
          type: array
          items:
            $ref: '#/components/schemas/v1VolumeDevice'
          title: 'volumeDevices is the list of block devices to be used by the container.

            +patchMergeKey=devicePath

            +patchStrategy=merge

            +listType=map

            +listMapKey=devicePath

            +optional'
        livenessProbe:
          $ref: '#/components/schemas/v1Probe'
        readinessProbe:
          $ref: '#/components/schemas/v1Probe'
        startupProbe:
          $ref: '#/components/schemas/v1Probe'
        lifecycle:
          $ref: '#/components/schemas/v1Lifecycle'
        terminationMessagePath:
          type: string
          title: 'Optional: Path at which the file to which the container''s termination message

            will be written is mounted into the container''s filesystem.

            Message written is intended to be brief final status, such as an assertion failure message.

            Will be truncated by the node if greater than 4096 bytes. The total message length across

            all containers will be limited to 12kb.

            Defaults to /dev/termination-log.

            Cannot be updated.

            +optional'
        terminationMessagePolicy:
          type: string
          title: 'Indicate how the termination message should be populated. File will use the contents of

            terminationMessagePath to populate the container status message on both success and failure.

            FallbackToLogsOnError will use the last chunk of container log output if the termination

            message file is empty and the container exited with an error.

            The log output is limited to 2048 bytes or 80 lines, whichever is smaller.

            Defaults to File.

            Cannot be updated.

            +optional'
        imagePullPolicy:
          type: string
          title: 'Image pull policy.

            One of Always, Never, IfNotPresent.

            Defaults to Always if :latest tag is specified, or IfNotPresent otherwise.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/containers/images#updating-images

            +optional'
        securityContext:
          $ref: '#/components/schemas/v1SecurityContext'
        stdin:
          type: boolean
          title: 'Whether this container should allocate a buffer for stdin in the container runtime. If this

            is not set, reads from stdin in the container will always result in EOF.

            Default is false.

            +optional'
        stdinOnce:
          type: boolean
          title: 'Whether the container runtime should close the stdin channel after it has been opened by

            a single attach. When stdin is true the stdin stream will remain open across multiple attach

            sessions. If stdinOnce is set to true, stdin is opened on container start, is empty until the

            first client attaches to stdin, and then remains open and accepts data until the client disconnects,

            at which time stdin is closed and remains closed until the container is restarted. If this

            flag is false, a container processes that reads from stdin will never receive an EOF.

            Default is false

            +optional'
        tty:
          type: boolean
          title: 'Whether this container should allocate a TTY for itself, also requires ''stdin'' to be true.

            Default is false.

            +optional'
      description: 'EphemeralContainerCommon is a copy of all fields in Container to be inlined in

        EphemeralContainer. This separate type allows easy conversion from EphemeralContainer

        to Container and allows separate documentation for the fields of EphemeralContainer.

        When a new field is added to Container it must be added here as well.'
    v1RolloutReplicaSetInfo:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMeta'
        status:
          type: string
        icon:
          type: string
        revision:
          type: string
        stable:
          type: boolean
        canary:
          type: boolean
        active:
          type: boolean
        preview:
          type: boolean
        replicas:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
        template:
          type: string
        scaleDownDeadline:
          type: string
        images:
          type: array
          items:
            type: string
        pods:
          type: array
          items:
            $ref: '#/components/schemas/v1RolloutPodInfo'
        ping:
          type: boolean
        pong:
          type: boolean
    v1PodFailurePolicyOnPodConditionsPattern:
      type: object
      properties:
        type:
          type: string
          description: 'Specifies the required Pod condition type. To match a pod condition

            it is required that specified type equals the pod condition type.'
        status:
          type: string
          description: 'Specifies the required Pod condition status. To match a pod condition

            it is required that the specified status equals the pod condition status.

            Defaults to True.'
      description: 'PodFailurePolicyOnPodConditionsPattern describes a pattern for matching

        an actual pod condition type.'
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
      description: API key is a token provided while making the API calls. This is used to authenticate the client at the exposed endpoint.
