        headerValue:
          $ref: '#/components/schemas/v1StringMatch'
    v1SuccessPolicyRule:
      type: object
      properties:
        succeededIndexes:
          type: string
          description: 'succeededIndexes specifies the set of indexes

            which need to be contained in the actual set of the succeeded indexes for the Job.

            The list of indexes must be within 0 to ".spec.completions-1" and

            must not contain duplicates. At least one element is required.

            The indexes are represented as intervals separated by commas.

            The intervals can be a decimal integer or a pair of decimal integers separated by a hyphen.

            The number are listed in represented by the first and last element of the series,

            separated by a hyphen.

            For example, if the completed indexes are 1, 3, 4, 5 and 7, they are

            represented as "1,3-5,7".

            When this field is null, this field doesn''t default to any value

            and is never evaluated at any time.


            +optional'
        succeededCount:
          type: integer
          format: int32
          description: 'succeededCount specifies the minimal required size of the actual set of the succeeded indexes

            for the Job. When succeededCount is used along with succeededIndexes, the check is

            constrained only to the set of indexes specified by succeededIndexes.

            For example, given that succeededIndexes is "1-4", succeededCount is "3",

            and completed indexes are "1", "3", and "5", the Job isn''t declared as succeeded

            because only "1" and "3" indexes are considered in that rules.

            When this field is null, this doesn''t default to any value and

            is never evaluated at any time.

            When specified it needs to be a positive integer.


            +optional'
      description: 'SuccessPolicyRule describes rule for declaring a Job as succeeded.

        Each rule must have at least one of the "succeededIndexes" or "succeededCount" specified.'
    v1ISCSIVolumeSource:
      type: object
      properties:
        targetPortal:
          type: string
          description: 'targetPortal is iSCSI Target Portal. The Portal is either an IP or ip_addr:port if the port

            is other than default (typically TCP ports 860 and 3260).'
        iqn:
          type: string
          description: iqn is the target iSCSI Qualified Name.
        lun:
          type: integer
          format: int32
          description: lun represents iSCSI Target Lun number.
        iscsiInterface:
          type: string
          title: 'iscsiInterface is the interface Name that uses an iSCSI transport.

            Defaults to ''default'' (tcp).

            +optional

            +default="default"'
        fsType:
          type: string
          title: 'fsType is the filesystem type of the volume that you want to mount.

            Tip: Ensure that the filesystem type is supported by the host operating system.

            Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#iscsi

            TODO: how do we prevent errors in the filesystem from compromising the machine

            +optional'
        readOnly:
          type: boolean
          title: 'readOnly here will force the ReadOnly setting in VolumeMounts.

            Defaults to false.

            +optional'
        portals:
          type: array
          items:
            type: string
          title: 'portals is the iSCSI Target Portal List. The portal is either an IP or ip_addr:port if the port

            is other than default (typically TCP ports 860 and 3260).

            +optional

            +listType=atomic'
        chapAuthDiscovery:
          type: boolean
          title: 'chapAuthDiscovery defines whether support iSCSI Discovery CHAP authentication

            +optional'
        chapAuthSession:
          type: boolean
          title: 'chapAuthSession defines whether support iSCSI Session CHAP authentication

            +optional'
        secretRef:
          $ref: '#/components/schemas/v1LocalObjectReference'
        initiatorName:
          type: string
          title: 'initiatorName is the custom iSCSI Initiator Name.

            If initiatorName is specified with iscsiInterface simultaneously, new iSCSI interface

            <target portal>:<volume name> will be created for the connection.

            +optional'
      description: 'Represents an ISCSI disk.

        ISCSI volumes can only be mounted as read/write once.

        ISCSI volumes support ownership management and SELinux relabeling.'
    v1VolumeSource:
