      title: ScaleIOVolumeSource represents a persistent ScaleIO volume
    v1VolumeResourceRequirements:
      type: object
      properties:
        limits:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/resourceQuantity'
          title: 'Limits describes the maximum amount of compute resources allowed.

            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

            +optional'
        requests:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/resourceQuantity'
          title: 'Requests describes the minimum amount of compute resources required.

            If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,

            otherwise to an implementation-defined value. Requests cannot exceed Limits.

            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

            +optional'
      description: VolumeResourceRequirements describes the storage resource requirements for a volume.
    v1ResourceClaim:
      type: object
      properties:
        name:
          type: string
          description: 'Name must match the name of one entry in pod.spec.resourceClaims of

            the Pod where this field is used. It makes that resource available

            inside a container.'
        request:
          type: string
          description: 'Request is the name chosen for a request in the referenced claim.

            If empty, everything from the claim is made available, otherwise

            only the result of this request.


            +optional'
      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
    v1RolloutNonJobInfo:
      type: object
      properties:
        value:
          type: string
        status:
          type: string
        metricName:
          type: string
        startedAt:
          $ref: '#/components/schemas/v1Time'
    v1PodResourceClaim:
      type: object
      properties:
        name:
          type: string
          description: 'Name uniquely identifies this resource claim inside the pod.

            This must be a DNS_LABEL.'
        resourceClaimName:
          type: string
          description: 'ResourceClaimName is the name of a ResourceClaim object in the same

            namespace as this pod.


            Exactly one of ResourceClaimName and ResourceClaimTemplateName must

            be set.'
        resourceClaimTemplateName:
          type: string
          description: 'ResourceClaimTemplateName is the name of a ResourceClaimTemplate

            object in the same namespace as this pod.


            The template will be used to create a new ResourceClaim, which will

            be bound to this pod. When this pod is deleted, the ResourceClaim

            will also be deleted. The pod name and resource name, along with a

            generated component, will be used to form a unique name for the

            ResourceClaim, which will be recorded in pod.status.resourceClaimStatuses.


            This field is immutable and no changes will be made to the

            corresponding ResourceClaim by the control plane after creating the

            ResourceClaim.


            Exactly one of ResourceClaimName and ResourceClaimTemplateName must

            be set.'
      description: 'PodResourceClaim references exactly one ResourceClaim, either directly

        or by naming a ResourceClaimTemplate which is then turned into a ResourceClaim

        for the pod.


        It adds a name to it that uniquely identifies the ResourceClaim inside the Pod.

        Containers that need access to the ResourceClaim reference it with this name.'
    v1AzureDiskVolumeSource:
      type: object
      properties:
        diskName:
          type: string
          title: diskName is the Name of the data disk in the blob storage
        diskURI:
          type: string
          title: diskURI is the URI of data disk in the blob storage
        cachingMode:
          type: string
          title: 'cachingMode is the Host Caching mode: None, Read Only, Read Write.

            +optional

            +default=ref(AzureDataDiskCachingReadWrite)'
        fsType:
          type: string
          title: 'fsType is Filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            +optional

            +default="ext4"'
        readOnly:
          type: boolean
          title: 'readOnly Defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional

            +default=false'
        kind:
          type: string
          title: 'kind expected values are Shared: multiple blob disks per storage account  Dedicated: single blob disk per storage account  Managed: azure managed data disk (only in managed availability set). defaults to shared

            +default=ref(AzureSharedBlobDisk)'
      description: AzureDisk represents an Azure Data Disk mount on the host and bind mount to the pod.
    v1Metric:
      type: object
      properties:
        name:
          type: string
          title: Name is the name of the metric
        interval:
          type: string
          title: 'Interval defines an interval string (e.g. 30s, 5m, 1h) between each measurement.

            If omitted, will perform a single measurement'
        initialDelay:
          type: string
          title: InitialDelay how long the AnalysisRun should wait before starting this metric
        count:
          $ref: '#/components/schemas/intstrIntOrString'
        successCondition:
          type: string
          title: "SuccessCondition is an expression which determines if a measurement is considered successful\nExpression is a goevaluate expression. The keyword `result` is a variable reference to the\nvalue of measurement. Results can be both structured data or primitive.\nExamples:\n  result > 10\n  (result.requests_made * result.requests_succeeded / 100) >= 90"
        failureCondition:
          type: string
          title: 'FailureCondition is an expression which determines if a measurement is considered failed

            If both success and failure conditions are specified, and the measurement does not fall into

            either condition, the measurement is considered Inconclusive'
        failureLimit:
          $ref: '#/components/schemas/intstrIntOrString'
        inconclusiveLimit:
          $ref: '#/components/schemas/intstrIntOrString'
        consecutiveErrorLimit:
          $ref: '#/components/schemas/intstrIntOrString'
        provider:
          $ref: '#/components/schemas/v1MetricProvider'
      title: Metric defines a metric in which to perform analysis
    v1ConfigMapKeySelector:
      type: object
      properties:
        localObjectReference:
          $ref: '#/components/schemas/v1LocalObjectReference'
        key:
          type: string
          description: The key to select.
        optional:
          type: boolean
          title: 'Specify whether the ConfigMap or its key must be defined

            +optional'
      title: 'Selects a key from a ConfigMap.

        +structType=atomic'
    v1InfluxdbMetric:
      type: object
      properties:
        profile:
          type: string
          title: Profile is the name of the secret holding InfluxDB account configuration
        query:
          type: string
          title: Query is a raw InfluxDB flux query to perform
      title: InfluxdbMetric defines the InfluxDB Flux query to perform canary analysis
    v1RolloutPodInfo:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMeta'
        status:
          type: string
        icon:
          type: string
        ready:
          type: string
        restarts:
          type: integer
          format: int32
    v1FieldsV1:
      type: object
      properties:
        Raw:
          type: string
          format: byte
          description: Raw is the underlying serialization of this object.
      description: 'FieldsV1 stores a set of fields in a data structure like a Trie, in JSON format.


        Each key is either a ''.'' representing the field itself, and will always map to an empty set,

        or a string representing a sub-field or item. The string will follow one of these four formats:

        ''f:<name>'', where <name> is the name of a field in a struct, or key in a map

        ''v:<value>'', where <value> is the exact json formatted value of a list item

        ''i:<index>'', where <index> is position of a item in a list

        ''k:<keys>'', where <keys> is a map of  a list item''s key fields to their unique values

        If a key maps to an empty Fields value, the field that key represents is part of the set.


        The exact format is defined in sigs.k8s.io/structured-merge-diff

        +protobuf.options.(gogoproto.goproto_stringer)=false'
    v1EmptyDirVolumeSource:
      type: object
      properties:
        medium:
          type: string
          title: 'medium represents what type of storage medium should back this directory.

            The default is "" which means to use the node''s default medium.

            Must be an empty string (default) or Memory.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#emptydir

            +optional'
        sizeLimit:
          $ref: '#/components/schemas/resourceQuantity'
      description: 'Represents an empty directory for a pod.

        Empty directory volumes support ownership management and SELinux relabeling.'
    v1SuccessPolicy:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/v1SuccessPolicyRule'
          title: 'rules represents the list of alternative rules for the declaring the Jobs

            as successful before `.status.succeeded >= .spec.completions`. Once any of the rules are met,

            the "SuccessCriteriaMet" condition is added, and the lingering pods are removed.

            The terminal state for such a Job has the "Complete" condition.

            Additionally, these rules are evaluated in order; Once the Job meets one of the rules,

            other rules are ignored. At most 20 elements are allowed.

            +listType=atomic'
      description: SuccessPolicy describes when a Job can be declared as succeeded based on the success of some indexes.
    intstrIntOrString:
      type: object
      properties:
        type:
          type: string
          format: int64
        intVal:
          type: integer
          format: int32
        strVal:
          type: string
      description: '+protobuf=true

        +protobuf.options.(gogoproto.goproto_stringer)=false

        +k8s:openapi-gen=true'
      title: 'IntOrString is a type that can hold an int32 or a string.  When used in

        JSON or YAML marshalling and unmarshalling, it produces or consumes the

        inner type.  This allows you to have, for example, a JSON field that can

        accept a name or number.

        TODO: Rename to Int32OrString'
    resourceQuantity:
      type: object
      properties:
        string:
          type: string
      description: "Quantity is a fixed-point representation of a number.\nIt provides convenient marshaling/unmarshaling in JSON and YAML,\nin addition to String() and AsInt64() accessors.\n\nThe serialization format is:\n\n```\n<quantity>        ::= <signedNumber><suffix>\n\n\t(Note that <suffix> may be empty, from the \"\" case in <decimalSI>.)\n\n<digit>           ::= 0 | 1 | ... | 9\n<digits>          ::= <digit> | <digit><digits>\n<number>          ::= <digits> | <digits>.<digits> | <digits>. | .<digits>\n<sign>            ::= \"+\" | \"-\"\n<signedNumber>    ::= <number> | <sign><number>\n<suffix>          ::= <binarySI> | <decimalExponent> | <decimalSI>\n<binarySI>        ::= Ki | Mi | Gi | Ti | Pi | Ei\n\n\t(International System of units; See: http://physics.nist.gov/cuu/Units/binary.html)\n\n<decimalSI>       ::= m | \"\" | k | M | G | T | P | E\n\n\t(Note that 1024 = 1Ki but 1000 = 1k; I didn't choose the capitalization.)\n\n<decimalExponent> ::= \"e\" <signedNumber> | \"E\" <signedNumber>\n```\n\nNo matter which of the three exponent forms is used, no quantity may represent\na number greater than 2^63-1 in magnitude, nor may it have more than 3 decimal\nplaces. Numbers larger or more precise will be capped or rounded up.\n(E.g.: 0.1m will rounded up to 1m.)\nThis may be extended in the future if we require larger or smaller quantities.\n\nWhen a Quantity is parsed from a string, it will remember the type of suffix\nit had, and will use the same type again when it is serialized.\n\nBefore serializing, Quantity will be put in \"canonical form\".\nThis means that Exponent/suffix will be adjusted up or down (with a\ncorresponding increase or decrease in Mantissa) such that:\n\n- No precision is lost\n- No fractional digits will be emitted\n- The exponent (or suffix) is as large as possible.\n\nThe sign will be omitted unless the number is negative.\n\nExamples:\n\n- 1.5 will be serialized as \"1500m\"\n- 1.5Gi will be serialized as \"1536Mi\"\n\nNote that the quantity will NEVER be internally represented by a\nfloating point number. That is the whole point of this exercise.\n\nNon-canonical values will still parse as long as they are well formed,\nbut will be re-emitted in their canonical form. (So always use canonical\nform, or don't diff.)\n\nThis format is intended to make it difficult to use these numbers without\nwriting some sort of special handling code in the hopes that that will\ncause implementors to also use a fixed point implementation.\n\n+protobuf=true\n+protobuf.embed=string\n+protobuf.options.marshal=false\n+protobuf.options.(gogoproto.goproto_stringer)=false\n+k8s:deepcopy-gen=true\n+k8s:openapi-gen=true"
    v1PodCertificateProjection:
      type: object
      properties:
        signerName:
          type: string
          description: 'Kubelet''s generated CSRs will be addressed to this signer.


            +required'
        keyType:
          type: string
          description: 'The type of keypair Kubelet will generate for the pod.


            Valid values are "RSA3072", "RSA4096", "ECDSAP256", "ECDSAP384",

            "ECDSAP521", and "ED25519".


            +required'
        maxExpirationSeconds:
          type: integer
          format: int32
          description: 'maxExpirationSeconds is the maximum lifetime permitted for the

            certificate.


            Kubelet copies this value verbatim into the PodCertificateRequests it

            generates for this projection.


            If omitted, kube-apiserver will set it to 86400(24 hours). kube-apiserver

            will reject values shorter than 3600 (1 hour).  The maximum allowable

            value is 7862400 (91 days).


            The signer implementation is then free to issue a certificate with any

            lifetime *shorter* than MaxExpirationSeconds, but no shorter than 3600

            seconds (1 hour).  This constraint is enforced by kube-apiserver.

            `kubernetes.io` signers will never issue certificates with a lifetime

            longer than 24 hours.


            +optional'
        credentialBundlePath:
          type: string
          description: 'Write the credential bundle at this path in the projected volume.


            The credential bundle is a single file that contains multiple PEM blocks.

            The first PEM block is a PRIVATE KEY block, containing a PKCS#8 private

            key.


            The remaining blocks are CERTIFICATE blocks, containing the issued

            certificate chain from the signer (leaf and any intermediates).


            Using credentialBundlePath lets your Pod''s application code make a single

            atomic read that retrieves a consistent key and certificate chain.  If you

            project them to separate files, your application code will need to

            additionally check that the leaf certificate was issued to the key.


            +optional'
        keyPath:
          type: string
          description: 'Write the key at this path in the projected volume.


            Most applications should use credentialBundlePath.  When using keyPath

            and certificateChainPath, your application needs to check that the key

            and leaf certificate are consistent, because it is possible to read the

            files mid-rotation.


            +optional'
        certificateChainPath:
          type: string
          description: 'Write the certificate chain at this path in the projected volume.


            Most applications should use credentialBundlePath.  When using keyPath

            and certificateChainPath, your application needs to check that the key

            and leaf certificate are consistent, because it is possible to read the

            files mid-rotation.


            +optional'
      description: 'PodCertificateProjection provides a private key and X.509 certificate in the

        pod filesystem.'
    v1ExecAction:
      type: object
      properties:
        command:
          type: array
          items:
            type: string
          title: 'Command is the command line to execute inside the container, the working directory for the

            command  is root (''/'') in the container''s filesystem. The command is simply exec''d, it is

            not run inside a shell, so traditional shell instructions (''|'', etc) won''t work. To use

            a shell, you need to explicitly call out to that shell.

            Exit status of 0 is treated as live/healthy and non-zero is unhealthy.

            +optional

            +listType=atomic'
      description: ExecAction describes a "run in container" action.
    v1SetHeaderRoute:
      type: object
      properties:
        name:
          type: string
          title: 'Name this is the name of the route to use for the mirroring of traffic this also needs

            to be included in the `spec.strategy.canary.trafficRouting.managedRoutes` field'
        match:
          type: array
          items:
            $ref: '#/components/schemas/v1HeaderRoutingMatch'
      title: SetHeaderRoute defines the route with specified header name to send 100% of traffic to the canary service
    v1WindowsSecurityContextOptions:
      type: object
      properties:
        gmsaCredentialSpecName:
          type: string
          title: 'GMSACredentialSpecName is the name of the GMSA credential spec to use.

            +optional'
        gmsaCredentialSpec:
          type: string
          title: 'GMSACredentialSpec is where the GMSA admission webhook

            (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the

            GMSA credential spec named by the GMSACredentialSpecName field.

            +optional'
        runAsUserName:
          type: string
          title: 'The UserName in Windows to run the entrypoint of the container process.

            Defaults to the user specified in image metadata if unspecified.

            May also be set in PodSecurityContext. If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence.

            +optional'
        hostProcess:
          type: boolean
          title: 'HostProcess determines if a container should be run as a ''Host Process'' container.

            All of a Pod''s containers must have the same effective HostProcess value

            (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).

            In addition, if HostProcess is true then HostNetwork must also be set to true.

            +optional'
      description: WindowsSecurityContextOptions contain Windows-specific options and credentials.
    v1VsphereVirtualDiskVolumeSource:
      type: object
      properties:
        volumePath:
          type: string
          title: volumePath is the path that identifies vSphere volume vmdk
        fsType:
          type: string
          title: 'fsType is filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            +optional'
        storagePolicyName:
          type: string
          title: 'storagePolicyName is the storage Policy Based Management (SPBM) profile name.

            +optional'
        storagePolicyID:
          type: string
          title: 'storagePolicyID is the storage Policy Based Management (SPBM) profile ID associated with the StoragePolicyName.

            +optional'
      description: Represents a vSphere volume resource.
    v1SecretEnvSource:
      type: object
      properties:
        localObjectReference:
          $ref: '#/components/schemas/v1LocalObjectReference'
        optional:
          type: boolean
          title: 'Specify whether the Secret must be defined

            +optional'
      description: 'SecretEnvSource selects a Secret to populate the environment

        variables with.


        The contents of the target Secret''s Data field will represent the

        key-value pairs as environment variables.'
    v1ContainerPort:
      type: object
      properties:
        name:
          type: string
          title: 'If specified, this must be an IANA_SVC_NAME and unique within the pod. Each

            named port in a pod must have a unique name. Name for the port that can be

            referred to by services.

            +optional'
        hostPort:
          type: integer
          format: int32
          title: 'Number of port to expose on the host.

            If specified, this must be a valid port number, 0 < x < 65536.

            If HostNetwork is specified, this must match ContainerPort.

            Most containers do not need this.

            +optional'
        containerPort:
          type: integer
          format: int32
          description: 'Number of port to expose on the pod''s IP address.

            This must be a valid port number, 0 < x < 65536.'
        protocol:
          type: string
          title: 'Protocol for port. Must be UDP, TCP, or SCTP.

            Defaults to "TCP".

            +optional

            +default="TCP"'
        hostIP:
          type: string
          title: 'What host IP to bind the external port to.

            +optional'
      description: ContainerPort represents a network port in a single container.
    v1GlusterfsVolumeSource:
      type: object
      properties:
        endpoints:
          type: string
          description: endpoints is the endpoint name that details Glusterfs topology.
        path:
          type: string
          title: 'path is the Glusterfs volume path.

            More info: https://examples.k8s.io/volumes/glusterfs/README.md#create-a-pod'
        readOnly:
          type: boolean
          title: 'readOnly here will force the Glusterfs volume to be mounted with read-only permissions.

            Defaults to false.

            More info: https://examples.k8s.io/volumes/glusterfs/README.md#create-a-pod

            +optional'
      description: 'Represents a Glusterfs mount that lasts the lifetime of a pod.

        Glusterfs volumes do not support ownership management or SELinux relabeling.'
    v1LabelSelectorRequirement:
      type: object
      properties:
        key:
          type: string
          description: key is the label key that the selector applies to.
        operator:
          type: string
          description: 'operator represents a key''s relationship to a set of values.

            Valid operators are In, NotIn, Exists and DoesNotExist.'
        values:
          type: array
          items:
            type: string
          title: 'values is an array of string values. If the operator is In or NotIn,

            the values array must be non-empty. If the operator is Exists or DoesNotExist,

            the values array must be empty. This array is replaced during a strategic

            merge patch.

            +optional

            +listType=atomic'
      description: 'A label selector requirement is a selector that contains values, a key, and an operator that

        relates the key and values.'
    v1AWSElasticBlockStoreVolumeSource:
      type: object
      properties:
        volumeID:
          type: string
          title: 'volumeID is unique ID of the persistent disk resource in AWS (Amazon EBS volume).

            More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore'
        fsType:
          type: string
          title: 'fsType is the filesystem type of the volume that you want to mount.

            Tip: Ensure that the filesystem type is supported by the host operating system.

            Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore

            TODO: how do we prevent errors in the filesystem from compromising the machine

            +optional'
        partition:
          type: integer
          format: int32
          title: 'partition is the partition in the volume that you want to mount.

            If omitted, the default is to mount by volume name.

            Examples: For volume /dev/sda1, you specify the partition as "1".

            Similarly, the volume partition for /dev/sda is "0" (or you can leave the property empty).

            +optional'
        readOnly:
          type: boolean
          title: 'readOnly value true will force the readOnly setting in VolumeMounts.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore

            +optional'
      description: 'Represents a Persistent Disk resource in AWS.


        An AWS EBS disk must exist before mounting to a container. The disk

        must also be in the same AWS zone as the kubelet. An AWS EBS disk

        can only be mounted as read/write once. AWS EBS volumes support

        ownership management and SELinux relabeling.'
    v1ObjectMeta:
      type: object
      properties:
        name:
          type: string
          title: 'Name must be unique within a namespace. Is required when creating resources, although

            some resources may allow a client to request the generation of an appropriate name

            automatically. Name is primarily intended for creation idempotence and configuration

            definition.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names

            +optional'
        generateName:
          type: string
          description: 'GenerateName is an optional prefix, used by the server, to generate a unique

            name ONLY IF the Name field has not been provided.

            If this field is used, the name returned to the client will be different

            than the name passed. This value will also be combined with a unique suffix.

            The provided value has the same validation rules as the Name field,

            and may be truncated by the length of the suffix required to make the value

            unique on the server.


            If this field is specified and the generated name exists, the server will return a 409.


            Applied only if Name is not specified.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#idempotency

            +optional'
        namespace:
          type: string
          description: 'Namespace defines the space within which each name must be unique. An empty namespace is

            equivalent to the "default" namespace, but "default" is the canonical representation.

            Not all objects are required to be scoped to a namespace - the value of this field for

            those objects will be empty.


            Must be a DNS_LABEL.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces

            +optional'
        selfLink:
          type: string
          title: 'Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.

            +optional'
        uid:
          type: string
          description: 'UID is the unique in time and space value for this object. It is typically generated by

            the server on successful creation of a resource and is not allowed to change on PUT

            operations.


            Populated by the system.

            Read-only.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#uids

            +optional'
        resourceVersion:
          type: string
          description: 'An opaque value that represents the internal version of this object that can

            be used by clients to determine when objects have changed. May be used for optimistic

            concurrency, change detection, and the watch operation on a resource or set of resources.

            Clients must treat these values as opaque and passed unmodified back to the server.

            They may only be valid for a particular resource or set of resources.


            Populated by the system.

            Read-only.

            Value must be treated as opaque by clients and .

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency

            +optional'
        generation:
          type: string
          format: int64
          title: 'A sequence number representing a specific generation of the desired state.

            Populated by the system. Read-only.

            +optional'
        creationTimestamp:
          $ref: '#/components/schemas/v1Time'
        deletionTimestamp:
          $ref: '#/components/schemas/v1Time'
        deletionGracePeriodSeconds:
          type: string
          format: int64
          title: 'Number of seconds allowed for this object to gracefully terminate before

            it will be removed from the system. Only set when deletionTimestamp is also set.

            May only be shortened.

            Read-only.

            +optional'
        labels:
          type: object
          additionalProperties:
            type: string
          title: 'Map of string keys and values that can be used to organize and categorize

            (scope and select) objects. May match selectors of replication controllers

            and services.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels

            +optional'
        annotations:
          type: object
          additionalProperties:
            type: string
          title: 'Annotations is an unstructured key value map stored with a resource that may be

            set by external tools to store and retrieve arbitrary metadata. They are not

            queryable and should be preserved when modifying objects.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations

            +optional'
        ownerReferences:
          type: array
          items:
            $ref: '#/components/schemas/v1OwnerReference'
          title: 'List of objects depended by this object. If ALL objects in the list have

            been deleted, this object will be garbage collected. If this object is managed by a controller,

            then an entry in this list will point to this controller, with the controller field set to true.

            There cannot be more than one managing controller.

            +optional

            +patchMergeKey=uid

            +patchStrategy=merge

            +listType=map

            +listMapKey=uid'
        finalizers:
          type: array
          items:
            type: string
          title: 'Must be empty before the object is deleted from the registry. Each entry

            is an identifier for the responsible component that will remove the entry

            from the list. If the deletionTimestamp of the object is non-nil, entries

            in this list can only be removed.

            Finalizers may be processed and removed in any order.  Order is NOT enforced

            because it introduces significant risk of stuck finalizers.

            finalizers is a shared field, any actor with permission can reorder it.

            If the finalizer list is processed in order, then this can lead to a situation

            in which the component responsible for the first finalizer in the list is

            waiting for a signal (field value, external system, or other) produced by a

            component responsible for a finalizer later in the list, resulting in a deadlock.

            Without enforced ordering finalizers are free to order amongst themselves and

            are not vulnerable to ordering changes in the list.

            +optional

            +patchStrategy=merge

            +listType=set'
        managedFields:
          type: array
          items:
            $ref: '#/components/schemas/v1ManagedFieldsEntry'
          description: 'ManagedFields maps workflow-id and version to the set of fields

            that are managed by that workflow. This is mostly for internal

            housekeeping, and users typically shouldn''t need to set or

            understand this field. A workflow can be the user''s name, a

            controller''s name, or the name of a specific apply path like

            "ci-cd". The set of fields is always in the version that the

            workflow used when modifying the object.


            +optional

            +listType=atomic'
      description: 'ObjectMeta is metadata that all persisted resources must have, which includes all objects

        users must create.'
    v1HostPathVolumeSource:
      type: object
      properties:
        path:
          type: string
          title: 'path of the directory on the host.

            If the path is a symlink, it will follow the link to the real path.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#hostpath'
        type:
          type: string
          title: 'type for HostPath Volume

            Defaults to ""

            More info: https://kubernetes.io/docs/concepts/storage/volumes#hostpath

