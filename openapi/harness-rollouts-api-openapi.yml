    v1EnvFromSource:
      type: object
      properties:
        prefix:
          type: string
          title: 'Optional text to prepend to the name of each environment variable.

            May consist of any printable ASCII characters except ''=''.

            +optional'
        configMapRef:
          $ref: '#/components/schemas/v1ConfigMapEnvSource'
        secretRef:
          $ref: '#/components/schemas/v1SecretEnvSource'
      title: EnvFromSource represents the source of a set of ConfigMaps or Secrets
    v1EphemeralContainer:
      type: object
      properties:
        ephemeralContainerCommon:
          $ref: '#/components/schemas/v1EphemeralContainerCommon'
        targetContainerName:
          type: string
          description: 'If set, the name of the container from PodSpec that this ephemeral container targets.

            The ephemeral container will be run in the namespaces (IPC, PID, etc) of this container.

            If not set then the ephemeral container uses the namespaces configured in the Pod spec.


            The container runtime must implement support for this feature. If the runtime does not

            support namespace targeting then the result of setting this field is undefined.

            +optional'
      description: 'An EphemeralContainer is a temporary container that you may add to an existing Pod for

        user-initiated activities such as debugging. Ephemeral containers have no resource or

        scheduling guarantees, and they will not be restarted when they exit or when a Pod is

        removed or restarted. The kubelet may evict a Pod if an ephemeral container causes the

        Pod to exceed its resource allocation.


        To add an ephemeral container, use the ephemeralcontainers subresource of an existing

        Pod. Ephemeral containers may not be removed or restarted.'
    v1QuobyteVolumeSource:
      type: object
      properties:
        registry:
          type: string
          title: 'registry represents a single or multiple Quobyte Registry services

            specified as a string as host:port pair (multiple entries are separated with commas)

            which acts as the central registry for volumes'
        volume:
          type: string
          description: volume is a string that references an already created Quobyte volume by name.
        readOnly:
          type: boolean
          title: 'readOnly here will force the Quobyte volume to be mounted with read-only permissions.

            Defaults to false.

            +optional'
        user:
          type: string
          title: 'user to map volume access to

            Defaults to serivceaccount user

            +optional'
        group:
          type: string
          title: 'group to map volume access to

            Default is no group

            +optional'
        tenant:
          type: string
          title: 'tenant owning the given Quobyte volume in the Backend

            Used with dynamically provisioned Quobyte volumes, value is set by the plugin

            +optional'
      description: 'Represents a Quobyte mount that lasts the lifetime of a pod.

        Quobyte volumes do not support ownership management or SELinux relabeling.'
    v1PodSchedulingGate:
      type: object
      properties:
        name:
          type: string
          description: 'Name of the scheduling gate.

            Each scheduling gate must have a unique name field.'
      description: PodSchedulingGate is associated to a Pod to guard its scheduling.
    v1CanaryStep:
      type: object
