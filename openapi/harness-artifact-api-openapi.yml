      title: ArtifactDeploymentViewResponse
      x-stoplight:
        id: jugz9izzxuuvo
      type: object
      properties:
        env_id:
          type: string
          description: Harness environment id
        env_name:
          type: string
          description: Environment name
        env_type:
          type: string
          enum:
          - PROD
          - NONPROD
          description: Environment type
        pipeline_id:
          type: string
