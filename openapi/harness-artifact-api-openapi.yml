openapi: 3.2.0
info:
  title: Harness Artifact API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Artifact
paths:
  /v1/org/{org}/project/{project}/artifacts:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    post:
      summary: List All Artifacts
      operationId: listArtifacts
      responses:
        '200':
          $ref: '#/components/responses/ArtifactListingResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      tags:
      - Artifact
      description: List all artifacts
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Order2'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          enum:
          - name
          - updated
          default: name
      security:
      - x-api-key: []
      requestBody:
        $ref: '#/components/requestBodies/ArtifactListingRequestBody'
      x-stoplight:
        id: sfjqaglg433tw
  /v1/org/{org}/project/{project}/grouped-artifacts:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    post:
      summary: List All Artifacts
      operationId: listLatestArtifacts
      responses:
        '200':
          $ref: '#/components/responses/ArtifactListingResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      tags:
      - Artifact
      description: List latest version of all artifacts
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Order2'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          enum:
          - name
          - updated
          default: name
      security:
      - x-api-key: []
      x-stoplight:
        id: uhn8ew9xe1j4g
  /v1/org/{org}/project/{project}/artifact/{artifact}/tag/{tag}/components:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/Artifact'
    - $ref: '#/components/parameters/Tag'
    post:
      summary: Artifact Detail Component View
      operationId: getArtifactDetailComponentView
      responses:
        '200':
          $ref: '#/components/responses/ArtifactComponentViewResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      tags:
      - Artifact
      description: Get artifact detail component view
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Order2'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          enum:
          - package_name
          - package_supplier
          default: package_name
      security:
      - x-api-key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactComponentViewRequestBody'
      x-stoplight:
        id: iee2ipp3sstch
  /v1/org/{org}/project/{project}/artifact/{artifact}/tag/{tag}/deployments:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/Artifact'
    - $ref: '#/components/parameters/Tag'
    post:
      summary: Artifact Detail Deployment View
      operationId: getArtifactDetailDeploymentView
      responses:
        '200':
          $ref: '#/components/responses/ArtifactDeploymentViewResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
        default:
          $ref: '#/components/responses/ArtifactDeploymentViewResponseBody'
      tags:
      - Artifact
      description: Get artifact detail deployment view
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Order2'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          enum:
          - env_name
          - env_type
          default: env_name
      security:
      - x-api-key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactDeploymentViewRequestBody'
        description: ''
      x-stoplight:
        id: 8ivdhaqr6wnc0
  /v1/org/{org}/project/{project}/artifact/{artifact}/tag/{tag}/details:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/Artifact'
    - $ref: '#/components/parameters/Tag'
    get:
      summary: Artifact Details
      operationId: getArtifactDetails
      responses:
        '200':
          $ref: '#/components/responses/ArtifactDetailResponseBody'
        '201':
          description: Created
        '400':
          description: Bad Request
      description: Get artifact details
      security:
      - x-api-key: []
      tags:
      - Artifact
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      x-stoplight:
        id: sq6emrti1dnvu
components:
  schemas:
    ArtifactComponentViewResponse:
      title: ArtifactComponentViewResponse
      x-stoplight:
        id: ifxc5m0lb9u32
      type: object
      properties:
        package_name:
          type: string
        package_version:
          type: string
        package_supplier:
          type: string
        package_manager:
          type: string
        purl:
          type: string
        package_license:
          type: string
        filter_tags:
          type: array
          x-stoplight:
            id: disrwjq6ou28k
          items:
            $ref: '#/components/schemas/LayerType'
    Operator:
      title: Operator
      x-stoplight:
        id: nxhoa45ajna2q
      enum:
      - Equals
      - StartsWith
      - Contains
      - NotEquals
      - GreaterThan
      - GreaterThanEquals
      - LessThan
      - LessThanEquals
    ArtifactComponentViewRequestBody:
      title: ArtifactComponentViewRequestBody
      x-stoplight:
        id: x5f2v20n46hkz
      type: object
      properties:
        component_filter:
          type: array
          items:
            $ref: '#/components/schemas/ComponentFilter'
        license_filter:
          $ref: '#/components/schemas/LicenseFilter'
        package_supplier:
          type: string
        package_manager:
          type: string
        image_layer:
          $ref: '#/components/schemas/LayerType'
    ArtifactListingRequestBody:
      type: object
      x-examples: {}
      properties:
        search_term:
          type: string
        component_filter:
          type: array
          items:
            $ref: '#/components/schemas/ComponentFilter'
        license_filter:
          $ref: '#/components/schemas/LicenseFilter'
        policy_violation:
          type: string
          enum:
          - ALLOW
          - DENY
          - ANY
          - NONE
        environment_type:
          type: string
          enum:
          - Prod
          - NonProd
          - None
          - All
      x-stoplight:
        id: 9ddio8k8n5fia
    ArtifactDetailResponse:
      title: ArtifactDetailResponse
      type: object
      x-examples: {}
      x-stoplight:
        id: px56xa89l9myy
      properties:
        id:
          type: string
          description: Artifact Identifier
        name:
          type: string
          description: Name of the artifact
        url:
          type: string
          description: Registry url of the artifact
        tag:
          type: string
          description: Version of the artifact
        components_count:
          type: integer
          description: Count of the normalized components within the artifact
        updated:
          type: string
          description: Last Updated time of artifact
        prod_env_count:
          type: integer
          description: Count of production env in which artifact is deployed
        non_prod_env_count:
          type: integer
          description: Count of pre-production env in which artifact is deploye
        build_pipeline_id:
          type: string
          description: Pipeline id of build pipeline used to orchestrate the artifact
        build_pipeline_name:
          type: string
          x-stoplight:
            id: rswo3za1467x2
          description: Pipeline name of build pipeline used to orchestrate the artifact
        build_pipeline_execution_id:
          type: string
          description: Pipeline execution id of build pipeline used to orchestrate the artifact
        orchestration_id:
          type: string
          description: Orchestration step identifier
        scorecard:
          type: object
          x-stoplight:
            id: m4r1asknhuioj
          properties:
            max_score:
              type: string
              x-stoplight:
                id: a3gfc89dp2mv9
            avg_score:
              type: string
              x-stoplight:
                id: ukdzx8upko3wt
        metadata:
          type: object
          additionalProperties: true
        sto_issue_count:
          $ref: '#/components/schemas/StoIssueCount'
      required:
      - id
      - name
      - tag
    PipelineDetails:
      title: PipelineDetails
      x-stoplight:
        id: rr6hfyn7yqya8
      type: object
      properties:
        org_id:
          type: string
          x-stoplight:
            id: tevm6bc13y3hi
          description: Organisation where pipeline is present.
        project_id:
          type: string
          x-stoplight:
            id: 7s1mu1n1dan0s
          description: Project where pipeline is present.
        name:
          type: string
          x-stoplight:
            id: dl352mt8yqdxt
          description: Name of the pipeline.
        execution_id:
          type: string
          x-stoplight:
            id: tevm6bc13y3hi
          description: Execution Id of the pipeline.
        id:
          type: string
          x-stoplight:
            id: 7s1mu1n1dan0s
          description: Id of the pipeline.
        triggered_by:
          type: string
          description: Name of who trigger the deployment pipeline
        triggered_by_id:
          type: string
          description: Id of who trigger the deployment pipeline
        triggered_at:
          type:
          - integer
          - 'null'
          description: Time of trigger of the deployment pipeline
          format: int64
        triggered_type:
          type: string
          description: Trigger type of the deployment pipeline
        status:
          type: string
          x-stoplight:
            id: qqz5h836cnx8e
          enum:
          - PASSED
          - FAILED
          - UNKNOWN
        stage_execution_id:
          type: string
          x-stoplight:
            id: 68i7ms2hxjctl
          description: Execution Id for the Stage
        step_execution_id:
          type: string
          x-stoplight:
            id: 22ha61i5fiwzc
          description: Execution Id for the step
        stage_type:
          type: string
          x-stoplight:
            id: 22ha61i5fiwzc
          description: Stage type in which the step executed
          enum:
          - BUILD
          - DEPLOY
          - SECURITY
    LicenseFilter:
      title: LicenseFilter
      type: object
      properties:
        value:
          type: string
        operator:
          $ref: '#/components/schemas/Operator'
      required:
      - value
      - operator
      x-stoplight:
        id: ae7ieb3d1qze1
    Slsa:
      title: Slsa
      x-stoplight:
        id: ay4nzhxmkraca
      type: object
      description: Slsa Verification Data
      properties:
        provenance:
          type: string
          x-stoplight:
            id: yyy7o9vx6ht3f
          description: Slsa provenance data
        policy_outcome_status:
          type: string
          x-stoplight:
            id: rany3wjtgl60e
          description: Slsa policy outcome
    ArtifactDeploymentViewRequestBody:
      title: ArtifactDeploymentViewRequestBody
      x-stoplight:
        id: 5qyutfccgf2o9
      type: object
      properties:
        environment:
          type: string
        environment_type:
          type: string
          enum:
          - Prod
          - NonProd
        policy_violation:
          type: string
          enum:
          - ALLOW
          - DENY
          - ANY
          - NONE
    ComponentFilter:
      title: ComponentFilter
      type: object
      properties:
        field_name:
          type: string
          enum:
          - ComponentVersion
          - ComponentName
        value:
          type: string
        operator:
          $ref: '#/components/schemas/Operator'
      required:
      - field_name
      - value
      - operator
      x-stoplight:
        id: p0u8koyls0i0c
    LayerType:
      title: LayerType
      enum:
      - BASE
      - APP
      - DISTRO
      x-stoplight:
        id: 151c5cf8ekave
    ArtifactListingResponse:
      title: ArtifactListingResponse
      x-stoplight:
        id: ffkyhbx1mpa93
      type: object
      x-examples: {}
      required:
      - id
      - name
      - tag
      properties:
        id:
          type: string
        name:
          type: string
        tag:
          type: string
        url:
          type: string
        components_count:
          type: integer
        allow_list_violation_count:
          type: string
        deny_list_violation_count:
          type: string
        activity:
          type: string
          enum:
          - DEPLOYED
          - GENERATED
        updated:
          type: string
        prod_env_count:
          type: integer
        non_prod_env_count:
          type: integer
        enforcement_id:
          type: string
        orchestration_id:
          type: string
        build_pipeline_id:
          type: string
        build_pipeline_execution_id:
          type: string
        baseline:
          type: boolean
          x-stoplight:
            id: bhdfxt2zo1ccg
        metadata:
          type: object
          additionalProperties: true
        scorecard:
          type: object
          x-stoplight:
            id: 7cnufejjvh2xb
          properties:
            max_score:
              type: string
              x-stoplight:
                id: 8rfm461fllni5
            avg_score:
              type: string
              x-stoplight:
                id: rloj7ie5t1u6x
    StoIssueCount:
      title: StoIssueCount
      x-stoplight:
        id: f6ujzuy4ee24s
