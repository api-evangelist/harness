openapi: 3.2.0
info:
  title: Harness Application Set API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: ApplicationSet
paths:
  /gitops/api/v1/applicationset:
    post:
      summary: Update updates an applicationset
      description: Update applicationset.
      operationId: ApplicationSetService_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1ApplicationSet'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: query
        required: false
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/applicationsApplicationSetCreateRequest'
      tags:
      - ApplicationSet
    put:
      summary: Update updates an applicationset
      description: Update existing applicationset.
      operationId: ApplicationSetService_Update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1ApplicationSet'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: query
        required: false
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/applicationsApplicationSetCreateRequest'
      tags:
      - ApplicationSet
  /gitops/api/v1/applicationset/generate:
    post:
      summary: Generate child applications from application set
      description: Generate child applications from application set.
      operationId: ApplicationSetService_Generate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationsApplicationSetGenerateResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: query
        required: false
        schema:
          type: string
      - name: createProject
        description: If project not specified and createProject is true, create project if it does not exist.
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applicationsApplicationSetGenerateRequest'
        required: true
      tags:
      - ApplicationSet
  /gitops/api/v1/applicationset/generators:
    get:
      summary: List applicationset generators
      operationId: ApplicationSetService_ListApplicationSetGenerators
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ApplicationSetGeneratorList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      tags:
      - ApplicationSet
  /gitops/api/v1/applicationset/generators/{type}:
    get:
      summary: Get applicationset generator
      operationId: ApplicationSetService_GetApplicationSetGenerator
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - GENERATOR_TYPE_NOT_SET
          - LIST
          - CLUSTERS
          - GIT
          - SCM_PROVIDER_GITHUB
          - SCM_PROVIDER_GITLAB
          - SCM_PROVIDER_GITEA
          - SCM_PROVIDER_BITBUCKET
          - SCM_PROVIDER_AZURE
          - SCM_PROVIDER_BITBUCKET_CLOUD
          - SCM_PROVIDER_AWS_CODE_COMMIT
          - DUCK_TYPE
          - PULL_REQUEST_GITHUB
          - PULL_REQUEST_GITLAB
          - PULL_REQUEST_GITEA
          - PULL_REQUEST_BITBUCKET
          - PULL_REQUEST_BITBUCKET_CLOUD
          - PULL_REQUEST_AZURE
          - MATRIX
          - MERGE
          - PLUGIN
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: query
        required: false
        schema:
          type: string
      tags:
      - ApplicationSet
  /gitops/api/v1/applicationset/templates/{type}:
    get:
      summary: Get applicationset template
      operationId: ApplicationSetService_GetApplicationSetTemplate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - GENERATOR_TYPE_NOT_SET
          - LIST
          - CLUSTERS
          - GIT
          - SCM_PROVIDER_GITHUB
          - SCM_PROVIDER_GITLAB
          - SCM_PROVIDER_GITEA
          - SCM_PROVIDER_BITBUCKET
          - SCM_PROVIDER_AZURE
          - SCM_PROVIDER_BITBUCKET_CLOUD
          - SCM_PROVIDER_AWS_CODE_COMMIT
          - DUCK_TYPE
          - PULL_REQUEST_GITHUB
          - PULL_REQUEST_GITLAB
          - PULL_REQUEST_GITEA
          - PULL_REQUEST_BITBUCKET
          - PULL_REQUEST_BITBUCKET_CLOUD
          - PULL_REQUEST_AZURE
          - MATRIX
          - MERGE
          - PLUGIN
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: query
        required: false
        schema:
          type: string
      tags:
      - ApplicationSet
  /gitops/api/v1/applicationset/{identifier}:
    get:
      summary: Get applicationset
      description: Returns an applicationset by identifier.
      operationId: ApplicationSetService_Get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1ApplicationSet'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: identifier
        description: UUID for the Application Set.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: query
        required: false
        schema:
          type: string
      - name: fetchMode
        description: Fetch mode for the entity.
        in: query
        required: false
        schema:
          type: string
          enum:
          - NOT_SET
          - LIVE
          - CACHED
          default: NOT_SET
      tags:
      - ApplicationSet
    delete:
      summary: Delete applicationset by id
      description: Delete applicationset.
      operationId: ApplicationSetService_Delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationsApplicationSetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: identifier
        description: UUID for the Application Set.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: query
        required: false
        schema:
          type: string
      tags:
      - ApplicationSet
  /gitops/api/v1/applicationset/{identifier}/resource-tree:
    get:
      summary: ResourceTree returns resource tree
      operationId: ApplicationSetService_ResourceTree
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applicationsApplicationSetTree'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      parameters:
      - name: identifier
        description: UUID for the Application Set.
        in: path
        required: true
        schema:
          type: string
      - name: accountIdentifier
        description: Account Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: orgIdentifier
        description: Organization Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: projectIdentifier
        description: Project Identifier for the Entity.
        in: query
        required: false
        schema:
          type: string
      - name: agentIdentifier
        description: Agent identifier for entity.
        in: query
        required: false
        schema:
          type: string
      - name: query.name
        in: query
        required: false
        schema:
          type: string
      - name: query.appsetNamespace
        description: The application set namespace. Default empty is argocd control plane namespace.
        in: query
        required: false
        schema:
          type: string
      tags:
      - ApplicationSet
  /gitops/api/v1/applicationsets:
    post:
      summary: List applicationsets
      operationId: ApplicationSetService_List
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servicev1ApplicationSetList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayruntimeError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ApplicationSetQuery'
        required: true
      tags:
      - ApplicationSet
components:
  schemas:
    applicationsBackoff:
      type: object
      properties:
        duration:
          type: string
          title: Duration is the amount to back off. Default unit is seconds, but could also be a duration (e.g. "2m", "1h")
        factor:
          type: string
          format: int64
          title: Factor is a factor to multiply the base duration after each failed retry
        maxDuration:
          type: string
          title: MaxDuration is the maximum amount of time allowed for the backoff strategy
      title: Backoff is the backoff strategy to use on subsequent retries for failing syncs
    applicationsSCMProviderGeneratorBitbucketServer:
      type: object
      properties:
        project:
          type: string
          description: Project to scan. Required.
        api:
          type: string
          description: The Bitbucket Server REST API URL to talk to. Required.
        basicAuth:
          $ref: '#/components/schemas/applicationsBasicAuthBitbucketServer'
        allBranches:
          type: boolean
          description: Scan all branches instead of just the default branch.
        bearerToken:
          $ref: '#/components/schemas/applicationsBearerTokenBitbucket'
        insecure:
          type: boolean
          title: 'Allow self-signed TLS / Certificates; default: false'
        caRef:
          $ref: '#/components/schemas/applicationsConfigMapKeyRef'
      description: SCMProviderGeneratorBitbucketServer defines connection info specific to Bitbucket Server.
    applicationsApplicationSetCondition:
      type: object
      properties:
        type:
          type: string
          title: Type is an applicationset condition type
        message:
          type: string
          title: Message contains human-readable message indicating details about condition
        lastTransitionTime:
          $ref: '#/components/schemas/v1Time'
        status:
          type: string
          title: True/False/Unknown
        reason:
          type: string
          title: Single word camelcase representing the reason for the status eg ErrorOccurred
      title: ApplicationSetCondition contains details about an applicationset condition, which is usually an error or warning
    applicationsKustomizePatch:
      type: object
      properties:
        path:
          type: string
        patch:
          type: string
        target:
          $ref: '#/components/schemas/applicationsKustomizeSelector'
        options:
          type: object
          additionalProperties:
            type: boolean
    applicationsHelmParameter:
      type: object
      properties:
        name:
          type: string
          title: Name is the name of the Helm parameter
        value:
          type: string
          title: Value is the value for the Helm parameter
        forceString:
          type: boolean
          title: ForceString determines whether to tell Helm to interpret booleans and numbers as strings
      title: HelmParameter is a parameter that's passed to helm template during manifest generation
    applicationsSCMProviderGeneratorAWSCodeCommit:
      type: object
      properties:
        tagFilters:
          type: array
          items:
            $ref: '#/components/schemas/applicationsTagFilter'
          title: TagFilters provides the tag filter(s) for repo discovery
        role:
          type: string
          description: 'Role provides the AWS IAM role to assume, for cross-account repo discovery

            if not provided, AppSet controller will use its pod/node identity to discover.'
        region:
          type: string
          description: 'Region provides the AWS region to discover repos.

            if not provided, AppSet controller will infer the current region from environment.'
        allBranches:
          type: boolean
          description: Scan all branches instead of just the default branch.
      description: SCMProviderGeneratorAWSCodeCommit defines connection info specific to AWS CodeCommit.
    applicationsSCMProviderGeneratorGithub:
      type: object
      properties:
        organization:
          type: string
          description: GitHub org to scan. Required.
        api:
          type: string
          description: The GitHub API URL to talk to. If blank, use https://api.github.com/.
        tokenRef:
          $ref: '#/components/schemas/applicationsSecretRef'
        appSecretName:
          type: string
          description: AppSecretName is a reference to a GitHub App repo-creds secret.
        allBranches:
          type: boolean
          description: Scan all branches instead of just the default branch.
      description: SCMProviderGeneratorGithub defines connection info specific to GitHub.
    servicev1ApplicationSetList:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/servicev1ApplicationSet'
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
        pageItemCount:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        pageIndex:
          type: integer
          format: int32
        empty:
          type: boolean
    applicationsSCMProviderGeneratorGitlab:
      type: object
      properties:
        group:
          type: string
          description: Gitlab group to scan. Required.  You can use either the project id (recommended) or the full namespaced path.
        includeSubgroups:
          type: boolean
          title: Recurse through subgroups (true) or scan only the base group (false).  Defaults to "false"
        api:
          type: string
          description: The Gitlab API URL to talk to.
        tokenRef:
          $ref: '#/components/schemas/applicationsSecretRef'
        allBranches:
          type: boolean
          description: Scan all branches instead of just the default branch.
        insecure:
          type: boolean
          title: 'Skips validating the SCM provider''s TLS certificate - useful for self-signed certificates.; default: false'
        includeSharedProjects:
          type: boolean
          title: When recursing through subgroups, also include shared Projects (true) or scan only the subgroups under same path (false).  Defaults to "true"
        topic:
          type: string
          description: Filter repos list based on Gitlab Topic.
        caRef:
          $ref: '#/components/schemas/applicationsConfigMapKeyRef'
      description: SCMProviderGeneratorGitlab defines connection info specific to Gitlab.
    applicationsPluginInput:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/v1JSON'
          description: 'Parameters contains the information to pass to the plugin. It is a map. The keys must be strings, and the

            values can be any type.'
    v1ManagedFieldsEntry:
      type: object
      properties:
        manager:
          type: string
          description: Manager is an identifier of the workflow managing these fields.
        operation:
          type: string
          description: 'Operation is the type of operation which lead to this ManagedFieldsEntry being created.

            The only valid values for this field are ''Apply'' and ''Update''.'
        apiVersion:
          type: string
          description: 'APIVersion defines the version of this resource that this field set

            applies to. The format is "group/version" just like the top-level

            APIVersion field. It is necessary to track the version of a field

            set because it cannot be automatically converted.'
        time:
          $ref: '#/components/schemas/v1Time'
        fieldsType:
          type: string
          title: 'FieldsType is the discriminator for the different fields format and version.

            There is currently only one possible value: "FieldsV1"'
        fieldsV1:
          $ref: '#/components/schemas/v1FieldsV1'
        subresource:
          type: string
          description: 'Subresource is the name of the subresource used to update that object, or

            empty string if the object was updated through the main resource. The

            value of this field is used to distinguish between managers, even if they

            share the same name. For example, a status update will be distinct from a

            regular update using the same manager name.

            Note that the APIVersion field is not related to the Subresource field and

            it always corresponds to the version of the main resource.'
      description: 'ManagedFieldsEntry is a workflow-id, a FieldSet and the group version of the resource

        that the fieldset applies to.'
    applicationsResourceResult:
      type: object
      properties:
        group:
          type: string
          title: Group specifies the API group of the resource
        version:
          type: string
          title: Version specifies the API version of the resource
        kind:
          type: string
          title: Kind specifies the API kind of the resource
        namespace:
          type: string
          title: Namespace specifies the target namespace of the resource
        name:
          type: string
          title: Name specifies the name of the resource
        status:
          type: string
          title: Status holds the final result of the sync. Will be empty if the resources is yet to be applied/pruned and is always zero-value for hooks
        message:
          type: string
          title: Message contains an informational or error message for the last sync OR operation
        hookType:
          type: string
          title: HookType specifies the type of the hook. Empty for non-hook resources
        hookPhase:
          type: string
          description: 'HookPhase contains the state of any operation associated with this resource OR hook

            This can also contain values for non-hook resources.'
        syncPhase:
          type: string
          title: SyncPhase indicates the particular phase of the sync that this result was acquired in
        images:
          type: array
          items:
            type: string
          title: Images contains the images related to the ResourceResult
      title: ResourceResult holds the operation result details of a specific resource
    applicationsTagFilter:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    applicationsMergeGenerator:
      type: object
      properties:
        generators:
          type: array
          items:
            $ref: '#/components/schemas/applicationsApplicationSetNestedGenerator'
        mergeKeys:
          type: array
          items:
            type: string
        template:
          $ref: '#/components/schemas/applicationsApplicationSetTemplate'
      description: 'MergeGenerator merges the output of two or more generators. Where the values for all specified merge keys are equal

        between two sets of generated parameters, the parameter sets will be merged with the parameters from the latter

        generator taking precedence. Parameter sets with merge keys not present in the base generator''s params will be

        ignored.

        For example, if the first generator produced [{a: ''1'', b: ''2''}, {c: ''1'', d: ''1''}] and the second generator produced

        [{''a'': ''override''}], the united parameters for merge keys = [''a''] would be

        [{a: ''override'', b: ''1''}, {c: ''1'', d: ''1''}].


        MergeGenerator supports template overriding. If a MergeGenerator is one of multiple top-level generators, its

        template will be merged with the top-level generator before the parameters are applied.'
    applicationsApplicationDestination:
      type: object
      properties:
        server:
          type: string
          title: Server specifies the URL of the target cluster and must be set to the Kubernetes control plane API
        namespace:
          type: string
          title: 'Namespace specifies the target namespace for the application''s resources.

            The namespace will only be set for namespace-scoped resources that have not set a value for .metadata.namespace'
        name:
          type: string
          title: Name is an alternate way of specifying the target cluster by its symbolic name
      title: ApplicationDestination holds information about the application's destination
    applicationsAppHealthStatus:
      type: object
      properties:
        status:
          type: string
          title: Status holds the status code of the application
        message:
          type: string
          description: 'Deprecated: this field is not used and will be removed in a future release.'
          title: Message is a human-readable informational message describing the health status
        lastTransitionTime:
          $ref: '#/components/schemas/v1Time'
      title: AppHealthStatus contains information about the currently observed health state of an application
    applicationsSyncOperationResource:
      type: object
      properties:
        group:
          type: string
        kind:
          type: string
        name:
          type: string
        namespace:
          type: string
      description: SyncOperationResource contains resources to sync.
    applicationsComparedTo:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/applicationsApplicationSource'
        destination:
          $ref: '#/components/schemas/applicationsApplicationDestination'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/applicationsApplicationSource'
          title: Sources is a reference to the application's multiple sources used for comparison
        ignoreDifferences:
          type: array
          items:
            $ref: '#/components/schemas/applicationsResourceIgnoreDifferences'
          title: IgnoreDifferences is a reference to the application's ignored differences used for comparison
      title: ComparedTo contains application source and target which was used for resources comparison
    applicationsApplicationSetResponse:
      type: object
      properties:
        project:
          type: string
        applicationset:
          $ref: '#/components/schemas/applicationsApplicationSet'
    applicationsApplicationSourcePluginParameter:
      type: object
      properties:
        name:
          type: string
          description: Name is the name identifying a parameter.
        string:
          type: string
          description: String_ is the value of a string type parameter.
        map:
          $ref: '#/components/schemas/applicationsOptionalMap'
        array:
          $ref: '#/components/schemas/applicationsOptionalArray'
    applicationsApplicationStatus:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/applicationsResourceStatus'
          title: Resources is a list of Kubernetes resources managed by this application
        sync:
          $ref: '#/components/schemas/applicationsSyncStatus'
        health:
          $ref: '#/components/schemas/applicationsAppHealthStatus'
        history:
          type: array
          items:
            $ref: '#/components/schemas/applicationsRevisionHistory'
          title: History contains information about the application's sync history
        conditions:
          type: array
          items:
