      required:
      - metricIdentifier
      - metricName
      type: object
      properties:
        metricIdentifier:
          type: string
          description: Unique metric identifier for the unit metric
        metricName:
          type: string
          description: Display name of the unit metric
        labels:
          type: object
          additionalProperties:
            type: string
            description: Optional key-value labels for the unit metric (e.g. manager, team). At most 128 entries; each key and each value may be at most 256 characters. On update, omit this field or send null to leave existing labels unchanged; send an empty object {} to remove all labels.
            example: '{"manager":"kiran"}'
          description: Optional key-value labels for the unit metric (e.g. manager, team). At most 128 entries; each key and each value may be at most 256 characters. On update, omit this field or send null to leave existing labels unchanged; send an empty object {} to remove all labels.
          example:
            manager: kiran
        description:
          type: string
          description: Unit Metric Description
        defaultAggregation:
          type: string
          description: 'Aggregation applied to unit cost metric values per time bucket in BigQuery. Supported: AVG (default when omitted or null), MIN, MAX, SUM.'
          enum:
          - AVG
          - MIN
          - MAX
          - SUM
        handleEmptyValue:
          type: string
          description: 'Strategy for handling missing/empty data points in unit cost metrics. LEAVE_BLANK: leave missing points empty (default). PREVIOUS_VALUE: carry forward the last known value. ZERO: fill gaps with 0.'
          enum:
          - PREVIOUS_VALUE
          - ZERO
          - LEAVE_BLANK
        unitMetricRecords:
          type: array
          description: Unit Metric Records
          items:
            $ref: '#/components/schemas/UnitCostMetricRecord'
        type:
          type: string
          description: 'Discriminator for unit metric data source: manually uploaded time-series or derived dynamically from a BigQuery column.'
          enum:
          - MANUAL
          - DERIVED
        dataSource:
          type: string
          description: BigQuery table to query for COLUMN-type unit metrics.
          enum:
          - BILLING
          - LLM_TRACES
        fieldId:
          type: string
          description: BigQuery column name to aggregate for DERIVED metrics. Required when type=DERIVED.
        columnAggregation:
          type: string
          description: SQL aggregation function applied to the fieldId column.
          enum:
          - SUM
          - COUNT
          - COUNT_DISTINCT
          - AVG
          - MIN
          - MAX
      description: The request object for Unit Metric
