openapi: 3.2.0
info:
  title: Harness Unit Metric API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Unit Metric
  description: Unit Metric resource.
paths:
  /ccm/api/unit-metric:
    get:
      tags:
      - Unit Metric
      summary: Get Unit Metric
      description: Get a Unit Metric by identifier with records for the specified time range.
      operationId: getUnitMetric
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: metricIdentifier
        in: query
        description: Unit Metric identifier
        required: true
        schema:
          type: string
      - name: startTime
        in: query
        description: Start time in ISO 8601 format (e.g., 2020-03-03T15:32:44Z or 2020-03-03T15:32:44%2B00:00)
        required: true
        schema:
          type: string
      - name: endTime
        in: query
        description: End time in ISO 8601 format (e.g., 2020-03-03T15:32:44Z or 2020-03-03T15:32:44%2B00:00)
        required: true
        schema:
          type: string
      - name: timeTruncGroupBy
        in: query
        description: Calendar bucket for grouping samples before aggregation (DAY, WEEK, MONTH). Each bucket is aggregated in BigQuery using the metric's defaultAggregation (AVG, MIN, MAX, or SUM; see Unit Metric create/update).
        schema:
          type: string
          description: Groups unit metric samples into calendar buckets (DAY, WEEK, or MONTH) before applying the metric's default aggregation in BigQuery.
          default: DAY
          enum:
          - DAY
          - WEEK
          - MONTH
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CcmError'
        default:
          description: Returns Unit Metric metadata and records for the specified time range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOUnitMetricResponseDTO'
    put:
      tags:
      - Unit Metric
      summary: Update Unit Metric
      description: Update an existing Unit Metric.
      operationId: updateUnitMetric
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Request body containing Unit Metric object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitMetricRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CcmError'
        default:
          description: Returns an updated Unit Metric Object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOUnitMetricResponseDTO'
    post:
      tags:
      - Unit Metric
      summary: Create Unit Metric
      description: Create a Unit Metric.
      operationId: createUnitMetric
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Request body containing Unit Metric object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitMetricRequestDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CcmError'
        default:
          description: Returns a created Unit Metric Object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOUnitMetricResponseDTO'
    delete:
      tags:
      - Unit Metric
      summary: Delete Unit Metric records or the entire metric
      description: Delete Unit Metric records within a specified time range, or pass deleteCompleteMetric=true to remove the metric definition along with all of its records (startTime/endTime are ignored in that case). A complete delete is rejected when the metric is still referenced by any Perspective.
      operationId: deleteUnitMetric
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: identifier
        in: query
        description: Unit Metric identifier
        required: true
        schema:
          type: string
      - name: startTime
        in: query
        description: Start time in ISO 8601 format (e.g., 2020-03-03T15:32:44Z or 2020-03-03T15:32:44%2B00:00). Required when deleteCompleteMetric=false; ignored otherwise.
        schema:
          type: string
      - name: endTime
        in: query
        description: End time in ISO 8601 format (e.g., 2020-03-03T15:32:44Z or 2020-03-03T15:32:44%2B00:00). Required when deleteCompleteMetric=false; ignored otherwise.
        schema:
          type: string
      - name: deleteCompleteMetric
        in: query
        description: When true, deletes the entire Unit Metric (definition + all records) and ignores startTime/endTime. The deletion is rejected if the metric is referenced by any Perspective.
        schema:
          type: boolean
          default: false
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CcmError'
        default:
          description: Returns success status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOBoolean'
  /ccm/api/unit-metric/perspective/{perspectiveId}:
    post:
      tags:
      - Unit Metric
      summary: Get Column Metric for Perspective
      description: Query a DERIVED-type unit metric with perspective filters applied, optionally with additional filters on top of the perspective's saved rules.
      operationId: getColumnUnitMetricForPerspective
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: perspectiveId
        in: path
        description: Perspective ID whose filters will be applied
        required: true
        schema:
          type: string
      - name: metricIdentifier
        in: query
        description: DERIVED-type unit metric identifier
        required: true
        schema:
          type: string
      - name: startTime
        in: query
        description: Start time in ISO 8601 format (e.g., 2020-03-03T15:32:44Z)
        required: true
        schema:
          type: string
      - name: endTime
        in: query
        description: End time in ISO 8601 format (e.g., 2020-03-03T15:32:44Z)
        required: true
        schema:
          type: string
      - name: timeTruncGroupBy
        in: query
        description: Calendar bucket for time grouping (DAY, WEEK, MONTH).
        schema:
          type: string
          description: Groups unit metric samples into calendar buckets (DAY, WEEK, or MONTH) before applying the metric's default aggregation in BigQuery.
          default: DAY
          enum:
          - DAY
          - WEEK
          - MONTH
      - name: overrideFilter
        in: query
        description: When false (default), body filters are applied on top of the perspective's saved rules. When true, the perspective's saved rules are ignored and only the body filters are applied — used to preview an edited/removed filter set before saving.
        schema:
          type: boolean
          default: false
      requestBody:
        description: Filters applied on top of the perspective's saved rules, or standalone when overrideFilter is true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/QLCEViewFilterWrapper'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CcmError'
        default:
          description: Returns time-bucketed metric values with perspective filters applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOUnitMetricResponseDTO'
  /ccm/api/unit-metric/list:
    get:
      tags:
      - Unit Metric
      summary: List All Unit Metrics
      description: Get all Unit Metrics for an account (metadata only, no records).
      operationId: listAllUnitMetrics
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of unit metrics to be shown (max 100)
        required: true
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 20
      - name: pageNo
        in: query
        description: Number of records to be skipped
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      - name: searchKey
        in: query
        description: Search key to filter unit metrics by name (case-insensitive)
        schema:
          type: string
      - name: sortType
        in: query
        description: Sort field for the list
        schema:
          type: string
          default: LAST_UPDATED_AT
          enum:
          - METRIC_NAME
          - LAST_UPDATED_AT
      - name: sortOrder
        in: query
        description: Sort order (ASCENDING or DESCENDING)
        schema:
          type: string
          enum:
          - ASCENDING
          - DESCENDING
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CcmError'
        default:
          description: Returns a list of all Unit Metrics for the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTOUnitMetricListResponseDTO'
