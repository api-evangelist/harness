openapi: 3.2.0
info:
  title: Harness Network Maps API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Network Maps
paths:
  /gateway/chaos/manager/api/rest/v2/applicationmaps:
    post:
      summary: List target network maps with chaos context
      operationId: listTargetNetworkMaps
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: page number
        name: page
        in: query
        required: true
        schema:
          type: integer
          default: 0
      - description: limit per page
        name: limit
        in: query
        required: true
        schema:
          type: integer
          default: 10
      - description: environment id that want to access the resource
        name: environmentIdentifier
        in: query
        schema:
          type: string
      - description: infra id that want to access the resource
        name: infraId
        in: query
        schema:
          type: string
      - description: show all target network maps
        name: all
        in: query
        schema:
          type: boolean
      - description: show minimal details
        name: minimal
        in: query
        schema:
          type: boolean
      - description: search based on name
        name: search
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/networkmap.ListTargetNetworkMapRequest'
        description: list Target Network Maps request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkmap.ListTargetNetworkMapResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Network Maps
  /gateway/chaos/manager/api/rest/v2/applicationmaps/{applicationmapid}:
    get:
      summary: Get target network map with chaos context
      operationId: getTargetNetworkMap
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: environment id that want to access the resource
        name: environmentIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: infra id that want to access the resource
        name: infraId
        in: query
        required: true
        schema:
          type: string
      - description: Application map ID
        name: applicationmapid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkmap.GetTargetNetworkMapResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Network Maps
    delete:
      summary: Delete application network map with chaos context
      operationId: deleteTargetNetworkMap
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: environment id that want to access the resource
        name: environmentIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: infra id that want to access the resource
        name: infraId
        in: query
        required: true
        schema:
          type: string
      - description: Application map ID
        name: applicationmapid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Network Maps
  /gateway/chaos/manager/api/rest/v2/applicationmaps/{applicationmapid}/canretry:
    get:
      summary: Can retry or not chaos experiment creation for the given target network map
      operationId: canRetryExperimentCreation
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: environment id that want to access the resource
        name: environmentIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: infra id that want to access the resource
        name: infraId
        in: query
        required: true
        schema:
          type: string
      - description: Application map ID
        name: applicationmapid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkmap.CanRetryExperimentCreationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Network Maps
  /gateway/chaos/manager/api/rest/v2/applicationmaps/{applicationmapid}/retry:
    post:
      summary: Retry chaos experiment creation for the given target network map
      operationId: retryExperimentCreation
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: environment id that want to access the resource
        name: environmentIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: infra id that want to access the resource
        name: infraId
        in: query
        required: true
        schema:
          type: string
      - description: Application map ID
        name: applicationmapid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/networkmap.RetryExperimentCreationRequest'
        description: Retry experiment creation request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkmap.RetryExperimentCreationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Network Maps
  /gateway/chaos/manager/api/rest/v2/applicationmaps/{applicationmapid}/targetservices:
    get:
      description: Get target discovered service with chaos context
      summary: List target discovered service with chaos context
      operationId: listService
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: environment id that want to access the resource
        name: environmentIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: infra id that want to access the resource
        name: infraId
        in: query
        required: true
        schema:
          type: string
      - description: Application map ID
        name: applicationmapid
        in: path
        required: true
        schema:
          type: string
      - description: page number
        name: page
        in: query
        required: true
        schema:
          type: integer
          default: 0
      - description: limit per page
        name: limit
        in: query
        required: true
        schema:
          type: integer
          default: 10
      - description: search based on name
        name: search
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkmap.ListTargetServiceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Network Maps
  /gateway/chaos/manager/api/rest/v2/applicationmaps/{applicationmapid}/targetservices/{targetserviceid}:
    get:
      summary: Get target discovered service with chaos context
      operationId: getServiceResponse
      parameters:
      - description: account id that want to access the resource
        name: accountIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: organization id that want to access the resource
        name: organizationIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: project id that want to access the resource
        name: projectIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: environment id that want to access the resource
        name: environmentIdentifier
        in: query
        required: true
        schema:
          type: string
      - description: infra id that want to access the resource
        name: infraId
        in: query
        required: true
        schema:
          type: string
      - description: Application map ID
        name: applicationmapid
        in: path
        required: true
        schema:
          type: string
      - description: Target discovered service ID Identity
        name: targetserviceid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/networkmap.GetTargetServiceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.RestError'
      tags:
      - Network Maps
components:
  schemas:
    intstr.IntOrString:
      type: object
      properties:
        intVal:
          type: integer
        strVal:
          type: string
        type:
          $ref: '#/components/schemas/intstr.Type'
    targetservice.ServiceType:
      type: string
      enum:
      - DiscoveredService
      - UnAccounted
      x-enum-varnames:
      - DiscoveredService
      - UnAccounted
    v1.PortStatus:
      type: object
      properties:
        error:
          description: "Error is to record the problem with the service port\nThe format of the error shall comply with the following rules:\n- built-in error values shall be specified in this file and those shall use\n  CamelCase names\n- cloud provider specific error values must have names that comply with the\n  format foo.example.com/CamelCase.\n---\nThe regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)\n+optional\n+kubebuilder:validation:Required\n+kubebuilder:validation:Pattern=`^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$`\n+kubebuilder:validation:MaxLength=316"
          type: string
        port:
          description: Port is the port number of the service port of which status is recorded here
          type: integer
        protocol:
          description: 'Protocol is the protocol of the service port of which status is recorded here

            The supported values are: "TCP", "UDP", "SCTP"'
          allOf:
          - $ref: '#/components/schemas/v1.Protocol'
    database.DiscoveredServiceCollection:
      type: object
      required:
      - accountIdentifier
      - agentID
      - agentIdentity
      - environmentIdentifier
      - id
      - name
      - spec
      - type
      - version
      properties:
        accountIdentifier:
          type: string
        agentID:
          type: string
        agentIdentity:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        environmentIdentifier:
          type: string
        id:
          type: string
        name:
          type: string
        organizationIdentifier:
          type: string
        projectIdentifier:
          type: string
        removed:
          type: boolean
        removedAt:
          type: string
        spec:
          $ref: '#/components/schemas/database.DiscoveredServiceSpec'
        type:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
        version:
          type: string
    v1.Protocol:
      type: string
      enum:
      - TCP
      - UDP
      - SCTP
      x-enum-varnames:
      - ProtocolTCP
      - ProtocolUDP
      - ProtocolSCTP
    targetnetworkmap.TargetNetworkMap:
      type: object
      required:
      - accountID
      - isRemoved
      properties:
        accountID:
          type: string
        agentIdentity:
          type: string
        averageResiliencyScore:
          type: number
        createdAt:
          type: integer
        createdBy:
          type: string
        environmentRef:
          type: string
        errorMessage:
          type: string
        experimentCreationMode:
          $ref: '#/components/schemas/targetnetworkmap.ExperimentCreationMode'
        id:
          type: string
        identity:
          type: string
        infrastructureId:
          type: string
        isRemoved:
          type: boolean
        name:
          type: string
        onboardingID:
          type: string
        orgID:
          type: string
        projectID:
          type: string
        recentExperimentRunsDetails:
          type: array
          items:
            $ref: '#/components/schemas/targetnetworkmap.ExperimentRunDetail'
        resiliencyCoverage:
          type: number
        serviceIDs:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/targetnetworkmap.Status'
        targetNetworkMapID:
          type: string
        totalExperimentCount:
          type: integer
        totalExperimentRunCount:
          type: integer
        updatedAt:
          type: integer
        updatedBy:
          type: string
    networkmap.TargetServiceDetails:
      type: object
      required:
      - id
      - kind
      - name
      properties:
        averageResiliencyScore:
          type: number
        id:
          type: string
        kind:
          $ref: '#/components/schemas/database.NetworkMapResourceKind'
        kubernetes:
          $ref: '#/components/schemas/database.NetworkMapEntityKubernetesInfo'
        name:
          type: string
        removed:
          type: boolean
        resiliencyCoverage:
          type: number
        serviceIdentity:
          $ref: '#/components/schemas/database.ServiceIdentity'
    v1.ClientIPConfig:
      type: object
      properties:
        timeoutSeconds:
          description: 'timeoutSeconds specifies the seconds of ClientIP type session sticky time.

            The value must be >0 && <=86400(for 1 day) if ServiceAffinity == "ClientIP".

            Default value is 10800(for 3 hours).

            +optional'
          type: integer
    v1.IPFamily:
      type: string
      enum:
      - IPv4
      - IPv6
      x-enum-varnames:
      - IPv4Protocol
      - IPv6Protocol
    v1.Condition:
      type: object
      properties:
        lastTransitionTime:
          description: 'lastTransitionTime is the last time the condition transitioned from one status to another.

            This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.

            +required

            +kubebuilder:validation:Required

            +kubebuilder:validation:Type=string

            +kubebuilder:validation:Format=date-time'
          type: string
        message:
          description: 'message is a human readable message indicating details about the transition.

            This may be an empty string.

            +required

            +kubebuilder:validation:Required

            +kubebuilder:validation:MaxLength=32768'
          type: string
        observedGeneration:
          description: 'observedGeneration represents the .metadata.generation that the condition was set based upon.

            For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date

            with respect to the current state of the instance.

            +optional

            +kubebuilder:validation:Minimum=0'
          type: integer
        reason:
          description: 'reason contains a programmatic identifier indicating the reason for the condition''s last transition.

            Producers of specific condition types may define expected values and meanings for this field,

            and whether the values are considered a guaranteed API.

            The value should be a CamelCase string.

            This field may not be empty.

            +required

            +kubebuilder:validation:Required

            +kubebuilder:validation:MaxLength=1024

            +kubebuilder:validation:MinLength=1

            +kubebuilder:validation:Pattern=`^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$`'
          type: string
        status:
          description: 'status of the condition, one of True, False, Unknown.

            +required

            +kubebuilder:validation:Required

            +kubebuilder:validation:Enum=True;False;Unknown'
          allOf:
          - $ref: '#/components/schemas/k8s_io_apimachinery_pkg_apis_meta_v1.ConditionStatus'
        type:
          description: 'type of condition in CamelCase or in foo.example.com/CamelCase.

            ---

            Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be

            useful (see .node.status.conditions), the ability to deconflict is important.

            The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)

            +required

            +kubebuilder:validation:Required

            +kubebuilder:validation:Pattern=`^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$`

            +kubebuilder:validation:MaxLength=316'
          type: string
    networkmap.GetTargetNetworkMapResponse:
      type: object
      required:
      - accountID
      - isRemoved
      properties:
        accountID:
          type: string
        agentIdentity:
          type: string
        averageResiliencyScore:
          type: number
        connections:
          type: array
          items:
            $ref: '#/components/schemas/database.Connection'
        createdAt:
          type: integer
        createdBy:
          type: string
        environmentRef:
          type: string
        errorMessage:
          type: string
        experimentCreationMode:
          $ref: '#/components/schemas/targetnetworkmap.ExperimentCreationMode'
        id:
          type: string
        identity:
          type: string
        infrastructureId:
          type: string
        isRemoved:
          type: boolean
        name:
          type: string
        onboardingID:
          type: string
        orgID:
          type: string
        projectID:
          type: string
        recentExperimentRunsDetails:
          type: array
          items:
            $ref: '#/components/schemas/targetnetworkmap.ExperimentRunDetail'
        resiliencyCoverage:
          type: number
        serviceIDs:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/networkmap.TargetServiceDetails'
        status:
          $ref: '#/components/schemas/targetnetworkmap.Status'
        targetNetworkMapID:
          type: string
        totalExperimentCount:
          type: integer
        totalExperimentRunCount:
          type: integer
        updatedAt:
          type: integer
        updatedBy:
          type: string
    database.EnvironmentIdentity:
      type: object
      properties:
        accountIdentifier:
          type: string
        identifier:
          type: string
        infraIdentifier:
          type: string
        organizationIdentifier:
          type: string
        projectIdentifier:
          type: string
    api.ResponseErrorCode:
      type: string
      enum:
      - PIPELINE_NOT_FOUND
      x-enum-varnames:
      - PipelineNotFound
    database.ConnectionType:
      type: string
      enum:
      - TCP
      x-enum-varnames:
      - ConnectionTypeTCP
    database.NetworkMapResourceKind:
      type: string
      enum:
      - K8SCustomService
      - discoveredservice
      x-enum-varnames:
      - NetworkMapResourceKindK8SCustomService
      - NetworkMapResourceKindDiscoveredService
    v1.SessionAffinityConfig:
      type: object
      properties:
        clientIP:
          description: 'clientIP contains the configurations of Client IP based session affinity.

            +optional'
          allOf:
          - $ref: '#/components/schemas/v1.ClientIPConfig'
    k8s_io_apimachinery_pkg_apis_meta_v1.ConditionStatus:
      type: string
      enum:
      - 'True'
      - 'False'
      - Unknown
      x-enum-varnames:
      - ConditionTrue
      - ConditionFalse
      - ConditionUnknown
    networkmap.CanRetryExperimentCreationResponse:
      type: object
      properties:
        result:
          type: boolean
    api.RestError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/api.ResponseErrorCode'
        description:
          type: string
        message:
          type: string
    targetnetworkmap.ExperimentRunDetail:
      type: object
      required:
      - isRemoved
      properties:
        completed:
          type: boolean
        createdAt:
          type: integer
        createdBy:
          type: string
        experimentRunID:
          type: string
        isRemoved:
          type: boolean
        name:
          type: string
        notifyID:
          type: string
        phase:
          type: string
        resiliencyScore:
          type: number
        targetService:
          type: array
          items:
            $ref: '#/components/schemas/targetservice.ServiceMetadata'
        updatedAt:
          type: integer
        updatedBy:
          type: string
    targetservice.TargetService:
      type: object
      required:
      - accountID
      - isRemoved
      properties:
        accountID:
          type: string
        averageResiliencyScore:
          type: number
        createdAt:
          type: integer
        createdBy:
          type: string
        environmentRef:
          type: string
        externalId:
          type: string
        id:
          type: string
        infrastructureId:
          type: string
        isRemoved:
          type: boolean
        licenseId:
          type: string
        name:
          type: string
        orgID:
          type: string
        projectID:
          type: string
        resiliencyCoverage:
          type: number
        spec:
          $ref: '#/components/schemas/targetservice.ServiceSpec'
        totalExperimentCount:
          type: integer
        type:
          $ref: '#/components/schemas/targetservice.ServiceType'
        updatedAt:
          type: integer
        updatedBy:
          type: string
    database.DiscoveredServiceKubernetesSpec:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        namespace:
          type: string
        service:
          $ref: '#/components/schemas/database.DiscoveredKubernetesService'
        uid:
          type: string
        workloads:
          type: array
          items:
            $ref: '#/components/schemas/database.DiscoveredKubernetesWorkload'
    v1.LoadBalancerIngress:
      type: object
      properties:
        hostname:
          description: 'Hostname is set for load-balancer ingress points that are DNS based

            (typically AWS load-balancers)

