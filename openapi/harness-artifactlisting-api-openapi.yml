openapi: 3.2.0
info:
  title: Harness Artifact Listing API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: artifactListing
paths:
  /v1/orgs/{org}/projects/{project}/artifact-sources:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    post:
      summary: List Artifact Sources
      operationId: listArtifactSources
      responses:
        '200':
          $ref: '#/components/responses/ArtifactSourcesListingResponse'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      tags:
      - artifactListing
      description: List Artifact Sources and associated artifacts count
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Order2'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          enum:
          - name
      security:
      - x-api-key: []
      x-stoplight:
        id: y2ehf0ax5nsh8
      requestBody:
        $ref: '#/components/requestBodies/ArtifactListingRequestBody'
  /v1/orgs/{org}/projects/{project}/artifact-sources/{source}/artifacts:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - schema:
        type: string
      name: source
      in: path
      required: true
      description: Artifact Source Id
    post:
      summary: List All Artifacts
      operationId: artifactListV2
      responses:
        '200':
          $ref: '#/components/responses/ArtifactV2ListingResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      description: List artifacts
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          enum:
          - updated
      - $ref: '#/components/parameters/OrderDefaultDesc'
      security:
      - x-api-key: []
      requestBody:
        $ref: '#/components/requestBodies/ArtifactListingRequestBody'
      x-stoplight:
        id: 25gnwq5h8o5ho
      tags:
      - artifactListing
  /v1/orgs/{org}/projects/{project}/artifacts/{artifact}/components:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/Artifact'
    post:
      summary: ArtifactV2 Detail Component View
      tags:
      - artifactListing
      responses:
        '200':
          $ref: '#/components/responses/ArtifactComponentViewResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      operationId: getArtifactV2DetailComponentView
      x-stoplight:
        id: kr7bsdqea6udo
      description: Get artifactV2 detail component view
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Order2'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          type: string
          enum:
          - package_name
          - package_supplier
          default: package_name
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactComponentViewRequestBody'
        description: ArtifactV2 Component View Request Body.
  /v1/orgs/{org}/projects/{project}/artifacts/{artifact}/deployments:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/Artifact'
    post:
      summary: Artifact Detail Deployment View
      operationId: getArtifactV2DetailDeploymentView
      responses:
        '200':
          $ref: '#/components/responses/ArtifactDeploymentViewResponseBody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
        default:
          $ref: '#/components/responses/ArtifactDeploymentViewResponseBody'
      description: Get artifactV2 detail deployment view
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - $ref: '#/components/parameters/Limit6'
      - $ref: '#/components/parameters/Order2'
      - $ref: '#/components/parameters/Page2'
      - in: query
        description: Parameter on the basis of which sorting is done.
        name: sort
        schema:
          enum:
          - env_name
          - env_type
          default: env_name
      security:
      - x-api-key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactDeploymentViewRequestBody'
        description: Get artifactV2 detail deployment view.
      x-stoplight:
        id: af9upcbwjbi8t
      tags:
      - artifactListing
  /v1/orgs/{org}/projects/{project}/artifact-sources/{source}/artifacts/{artifact}/overview:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/Artifact'
    - schema:
        type: string
      name: source
      in: path
      required: true
      description: Artifact Source Id
    get:
      summary: ArtifactV2 Overview
      tags:
      - artifactListing
      responses:
        '200':
          description: Example response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactV2Overview'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      operationId: getArtifactV2Overview
      x-stoplight:
        id: nj4qgvn5l5j53
      description: Get ArtifactV2 Overview
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
  /v1/orgs/{org}/projects/{project}/artifact-overview:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/AccountHeader6'
    get:
      summary: ArtifactV2 Overview
      tags:
      - artifactListing
      responses:
        '200':
          description: Example response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactV2Overview'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      operationId: getArtifactV2OverviewByName
      x-stoplight:
        id: o6y0qpoj9lk5u
      description: Get ArtifactV2 by image name, tag and digest
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
      - schema:
          type: string
        in: query
        name: digest
        required: true
        description: Digest of the artifact
      - schema:
          type: string
        in: query
        name: registry_url
        description: Registry url
        required: true
      - schema:
          type: string
        in: query
        name: image_name
        description: Image name of the artifact
        required: true
  /v1/orgs/{org}/projects/{project}/artifacts/{artifact}/chain-of-custody:
    parameters:
    - $ref: '#/components/parameters/OrgParam1'
    - $ref: '#/components/parameters/ProjectParam1'
    - $ref: '#/components/parameters/Artifact'
    get:
      summary: ArtifactV2 Chain Of Custody
      tags:
      - artifactListing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactChainOfCustody'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      operationId: getArtifactV2ChainOfCustody
      x-stoplight:
        id: nd9bu65d75xsl
      description: get artifactV2 chain of custody
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/AccountHeader6'
components:
  schemas:
    ArtifactComponentViewResponse:
      title: ArtifactComponentViewResponse
      x-stoplight:
        id: ifxc5m0lb9u32
      type: object
      properties:
        package_name:
          type: string
        package_version:
          type: string
        package_supplier:
          type: string
        package_manager:
          type: string
        purl:
          type: string
        package_license:
          type: string
        filter_tags:
          type: array
          x-stoplight:
            id: disrwjq6ou28k
          items:
            $ref: '#/components/schemas/LayerType'
    Operator:
      title: Operator
      x-stoplight:
        id: nxhoa45ajna2q
      enum:
      - Equals
      - StartsWith
      - Contains
      - NotEquals
      - GreaterThan
      - GreaterThanEquals
      - LessThan
      - LessThanEquals
    ArtifactV2ListingResponse:
      type: object
      x-stoplight:
        id: 963kgsf6l6o5x
      x-examples: {}
      title: ArtifactV2ListingResponse
      properties:
        id:
          type: string
          description: Artifact ID
        digest:
          type: string
          x-stoplight:
            id: 05r9msnbxlpwq
          description: Digest of the Artifact
        name:
          type: string
          description: Artifact Name
        tags:
          type: array
          x-stoplight:
            id: 6qeg5nzw8an2j
          items:
            x-stoplight:
              id: fnvzg8zbc8iun
            type: string
        url:
          type: string
          description: Artifact Origin URL
        metadata:
          type: object
        components_count:
          type: integer
          description: Number of components of the artifact
        updated:
          type: string
          description: Last updated time of the artifact
        scorecard:
          type: object
          properties:
            max_score:
              type: string
              description: Maximum score of the artifact SBOM
            avg_score:
              type: string
              description: Average score of the artifact SBOM
        policy_enforcement:
          type: object
          x-stoplight:
            id: gy1y5dicgpypq
          properties:
            id:
              type: string
              x-stoplight:
                id: n4wdtm6y3ifje
              description: Enforcement Step Id for the artifact lastest enfrocement.
            allow_list_violation_count:
              type: string
              x-stoplight:
                id: 93fyhq0f48926
              description: Count of the allow list policy violations
            deny_list_violation_count:
              type: string
              x-stoplight:
                id: qkv64n8a15xb3
              description: Count of the deny list policy violations
        deployment:
          type: object
          x-stoplight:
            id: fybqbfp2x69l3
          properties:
            prod_env_count:
              type: integer
              x-stoplight:
                id: wux3zmbktqqs0
              description: Count of production environment this artifact is currently deployed.
            non_prod_env_count:
              type: integer
              x-stoplight:
                id: vqey9t8s156s4
              description: Count of pre-production environment this artifact is currently deployed.
        orchestration:
          type: object
          x-stoplight:
            id: hchdgdaay5ros
          properties:
            id:
              type: string
              x-stoplight:
                id: hwqaymud6ahig
              description: Orchestration step execution ID for the aritfact.
            pipeline_id:
              type: string
              x-stoplight:
                id: t6jtif1llpafh
              description: Build pipeline Id used for orchestration of the artifact
            pipeline_execution_id:
              type: string
              x-stoplight:
                id: ojs3ry10yq7em
              description: Build pipeline execution Id used for orchestration of the artifact
        sto_issue_count:
          $ref: '#/components/schemas/StoIssueCount'
        signing:
          $ref: '#/components/schemas/IntegrityVerification'
    ArtifactComponentViewRequestBody:
      title: ArtifactComponentViewRequestBody
      x-stoplight:
        id: x5f2v20n46hkz
      type: object
      properties:
        component_filter:
          type: array
          items:
            $ref: '#/components/schemas/ComponentFilter'
        license_filter:
          $ref: '#/components/schemas/LicenseFilter'
        package_supplier:
          type: string
        package_manager:
          type: string
        image_layer:
          $ref: '#/components/schemas/LayerType'
    SBOMInfo:
      title: SBOMInfo
      x-stoplight:
        id: 2dzt0ov3lmusq
      type: object
      properties:
        orchestration_id:
          type: string
          x-stoplight:
            id: ju6d8j0ulhw4t
        project_id:
          type: string
          x-stoplight:
            id: ju6d8j0ulhw4t
        org_id:
          type: string
          x-stoplight:
            id: ju6d8j0ulhw4t
        components_count:
          type: integer
          x-stoplight:
            id: peqspkq16qkwq
        drift_id:
          type: string
          x-stoplight:
            id: 7n8p0njpodkus
        total_drifts:
          type: integer
          x-stoplight:
            id: 62jr4hroubi5s
        pipeline_details:
          $ref: '#/components/schemas/PipelineDetails'
    ArtifactListingRequestBody:
      type: object
      x-examples: {}
      properties:
        search_term:
          type: string
        component_filter:
          type: array
          items:
            $ref: '#/components/schemas/ComponentFilter'
        license_filter:
          $ref: '#/components/schemas/LicenseFilter'
        policy_violation:
          type: string
          enum:
          - ALLOW
          - DENY
          - ANY
          - NONE
        environment_type:
          type: string
          enum:
