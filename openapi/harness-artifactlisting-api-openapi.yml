          type: string
          x-stoplight:
            id: ju6d8j0ulhw4t
        allow_list_violations:
          type: integer
          x-stoplight:
            id: ju6d8j0ulhw4t
        deny_list_violations:
          type: integer
          x-stoplight:
            id: ju6d8j0ulhw4t
