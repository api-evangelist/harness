        triggered_by_id:
          type: string
          description: Id of who trigger the deployment pipeline
        triggered_at:
          type:
          - integer
          - 'null'
          description: Time of trigger of the deployment pipeline
          format: int64
        triggered_type:
          type: string
          description: Trigger type of the deployment pipeline
        status:
          type: string
          x-stoplight:
            id: qqz5h836cnx8e
          enum:
          - PASSED
          - FAILED
          - UNKNOWN
        stage_execution_id:
          type: string
          x-stoplight:
            id: 68i7ms2hxjctl
          description: Execution Id for the Stage
        step_execution_id:
          type: string
          x-stoplight:
            id: 22ha61i5fiwzc
          description: Execution Id for the step
        stage_type:
          type: string
          x-stoplight:
            id: 22ha61i5fiwzc
          description: Stage type in which the step executed
          enum:
          - BUILD
          - DEPLOY
          - SECURITY
    LicenseFilter:
      title: LicenseFilter
      type: object
      properties:
        value:
          type: string
        operator:
          $ref: '#/components/schemas/Operator'
      required:
      - value
      - operator
      x-stoplight:
        id: ae7ieb3d1qze1
    ArtifactChainOfCustody:
      title: ArtifactChainOfCustody
      x-stoplight:
        id: 1yqfetazjhj4v
      type: object
      x-internal: false
      properties:
        ActivityType:
          type: string
          x-stoplight:
            id: sduoo18ns9yfj
          enum:
          - ORCHESTRATION
          - ENFORCEMENT
          - PROVENANCE
          - VERIFICATION
          - COMPLIANCE
          - VULNERABILITY
          - DEPLOYMENT
        created_at:
          type: integer
          format: int64
          x-stoplight:
            id: 6j7z7j7z7z7z7
        orchestration:
          $ref: '#/components/schemas/SBOMInfo'
        enforcement:
          $ref: '#/components/schemas/Violations'
        provenance:
          $ref: '#/components/schemas/SLSADetails1'
        verification:
          $ref: '#/components/schemas/SLSADetails1'
        deployment:
          $ref: '#/components/schemas/Deployments'
        vulnerability:
          $ref: '#/components/schemas/StoIssueCount'
        compliance:
          $ref: '#/components/schemas/RiskAndCompliance'
        artifact_details:
          $ref: '#/components/schemas/ArtifactV2Details'
