        id: ay4nzhxmkraca
      type: object
      description: Slsa Verification Data
      properties:
        provenance:
          type: string
          x-stoplight:
            id: yyy7o9vx6ht3f
          description: Slsa provenance data
        policy_outcome_status:
          type: string
          x-stoplight:
            id: rany3wjtgl60e
