openapi: 3.2.0
info:
  title: Harness Policysets API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Policy Sets
  description: Create, edit and delete Governance policy sets
paths:
  /pm/api/v1/policysets:
    get:
      tags:
      - Policy Sets
      description: List all policy sets
      operationId: policysets#list
      parameters:
      - name: accountIdentifier
        in: query
        description: Harness account ID
        allowEmptyValue: true
        schema:
          type: string
          description: Harness account ID
          default: ''
          example: eBqAoNchMLKigC_qZ5EdC
        example: eBqAoNchMLKigC_qZ5EdC
      - name: orgIdentifier
        in: query
        description: Harness organization ID
        allowEmptyValue: true
        schema:
          type: string
          description: Harness organization ID
          default: ''
          example: test-org
        example: test-org
      - name: projectIdentifier
        in: query
        description: Harness project ID
        allowEmptyValue: true
        schema:
          type: string
          description: Harness project ID
          default: ''
          example: test-project
        example: test-project
      - name: per_page
        in: query
        description: Number of results per page
        allowEmptyValue: true
        schema:
          type: integer
          description: Number of results per page
          default: 50
          example: 20
          format: int64
          minimum: 1
          maximum: 100
        example: 20
      - name: page
        in: query
        description: Page number (starting from 0)
        allowEmptyValue: true
        schema:
          type: integer
          description: Page number (starting from 0)
          default: 0
          example: 4
          format: int64
          minimum: 0
        example: 4
      - name: identifierFilter
        in: query
        description: Comma separated List of Identifiers to filter on
        allowEmptyValue: true
        schema:
          type: string
          description: Comma separated List of Identifiers to filter on
          default: ''
          example: test-projectId1, test-projectId2
        example: test-projectId1, test-projectId2
      - name: searchTerm
        in: query
        description: Filter results by partial name match
        allowEmptyValue: true
        schema:
          type: string
          description: Filter results by partial name match
          default: ''
          example: poli
        example: poli
      - name: sort
        in: query
        description: Sort order for results
        allowEmptyValue: true
        schema:
          type: string
          description: Sort order for results
          default: name,ASC
          example: name,DESC
          enum:
          - name,ASC
          - name,DESC
          - updated,ASC
          - updated,DESC
        example: updated,DESC
      - name: type
        in: query
        description: Filter results by type
        allowEmptyValue: true
        schema:
          type: string
          description: Filter results by type
          example: pipeline
          minLength: 1
        example: pipeline
      - name: types
        in: query
        description: Filter results by multiple types (comma-separated), e.g. pipeline,environment
        allowEmptyValue: true
        schema:
          type: string
          description: Filter results by multiple types (comma-separated), e.g. pipeline,environment
          example: pipeline,environment
          minLength: 1
        example: pipeline,environment
      - name: action
        in: query
        description: Filter results by action
        allowEmptyValue: true
        schema:
          type: string
          description: Filter results by action
          example: onrun
          minLength: 1
        example: onrun
      - name: yaml_version
        in: query
        description: Harness yaml version associated with this policySet
        allowEmptyValue: true
        schema:
          type: string
          description: Harness yaml version associated with this policySet
          default: '0'
          example: '0'
          enum:
          - '0'
          - '1'
        example: '0'
      - name: x-api-key
        in: header
        description: Harness PAT key used to perform authorization
        allowEmptyValue: true
        schema:
          type: string
          description: Harness PAT key used to perform authorization
          example: Labore dolorum dolorum ut repudiandae ut nisi.
        example: Officia quasi ipsum consectetur facere quaerat illo.
      responses:
        '200':
          description: OK response.
          headers:
            Link:
              description: Link-based paging
              schema:
                type: string
                description: Link-based paging
                example: ''
              example: ''
            X-Page-Index:
              description: 'Deprecated: Please use pageNumber / X-Page-Number instead. Same value as pageNumber; kept for legacy UI clients.'
              schema:
                type: integer
                description: 'Deprecated: Please use pageNumber / X-Page-Number instead. Same value as pageNumber; kept for legacy UI clients.'
                example: 4
                format: int64
              example: 4
            X-Page-Item-Count:
              description: Number of results in this page
              schema:
                type: integer
                description: Number of results in this page
                example: 20
                format: int64
              example: 20
            X-Page-Number:
              description: Current page number (0-based). Harness standard pagination header X-Page-Number.
              schema:
                type: integer
                description: Current page number (0-based). Harness standard pagination header X-Page-Number.
                example: 4
                format: int64
              example: 4
            X-Page-Size:
              description: Requested page size. Harness standard pagination header X-Page-Size.
              schema:
                type: integer
                description: Requested page size. Harness standard pagination header X-Page-Size.
                example: 20
                format: int64
              example: 20
            X-Total-Elements:
              description: Total number of results available. Harness standard pagination header X-Total-Elements.
              schema:
                type: integer
                description: Total number of results available. Harness standard pagination header X-Total-Elements.
                example: 230
                format: int64
              example: 230
            X-Total-Items:
              description: 'Deprecated: Please use totalElements / X-Total-Elements instead. Same value as totalElements; kept for legacy UI clients.'
              schema:
                type: integer
                description: 'Deprecated: Please use totalElements / X-Total-Elements instead. Same value as totalElements; kept for legacy UI clients.'
                example: 230
                format: int64
              example: 230
            X-Total-Pages:
              description: Total pages available
              schema:
                type: integer
                description: Total pages available
                example: 12
                format: int64
              example: 12
