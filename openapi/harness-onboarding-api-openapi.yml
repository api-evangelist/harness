components:
  schemas:
    pipelineonboarding.PipelineChaosOnboardingCheckResponse:
      type: object
      properties:
        check:
          type: boolean
        infrastructures:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/pipelineonboarding.InfrastructuresStatus'
        message:
          type: string
        name:
          type: string
        services:
          type: object
          additionalProperties:
            type: object
    pipelineonboarding.PipelineChaosOnboardingTaskRequest:
      type: object
      properties:
        chaosAdvanceConfiguration:
          $ref: '#/components/schemas/v2_onboarding.ChaosInfraAdvanceConfiguration'
        discoveryAdvanceConfiguration:
          $ref: '#/components/schemas/database.AgentConfiguration'
        isAIEnabled:
          type: boolean
        pipelineIdentity:
          type: string
    v2_onboarding.ChaosInfraAdvanceConfiguration:
      type: object
      properties:
        annotation:
          type: object
          additionalProperties:
            type: string
        autopilotEnabled:
          type: boolean
        containers:
          type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/infra_v2.Env'
        imagePullPolicy:
          $ref: '#/components/schemas/v1.PullPolicy'
        insecureSkipVerify:
          type: boolean
        label:
          type: object
          additionalProperties:
            type: string
        mtls:
          $ref: '#/components/schemas/infra_v2.MTLSConfiguration'
        nodeSelector:
          type: object
          additionalProperties:
            type: string
        proxy:
          $ref: '#/components/schemas/infra_v2.ProxyConfiguration'
        runAsGroup:
          type: integer
        runAsUser:
          type: integer
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/v1.Toleration'
        volumeMounts:
          type: array
          items:
            $ref: '#/components/schemas/v1.VolumeMount'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/infra_v2.Volumes'
    OnboardingContext:
      type: object
      properties:
        strategy:
          type: string
          description: Deployment strategy. When set, the call renders a ready-to-run pipeline for this strategy (returned as pipelineYaml) instead of provisioning resources. Accepts 'rolling', 'canary' or 'bluegreen'.
          enum:
          - rolling
          - canary
          - bluegreen
        deployment_type:
          type: string
          description: Deployment type for the generated pipeline. Required when 'strategy' is set; together with 'strategy' it selects the pipeline template. Accepts only 'Kubernetes'.
          enum:
          - kubernetes
        environment_identifier:
          type: string
          description: Environment identifier to reference in the generated pipeline. Required when 'strategy' is set.
        infrastructure_identifier:
          type: string
          description: Infrastructure identifier to reference in the generated pipeline. Required when 'strategy' is set.
        service_type:
          type: string
          description: Service deployment type. Supports 'kubernetes' only. Required when creating a service; may be omitted when updating an existing one (service_id matches an existing service).
        service_identifier:
          type: string
          description: 'Service identifier. In provisioning requests: when it matches an existing service, that service is UPDATED (the manifest and/or artifact sections in this request are merged in and all other sections are preserved); when absent (create), an identifier is generated. In strategy-based requests: the service identifier referenced in the generated pipeline (required).'
        service_name:
          type: string
          description: Name to use for the created service.
        manifest_type:
          type: string
          description: Manifest store type. Supports 'github' or 'harnessCode'.
        manifest_id:
          type: string
          description: Identifier for the created GitHub (manifest) connector.
        manifest_authType:
          type: string
          description: GitHub auth type. Accepts only 'UsernameToken' or 'OAuth'.
          enum:
          - UsernameToken
          - OAuth
        manifest_username:
          type: string
          description: GitHub username for the manifest connector.
        manifest_token:
          type: string
          description: GitHub password/token value for the manifest connector; stored as a secret.
        manifest_tokenRef:
          type: string
          description: Reference to an existing secret holding the GitHub OAuth access token (used when manifest_authType is 'oauth'). Bare id = project scope; prefix 'org.'/'account.' for those scopes. Wired to both authentication and apiAccess; no new secret is created.
        manifest_repoUrl:
          type: string
          description: Full GitHub repository URL (REPO-type connector).
        manifest_fetchType:
          type: string
          description: Git fetch type. Accepts only 'branch' or 'commit'.
          enum:
          - branch
          - commit
        manifest_branch:
          type: string
          description: Git branch to fetch the manifest from (used when manifest_fetchType is 'branch').
        manifest_commitId:
          type: string
          description: Git commit id to fetch the manifest from (used when manifest_fetchType is 'commit').
        manifest_repoName:
          type: string
          description: Repository name within the manifest store. Used by 'harnessCode' (the Harness Code repo) and by account-level Git connectors.
        manifest_paths:
          type: string
          description: Manifest file path(s) / folder(s) within the repository. Accepts multiple, comma-separated (e.g. 'k8s/deployment.yaml, k8s/service.yaml'); each is added to the manifest store.
        artifact_type:
          type: string
          description: Artifact source type. Supports 'DockerRegistry'.
        artifact_id:
          type: string
          description: Identifier for the created Docker (artifact) connector.
        artifact_username:
          type: string
          description: Docker registry username for the artifact connector.
        artifact_password:
          type: string
          description: Docker registry password/token value for the artifact connector; stored as a secret.
        artifact_imagePath:
          type: string
          description: Docker image path, e.g. 'library/nginx'.
        artifact_tag:
          type: string
          description: Docker image tag.
        env_id:
          type: string
          description: Environment identifier. When it matches an existing environment, that environment is reused and the infrastructure is attached to it. When absent, an identifier is generated.
        env_name:
          type: string
          description: Environment display name. Defaults to the environment identifier when absent.
        env_type:
          type: string
          description: Environment type. Supports 'PreProduction' (default) or 'Production'.
        infra_type:
          type: string
          description: Infrastructure type. Supports 'KubernetesDirect' only.
        infra_id:
          type: string
          description: Infrastructure identifier. When absent, an identifier is generated.
        infra_name:
          type: string
          description: Infrastructure display name. Defaults to the infrastructure identifier when absent.
        infra_namespace:
          type: string
          description: Kubernetes namespace the infrastructure deploys into.
        infra_releaseName:
          type: string
          description: Harness release name expression. When absent, a unique 'release-'-prefixed name is generated.
        infra_connectorType:
          type: string
          description: Cluster connector type. Supports 'K8sCluster' only.
        infra_clusterUrl:
          type: string
          description: Kubernetes cluster master URL for the connector.
        infra_credentialType:
          type: string
          description: Cluster credential type. Supports 'ManualConfig' only.
        infra_authType:
          type: string
          description: Cluster auth type. Supports 'ServiceAccount' only.
        infra_serviceAccountToken:
          type: string
          description: Kubernetes service-account token value; stored as a secret and referenced by the connector.
      description: Declarative context describing the resources to onboard
