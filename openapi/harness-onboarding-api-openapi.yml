openapi: 3.2.0
info:
  title: Harness Onboarding API
  version: '1.0'
  description: The Harness Software Delivery Platform uses OpenAPI Specification v3.0.
  contact:
    name: API Support
    email: contact@harness.io
    url: https://harness.io/
  x-logo:
    url: https://mma.prnewswire.com/media/779232/Harnes_logo_horizontal.jpg?p=facebook
    altText: Harness
  termsOfService: https://harness.io/terms-of-use/
servers:
- url: https://app.harness.io
  description: Harness host URL
- url: https://{vanity}
  description: Vanity URL
  variables:
    vanity:
      default: app.harness.io
security:
- x-api-key: []
tags:
- name: Onboarding
  description: This contains APIs related to platform onboarding flows
paths:
  /ng/api/onboarding/execute:
    post:
      tags:
      - Onboarding
      summary: Provisions secrets, connectors, and a Kubernetes service (with GitHub manifest…
      operationId: executeOnboarding
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      requestBody:
        description: The onboarding execute request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingExecuteRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/OnboardingExecuteRequest'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Identifiers of the resources created during onboarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingExecuteResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/OnboardingExecuteResponse'
  /ng/api/onboarding/kubeconfig/upload:
    post:
      tags:
      - Onboarding
      summary: Upload and process a kubeconfig file for onboarding
      operationId: uploadKubeConfig
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: The kubeConfig (~/.kube/config) file to upload
                  format: binary
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failure'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Failure'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Error1'
        default:
          description: Per-context connector-creation hints detected from the kubeConfig
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubeconfigUploadResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/KubeconfigUploadResponse'
