principles:
  - name: Visibility
    description: Use the Harness Cloud Cost Management module and Software Engineering Insights for
      pipeline-level cost and engineering productivity telemetry.
  - name: Allocation
    description: Tag deployments and pipelines with team / service / environment labels at the
      Harness Project and Org level so spend can be attributed.
  - name: Optimization
    description: Right-size concurrent pipeline parallelism, prune idle Code Repository storage, and
      consolidate modules at the Enterprise tier rather than buying point tools.
  - name: Accountability
    description: Assign budget owners per Harness Org / Project; review module enablement and
      pipeline volume monthly against the negotiated Enterprise commitment.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
