- tool: harness_describe
  reason: Returns the server's own local registry metadata — resource types, operations, fields, supportedScopes.
    There is no REST endpoint that publishes this registry.
- tool: harness_search
  reason: Composite. Semantic routing over local ONNX embeddings narrows the resource-type set, then scatter-gathers
    across many REST list operations. No single REST search exists.
- tool: harness_status
  reason: Composite project health dashboard assembled from several execution and dashboard reads.
- tool: harness_schema
  reason: Serves bundled YAML/JSON Schema snapshots (and, for release resources, a live RMG /api/yamlSchema
    call). The bundled snapshots are not a public REST surface; the equivalent published artifacts are
    the JSON Schemas in json-schema/.
rest_only:
  summary: The overwhelming majority of the REST surface has no dedicated tool NAME, because the registry
    design intends resource types to be reached through the 11 verbs. 247 of the 485 spec tags / roughly
    2,883 operations are addressable through the registry; the remainder — notably the CCM analytics and
    dashboard reads, SEI metrics, WAAP, and the Harness Code low-level git plumbing — are reachable over
    REST only.
  examples:
  - operationId: saveSlsaVerification
    note: SLSA provenance verification — supply-chain surface, no registry verb.
  - operationId: uploadAttestation
    note: The only operation in the whole spec that accepts an Idempotency-Key header.
  - operationId: putHandleInterrupt
    note: Pipeline execution interrupt (abort/pause); the tool surface exposes retry, not interrupt.
  - operationId: triggerRollbackV3
    note: Post-deployment instance rollback.
