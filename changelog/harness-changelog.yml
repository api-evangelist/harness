breaking_changes:
  - title: Audit Trail YAML optimization
    effective: '2026-08-16'
    severity: breaking
    detail: >-
      Audit entries no longer store old/new YAML snapshots when there is no meaningful
      difference between states. Automation that reads YAML out of audit log entries must
      handle entries without YAML.
  - title: Bitbucket Cloud cross-workspace API deprecation
    effective: Delegate v26.02.88600 / SCM Service v1.45.1
    severity: breaking
    detail: >-
      Harness migrated to the new Bitbucket Cloud APIs after Atlassian's end-of-life for
      cross-workspace APIs. With repository-level access tokens, Test Connection and
      repository listing now fail; workspace-level tokens are required.
  - title: Resource group endpoints removed
    severity: breaking
    detail: >-
      api/resourcegroup/{identifier} (all verbs), POST api/resourcegroup/filter and GET
      api/resourcegroup are no longer supported.
    see_also: lifecycle/harness-lifecycle.yml
