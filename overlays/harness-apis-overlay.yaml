    description: >-
      Add the token format and the RBAC permission model, which the scheme description
      omits. Knowing the token shape lets a client validate a key before spending a call.
    update:
      x-token-format: <prefix>.<accountId>.<tokenId>.<secret>
      x-token-kinds: [PAT, SAT]
      x-authorization-model: rbac-permissions
      x-permissions-reference: https://developer.harness.io/harness-platform/use-harness-platform/automation/api/api-permissions-reference
      x-permission-count: 194
  - target: $.paths['/pipeline/api/pipeline/execute/{identifier}'].post
    description: >-
      Annotate the pipeline-run operation with its reversal path and consequence class.
      This is the single highest-consequence write in the contract and nothing in the spec
      says how to take it back.
    update:
      x-agentic-access:
        action-class: acting
        consequence: write
        escalation:
          human-in-the-loop: required
      x-reversibility:
        reversal: putHandleInterrupt
        kind: abort
        window: while the execution is still running
        rollback: triggerRollbackV3
        precondition: checkIfInstanceCanBeRolledBack
      x-idempotency: >-
        None. A repeated call starts a second execution. No Idempotency-Key is accepted on
