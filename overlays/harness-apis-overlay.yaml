  - target: $.info
    description: >-
      Surface the published platform rate limits, which are documented on the developer hub
      but not represented anywhere in the contract itself.
    update:
      x-rate-limits:
        source: https://developer.harness.io/harness-platform/use-harness-platform/rate-limits
        per_ip: 5000 requests / 10 seconds
        per_api_key: 1000 requests / minute
        external_per_x_api_key: 400 requests / minute
        status_on_exhaustion: 429
        retry_after_header: >-
          Documented, but Harness states it is not supported by the Google Cloud Armor
          layer enforcing the IP limit. Back off on the status code.
