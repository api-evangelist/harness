- target: $.paths['/code/api/v1/labels'].get
  update:
    x-apievangelist-phrasing:
      intent: List labels defined for an account, org or project
      effect: read
      questions:
      - What labels are defined for my Harness Code project?
      - Can I include labels inherited from the org and account when listing project labels?
      - Is there a way to search the labels defined at the account level by name?
      instructions:
      - text: List the labels defined in project {project} of org {org}.
        slots:
          project: query.projectIdentifier
          org: query.orgIdentifier
      - text: Show account {account}'s labels matching {search}, including inherited ones.
        slots:
          account: query.accountIdentifier
          search: query.query
      method: generated
      generated: '2026-09-26'
- target: $.paths['/code/api/v1/labels'].put
  update:
    x-apievangelist-phrasing:
      intent: Save a label and its values in one call at a scope
      effect: write
      questions:
      - Can I create or overwrite a project label together with all its values in a single request?
      - What's the quickest way to upsert an org-level label along with its allowed values?
      instructions:
