specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Harness
providerId: harness
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - DevOps
  - GitOps
  - Internal Developer Portal
  - Lifecycle
  - Software Delivery
  - Rate Limiting
  - Quotas
  - Throttling
description: Harness does not publish a single consolidated API rate-limit table at a public URL.
  Limits are governed at the platform level per account, with documented capacity ceilings on
  concurrent pipeline executions per plan (60 on Essentials, 500 on Enterprise). Specific per-second
  request-rate numbers are not publicly disclosed; raise via support.
notes: Public rate-limit documentation could not be located at the time of reconciliation. Numeric
  per-second limits are placeholder; verify with the Harness API reference or support before
  production sizing.
sources:
  - https://www.harness.io/pricing
  - https://apidocs.harness.io/
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - tier: free
    name: Free Tier (Harness Open Source / Litmus Chaos)
    scope: account
    metric: requests_per_minute
    limit: see Harness support / API reference
    applies:
      - Harness Platform API
      - Harness Continuous Integration API
      - Harness Continuous Delivery and GitOps API
  - tier: essentials
    name: Essentials Concurrent Pipelines
    scope: account
    metric: concurrent_executions
    limit: 60
    timeFrame: usage
    applies:
      - Harness Continuous Integration API
      - Harness Continuous Delivery and GitOps API
  - tier: enterprise
    name: Enterprise Concurrent Pipelines
    scope: account
    metric: concurrent_executions
    limit: 500
    timeFrame: usage
    applies:
      - Harness Continuous Integration API
      - Harness Continuous Delivery and GitOps API
  - tier: enterprise
    name: Enterprise Code Repository Storage
    scope: account
    metric: gb_total
    limit: 250
    timeFrame: usage
    applies:
      - Harness Code Repository API
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter and honor the Retry-After
      header on 429 responses.
  - name: Account Scoping
    description: Limits are enforced per Harness account, not per individual API key.
  - name: Plan-based Capacity
    description: Concurrent pipeline ceilings are tied to the account's plan tier (Essentials or
      Enterprise); raises require plan upgrade or sales engagement.
  - name: Fair Use
    description: Even on Enterprise, sustained traffic that materially impacts shared infrastructure
      may be subject to fair-use throttling.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
    url: https://apievangelist.com
