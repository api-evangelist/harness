model: rbac-permissions
description: Harness REST authorization is RBAC, not OAuth scopes. An API key or service-account token inherits
  the permissions of the user or service account it belongs to; the authorization unit is a permission ID like core_pipeline_execute,
  evaluated at a scope (account / organization / project). OAuth scopes DO exist on the platform, but only on the
  identity provider that fronts sign-in and the hosted MCP server — they are recorded separately below.
