specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Harness
providerId: harness
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - DevOps
  - GitOps
  - Internal Developer Portal
  - Lifecycle
  - Software Delivery
description: Harness offers a tiered platform with three published plans (Free, Essentials, Enterprise).
  Free is no-cost and provides access to Harness Open Source and Litmus Chaos. Essentials and
  Enterprise require contacting sales — exact per-user prices are not publicly posted, but documented
  capacity ceilings (e.g. 60 concurrent pipelines on Essentials, 500 on Enterprise, 250 GB code
  repository storage) are reproduced as plan entries. Modules are mix-and-match on Enterprise.
sources:
  - https://www.harness.io/pricing
plans:
  - id: harness-free
    name: Free
    type: freemium
    description: No-cost starter plan for individual developers and small teams. Access to Harness
      Open Source and Litmus Chaos with community support.
    entries:
      - label: Plan price
        description: Monthly cost of the Free plan
        name: plan_price
        type: flat
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Harness Open Source
      - name: Litmus Chaos
      - name: Community Support
      - name: Harness Platform API
      - name: Harness Continuous Integration API
      - name: Harness Continuous Delivery and GitOps API
  - id: harness-essentials
    name: Essentials
    type: subscription
    description: Packaged DevOps Essentials bundle for growing teams (CI, CD & GitOps, IaC Management,
      Security Testing Orchestration) with standard support. Pricing not publicly posted.
    entries:
      - label: Plan price
        description: Subscription pricing requires contacting sales
        name: plan_price
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        domains: []
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Concurrent pipeline executions
        description: Documented ceiling on simultaneously executing pipelines
        name: concurrent_pipelines
        type: quota
        metric: concurrent_executions
        limit: 60
        timeFrame: usage
        geo: global
        domains: []
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Continuous Integration
      - name: Continuous Delivery and GitOps
      - name: Infrastructure as Code Management
      - name: Security Testing Orchestration
      - name: Standard Support
      - name: Harness Platform API
      - name: Harness Continuous Integration API
      - name: Harness Continuous Delivery and GitOps API
      - name: Harness Security Testing Orchestration API
      - name: Harness Infrastructure as Code Management API
  - id: harness-enterprise
    name: Enterprise
    type: enterprise
    description: Custom-quoted plan; pick any modules. Includes premium support and a dedicated
      account manager. Higher capacity ceilings (500 concurrent pipelines, 250 GB code repository
      storage).
    entries:
      - label: Plan price
        description: Custom-quoted; contact sales for pricing
        name: plan_price
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: configurable
        domains: []
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Concurrent pipeline executions
        description: Documented ceiling on simultaneously executing pipelines
        name: concurrent_pipelines
        type: quota
        metric: concurrent_executions
        limit: 500
        timeFrame: usage
        geo: configurable
        domains: []
        unit: 1
        price: included
        userMultiplied: false
      - label: Code Repository storage
        description: Documented storage ceiling for the Code Repository module
        name: code_repo_storage
        type: quota
        metric: gb
        limit: 250
        timeFrame: usage
        geo: configurable
        domains: []
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: All DevOps Essentials modules
      - name: Feature Management and Experimentation
      - name: Resilience Testing
      - name: Service Reliability Management
      - name: Database DevOps
      - name: Software Engineering Insights
      - name: Internal Developer Portal
      - name: Cloud Cost Management
      - name: Supply Chain Security
      - name: Premium Support
      - name: Dedicated Account Manager
      - name: Harness Platform API
      - name: Harness Continuous Integration API
      - name: Harness Continuous Delivery and GitOps API
      - name: Harness Feature Management and Experimentation API
      - name: Harness Cloud Cost Management API
      - name: Harness Chaos Engineering API
      - name: Harness Security Testing Orchestration API
      - name: Harness Internal Developer Portal API
      - name: Harness Code Repository API
      - name: Harness Service Reliability Management API
      - name: Harness Infrastructure as Code Management API
      - name: Harness Supply Chain Security API
      - name: Harness Software Engineering Insights API
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
    url: https://apievangelist.com
